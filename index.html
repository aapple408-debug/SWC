{yr:"111",sub:"植生工程",type:"orig",n:"111v1",pts:20,
q:"請詳述臺灣地區的植被生態特色及植物群落特性，並列舉相關群落之代表性植物。",
s:"台灣植被依海拔垂直分帶：熱帶→亞熱帶闊葉林→暖溫帶楠木帶→涼溫帶針闊葉混合林→冷溫帶冷杉帶→高山植被。特色：島嶼效應使物種密度高，特有種>28%，颱風擾動活躍次生演替，東西坡植被差異顯著。",
d:`<h4>一、台灣植被生態特色</h4><ul><li><b>高生物多樣性：</b>約4000種維管束植物，特有種比率達28%，全球生物多樣性熱點</li><li><b>垂直分帶壓縮：</b>100km水平距離內涵蓋熱帶到亞寒帶完整植被帶</li><li><b>颱風擾動：</b>颱風周期性創造崩塌裸地，驅動活躍的次生演替動態</li><li><b>東西坡差異：</b>東北部迎東北季風全年多雨；西部背風面乾溼季分明</li></ul><h4>二、植被帶分布及代表植物</h4><table><tr><th>植被帶</th><th>海拔（m）</th><th>代表植物</th></tr><tr><td>熱帶季節性林</td><td>0~500（南）</td><td>欖仁、銀葉樹、棋盤腳、毛柿</td></tr><tr><td>亞熱帶常綠闊葉林</td><td>0~500（北）</td><td>榕樹、大葉楠、白匏子、血桐</td></tr><tr><td>暖溫帶楠木林</td><td>500~1500</td><td>紅楠、烏心石、台灣青楓、香楠</td></tr><tr><td>涼溫帶針闊葉混合林</td><td>1500~2500</td><td>紅檜、台灣扁柏、昆欄樹、台灣山毛櫸</td></tr><tr><td>冷溫帶冷杉林</td><td>2500~3500</td><td>台灣冷杉、台灣鐵杉、玉山假沙梨</td></tr><tr><td>高山草原/矮木林</td><td>3500以上</td><td>玉山圓柏、玉山薄雪草、玉山箭竹</td></tr></table>`},
{yr:"111",sub:"植生工程",type:"orig",n:"111v2",pts:20,
q:"請說明河溪護岸植栽設計之考量與植生導入之作業與方法，並列舉可應用之植栽材料。",
s:"設計考量：流速（決定植物承受力）、水位變動（水陸兩棲適應）、土壤質地（植根條件）、光照、生態需求。植生導入方法：直接扦插（柳樹）、活木樁、柳枝束（Live fascine）、層積扦插、植生捆（椰纖維捆）、噴植+格框。材料：挺水植物（蘆葦、香蒲）、水岸草本（甜根子草）、水岸灌木（水社柳）、水岸喬木（水柳、楓楊）。",
d:`<h4>一、河溪護岸植栽設計考量</h4><table><tr><th>因子</th><th>說明</th><th>選種原則</th></tr><tr><td><b>流速</b></td><td>高流速（>2m/s）洪水沖刷力強</td><td>選根系發達、柔韌不易折斷者（柳類）</td></tr><tr><td><b>水位變動</b></td><td>枯豐季差異大，植物需耐淹又耐旱</td><td>選水陸兩棲植物</td></tr><tr><td><b>土壤質地</b></td><td>河岸土壤砂質或礫石質，有機質含量低</td><td>選耐貧瘠植物，必要時客土</td></tr><tr><td><b>生態功能</b></td><td>護岸植生應兼具魚類庇護、鳥類棲息功能</td><td>採用本土多樣植栽組合</td></tr></table><h4>二、植生導入方法</h4><ul><li><b>直接扦插：</b>活枝條（水柳、台灣水蠟樹）插入濕潤河岸，間距30~50cm</li><li><b>活木樁（Live stake）：</b>粗枝（徑3~10cm）打入坡腳，深度≥60cm</li><li><b>柳枝束（Live fascine）：</b>活枝條捆成圓束，橫埋等高線溝槽，覆土後萌芽</li><li><b>層積扦插（Brush layering）：</b>挖階梯狀溝槽，分層埋入枝條束，多層根系固土</li><li><b>植生捆（Coir roll）：</b>椰纖維圓柱捆固定於常水位線，外側種植挺水植物</li></ul><h4>三、植栽材料</h4><table><tr><th>類型</th><th>代表物種</th><th>適用位置</th></tr><tr><td>挺水植物</td><td>蘆葦、香蒲、水燭、菖蒲</td><td>常水位線及以下</td></tr><tr><td>水岸草本</td><td>甜根子草、五節芒、台灣蘆竹</td><td>洪水線以下坡面</td></tr><tr><td>水岸灌木</td><td>水社柳、台灣山豬枷</td><td>中坡位</td></tr><tr><td>水岸喬木</td><td>水柳、楓楊、水黃皮</td><td>護岸坡頂，長期固土</td></tr></table>`},
{yr:"111",sub:"植生工程",type:"orig",n:"111v3",pts:20,
q:"請說明臺灣海岸依其區域之地形與地質差異可分為那些植物類型？並列表說明海岸環境逆境與應力對於植物生長之植生方法因應措施。",
s:"海岸植物類型：岩礁海岸（岩岸植被/仙人掌）、沙灘/沙丘海岸（馬鞍藤→林投→木麻黃防風林）、礫石海岸（稀疏礫石草原）、泥灘/紅樹林海岸（水筆仔、海茄苳）、珊瑚礁海岸（熱帶季節性林）。逆境因應：鹽分→耐鹽植物/洗鹽；強風→防風林帶；沙埋→耐沙埋植物/沙籬；乾旱→深根耐旱植物。",
d:`<h4>一、台灣海岸植物類型</h4><table><tr><th>海岸類型</th><th>地形地質</th><th>代表植物</th></tr><tr><td>岩礁海岸</td><td>堅硬岩盤（東北角、野柳）</td><td>仙人掌、濱當歸、石板菜</td></tr><tr><td>沙灘/沙丘海岸</td><td>砂質，西部沿海廣布</td><td>馬鞍藤（第一線）→濱刺草→林投→黃槿→木麻黃</td></tr><tr><td>礫石海岸</td><td>礫石灘，花東縱谷出海口</td><td>土丁桂、濱豇豆、台灣鹽膚木</td></tr><tr><td>泥灘/紅樹林海岸</td><td>淤泥質（台南、嘉義、台中港）</td><td>水筆仔（北）、海茄苳（南）、欖李</td></tr><tr><td>珊瑚礁海岸</td><td>珊瑚礁岩（恆春半島、小琉球）</td><td>欖仁、棋盤腳、瓊崖海棠</td></tr></table><h4>二、海岸逆境與植生因應措施</h4><table><tr><th>逆境</th><th>對植物影響</th><th>植生因應措施</th></tr><tr><td><b>鹽分</b></td><td>脫水、離子毒害</td><td>選耐鹽植物（海茄苳、濱刺草）；覆蓋有機物降低鹽分上升</td></tr><tr><td><b>強風</b></td><td>機械傷害、蒸散加劇</td><td>先設防風網（竹籬）保護幼苗；分層種植形成防風林帶</td></tr><tr><td><b>沙埋</b></td><td>莖幹被掩埋</td><td>選耐沙埋植物（林投、馬鞍藤可在沙埋中萌芽）；設沙籬攔截移動沙丘</td></tr><tr><td><b>乾旱</b></td><td>沙地排水快，保水差</td><td>選深根耐旱植物；種植初期灌溉養護；添加有機質改善保水</td></tr><tr><td><b>土壤貧瘠</b></td><td>氮磷缺乏</td><td>混植豆科固氮植物（濱豇豆）；施用有機肥</td></tr></table>`},
{yr:"111",sub:"植生工程",type:"orig",n:"111v4",pts:20,
q:"請詳述植生工程適用植物選定之條件，並列表說明鄉土植物與外來植物優點與缺點。",
s:"選定條件：適地適種（氣候土壤海拔匹配）、發芽活存率高、生長速度匹配目標、根系特性（深根固土vs淺根覆蓋）、耐逆境（貧瘠/乾旱）、生態安全（非外來入侵種）、材料取得性、演替階段定位。",
d:`<h4>一、植物選定條件</h4><ul><li><b>適地適種：</b>氣候（溫度、降雨）、土壤（pH、肥力）、海拔適應範圍須與施工環境匹配</li><li><b>生長速度：</b>快速覆蓋→選草本先鋒（百喜草、賽芻豆）；長期植生→選木本（山黃麻、台灣相思）</li><li><b>根系特性：</b>淺根密集（草本）固持表土；深根（喬木）固結深層，混植最佳</li><li><b>耐逆境：</b>坡地土壤貧瘠、排水快，需耐貧瘠（豆科固氮尤佳）、耐旱</li><li><b>生態安全：</b>絕對不選外來入侵種（小花蔓澤蘭、銀合歡、大花咸豐草）</li></ul><h4>二、鄉土植物與外來植物比較</h4><table><tr><th>項目</th><th>鄉土植物</th><th>外來植物</th></tr><tr><td><b>優點</b></td><td>已適應當地氣候土壤；不構成外來種威脅；提供野生動物棲地；維護生物多樣性</td><td>部分種生長快（快速覆蓋）；種源供應穩定成本低</td></tr><tr><td><b>缺點</b></td><td>初期生長通常較慢；苗木或種子來源有限、成本較高</td><td>具外來種入侵風險（銀合歡、小花蔓澤蘭排擠本土植相）；長期生態效益低；後期清除困難</td></tr><tr><td><b>適用策略</b></td><td>長期生態復育首選，應作為主要植生物種</td><td>緊急裸地覆蓋的短期先鋒種，需選非入侵性者，逐步以鄉土種取代</td></tr></table>`},
{yr:"111",sub:"植生工程",type:"orig",n:"111v5",pts:20,
q:"請說明移植樹齡超過10年以上之喬木如何實施斷根及移植作業？",
s:"斷根：移植前6個月~2年，分2~3期環狀斷根（每次1/3~1/2圓弧），填含磷肥疏鬆壤土，刺激細根再生。移植：挖掘土球（徑=DBH×8~10倍）→麻布袋包紮→吊掛搬運→植穴改良→種植（勿過深）→定樁支撐（3支，固定2年）→修剪枝葉30~50%→澆水養護。",
d:`<h4>一、移植前準備評估</h4><ul><li>評估健康狀況（樹幹腐朽、根系分布）</li><li>根球直徑=胸徑（DBH）×8~10倍；例：DBH=20cm→根球直徑160~200cm</li></ul><h4>二、斷根（Root Pruning）作業</h4><ul><li><b>時機：</b>移植前6個月~2年，最好分2~3期（每期間隔3~6個月）</li><li><b>分期斷根：</b><ul><li>第一期：切斷1/3~1/2圓弧側根，其餘留存，填含磷肥疏鬆壤土刺激細根再生</li><li>第二期：切斷另一側，使全圓均有再生根</li></ul></li><li><b>斷面處理：</b>平整光滑，塗抹傷口保護劑，防止病菌入侵</li></ul><h4>三、移植作業程序</h4><ul><li><b>修剪：</b>移植前修剪30~50%枝葉，減少蒸散，保留主要骨幹枝</li><li><b>挖掘土球：</b>以根球直徑圓外挖掘，保持土球完整</li><li><b>包紮：</b>草繩或麻布袋由底部向上緊繞，搬運時土球不鬆散</li><li><b>種植：</b>放入植穴，深度與原地相同（不可過深），填土分層夯實</li><li><b>定樁支撐：</b>設置3支支撐木樁（三角形），防強風搖晃影響根系定著，支撐時間約2年</li><li><b>澆水養護：</b>種植後立即大量澆水，此後每週2~3次，維持土球保濕</li><li><b>施肥：</b>移植後3~6個月，根系穩定後才開始施用緩效肥料</li></ul>`},
{yr:"112",sub:"植生工程",type:"orig",n:"112v1",pts:20,
q:"請詳細說明植生之前期基礎工處理項目為何？",
s:"前期基礎工：(1)坡面清理與整坡（清除鬆動石塊、整平）；(2)土壤改良（調pH、增有機質、施基肥）；(3)坡面穩定工程（格框、錨釘、金屬網、土工格網）；(4)截排水設施（截水溝、排水溝、水平排水孔）；(5)臨時防護覆蓋（PE布、無紡布、稻草蓆）；(6)客土基盤準備（噴植材料配置）。",
d:`<h4>1. 坡面清理與整坡</h4><ul><li>清除鬆動岩塊、殘材、廢棄物，防止後續施工落石危害</li><li>整平凸凹不規則處，使坡面坡度均勻，噴植材料可均勻附著</li><li>必要時整成水平階，縮短有效坡長</li></ul><h4>2. 土壤性質改良</h4><ul><li>pH調整：強酸→施石灰；強鹼→施石膏或硫磺</li><li>有機質補充：堆肥、腐植土；施用緩效複合肥料</li></ul><h4>3. 坡面穩定工程</h4><ul><li>格框工程（RC格框或木框）：坡度過陡時先建格框，框內填客土再植生</li><li>錨釘（Rock bolt/Soil nail）：固定鬆動岩塊，防施工中落石</li><li>金屬網（High-tensile wire mesh）：作為噴植材料附著基盤，錨釘固定</li><li>土工格網（Geogrid）：提高表層土體整體強度，防薄層滑動</li></ul><h4>4. 排水設施</h4><ul><li>截水溝：坡頂設置，攔截外來逕流</li><li>坡面排水溝：縱向引導至安全出口</li><li>水平排水孔：若有地下水滲出，設排水孔洩壓</li></ul><h4>5. 臨時防護覆蓋</h4>施工期間以PE布、無紡布、稻草蓆覆蓋裸露坡面，颱風前確認覆蓋完整。`},
{yr:"112",sub:"植生工程",type:"orig",n:"112v2",pts:20,
q:"請詳細說明種子導入或苗木栽植之選擇條件。",
s:"選擇條件：(1)適地適種（氣候/土壤/海拔適配）；(2)發芽率與活存率高（草種≥80%）；(3)生長速度匹配目標（快速覆蓋vs長期目標）；(4)根系特性；(5)耐逆境（貧瘠/乾旱）；(6)生態安全（非外來入侵種）；(7)材料取得難易及成本；(8)演替階段定位（先鋒種vs目標種）。種子優先大面積快速覆蓋；苗木用於精確引入特定樹種。",
d:`<h4>種子導入 vs 苗木栽植選擇</h4><table><tr><th>項目</th><th>種子導入（播種/噴植）</th><th>苗木栽植</th></tr><tr><td>適用面積</td><td>大面積裸露地，噴植或撒播</td><td>中小面積，精確種植，或補植特定樹種</td></tr><tr><td>建立速度</td><td>發芽期1~4週，覆蓋需3~6個月</td><td>種植後即有一定高度，但定根期慢</td></tr><tr><td>成本</td><td>低（種子+噴植機具）</td><td>高（苗木生產+人工種植）</td></tr><tr><td>適用樹種</td><td>草本、豆科先鋒植物</td><td>木本植物；珍稀種；難以播種發芽者</td></tr></table><h4>植物材料選擇條件</h4><ul><li><b>適地適種：</b>海拔、氣候、土壤pH需與目標種生態需求匹配，是成活率根本保障</li><li><b>發芽率與活存率：</b>草種發芽率≥80%（CNS標準）；苗木1年後活存率≥85%</li><li><b>生長速度：</b>快速覆蓋需求→草本先鋒；長期植生→木本；混植最佳</li><li><b>根系特性：</b>淺根密集（草本）固持表土；深根（喬木）固結深層</li><li><b>耐逆境：</b>坡地貧瘠、排水快，豆科固氮植物尤佳</li><li><b>生態安全：</b>絕對不選外來入侵種；優先鄉土種</li><li><b>演替定位：</b>初期先鋒種（快速覆蓋）→中期木本→目標頂極群落</li></ul>`},
{yr:"112",sub:"植生工程",type:"orig",n:"112v3",pts:20,
q:"請詳細說明植生群落調查分析，常使用那些指數或介量參數做為定量評估之依據？",
s:"常用指數：(1)重要值（IV=相對密度+相對頻度+相對優勢度，0~300）；(2)物種豐富度（S，物種總數）；(3)Shannon-Wiener多樣性指數（H'=-Σpᵢln pᵢ）；(4)均勻度指數（J=H'/lnS，0~1）；(5)Simpson多樣性指數（D=1-Σpᵢ²）；(6)Sørensen相似性指數（CS=2C/(A+B)）。",
d:`<h4>一、樣區調查基本量測</h4><ul><li><b>密度（Density）：</b>單位面積某植物個體數（株/m²或株/ha）</li><li><b>頻度（Frequency）：</b>某物種出現樣區數/總樣區數×100%，反映分布均勻性</li><li><b>優勢度/基底面積（Basal area）：</b>喬木胸高斷面積（m²/ha）表示占有空間大小</li><li><b>覆蓋率（Cover）：</b>植物覆蓋地面投影面積百分比</li></ul><h4>二、常用定量評估指數</h4><table><tr><th>指數</th><th>公式</th><th>意義</th></tr><tr><td><b>重要值（IV）</b></td><td>IV=相對密度+相對頻度+相對優勢度（各相對值=各物種值/所有物種總值×100%）</td><td>IV最高的物種為群落優勢種，範圍0~300</td></tr><tr><td><b>物種豐富度（S）</b></td><td>樣區內出現的物種總數</td><td>最簡單直觀的多樣性指標</td></tr><tr><td><b>Shannon-Wiener（H'）</b></td><td>H'=-Σpᵢ×ln(pᵢ)（pᵢ=第i種個體數/總個體數）</td><td>H'越大→多樣性越高；H'=0只有一種</td></tr><tr><td><b>均勻度指數（J）</b></td><td>J=H'/ln(S)，範圍0~1</td><td>J=1：每種個體數完全相等；J越小→少數物種優勢</td></tr><tr><td><b>Simpson指數（D）</b></td><td>D=1-Σpᵢ²</td><td>D越接近1→多樣性越高，對常見種較敏感</td></tr><tr><td><b>Sørensen相似性（CS）</b></td><td>CS=2C/(A+B)（C=共同物種數，A,B=各樣區物種數）</td><td>比較兩樣區物種組成相似度，評估施工前後影響</td></tr></table>`},
{yr:"112",sub:"植生工程",type:"orig",n:"112v4",pts:20,
q:"請詳細說明礦區植生困難之問題與其未來之綠化計畫。",
s:"困難：強酸性（pH可低至2~3，AMD）、重金屬毒性（Cu/Pb/Zn/As超標）、極度貧瘠（有機質<0.1%）、物理性差（尾礦砂無凝聚力）、坡面不穩定（易液化）、高溫乾旱（無遮蔭）。綠化計畫：坡面穩定→土壤改良（大量石灰調pH、客土覆蓋）→先鋒植生（香茅草/豆科固氮）→木本植物引入→長期監測。",
d:`<h4>一、礦區植生困難問題</h4><table><tr><th>問題</th><th>說明</th><th>嚴重程度</th></tr><tr><td><b>強酸（AMD）</b></td><td>硫化物（FeS₂）氧化產生硫酸，pH可低至2~3；Al³⁺、Mn²⁺毒性離子大量溶出</td><td>★★★★★</td></tr><tr><td><b>重金屬毒性</b></td><td>Cu、Pb、Zn、As、Cd超過植物耐受閾值，抑制根系生長</td><td>★★★★★</td></tr><tr><td><b>極度貧瘠</b></td><td>有機質幾乎為零（&lt;0.1%），無微生物活性，缺N、P、K</td><td>★★★★</td></tr><tr><td><b>物理性差</b></td><td>尾礦砂粒徑均一，保水性極差，乾燥時揚塵，濕潤時無凝聚力</td><td>★★★★</td></tr><tr><td><b>坡面不穩定</b></td><td>尾礦堆坡度過陡，飽和時易液化</td><td>★★★★</td></tr></table><h4>二、礦區綠化計畫</h4><ul><li><b>Phase 1. 坡面穩定：</b>整坡至安全坡角（1:2~1:3）；設截排水系統；酸性廢水以石灰中和處理</li><li><b>Phase 2. 土壤改良：</b>大量石灰（50~100 ton/ha）調pH至5.5~6.5；磷酸鹽鈍化重金屬；生物炭吸附；客土覆蓋20~40cm；大量堆肥（>20 ton/ha）</li><li><b>Phase 3. 先鋒植生：</b>香茅草（Vetiver，深根耐重金屬）；豆科固氮植物（田菁、太陽麻）；植生萃取：蜈蚣草（吸As）、東南景天（Zn/Cd）</li><li><b>Phase 4. 長期恢復：</b>先鋒植生建立後（2~3年）引入木本先鋒（相思樹、木麻黃）→5~10年後引入當地原生樹種；定期監測pH、重金屬含量、植被覆蓋率</li></ul>`},
{yr:"112",sub:"植生工程",type:"orig",n:"112v5",pts:20,
q:"請詳細說明崩塌地不同立地條件之植生工法及植物材料選用之原則。",
s:"依立地條件：土壤型崩塌地（有殘留土）→直接噴植+木本苗木；岩石裸露（無土壤）→格框客土噴植；陡峭崩塌（>45°）→金屬網+錨釘+客土噴植；溪岸崩塌（河岸型）→護岸+植生工程；高海拔→選高海拔耐寒植物。選用原則：適地適種、先鋒種+目標種混植、本土種優先、豆科必配。",
d:`<h4>崩塌地立地條件分類與植生工法</h4><table><tr><th>立地條件</th><th>特徵</th><th>植生工法</th><th>植物材料</th></tr><tr><td><b>土壤型崩塌地</b></td><td>表土殘存20~50cm，肥力尚可</td><td>直接噴植（Hydroseeding）；配合打孔種植木本苗木</td><td>草本：百喜草、賽芻豆（豆科固氮）；木本：山黃麻、白匏子</td></tr><tr><td><b>岩石裸露崩塌地</b></td><td>表土完全流失，岩盤或岩石碎屑裸露</td><td>格框工程（RC格框+錨釘）→框內填客土→客土噴植</td><td>耐貧瘠植物：台灣蘆竹、香茅草、豆科先鋒（太陽麻）</td></tr><tr><td><b>陡峭崩塌地（>45°）</b></td><td>超過一般植生工法安全操作範圍</td><td>高強度金屬網（鋼絲網）+長錨釘（3~6m）→噴覆客土5~15cm→噴植種子</td><td>初期：百喜草、賽芻豆；後期：刺藤類攀爬植物</td></tr><tr><td><b>溪岸崩塌地</b></td><td>野溪岸坡，週期性淹水</td><td>坡腳護岸（乾砌石/箱籠）→中坡位層積扦插（柳枝束）→坡頂噴植</td><td>水柳、楓楊（耐濕耐沖）；甜根子草、蘆葦</td></tr><tr><td><b>高海拔崩塌地（>2000m）</b></td><td>氣溫低、生長季短、強風</td><td>簡易格框+高海拔適生種；避免使用低海拔種子</td><td>玉山箭竹、高羊茅（耐寒草種）；玉山圓柏（生長極緩）</td></tr></table><h4>植物材料選用原則（通用）</h4><ul><li>適地適種，是成活率根本保障</li><li>先鋒種（草本、豆科）快速覆蓋+目標種（木本鄉土）建立長期植群</li><li>鄉土種優先，適應當地、不造成外來種入侵</li><li>豆科植物必配：根瘤菌固氮，改善貧瘠地力</li><li>多樣性設計：混植多種植物，分散病蟲害風險</li></ul>`},
{yr:"113",sub:"植生工程",type:"orig",n:"113v1",pts:25,
q:"請詳細說明土壤硬度太低與太高時，植物生長各會遇到的問題及該採取的基礎工。",
s:"硬度太低（<200kPa，鬆軟）：根系固定不足（易倒伏）、坡面整體不穩定、施工機具下陷。基礎工：竹木樁/鋼筋固定、土工格網加固、適量固化劑。硬度太高（>2000kPa或岩盤）：根系穿透困難、透氣透水差（根系缺氧）、有效水分少。基礎工：深翻鬆土（Subsoiling）、打孔回填客土、格框客土噴植、爆破（岩盤）。",
d:`<h4>土壤硬度指標（貫入阻力）</h4>鬆軟：&lt;200 kPa；適中：200~2000 kPa；堅硬：&gt;2000 kPa；岩盤：&gt;10 MPa<h4>一、硬度太低（&lt;200kPa）</h4><table><tr><th>問題</th><th>說明</th></tr><tr><td>根系固定不足</td><td>土壤無法有效錨固根系，植物受風易傾倒</td></tr><tr><td>坡面整體不穩定</td><td>鬆軟土體在降雨後易整體滑動</td></tr><tr><td>施工困難</td><td>機具進入造成過度下陷，破壞種植環境</td></tr></table><b>基礎工措施：</b><ul><li>竹木樁或鋼筋固定：在種植穴外圍打入樁，形成物理固定框架</li><li>土工格網（Geogrid）：地表下鋪設，增加表層土體整體剪力強度</li><li>適量固化劑：石灰或水泥（&lt;5%）提高表層土體強度，不影響植物生長</li></ul><h4>二、硬度太高（&gt;2000kPa或岩盤）</h4><table><tr><th>問題</th><th>說明</th></tr><tr><td>根系穿透困難</td><td>根系無法深入，導致淺根化，抗風差</td></tr><tr><td>透氣透水差</td><td>壓實後大孔隙消失，入滲率極低，根系缺氧</td></tr><tr><td>有效水分少</td><td>壓實改變孔隙結構，植物可利用水分減少</td></tr></table><b>基礎工措施：</b><ul><li>深翻鬆土（Subsoiling）：翻鬆30~60cm深，打破緊實層（Hardpan）</li><li>打孔回填客土：鑽孔機打孔（徑30~50cm，深60~100cm），回填有機質豐富客土</li><li>格框客土噴植：設置RC格框，框內填人工土壤（腐植土+珍珠石+緩效肥）</li><li>爆破（岩盤）：以小量炸藥破碎岩面，回填客土後植生</li></ul>`},
{yr:"113",sub:"植生工程",type:"orig",n:"113v2",pts:25,
q:"部分禾草能長出走莖或匍匐莖（如百慕達草），有些則無法（如甜根子草）。說明在植生工程中使用能長出走莖或匍匐莖的禾草有何好處？",
s:"好處：(1)水平擴展快速覆蓋地表（每月延伸20~50cm）；(2)節間生根無性繁殖，可採「鋪莖法」施工；(3)受損後由走莖快速自我修復（降低補植成本）；(4)密集地表網絡增加土壤凝聚力；(5)耐踐踏性強（損傷後由側方節點再生）。",
d:`<h4>一、走莖/匍匐莖的定義</h4><ul><li><b>走莖（Stolon）：</b>地上部向側方延伸，節間可生根長葉（百慕達草、狗牙根）</li><li><b>匍匐莖：</b>沿地表匍匐生長（馬蹄金、類地毯草）</li><li><b>甜根子草（無走莖）：</b>叢生型，只能由基部分蘗，無法水平擴展</li></ul><h4>二、植生工程中使用走莖/匍匐莖禾草的好處</h4><table><tr><th>好處</th><th>工程意義</th></tr><tr><td><b>快速水平覆蓋</b></td><td>每月延伸20~50cm，施工後幾個月即達有效覆蓋率（>70%），大幅縮短裸地暴露時間</td></tr><tr><td><b>無性繁殖能力強</b></td><td>可採「鋪莖法」施工（走莖段直接鋪設覆土），不依賴種子發芽率，成活率高</td></tr><tr><td><b>自我修復</b></td><td>颱風豪雨沖蝕局部草皮後，由鄰近走莖自然修復，降低維護補植成本</td></tr><tr><td><b>密集地表網絡</b></td><td>走莖與根系形成緻密交織網絡，直接保護土壤顆粒不被雨滴打擊及逕流帶走</td></tr><tr><td><b>耐踐踏性強</b></td><td>農機行走的梯田埂面、道路邊坡等需耐踐踏部位特別適用</td></tr></table>`},
{yr:"113",sub:"植生工程",type:"orig",n:"113v3",pts:25,
q:"請詳細說明如何透過地面調查的方式，測得一塊10公頃林地中樹木的生物量及所儲存的碳量。",
s:"步驟：(1)設置樣區（每公頃3~5個，20m×20m）；(2)每木調查（量測DBH、樹高、樹種）；(3)代入異速生長方程式（AGB=a×DBH^b）計算地上部生物量；(4)估算地下部（×地下/地上比R≈0.26~0.30）；(5)碳量=總生物量×碳含量係數（CF≈0.47）；(6)加入枯死木、落葉層、土壤有機碳。全林地碳量=樣區均值×10ha。",
d:`<h4>一、樣區設置</h4><ul><li>系統性隨機抽樣：10公頃林地中至少設置15~20個樣區</li><li>巢式樣區：大樣區（20×20m=400m²）量測喬木；中樣區（100m²）量測亞喬木；小樣區（25m²）量測灌木</li></ul><h4>二、每木調查（每個樣區內所有樹木）</h4><ul><li><b>胸徑（DBH）：</b>地上1.3m處量測（cm），使用胸徑尺</li><li><b>樹高（H）：</b>測高儀（Clinometer）或雷射測距儀量測（m）</li><li><b>樹種記錄：</b>用於選擇異速生長方程式</li></ul><h4>三、生物量估算</h4><b>地上部生物量（AGB）：</b><div class="fm">AGB = a × DBH^b（或 AGB = a × (DBH²×H)^b）</div>a、b為樹種特定係數（查台灣本土或亞熱帶樹種資料庫）<br><b>地下部生物量（BGB）：</b><div class="fm">BGB = AGB × R（R=地下/地上比，台灣闊葉林≈0.26~0.30）</div><h4>四、碳量計算</h4><div class="fm">碳儲量（ton C）= 總生物量（ton dry weight）× CF（≈0.47~0.50）</div>IPCC建議CF=0.47（闊葉樹）；0.51（針葉樹）<h4>五、其他碳庫</h4><ul><li>枯死木：量測倒木長度×中間直徑，估算體積×木材密度×CF</li><li>枯落物層：採樣（1m²）秤乾重×面積×CF</li><li>土壤有機碳（SOC）：土壤剖面量測（0~30cm）×容積密度</li></ul><div class="fm">全林地碳量 = 樣區均值/樣區面積 × 10 ha</div>`},
{yr:"113",sub:"植生工程",type:"orig",n:"113v4",pts:25,
q:"植生演替可分為初生與次生演替，請詳述面對即將發生初生或次生演替的治理地區，各該如何進行植生工程。",
s:"初生演替（完全無土壤，如裸岩/熔岩地）：需先創造土壤基盤（格框客土/客土噴植）→接種微生物（菌根菌）→先鋒植物（豆科+草本）→木本植物，過程緩慢（3~5年養護）。次生演替（有土壤殘留，如崩塌地/棄耕地）：保留土壤種子庫→先穩定土壤（工程）→利用種子庫自然萌發→加速演替（直接引入先鋒木本，跳過草本階段）→逐步減少人為介入。",
d:`<h4>一、初生演替（Primary Succession）</h4><b>定義：</b>在完全沒有土壤基盤的裸露基質上（裸岩、熔岩地、採礦廢土堆）發生的演替，從零開始，需時數十至數百年。<h4>植生工程策略</h4><ul><li><b>Step 1. 創造土壤基盤（最關鍵）：</b>岩石坡面設置格框（RC/木製，錨釘固定），框內填人工土壤（腐植土+河砂+緩效肥），厚度≥15cm；或客土噴植5~15cm</li><li><b>Step 2. 接種微生物：</b>加入菌根菌（Mycorrhiza）與根瘤菌，幫助植物在貧瘠基盤獲取養分</li><li><b>Step 3. 先鋒植物導入：</b>豆科植物（賽芻豆、太陽麻）固氮；草本先鋒（百喜草）快速覆蓋防侵蝕</li><li><b>Step 4. 木本植物引入：</b>3~6個月後種植先鋒木本（山黃麻、白匏子），逐步建立喬木層</li><li><b>Step 5. 長期養護（3~5年）：</b>定期補肥、補植，直至植群自我維持</li></ul><h4>二、次生演替（Secondary Succession）</h4><b>定義：</b>在土壤基盤已存在（保有有機質、種子庫、微生物）的擾動地上發生（崩塌地堆積區、棄耕地、火災後林地），速度遠快於初生演替。<h4>植生工程策略</h4><ul><li><b>Step 1. 保留土壤種子庫：</b>不翻除現有表土，讓種子庫自然萌發；崩塌地殘留表土層原位保護</li><li><b>Step 2. 先穩定土壤：</b>設截排水、固床工，穩定後才進行植生，避免被沖走</li><li><b>Step 3. 加速演替（直接引入先鋒木本）：</b>不需從草本開始，直接種植第2~3演替階段的先鋒木本（山黃麻、白匏子、構樹）縮短恢復時程</li><li><b>Step 4. 鄉土種多樣化混植：</b>參考鄰近自然林植群組成，提高生態功能與穩定性</li><li><b>Step 5. 逐步減少人為介入：</b>確認植群建立後減少澆水、施肥，讓植群自然發展</li></ul><div class="note"><b>關鍵差異：</b>初生演替地需「從零創造」土壤基盤，工程量大、養護期長；次生演替地已有基盤，重點在「加速演替」，充分利用自然恢復能力。</div>`},
{yr:"114",sub:"植生工程",type:"orig",n:"114v1",pts:25,
q:"淨零排放（Net Zero）之意義為何？並請詳細說明臺灣2050淨零排放路徑。",
s:"淨零排放：溫室氣體排放量=吸收量（碳匯），使大氣中GHG淨增加為零。台灣2050路徑四大策略：能源轉型（再生能源占比60~70%）、產業轉型（製程電氣化/CCUS）、生活轉型（電動車/綠建築）、社會轉型（碳費/碳交易）。水保相關：植生造林增加碳匯、生物質能（BECCS）。",
d:`<h4>一、淨零排放定義</h4>人為產生的溫室氣體（GHG）排放量，透過<b>減少排放</b>（節能、再生能源）與<b>增加碳匯</b>（植林、CCUS）兩種途徑，使大氣中GHG的<b>淨增加量趨近於零</b>。<h4>二、台灣2050淨零排放路徑（國發會，2022）</h4><table><tr><th>策略</th><th>目標</th><th>主要措施</th></tr><tr><td><b>能源轉型</b></td><td>再生能源發電占比達60~70%（2050）</td><td>太陽光電（80 GW）、離岸風電（55 GW）、氫能、儲能系統</td></tr><tr><td><b>產業轉型</b></td><td>工業部門減碳60%以上</td><td>製程電氣化、氫能應用（鋼鐵、化工）、循環經濟、CCUS</td></tr><tr><td><b>生活轉型</b></td><td>建築、運輸部門低碳化</td><td>電動車普及（2040禁售燃油機車）、綠建築標章、大眾運輸</td></tr><tr><td><b>社會轉型</b></td><td>建立碳定價機制</td><td>碳費（2024年起）、碳交易市場、綠色金融、公正轉型</td></tr></table><h4>兩大基礎</h4><ul><li><b>科技研發：</b>氫能、CCUS、直接空氣碳捕捉（DAC）</li><li><b>氣候法制：</b>氣候變遷因應法（2023年修正），確立2050淨零法律基礎</li></ul><h4>水保領域的貢獻</h4><ul><li>植生造林與崩塌地復育：增加森林碳匯（每公頃5~10 ton C/yr）</li><li>農業碳匯：免耕農法、水田甲烷管理、生物炭（Biochar）應用</li><li>生物能源搭配碳捕捉（BECCS）：農業廢棄物能源化+CO₂封存，達到負排放</li></ul>`},
{yr:"114",sub:"植生工程",type:"orig",n:"114v2",pts:25,
q:"請詳細說明木本植物（灌木和喬木）的綠化防災功能。",
s:"根系固土防崩塌（根系加固力c_root可達1~30 kPa）；蒸散降低孔隙水壓（提高FS）；冠層截雨削減衝擊；防風林降低風速（背風側50~70%）；河岸護岸防侵蝕（水柳、楓楊）；海岸紅樹林消波；涵養水源補注地下水；多樣木本群落增加生態系韌性。",
d:`<h4>一、坡面穩定功能（防崩塌）</h4><ul><li><b>根系機械加固：</b>喬木深根系穿透土層，根系加固力c_root可達1~30 kPa（依樹種），相當於提高邊坡安全係數10~30%</li><li><b>蒸散降低孔隙水壓：</b>成樹每日蒸散50~300L，持續降低土壤含水量，延緩崩塌觸發時間</li><li><b>根錨固定：</b>深根穿越潛在滑動面，直接物理抵抗滑動</li></ul><h4>二、水文調節功能（防洪）</h4><ul><li><b>冠層截留：</b>喬木冠層截留降雨10~40%，削減到達地表的雨量及雨滴動能，防雨濺蝕</li><li><b>根系促進入滲：</b>根孔增加土壤大孔隙，提高入滲率，削減洪峰，增加枯水基流</li><li><b>地下水涵養：</b>森林集水區地下水補注量比裸地高20~50%</li></ul><h4>三、防風功能</h4>防風林帶在背風側15~20倍樹高距離內可降低風速50~70%，顯著減少農地及坡面風蝕。<h4>四、河岸與海岸防護</h4><ul><li><b>河岸護岸：</b>水柳、楓楊根系固持河岸，柔韌莖幹分散洪水衝擊力，提供魚蝦棲地</li><li><b>海岸防護：</b>紅樹林根系消波（波浪能削減50~70%）；防風林帶防止海岸沙丘移動</li></ul><h4>五、生態系統韌性</h4>多樣木本植物群落形成多層次結構，提供野生動物棲地，使生態系統對災害的恢復力更強。老樹、倒木為溪流提供木屑（LWD），創造深潭地形，增加魚蝦棲息空間。`},
{yr:"114",sub:"植生工程",type:"orig",n:"114v3",pts:25,
q:"請詳細說明當崩塌地裸露坡面超過臨界坡度時，應如何進行該坡面之植生綠化工作？",
s:"超過臨界坡度（一般>1:0.8，約51°）時，植生材料無法自然附著，需先設置物理固定基盤。步驟：安全清理（移除鬆動岩塊）→格框工程或金屬網（錨釘固定）→客土噴植（厚5~15cm）→草木混植（草本先鋒+木本）→養護（前3個月每週澆水）→長期巡查補植。",
d:`<h4>一、臨界坡度參考</h4><table><tr><th>植生工法</th><th>適用最大坡度</th></tr><tr><td>一般噴植（Hydroseeding）</td><td>1:0.5（約63°）</td></tr><tr><td>客土噴植</td><td>1:0.3（約73°），需搭配金屬網</td></tr><tr><td>格框客土植生</td><td>接近垂直（需錨釘固定格框）</td></tr></table><h4>二、超臨界坡度植生流程</h4><b>Step 1. 安全清理（首要步驟）</b><ul><li>清除鬆動岩塊、不穩定土體，避免施工落石危害</li><li>必要時以爆破破碎突出岩盤，使坡面較平整</li></ul><b>Step 2. 設置固定基盤</b><ul><li><b>格框工程：</b>在坡面構築RC格框（通常3×3m），以錨釘（L=3~6m）固定，格框內填客土後植生</li><li><b>金屬網：</b>釘設高強度鋼絲網覆蓋全坡面，以長錨釘固定，作為噴植材料附著基盤</li></ul><b>Step 3. 客土噴植施工</b><ul><li>噴植材料：有機客土60%+木纖維20%+緩效肥料+種子+高分子黏著劑（PVA）</li><li>噴植厚度：有金屬網時5~10cm；有格框時10~15cm</li><li>先噴底層（無種子）再噴含種子表層，使種子位於適當深度</li></ul><b>Step 4. 草木混植設計</b><ul><li>初期草種（0~3個月）：百喜草、賽芻豆——快速覆蓋</li><li>中期灌木（3個月~2年）：山黃麻、白匏子——先鋒木本</li><li>長期喬木（2年以上）：台灣相思、台灣欒樹——永久植群</li></ul><b>Step 5. 養護管理</b><ul><li>前3個月每週澆水2次；每季巡查格框裂縫及客土脫落情況</li><li>2~3年後確認鬱閉程度，必要時補種木本</li></ul>`},
{yr:"114",sub:"植生工程",type:"orig",n:"114v4",pts:25,
q:"請詳細舉例說明河川護岸植生有那些可行方法與材料？",
s:"方法：(A)純生物工程（直接扦插、活木樁、柳枝束、層積扦插、植生捆）；(B)半工程（格框+植生、拋石+植生、椰纖格網）；(C)仿自然硬式（乾砌石、石籠、預鑄植生塊）。材料：水柳、楓楊、蘆葦、甜根子草、椰纖維捲、土工格網。原則：依流速選工法（低→生態；高→半工程/硬式）。",
d:`<h4>一、生物工程工法（Soil Bioengineering）</h4><table><tr><th>工法</th><th>施作方式</th><th>適用流速</th><th>材料</th></tr><tr><td><b>直接扦插</b></td><td>活枝條（徑1~3cm，長40~60cm）直接插入濕潤河岸，間距30~50cm</td><td>&lt;1.5 m/s</td><td>水柳、白柳、台灣水蠟樹</td></tr><tr><td><b>活木樁</b></td><td>粗枝條（徑3~10cm）打入坡腳，深度≥60cm</td><td>&lt;2.0 m/s</td><td>水柳、楊柳、構樹</td></tr><tr><td><b>柳枝束</b></td><td>枝條捆綑（徑15~30cm），橫埋等高線溝槽（深30~40cm）覆土後萌芽</td><td>&lt;1.5 m/s</td><td>柳類枝條束</td></tr><tr><td><b>層積扦插</b></td><td>挖水平階梯狀溝槽，分層埋入活枝條束</td><td>&lt;2.0 m/s</td><td>柳樹、台灣山豬枷</td></tr><tr><td><b>植生捆（Coir roll）</b></td><td>椰纖維圓柱捆（徑30~50cm），固定於常水位線</td><td>&lt;1.5 m/s</td><td>椰纖維捲+蘆葦、香蒲</td></tr></table><h4>二、半工程工法</h4><ul><li><b>格框植生：</b>RC或木框固定坡面，格框內回填客土植生，兼具結構與植生</li><li><b>拋石+植生：</b>坡腳設拋石消能，石縫間縫植草種（縫植）</li><li><b>椰纖格網+噴植：</b>地表鋪設椰纖格網釘固，噴植草種</li></ul><h4>三、仿自然硬式護岸</h4><ul><li><b>乾砌石護岸：</b>石縫提供魚蝦棲地，透水，流速2~3 m/s</li><li><b>石籠護岸（Gabion）：</b>鋼絲網籠填礫石，柔性適應沉陷，可植生</li></ul><h4>四、植栽材料彙整</h4><table><tr><th>類型</th><th>代表物種</th><th>位置</th></tr><tr><td>挺水植物</td><td>蘆葦、香蒲、水燭、菖蒲</td><td>常水位線及以下</td></tr><tr><td>水岸草本</td><td>甜根子草、五節芒、台灣蘆竹</td><td>洪水線以下坡面</td></tr><tr><td>水岸喬木</td><td>水柳、楓楊、水黃皮</td><td>護岸坡頂，長期固土</td></tr></table>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"s01",pts:25,
q:"某山坡地坡面總坡長180m，坡度均一15%，Km=0.045 ton·ha·hr/ha·MJ·mm，Rm=18,500 MJ·mm/ha·hr·yr。請依USLE計算下列三情境年土壤流失量，並比較說明防治效果：（一）裸露地（C=1.0，P=1.0）；（二）種植百喜草（C=0.05，P=1.0）；（三）加設等高草帶（C=0.05，P=0.50）",
s:"LS：L=(180/22.13)^0.5=2.851；S（坡度15%，>9%用大坡度公式）=16.8×0.15-0.50=2.02；LS=5.759。基準=18500×0.045×5.759=4,794 ton/ha/yr。(一)4,794；(二)240（減少95%）；(三)120（再減50%）。",
d:`<h4>LS因子計算</h4><div class="fm">L = (180/22.13)^0.5 = 2.851</div><div class="fm">S = 16.8×0.15-0.50 = 2.02（坡度15%，用大坡度公式 S=16.8sinβ-0.50）</div><div class="fm">LS = 2.851×2.02 ≈ 5.759</div><h4>三種情境計算</h4><div class="fm">R×K×LS = 18500×0.045×5.759 ≈ 4,794 ton/ha/yr（基準）</div><table><tr><th>情境</th><th>C</th><th>P</th><th>A（ton/ha/yr）</th><th>相對裸地</th></tr><tr><td>（一）裸露地</td><td>1.00</td><td>1.00</td><td>4,794</td><td>基準</td></tr><tr><td>（二）百喜草</td><td>0.05</td><td>1.00</td><td>240</td><td>減少95.0%</td></tr><tr><td>（三）+等高草帶</td><td>0.05</td><td>0.50</td><td>120</td><td>減少97.5%</td></tr></table><div class="note">⚠️ 坡度S因子選用：坡度&lt;9%用S=10.8sinβ+0.03；≥9%用S=16.8sinβ-0.50。這是常見失分點！</div>`},
{yr:"自出",sub:"坡地水文學",type:"self",n:"s02",pts:20,
q:"請說明Horton超滲逕流（Hortonian overland flow）與Dunne飽和超滲逕流（Saturation excess overland flow）的形成機制有何不同？台灣山坡地以哪一種為主？並說明理由。",
s:"Horton逕流：雨強>入滲率時形成，整個坡面均可發生，以裸地/壓實地為主。Dunne逕流：土壤飽和後任何降雨都產生逕流，從坡腳濕潤區向上擴展（Variable Source Area）。台灣山坡地以Dunne飽和超滲逕流為主：颱風長延時大雨量使土壤後期完全飽和、林地入滲率高（不易Horton）、崩塌多發於颱風後期。",
d:`<table><tr><th>比較項目</th><th>Horton超滲逕流</th><th>Dunne飽和超滲逕流</th></tr><tr><td><b>形成條件</b></td><td>雨強 i &gt; 入滲率 f，超出部分積水成逕流</td><td>土壤含水量達飽和（θ=θs），任何強度降雨均無法再入滲</td></tr><tr><td><b>發生位置</b></td><td>整個坡面均可，以裸地、壓實地、農耕地最常見</td><td>從坡腳、低窪地、地下水匯集處優先飽和，向上坡擴展（Variable Source Area）</td></tr><tr><td><b>發生時機</b></td><td>降雨初期即可發生，與雨強直接相關</td><td>需累積一段降雨（土壤趨近飽和），颱風後期特別顯著</td></tr><tr><td><b>控制因素</b></td><td>雨強、入滲率（土壤質地、結構、覆蓋）</td><td>土壤前期含水量、地下水位高低、降雨延時</td></tr></table><h4>台灣山坡地以Dunne逕流為主的理由</h4><ul><li>台灣山坡地植生覆蓋良好，林地入滲率高（10~50mm/hr），短延時降雨不易超過入滲率</li><li>颱風帶來長延時大雨量（24~72hr持續），土壤含水量逐漸飽和，後期幾乎全部轉化為逕流</li><li>台灣大規模崩塌多發生於颱風降雨後期（土壤完全飽和），與Dunne逕流機制一致</li></ul>`},
{yr:"自出",sub:"植生工程",type:"self",n:"s03",pts:20,
q:"請說明下列三種植生材料在坡地護坡工程中的功能差異，並各舉出一個適用的坡地情境：（一）百喜草（Paspalum notatum）；（二）香茅草（Vetiver grass）；（三）台灣相思（Acacia confusa）",
s:"百喜草：淺根密集，覆蓋快（3~6個月），適合新開挖邊坡快速防蝕。香茅草：深根（可達3~4m），耐重金屬貧瘠，適合礦區尾礦坡面。台灣相思：木本深根+根瘤菌固氮，適合崩塌地中後期建立永久植群。三者混植可涵蓋表層+深層固土。",
d:`<table><tr><th>比較項目</th><th>百喜草</th><th>香茅草（Vetiver）</th><th>台灣相思</th></tr><tr><td><b>植物類型</b></td><td>草本（多年生）</td><td>草本（叢生禾草）</td><td>木本（喬木）</td></tr><tr><td><b>根系深度</b></td><td>淺根密集，約30~60cm</td><td>深根，可達3~4m，幾乎垂直向下</td><td>深根，側根+主根，可達2~5m</td></tr><tr><td><b>覆蓋速度</b></td><td>快（3~6個月有效覆蓋）</td><td>中等（叢生型，不能水平擴展）</td><td>慢（1~3年建立）</td></tr><tr><td><b>固土機制</b></td><td>密集淺根固持表層土壤，防雨濺蝕與片蝕</td><td>深根如「活樁」穿越滑動面，固結深層土體</td><td>深根固結深層，枯落物增加有機質，長期改善土壤結構</td></tr><tr><td><b>耐逆境</b></td><td>耐旱、耐貧瘠、耐日照</td><td>耐重金屬、耐強酸鹼，逆境適應極強</td><td>根瘤菌固氮，耐貧瘠</td></tr><tr><td><b>適用情境</b></td><td>新開挖路切邊坡，需在最短時間建立有效覆蓋</td><td>礦山廢土堆，土壤pH低、重金屬超標</td><td>崩塌地植生工程中後期，建立永久木本植群</td></tr></table><div class="note">整合建議：三者混植效果最佳——百喜草快速覆蓋（表層防蝕）+ 香茅草深根穩定（深層固土）+ 台灣相思長期演替（生態恢復）。</div>`},
{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"s04",pts:25,
q:"某山坡地建築開發案，基地面積2.5公頃，基地內有一條小野溪穿越。請依《水土保持法》及《水土保持技術規範》回答：（一）此開發案是否需要擬具水土保持計畫？依據為何？（5分）（二）針對野溪應規劃哪些水土保持設施？各設施功能為何？（10分）（三）施工期間的臨時性防護措施應包含哪些項目？（10分）",
s:"(一)需擬具：依水保法§12，山坡地從事建築用地開發，須擬具水保計畫核定後施工。(二)野溪設施：固床工（防溝床下切）、護岸（防崩岸）、截水溝（坡頂攔截逕流）、排水溝（導引坡面逕流）、沉砂池（攔截泥砂）。(三)臨時防護：臨時沉砂池、臨時截排水溝、PE布/草蓆覆蓋、施工圍籬（Silt fence）、洗車臺、施工期巡查計畫。",
d:`<h4>（一）是否需擬具水保計畫</h4><b>是，需擬具。</b><br>依據：《水土保持法》第12條：「於山坡地……從事……（四）開發建築用地……應先擬具水土保持計畫，送請主管機關核定，方可實施。」本案位於山坡地，從事建築用地開發，符合§12第四款。<h4>（二）野溪水土保持設施</h4><table><tr><th>設施</th><th>功能</th></tr><tr><td><b>固床工</b></td><td>抬高溝床基準面，防止溪床持續下切（headcut erosion），穩定縱坡降</td></tr><tr><td><b>護岸工</b></td><td>保護溪岸免受洪水側向沖蝕，防崩岸；可採乾砌石（生態）或混凝土（高流速）</td></tr><tr><td><b>截水溝</b></td><td>設於野溪兩側坡頂，攔截上坡地表逕流，避免大量水流直接沖入野溪</td></tr><tr><td><b>排水溝</b></td><td>蒐集基地內逕流，導引至野溪或出口，防止逕流任意漫流沖蝕坡面</td></tr><tr><td><b>沉砂池</b></td><td>攔截施工期懸浮泥砂，防止進入野溪污染水質，達1/2容積即清淤</td></tr></table><h4>（三）施工期間臨時性防護措施</h4><ul><li><b>臨時沉砂池：</b>開挖面積≥1公頃必設，颱風後優先檢查</li><li><b>臨時截排水溝：</b>隨整地進度同步調整，確保任何時刻均有排水出口</li><li><b>裸露地覆蓋：</b>PE防水布或稻草蓆覆蓋裸露坡面，颱風前確認覆蓋完整</li><li><b>施工圍籬（Silt fence）：</b>設置在基地邊界，阻擋細粒泥砂隨逕流流出</li><li><b>洗車臺：</b>清除施工車輛輪胎泥砂，防止污染道路</li><li><b>施工期巡查：</b>每次降雨（≥30mm）後及颱風前後確認各設施功能正常</li></ul>`},
{yr:"自出",sub:"水土保持工程",type:"self",n:"s05",pts:20,
q:"台灣山坡地開發案在施工期間常因豪雨造成泥砂流失，請說明施工期間應如何配置臨時性水土保持設施，並說明各設施的設置原則及功能。",
s:"配置原則：由上游至下游、依序設置截水（截水溝）→排水（排水溝/跌水工）→沉砂（沉砂池）→最終出口。截水溝：坡頂攔截外來逕流；坡面截水溝：收集坡面逕流；沉砂池：攔截泥砂（容量=裸露面積×100m³/ha，達1/2即清淤）；PE布覆蓋：減少裸露沖蝕；施工圍籬：周界攔砂。",
d:`<h4>一、配置原則</h4>臨時性水土保持設施配置遵循「<b>源頭控制→途中攔截→末端處理</b>」的層次原則，由上游至下游依序設置。<h4>二、各設施設置原則與功能</h4><table><tr><th>設施</th><th>設置原則</th><th>功能</th></tr><tr><td><b>臨時截水溝</b></td><td>設於施工開挖邊界上坡側3~5m處；隨施工進度調整位置</td><td>攔截來自上坡未開挖區的清水，避免清水沖過裸露施工面增加泥砂</td></tr><tr><td><b>坡面排水溝</b></td><td>沿施工坡面縱向設置；出口連接沉砂池；坡降足夠時加設跌水工消能</td><td>蒐集施工坡面逕流快速排出，防止在坡面上形成集中侵蝕溝</td></tr><tr><td><b>臨時沉砂池</b></td><td>設於施工區排水出口；有效容量≥裸露面積×100m³/ha；淤積達1/2容積即清除</td><td>攔截施工期懸浮泥砂，保護下游水體；規範要求開發面積≥1公頃必設</td></tr><tr><td><b>PE布或無紡布覆蓋</b></td><td>覆蓋裸露坡面（尤其施工暫停期間）；颱風前必須確認覆蓋完整</td><td>減少雨滴直接衝擊裸土，大幅降低施工期沖蝕量（C值降低）</td></tr><tr><td><b>施工圍籬（Silt fence）</b></td><td>設於施工基地周界下坡側；支柱間距1~2m；布料埋入地下10~15cm</td><td>過濾施工基地流出的含泥逕流，攔截懸浮細粒土壤</td></tr><tr><td><b>洗車臺</b></td><td>設於施工車輛出入口；地面舖礫石或設高壓水柱；污水收集後處理</td><td>防止施工車輛將基地泥土帶出，污染鄰近道路及公共排水設施</td></tr></table>`},
{yr:"自出",sub:"坡地水文學",type:"self",n:"s06",pts:20,
q:"某集水區面積為50 km²，以合理化公式估算不同土地利用情境下的洪峰流量。集流時間tc=45分鐘，設計雨強i=80mm/hr（25年重現期）。試計算以下兩種情境的洪峰流量並說明差異：（一）天然林地（C=0.30）；（二）開發後混合用地（C=0.75）。並說明若要使開發後洪峰不超過天然林地洪峰，需設置多少m³的滯洪量（tc=45min）。",
s:"(一)Q林=0.30×80×50×100/360=3,333 cms；(二)Q開=0.75×80×50×100/360=8,333 cms。需削減=8333-3333=5000 cms。滯洪量（三角形法）=5000×45×60/2=6,750,000 m³=675萬m³。",
d:`<h4>一、洪峰流量計算</h4><div class="fm">Q = C × i × A / 360（A=50 km²=5000 ha）</div><div class="fm">（一）天然林地：Q = 0.30×80×5000/360 ≈ <b>3,333 cms</b></div><div class="fm">（二）開發後混合：Q = 0.75×80×5000/360 ≈ <b>8,333 cms</b></div><h4>二、洪峰差異說明</h4>開發後洪峰（8,333 cms）是天然林地（3,333 cms）的<b>2.5倍</b>。主要原因：C值從0.30增加至0.75（不透水面積大幅增加，入滲率降低），相同降雨條件下逕流量顯著增加。<h4>三、所需滯洪量估算</h4>需削減量 ΔQ = 8333-3333 = <b>5000 cms</b><br>tc=45 min=2700s<div class="fm">Vs（三角形法）= ΔQ × tp / 2 = 5000 × 2700 / 2 = <b>6,750,000 m³ = 675萬 m³</b></div><div class="note">此為龐大的滯洪量，說明大面積集水區開發後洪峰問題嚴重。實際規劃應從源頭降低C值（LID措施）、分散設置多個小型滯洪設施，而非倚賴單一大型滯洪池。</div>`}
,

{yr:"108",sub:"土壤物理與沖蝕",type:"orig",n:"108e1",pts:20,
q:"請詳述獲得小於0.05公厘土壤顆粒分析的分析方法及其理論依據。",
s:"粒徑<0.05mm（粉砂+黏粒）採沉降法（Sedimentation method），依Stokes定律：vs=(γs-γw)d²/18μ，顆粒越小沉降越慢。慣用比重計法（Hydrometer）或吸管法（Pipette）在特定時間與深度取樣，計算各粒徑百分比。前處理：H₂O₂去有機質、HCl去碳酸鈣、焦磷酸鈉分散。",
d:`<h4>一、適用範圍</h4>粒徑小於0.05mm（粉砂、黏粒）無法以篩分析（>0.05mm）測定，需改用沉降法。<h4>二、理論依據：Stokes定律</h4><div class="fm">vs = (γs - γw) × d² / (18μ)</div>vs=沉降速度（cm/s）；γs=顆粒單位重（≈2.65 g/cm³）；γw=水單位重；d=粒徑（cm）；μ=水的動力黏滯係數（與溫度有關）。<b>粒徑越大，沉降越快；粒徑越小，懸浮越久。</b><h4>三、慣用方法</h4><ul><li><b>比重計法（Hydrometer method, ASTM D422）：</b>懸浮液置1000mL量筒，攪拌後靜置，在特定時間讀取比重計密度，換算各粒徑百分比。操作簡便，精度略低。</li><li><b>吸管法（Pipette method）：</b>在特定時間與深度（10或20cm）以吸管抽取懸浮液，蒸乾秤重，精度高（標準方法）但費時。</li></ul><h4>四、前處理步驟</h4><ul><li>H₂O₂（過氧化氫）去除有機質</li><li>HCl（鹽酸）去除碳酸鈣</li><li>焦磷酸鈉（Na₄P₂O₇）分散劑，使顆粒完全分散</li></ul>`},

{yr:"108",sub:"土壤物理與沖蝕",type:"orig",n:"108e2",pts:20,
q:"請詳述農委會在1998年《臺灣省山坡地土地可利用限度分類標準》中所考量的侵蝕危害、植被生長、坡地特性及土地限制等主要影響因子。",
s:"1998年分類標準考量四大因子：(1)侵蝕危害：坡度（決定沖蝕潛勢）、土壤可蝕性（K值）、土層深度；(2)植被生長：現有植生覆蓋率、植物適生性；(3)坡地特性：坡向、地形穩定性（崩塌潛勢）；(4)土地限制：岩石露出率、積水或排水不良、土壤有效深度。依這些因子將山坡地分為可農業使用（1~4類）與不可農業使用（5~6類）。",
d:`<h4>一、臺灣山坡地土地可利用限度分類背景</h4>1998年農委會依《山坡地保育利用條例》訂定，目的為合理評估山坡地農業利用潛力，防止超限利用造成土壤流失與災害。<h4>二、主要評估因子</h4><table><tr><th>因子類別</th><th>評估項目</th><th>說明</th></tr><tr><td><b>侵蝕危害</b></td><td>坡度、土壤可蝕性（K值）、土層深度、礫石含量</td><td>坡度越陡→侵蝕潛勢越高；土層薄→不可農耕；礫石多→限制利用</td></tr><tr><td><b>植被生長</b></td><td>現有植生覆蓋率、植物適生性</td><td>反映土地生產力與植生恢復能力</td></tr><tr><td><b>坡地特性</b></td><td>坡向、地形穩定性（崩塌潛勢）、地表石礫</td><td>不穩定坡面（破碎地質）→不可開發</td></tr><tr><td><b>土地限制</b></td><td>排水性、積水狀況、岩石露出率</td><td>排水不良→農作物根系缺氧；岩石大量露出→不可耕</td></tr></table><h4>三、分類結果（6類）</h4><ul><li><b>1~4類（宜農牧地）：</b>可農業使用，坡度較緩、土層較厚，依坡度與限制程度分級</li><li><b>5類（宜林地）：</b>宜造林，不宜農耕</li><li><b>6類（加強保育地）：</b>地形不穩定、崩塌潛勢高，應嚴格保育不得開發</li></ul>`},

{yr:"108",sub:"土壤物理與沖蝕",type:"orig",n:"108e3",pts:20,
q:"請詳述土壤沖蝕性指數（Km）及其測定方法。",
s:"Km（土壤可蝕性因子）：在標準條件下（坡長22.1m、坡度9%、連續休耕裸地、C=P=1.0）每單位降雨沖蝕指數（R值）的土壤流失量。Km值越大→土壤越容易被侵蝕。測定方法：(1)標準小區實測法（直接量測）；(2)土壤性質估算法（Wischmeier公式，依粒徑、有機質、土壤結構、滲透性估算）。",
d:`<h4>一、土壤可蝕性指數（Km）定義</h4>USLE中K因子（台灣用Km）：在<b>標準小區條件</b>（坡長22.1m、坡度9%、連續休耕裸地）下，每單位降雨沖蝕力指數（R值）造成的土壤流失量。<div class="fm">Km = A / (R × L × S × C × P)（在標準條件下C=P=1，L=S=1）</div>Km越大→土壤顆粒結合力弱，越容易被侵蝕。台灣典型值：0.01~0.06 ton·ha·hr/MJ·mm·ha。<h4>二、測定方法</h4><ul><li><b>直接測定法（標準小區法）：</b>建立符合標準條件的侵蝕小區（22.1m×1.83m），連續觀測多年降雨與土壤流失量，以A/(R×LS×C×P)反推Km值。優點：精確；缺點：耗時（需多年資料）、成本高。</li><li><b>土壤性質估算法（Wischmeier & Smith nomograph）：</b>依以下土壤性質估算：<ul><li>粒徑：粉砂粒（0.002~0.1mm）佔比越高→Km越大（粉砂最易被侵蝕）</li><li>有機質含量：有機質越高→Km越低（有機質改善團粒結構）</li><li>土壤結構：細粒狀（granular）→Km低；塊狀、板狀→Km高</li><li>滲透等級：滲透越快→Km越低（快速排除積水）</li></ul></li></ul>`},

{yr:"108",sub:"土壤物理與沖蝕",type:"orig",n:"108e4",pts:20,
q:"請詳述坡面侵蝕土砂量推估方法及其主要依據。",
s:"坡面侵蝕土砂量推估方法：(1)USLE（通用土壤流失公式）：A=R×K×L×S×C×P，最廣泛應用，經驗統計模式；(2)RUSLE（修正USLE）：改善LS因子（考量坡形）與C因子（季節性）；(3)WEPP（水蝕預測模式）：物理過程模式，逐日模擬；(4)現地量測（侵蝕針法、小區實測）。主要依據：降雨動能、土壤可蝕性、地形（坡長坡度）、植生覆蓋、保育措施。",
d:`<h4>一、USLE（通用土壤流失公式）</h4><div class="fm">A = R × K × L × S × C × P</div>台灣採USLE，R用Rm（台灣修正降雨沖蝕指數）。最廣泛應用於工程設計，屬<b>經驗統計模式</b>，無法描述空間分布過程。<h4>二、RUSLE（修正USLE）</h4>改進項目：LS因子考量坡形（凸坡/凹坡）、C因子引入季節性植生覆蓋變化，較USLE精確。<h4>三、WEPP（Water Erosion Prediction Project）</h4>物理過程模式，逐日模擬降雨→入滲→逕流→剝離→搬運→沉積完整過程，需大量輸入資料（氣候、土壤、地形、植生），精度高但複雜。<h4>四、現地量測法</h4><ul><li><b>侵蝕針法（Erosion pin）：</b>在地面插入鋼針，定期量測露出長度，推估地表降低速率</li><li><b>標準小區實測：</b>最直接但耗時耗力</li></ul><h4>五、推估主要依據</h4><table><tr><th>因子</th><th>說明</th></tr><tr><td>降雨特性</td><td>降雨動能與強度（R值）是最主要驅動力</td></tr><tr><td>土壤可蝕性</td><td>K值反映土壤抵抗剝離的能力</td></tr><tr><td>地形</td><td>坡長（L）越長、坡度（S）越陡→侵蝕越大</td></tr><tr><td>植生覆蓋</td><td>C值：裸地=1.0；密植=0.001~0.01</td></tr><tr><td>保育措施</td><td>P值：梯田、等高耕作等可降低侵蝕</td></tr></table>`},

{yr:"108",sub:"土壤物理與沖蝕",type:"orig",n:"108e5",pts:20,
q:"請詳述崩積土地區坡地土砂問題及土砂量定量化方法及其原則。",
s:"崩積土地區土砂問題：不均質鬆散堆積（含大礫石至細粒土）、孔隙率大、透水性高但不均勻、遇水飽和後強度驟降→易崩塌。定量化方法：航照判釋計算崩塌面積×估算深度；鑽探取得崩積層厚度；DEM差異法（多期地形比較體積差異）；¹³⁷Cs同位素法（長期累積）；河川輸砂量法（集水區總輸出砂量）。原則：先掌握土砂供給區→估算移動量→計算輸出量（考量SDR泥砂傳遞比）。",
d:`<h4>一、崩積土地區土砂問題</h4><ul><li><b>物質特性：</b>分選性差（含大礫石至粉砂黏粒），孔隙率大（30~50%），無明顯層理</li><li><b>力學行為：</b>有效凝聚力低，遇降雨入滲→孔隙水壓迅速上升→強度驟降，是淺層崩塌（土石流物源）的重要來源</li><li><b>水文行為：</b>滲透性高但不均勻，大孔隙中快速流動，容易形成管湧（Piping）</li><li><b>坡地問題：</b>崩積土易再次崩塌，提供下游土石流持續土砂供給</li></ul><h4>二、土砂量定量化方法</h4><table><tr><th>方法</th><th>原理</th><th>優缺點</th></tr><tr><td>航照判釋法</td><td>多期航照判釋崩塌面積×估算平均深度</td><td>快速大面積；深度估算有不確定性</td></tr><tr><td>DEM差異法</td><td>比較不同時期高精度DEM（LiDAR/UAV），計算體積差</td><td>精確；需高精度地形資料</td></tr><tr><td>鑽探量測</td><td>鑽孔取得崩積層厚度分布，插值計算總體積</td><td>精確但成本高、局部性</td></tr><tr><td>¹³⁷Cs同位素法</td><td>比較基準地點與待測地點Cs-137含量差異</td><td>可估算長期累積侵蝕；精度±15~30%</td></tr><tr><td>河川輸砂量法</td><td>量測集水區出口懸浮載+床載，除以SDR換算侵蝕量</td><td>整合全集水區；SDR不確定性大</td></tr></table><h4>三、定量化原則</h4><ul><li>先確認土砂<b>供給區</b>（崩塌地位置與面積）</li><li>估算<b>崩塌深度</b>（依地形、地質判斷，通常1~5m）</li><li>計算<b>移動體積</b>（面積×深度）</li><li>考量<b>泥砂傳遞比（SDR）</b>：移動土砂中實際輸出集水區的比例（通常0.05~0.5）</li></ul>`},

{yr:"108",sub:"水土保持工程",type:"orig",n:"108w1",pts:25,
q:"請說明魚道（Fish way）之定義及其種類與適用範圍。溯河成長的魚類適用那一種魚道？",
s:"魚道定義：在攔水設施（壩、堰、固床工）旁設置供魚類通過的水路，維持河川縱向連通性。種類：(1)階梯式（Pool-type）；(2)橫隔板式（Baffle）；(3)丹尼爾魚道（Denil）；(4)自然仿生魚道（Bypass channel）；(5)魚梯（Fish lift/lock）。溯河洄游魚類（如香魚、鰻魚）適用自然仿生旁道魚道，坡度平緩、水流多樣、接近自然。",
d:`<h4>一、魚道定義</h4>在攔水設施（壩、堰、固床工）旁設置的水路設施，使魚類能克服水位落差向上游溯游（或向下游降游），維持河川縱向生態連通性。<h4>二、魚道種類與適用範圍</h4><table><tr><th>種類</th><th>構造特徵</th><th>適用條件</th></tr><tr><td><b>階梯式（Pool-and-weir）</b></td><td>一系列水池以低堰連接，各池間落差小（0.1~0.3m）</td><td>落差&lt;5m；適用多種魚類；最常見</td></tr><tr><td><b>橫隔板式（Baffle）</b></td><td>在斜槽底部設置消能塊（baffle），降低流速</td><td>中等落差；對游泳能力強的魚類有效</td></tr><tr><td><b>丹尼爾魚道（Denil）</b></td><td>標準化斜槽，斜板消能，流速大</td><td>需要游泳能力較強的魚類（鮭魚類）</td></tr><tr><td><b>自然仿生旁道魚道（Bypass channel）</b></td><td>在壩旁繞道設置接近天然的水道，寬淺蜿蜒</td><td>最接近自然；適合所有魚類及底棲生物；落差可大</td></tr><tr><td><b>魚梯（Fish lift/Elevator）</b></td><td>機械式提升裝置，收集魚類後吊至上游</td><td>落差極大（>10m）；成本高</td></tr></table><h4>三、溯河成長魚類適用魚道</h4>溯河洄游魚類（如<b>香魚、日本鰻（鰻鱺）、苦花（台灣鏟頜魚）</b>）需完整通過障礙物，適用<b>自然仿生旁道魚道（Bypass channel）</b>。<br>理由：水流型態多樣（含深潭-淺瀨）；坡度平緩（0.5~2%）；石塊配置提供休息點；底棲生物亦可通過；生態效益最高。`},

{yr:"108",sub:"水土保持工程",type:"orig",n:"108w2",pts:30,
q:"野溪河寬30m、梯形斷面（邊坡1:0.3）、河床與護岸曼寧係數0.025，固床工相關數據如表。若在同樣流量下要維持20cm生態水深時，計算2號固床工下切後溢流口寬度及1號固床工頂部需削去多少m。",
s:"先用2~3號間流量計算：以20cm水深代入梯形斷面Manning公式求Q。2號固床工：設計矩形溢流口，Q=BH^(3/2)×Cd√(2g)，解出B（溢流口寬）。1號固床工：依2號下游水面高程+超高計算應有頂部高程，差值即為應削去深度。",
d:`<h4>前提資料整理</h4>河寬b=30m；邊坡z=0.3（豎橫比1:0.3）；Manning n=0.025<br>固床工頂部高程：1號=28.91m；2號=30.88m；3號=35.65m<br>固床工下游水面高程：1號=26.71m；2號=28.68m<br>間距：1~2號=27.18m；2~3號=88.5m<h4>Step 1. 計算2~3號間的流量（維持20cm水深）</h4>梯形斷面A=（b+z×y）×y=（30+0.3×0.2）×0.2=（30+0.06）×0.2=6.012 m²<br>濕周P=b+2y√(1+z²)=30+2×0.2×√(1.09)=30+0.418=30.418m<br>水力半徑R=A/P=6.012/30.418=0.198m<br>坡度S：由3號到2號，水面高差=(35.65-3號下游水面)難以直接求，改由2號到3號溪床坡度估算：(35.65-30.88)/88.5=0.054<div class="fm">Q = (1/n)×A×R^(2/3)×S^(1/2) = (1/0.025)×6.012×0.198^(2/3)×0.054^(1/2)</div>R^(2/3)=0.198^0.667≈0.338；S^0.5=0.232<br>Q=40×6.012×0.338×0.232=40×0.472=<b>約18.88→取Q≈0.47 cms</b><h4>Step 2. 2號固床工矩形溢流口設計</h4><div class="fm">Q = (2/3)×Cd×√(2g)×B×H^(3/2)（矩形堰公式，H=水深=0.2m）</div>Cd≈0.6；g=9.81；(2/3)×0.6×√(19.62)=0.4×4.43=1.772<br>0.47=1.772×B×0.2^1.5=1.772×B×0.0894<div class="fm">B = 0.47/(1.772×0.0894) ≈ <b>2.96 m ≈ 3.0 m</b></div><h4>Step 3. 1號固床工頂部應削去高度</h4>1號下游水面=26.71m；要維持20cm水深，1號固床工頂部應在下游水面+超高以下。<br>原頂部高程=28.91m；應有頂部高程≈26.71+0.20=26.91m（使下游維持20cm水深）<div class="fm">應削去 = 28.91 - 26.91 = <b>2.0 m</b></div>`},

{yr:"108",sub:"水土保持工程",type:"orig",n:"108w3",pts:25,
q:"某開發基地0.3公頃，集流時間3分鐘，開發前5年重現期洪峰0.066 cms、25年重現期洪峰0.086 cms，開發後洪峰0.119 cms，計算永久滯洪設施設計蓄洪量，以及20cm圓形涵管出水口的滯洪深度。",
s:"永久滯洪量以25年重現期設計：Q_after=0.119 cms，Q_before（25yr）=0.086 cms，ΔQ=0.033 cms。蓄洪量Vs=ΔQ×tc/2=0.033×180/2≈2.97 m³。孔口水深：Q=Cd×A×√(2gh)；0.086=0.6×π/4×0.04×√(19.62h)；解出h≈滯洪深度。",
d:`<h4>一、永久性滯洪設施設計蓄洪量</h4>永久滯洪設施以<b>25年重現期</b>設計，目標出流量≤開發前25年洪峰（0.086 cms）。<br>需削減量：ΔQ=0.119-0.086=0.033 cms<br>集流時間tc=3min=180s<div class="fm">蓄洪量 Vs = ΔQ × tc / 2 = 0.033 × 180 / 2 ≈ <b>2.97 m³</b></div><h4>二、出水口滯洪深度計算</h4>20cm直徑圓形涵管，流量係數Cd=0.6<br>管截面積A=π/4×0.2²=π/4×0.04=0.03142 m²<br>出水口設計流量=目標出流量=0.086 cms（25年重現期開發前洪峰）<div class="fm">Q = Cd × A × √(2gh)</div>0.086 = 0.6 × 0.03142 × √(2×9.81×h)<br>0.086 = 0.01885 × √(19.62h)<br>√(19.62h) = 0.086/0.01885 = 4.563<br>19.62h = 20.82<div class="fm">h = 20.82/19.62 ≈ <b>1.06 m（涵管中心以上滯洪深度）</b></div><div class="note">實際滯洪設施有效深度=h+涵管半徑=1.06+0.10=1.16m（涵管頂部以上1.06m）</div>`},

// ═══ 108年 水土保持規劃設計 ═══
{yr:"108",sub:"水土保持規劃設計",type:"orig",n:"108p1",pts:20,
q:"請依水土保持之坡地保育觀點說明合理利用山坡地的原則。",
s:"合理利用原則：(1)適地適用（依土地可利用限度分類，不超限利用）；(2)治山防洪優先（先穩坡再開發）；(3)保持植生覆蓋（避免大面積長期裸露）；(4)配合自然地形（順坡地形設計，避免大規模整地）；(5)整體集水區管理（上下游一體規劃）；(6)水土保持處理與維護（完工後持續管理）。",
d:`<h4>一、合理利用山坡地的核心原則</h4><ul><li><b>1. 適地適用原則：</b>依《山坡地土地可利用限度分類標準》評估，在可利用土地（1~4類）從事農業，宜林地（5類）造林，加強保育地（6類）嚴格保護，不可超限利用。超限利用是台灣山坡地最主要的水土保持問題。</li><li><b>2. 治山防洪優先原則：</b>開發前應先完成水土保持處理（截排水、護坡），再進行農業或建設利用，不可「先開發後處理」。</li><li><b>3. 保持植生覆蓋原則：</b>儘量維持植生覆蓋，開挖後立即植生覆蓋（臨時性）；分期施工減少同時裸露面積；竣工後儘速建立永久植生。植生是最有效且低成本的水土保持手段。</li><li><b>4. 配合自然地形原則：</b>工程設計應順應自然地形，避免大規模整地改變地形；道路線形應依等高線走向，不宜大量挖填。</li><li><b>5. 整體集水區管理原則：</b>水土保持規劃應以集水區為基本單元，上下游、左右岸一體規劃，避免局部治理效果被上游供砂抵消。</li><li><b>6. 持續維護原則：</b>水土保持設施完工後需定期維護（汛前汛後巡查）；植生建立需養護期（3~5年）直至自然維持。</li></ul>`},

{yr:"108",sub:"水土保持規劃設計",type:"orig",n:"108p2",pts:20,
q:"請說明在山坡地為了進行農地整坡而需構築農地沉砂池，其設計原則為何？",
s:"農地沉砂池設計原則：(1)容量：V=裸露面積×100m³/ha（或依輸砂量計算）；(2)水面積：A=Q/vs（vs=目標粒徑Stokes沉降速度，通常去除0.02mm以上顆粒）；(3)有效水深1~2m；(4)入口設擋板防短路流；(5)出口設溢流堰；(6)安全係數1.5~2倍；(7)淤積達1/2容積即清淤；(8)面積≥1公頃必設；(9)選址於集水匯流點下游。",
d:`<h4>一、農地沉砂池功能</h4>農地整坡（整地、坡面改造）期間產生大量裸露地，暴雨時泥砂隨逕流流出，農地沉砂池攔截泥砂，保護下游農地、水路及水體水質。<h4>二、設計原則</h4><table><tr><th>設計項目</th><th>原則規定</th></tr><tr><td>設置門檻</td><td>整地面積≥1公頃，依規定必須設置</td></tr><tr><td>容量計算</td><td>有效容量≥裸露面積×100m³/ha（簡化初估）；精確計算依USLE估算輸砂量</td></tr><tr><td>目標去除粒徑</td><td>去除粒徑≥0.02mm（細砂/粉砂）的顆粒，以Stokes定律求沉降速度vs</td></tr><tr><td>水面積</td><td>A=Q/vs（Q=設計流量，vs=目標粒徑沉降速度0.3~0.5mm/s）</td></tr><tr><td>有效水深</td><td>1.0~2.0m</td></tr><tr><td>安全係數</td><td>計算值×1.5~2.0（因應短路流效率損失）</td></tr><tr><td>清淤規定</td><td>淤積量達有效容量1/2時即須清除</td></tr><tr><td>入出口設計</td><td>入口設擋板（baffle）使水流均勻；出口設溢流堰過濾</td></tr><tr><td>選址原則</td><td>設於整地區下坡側排水匯流點；出口連接排水系統</td></tr></table>`},

{yr:"108",sub:"水土保持規劃設計",type:"orig",n:"108p3",pts:20,
q:"請說明設置農塘的目的與其類型。",
s:"農塘目的：(1)灌溉蓄水（枯水期供應農業用水）；(2)滯洪（洪水期削峰）；(3)養殖（魚蝦養殖）；(4)景觀休憩；(5)生態棲地（濕地功能）。類型：(1)攔截型（攔截地表逕流）；(2)截取型（引取溪流水）；(3)人工開挖型（低窪地開挖蓄水）；(4)天然改造型（改造天然窪地）。台灣常見為攔截型農塘。",
d:`<h4>一、設置農塘的目的</h4><table><tr><th>目的</th><th>說明</th></tr><tr><td><b>灌溉蓄水（主要目的）</b></td><td>收集枯水期前的逕流，在降雨缺乏時期供應農業用水，解決山坡地農業灌溉水源問題</td></tr><tr><td><b>滯洪防洪</b></td><td>豪雨時蓄積洪水，削減洪峰流量，降低下游農地及聚落的洪水風險</td></tr><tr><td><b>養殖漁業</b></td><td>作為魚蝦蟹養殖水體，提供農民額外收入</td></tr><tr><td><b>生態功能</b></td><td>農塘水域提供兩棲類、水鳥、昆蟲的棲地，增加農村地景生態多樣性</td></tr><tr><td><b>景觀休憩</b></td><td>改善農村景觀，提供農村休閒功能</td></tr></table><h4>二、農塘類型</h4><table><tr><th>類型</th><th>建造方式</th><th>特點</th></tr><tr><td><b>攔截型（最常見）</b></td><td>在山坡地溪谷或低窪地，以堤埂攔截地表逕流蓄水</td><td>水源來自集水區逕流，充水量取決於集水面積與降雨量</td></tr><tr><td><b>截取型</b></td><td>從鄰近溪流引水充注農塘，以閘門控制取水</td><td>水源穩定但需取水權利</td></tr><tr><td><b>人工開挖型</b></td><td>在低窪地或緩坡開挖，形成人工蓄水池</td><td>不需築堤，施工較單純，但容量受限</td></tr><tr><td><b>天然改造型</b></td><td>利用天然窪地或舊有池塘加以整修擴大</td><td>利用現有地形，成本低</td></tr></table>`},

{yr:"108",sub:"水土保持規劃設計",type:"orig",n:"108p4",pts:20,
q:"請說明依核定之水土保持計畫或簡易水土保持申報書施工在什麼情況下應辦理變更設計？又經主管機關同意免辦理變更設計，惟應經承辦監造技師認定安全無虞的條件為何？",
s:"應辦理變更設計：(1)開發規模擴大；(2)開發性質改變；(3)設施位置、型式重大改變；(4)地質條件與原計畫差異過大；(5)增加保育設施。免辦理但技師認定安全無虞：(1)工程量小幅增減（±10%以內）；(2)地形差異小的因地制宜調整；(3)材料規格小幅調整但功能相符；(4)非主要設施的位置微調。",
d:`<h4>一、應辦理變更設計的情況</h4>依《水土保持計畫審核監督辦法》，下列情況應向主管機關申請變更設計：<ul><li><b>開發規模變更：</b>開發面積擴大、挖填土方量大幅增加</li><li><b>開發性質改變：</b>從農業用地改為建築用地等使用目的根本改變</li><li><b>主要設施重大變更：</b>擋土牆位置、型式、尺寸重大改變；滯洪池、沉砂池容量大幅減少</li><li><b>地質條件重大差異：</b>施工過程發現地質條件與原計畫差異過大，需重新設計</li><li><b>保育設施增刪：</b>刪除原計畫的保育設施（如沉砂池）</li></ul><h4>二、免辦理變更設計但需技師認定安全無虞的條件</h4><ul><li><b>工程量小幅增減：</b>施工面積或土方量在原核定量±10%以內的合理施工誤差</li><li><b>因地制宜小幅調整：</b>因現地地形與設計圖略有差異，而進行的細部位置調整，且功能不受影響</li><li><b>材料規格小幅調整：</b>材料規格略有不同但強度不低於原設計</li><li><b>非主要設施微調：</b>排水溝、截水溝等次要設施的路線小幅調整</li></ul>免辦理變更設計時，仍須由<b>承辦監造技師</b>現場確認安全無虞，並留存記錄，完工後於竣工報告中說明。`},

// ═══ 109年 土壤物理與沖蝕 ═══
{yr:"109",sub:"土壤物理與沖蝕",type:"orig",n:"109e1",pts:20,
q:"請說明造成土壤表面結皮（surface crusting）的肇因。",
s:"土壤表面結皮成因：(1)雨滴打擊（Raindrop impact）：雨滴動能打散土壤團粒，細粒土壤顆粒堵塞表土孔隙，形成緻密硬殼；(2)膠體分散（Slaking/Dispersion）：乾燥土壤遇水急速濕潤，使水進入孔隙中的氣體造成孔隙崩潰；(3)化學分散：高鈉土壤（Na⁺）使黏粒分散；(4)蒸發乾燥：濕潤土壤乾燥後鹽類或黏粒在表面沉積。結皮的危害：入滲率大幅降低→逕流增加→沖蝕加劇。",
d:`<h4>一、土壤表面結皮定義</h4>土壤表面因物理、化學作用形成薄層（數mm至數cm）緻密硬殼，入滲率顯著降低（可降低至原來1/10~1/100）。<h4>二、形成肇因</h4><table><tr><th>成因類型</th><th>機制說明</th><th>常見情況</th></tr><tr><td><b>雨滴衝擊（最主要）</b></td><td>雨滴動能KE=½mv²打散表層土壤團粒，細顆粒移動填塞孔隙；同時將細泥漿（slurry）注入孔隙中，乾燥後形成硬殼</td><td>裸露農地、施工裸地；高雨強地區</td></tr><tr><td><b>濕脹崩散（Slaking）</b></td><td>乾燥土壤遇水快速濕潤，孔隙中空氣壓縮後爆裂，使土壤團粒碎散，細粒填塞孔隙</td><td>旱季後第一場降雨；黏質土最明顯</td></tr><tr><td><b>化學分散（Na⁺）</b></td><td>土壤鈉離子（Na⁺）濃度高，使黏粒雙電層膨脹、黏粒分散，破壞團粒結構</td><td>鹽鹼土、灌溉含鈉水的農地</td></tr><tr><td><b>蒸發乾燥沉積</b></td><td>毛細管水蒸發，攜帶的鹽類或細粒在表面沉積，乾燥後形成殼</td><td>乾旱地區、溫室農業</td></tr></table><h4>三、結皮的危害</h4><ul><li>入滲率大幅降低→地表逕流增加→沖蝕加劇</li><li>作物種子萌芽受阻（難以穿透硬殼）</li><li>土壤通氣性下降，根系缺氧</li></ul><h4>四、防止結皮的方法</h4><ul><li>增加地表覆蓋（稻草、覆蓋作物）攔截雨滴動能</li><li>施用有機質改善土壤結構，增加團粒穩定性</li><li>施用PAM（聚丙烯醯胺）保護土壤顆粒不被分散</li></ul>`},

{yr:"109",sub:"土壤物理與沖蝕",type:"orig",n:"109e2",pts:25,
q:"請說明影響土壤入滲性（infiltration）的關鍵因子。",
s:"影響入滲性的關鍵因子：(1)土壤質地（黏土入滲慢，砂土快）；(2)土壤結構（團粒佳→大孔隙多→入滲快）；(3)前期含水量（越乾越快，越濕越慢）；(4)地表覆蓋（植生/覆蓋物防結皮）；(5)有機質含量（增加孔隙與穩定團粒）；(6)容積密度（壓實→入滲降低）；(7)地表坡度（坡度越陡，水停留時間越短）；(8)土壤溫度（影響水的黏滯係數）。",
d:`<h4>影響土壤入滲性的關鍵因子</h4><table><tr><th>因子</th><th>影響機制</th><th>對入滲率的影響</th></tr><tr><td><b>土壤質地（最重要）</b></td><td>黏粒多→孔隙小→入滲慢；砂粒多→孔隙大→入滲快</td><td>砂土Ks可達100 mm/hr；黏土&lt;1 mm/hr；差異達100倍以上</td></tr><tr><td><b>土壤結構</b></td><td>良好團粒結構→大孔隙豐富（macropores）→優先流→入滲大幅提升</td><td>同質地下，有良好結構的土壤入滲率可比無結構高5~10倍</td></tr><tr><td><b>前期含水量</b></td><td>土壤越乾→基質吸力越大→初始入滲率越高；隨含水量增加，入滲率降低並趨近穩定（Ks）</td><td>初始階段差異最大；Green-Ampt模式的主要參數</td></tr><tr><td><b>地表覆蓋</b></td><td>植生或覆蓋物攔截雨滴→防止結皮形成→維持孔隙不被堵塞</td><td>裸地vs林地入滲率差異3~10倍</td></tr><tr><td><b>有機質含量</b></td><td>有機質改善土壤結構（增加大孔隙）、提供微生物活動促進孔隙形成</td><td>有機質每增加1%，入滲率可提高約20~30%</td></tr><tr><td><b>容積密度（壓實）</b></td><td>壓實→大孔隙被破壞→入滲率急劇降低</td><td>施工機具碾壓後，入滲率可降低90%以上</td></tr><tr><td><b>地表坡度</b></td><td>坡度越陡→水在坡面停留時間越短→入滲機會減少</td><td>間接影響，影響量相對小</td></tr><tr><td><b>土壤溫度</b></td><td>溫度升高→水的黏滯係數降低→流動阻力減小→入滲率提高</td><td>冬季低溫可使入滲率降低20~40%</td></tr></table>`},

{yr:"109",sub:"土壤物理與沖蝕",type:"orig",n:"109e3",pts:30,
q:"某開發基地整地期間，A區（上坡面）坡長45m、坡度9%；B區（下坡面）坡長90m、坡度5%，基地總面積1.35公頃，Rm=10000，Km=0.023。利用Foster & Wischmeier（1974）公式估算整地期間的土壤流失量。",
s:"Foster法：各坡段LS用累積坡長計算，再取差值。A區在B區上坡面，形成複合坡面。各段L因子：A段末λ₁=45m，L₁=(45/22.13)^0.5=1.426；B段末λ₂=135m，L₂=(135/22.13)^0.5=2.470。S_A=16.8×sin9°-0.50≈2.12（9%用大坡度公式）；S_B=10.8×sin5°+0.03≈0.971（5%用小坡度公式）。LS_A=L₁×S_A；LS_B=L₂×S_B-L₁×S_A。各段加權求全坡面A值。",
d:`<h4>一、複合坡面計算原則（Foster & Wischmeier 1974）</h4>各坡段LS因子以<b>累積坡長</b>計算，再以差值法取各段貢獻。A區在上坡（45m），B區在下坡（90m），累積坡長：A段末=45m，B段末=45+90=135m。<h4>二、L因子（m=0.5，坡度均≥5%）</h4><div class="fm">L₁（至A段末，λ=45m）= (45/22.13)^0.5 = 2.033^0.5 = 1.426</div><div class="fm">L₂（至B段末，λ=135m）= (135/22.13)^0.5 = 6.099^0.5 = 2.470</div><h4>三、S因子</h4>A區坡度9%：sinβ≈0.09（≥9%用大坡度公式）<div class="fm">S_A = 16.8×0.09 - 0.50 = 1.512 - 0.50 = 1.012</div>B區坡度5%：sinβ≈0.05（&lt;9%用小坡度公式）<div class="fm">S_B = 10.8×0.05 + 0.03 = 0.54 + 0.03 = 0.570</div><h4>四、各段累積LS與差值LS</h4>累積LS₁=L₁×S_A=1.426×1.012=<b>1.443</b><br>累積LS₂=L₂×S_B=2.470×0.570=<b>1.408</b><br>A段LS=1.443（A段代表LS）<br>B段LS（差值）=累積LS₂×(λ₂/λ₁+λ₂)-累積LS₁×(λ₁/λ₁+λ₂)的差值法：<br>B段LS=(L₂×S_B×135-L₁×S_A×45)/(135-45)... 或直接用各段代表LS<h4>五、各段A值（C=P=1.0，裸地整地期間）</h4><div class="fm">A_A = R×K×LS_A = 10000×0.023×1.443 = <b>331.9 ton/ha/yr</b></div><div class="fm">A_B = R×K×LS_B = 10000×0.023×1.408 = <b>323.8 ton/ha/yr</b></div><h4>六、全坡面加權土壤流失量</h4>A區面積=45/(45+90)×1.35=0.45ha；B區面積=0.90ha<div class="fm">A全 = (331.9×0.45 + 323.8×0.90)/1.35 = (149.4+291.4)/1.35 ≈ <b>326.5 ton/ha/yr</b></div><div class="fm">全基地流失量 = 326.5×1.35 ≈ <b>441 ton/yr</b></div>`},

// ═══ 109年 水土保持工程 ═══
{yr:"109",sub:"水土保持工程",type:"orig",n:"109w1",pts:20,
q:"請論述野溪特徵及其災害型態為何？",
s:"野溪特徵：坡度陡（>3%）、流量變化大（豐枯比可達1000:1）、輸砂量大、蜿蜒多變、水質清澈。台灣野溪因颱風豪雨帶來極端降雨，特別容易發生災害。災害型態：(1)土石流（最嚴重）；(2)溪岸崩塌（崩岸）；(3)溪床下切（導致護岸掏空）；(4)淤積（溪床升高導致溢堤）；(5)堰塞湖（崩塌堵塞溪道後潰壩）。",
d:`<h4>一、野溪主要特徵</h4><table><tr><th>特徵項目</th><th>說明</th></tr><tr><td><b>坡度陡</b></td><td>台灣山地野溪坡度通常3~30%，遠大於平原河川，水流速度快</td></tr><tr><td><b>流量變化極大</b></td><td>豐水期（颱風）與枯水期流量比可達1000:1甚至更大，洪峰來去急促</td></tr><tr><td><b>輸砂量大</b></td><td>坡陡流急加上台灣地質年輕脆弱，單位面積輸砂量遠高於世界平均</td></tr><tr><td><b>溪道不穩定</b></td><td>溪道隨洪水事件蜿蜒、改道、下切或淤積，形態變化快速</td></tr><tr><td><b>集水區面積小</b></td><td>台灣野溪多數集水區面積&lt;100km²，集流時間短，洪水反應快</td></tr></table><h4>二、主要災害型態</h4><table><tr><th>災害類型</th><th>成因</th><th>危害對象</th></tr><tr><td><b>土石流（最嚴重）</b></td><td>溪床大量可移動土石+豐沛降雨觸發，水土混合高速流動</td><td>沖積扇上的聚落、農地</td></tr><tr><td><b>溪岸崩塌（崩岸）</b></td><td>洪水高流速沖蝕坡腳，地下水位上升使坡腳失穩</td><td>溪岸農地、道路、橋梁</td></tr><tr><td><b>溪床下切</b></td><td>清水侵蝕（攔砂壩截斷泥砂供給後）、河床基準降低</td><td>橋梁基礎、護岸掏空失效</td></tr><tr><td><b>溪床淤積</b></td><td>坡度平緩段或水庫前，上游大量泥砂輸入堆積</td><td>溪床升高→洪水溢堤→農地與聚落淹水</td></tr><tr><td><b>堰塞湖潰壩</b></td><td>崩塌或土石流堵塞溪道→蓄積洪水→潰壩大洪水</td><td>下游聚落（短時間超大洪水）</td></tr></table>`},

{yr:"109",sub:"水土保持工程",type:"orig",n:"109w2",pts:20,
q:"在土石流潛勢溪流從事水土保持工程設計時應該如何估算土石流之設計流量？（假設清水逕流之設計流量Qw及土石流之土砂體積濃度Cd為已知）",
s:"土石流設計流量公式：Qd=Qw/(1-Cd)。其中Qw為清水逕流設計流量（以合理化公式或頻率分析求得），Cd為土砂體積濃度（通常0.4~0.6）。物理意義：土石流為水與土砂的混合體，若土砂佔Cd比例，則清水部分為(1-Cd)×Qd=Qw，因此Qd=Qw/(1-Cd)。",
d:`<h4>一、土石流設計流量基本公式</h4><div class="fm">Qd = Qw / (1 - Cd)</div>Qd：土石流設計流量（m³/s）<br>Qw：清水逕流設計流量（m³/s）<br>Cd：土石流土砂體積濃度（0~1，通常0.4~0.6）<h4>二、物理意義</h4>土石流為水分與土砂的混合流體，在體積濃度Cd條件下：<ul><li>土砂佔總體積比例 = Cd</li><li>水分佔總體積比例 = 1-Cd</li><li>水分部分的流量 = Qw（清水逕流）</li></ul>因此：(1-Cd)×Qd = Qw → <b>Qd = Qw/(1-Cd)</b><h4>三、各參數取得方式</h4><ul><li><b>Qw（清水逕流設計流量）：</b>以合理化公式Q=CiA/360（小集水區）或水文頻率分析（有記錄資料時）求得，設計重現期通常取50~200年。</li><li><b>Cd（土砂體積濃度）：</b>依據溪流特性選取。台灣技術規範：<ul><li>稠密型土石流（泥流型）：Cd=0.4~0.6</li><li>稀疏型土石流（洪水型）：Cd=0.2~0.4</li><li>實際值可由現地砂樣與水樣比重求得</li></ul></li></ul><div class="note">設計注意：Cd越大→Qd/Qw比值越高→設計流量越大→需更大的溢洪口與排洪能力。Cd=0.5時，土石流設計流量為清水流量的2倍。</div>`},

{yr:"109",sub:"水土保持工程",type:"orig",n:"109w3",pts:20,
q:"防砂壩之溢洪口斷面大小如何設計？（假設斷面為矩形且設計流量Qw為已知）",
s:"矩形溢洪口設計：Q=Cd×L×H^(3/2)×√(2g)×(2/3)。已知Q=Qw，給定水頭H（溢洪口有效水深），解出溢洪口寬L=Qw/[(2/3)×Cd×√(2g)×H^(3/2)]。溢洪口高度通常取H=0.5~1.0m，Cd≈0.6（矩形堰）。設計時應確認溢洪口寬度不超過壩頂寬的1/3，且溢洪口底部高程高於壩底有效庫容。",
d:`<h4>一、矩形溢洪口設計公式</h4><div class="fm">Q = (2/3) × Cd × L × √(2g) × H^(3/2)</div>Q：設計流量（m³/s）；Cd：流量係數（矩形堰≈0.6）；L：溢洪口寬度（m）；H：溢洪口有效水頭（溢洪口以上水深，m）；g：重力加速度=9.81 m/s²<h4>二、設計步驟</h4><b>Step 1. 設定設計流量Q=Qw（清水逕流設計流量）</b><br><b>Step 2. 設定溢洪水頭H</b>（通常H=0.5~1.0m，兼顧安全與施工可行性）<br><b>Step 3. 計算溢洪口寬度L</b><div class="fm">L = Q / [(2/3) × Cd × √(2g) × H^(3/2)]</div>代入Cd=0.6，g=9.81：<br>(2/3)×0.6×√(19.62)=0.4×4.429=1.772<div class="fm">L = Q / (1.772 × H^1.5)</div><b>Step 4. 安全檢核</b><ul><li>溢洪口寬度L不超過壩頂有效寬度的1/2</li><li>溢洪口底高程需高於壩體計畫淤沙位置（確保有效庫容）</li><li>溢洪口兩側需有足夠混凝土邊牆強度，防止局部破壞</li><li>溢洪口下游設消能設施（護坦、消力池）防止沖蝕壩腳</li></ul><div class="note">若為土石流設計，則設計流量改用Qd=Qw/(1-Cd)，溢洪口需相應加大。</div>`},

{yr:"109",sub:"水土保持工程",type:"orig",n:"109w4",pts:20,
q:"試論生態檢核機制之目的及重點？",
s:"目的：減輕公共工程對生態的負面衝擊，維護生物多樣性與棲地品質，落實生態保育四層次（迴避→縮小→減輕→補償）。重點：(1)規劃設計階段：生態調查、敏感區確認、友善設計；(2)施工階段：生態人員駐場監督、施工人員訓練；(3)維護管理階段：監測生態恢復、必要時補充措施。台灣108年起公共工程強制執行生態檢核。",
d:`<h4>一、生態檢核機制目的</h4><ul><li>減輕公共工程（包含水土保持工程）對生態環境的負面衝擊</li><li>維護集水區生物多樣性資源與棲地環境品質</li><li>落實「迴避→縮小→減輕→補償」的生態保育四層次策略</li><li>透過系統化的調查評估，確保工程設計具備生態友善考量</li></ul><h4>二、生態檢核重點（三階段）</h4><table><tr><th>階段</th><th>執行重點</th></tr><tr><td><b>規劃設計階段</b></td><td>生態資料調查（物種清查、棲地評估）→確認生態敏感區位→研擬替代方案→納入生態友善設計（如魚道、保留礫石底質）→IEAT評估表填寫</td></tr><tr><td><b>施工階段</b></td><td>生態監測人員現場駐守→施工人員生態教育訓練→施工前敏感物種調查→施工中異常即時回報與處置→禁止傷害保育類動植物</td></tr><tr><td><b>維護管理階段</b></td><td>定期監測生態回復狀況（物種豐富度、棲地品質）→評估保育成效→必要時補充植生或棲地修復措施</td></tr></table><h4>三、台灣生態檢核制度背景</h4>行政院108年推動「公共工程生態檢核機制」，要求各公共工程主辦機關在各階段進行生態評估，並由具生態專業的人員全程參與，是台灣首次將生態保育系統化納入公共工程標準程序。`},

// ═══ 109年 坡地水文學 ═══
{yr:"109",sub:"坡地水文學",type:"orig",n:"109h1",pts:25,
q:"某坡地集水區之集流等時線已知，各等時線間集水面積（A1~A6分別為0.2、0.8、1.0、1.2、1.2、1.0 km²），降雨損失φ=1公厘/5分鐘，求：(一)O點在第15分鐘之直接逕流量由那些地區貢獻？(二)O點在第45分鐘之直接逕流量由那些時間的降雨量貢獻？(三)O點之尖峰直接逕流量為若干？",
s:"(一)t=15min時，到達O點的逕流來自距O點5min以內的集水區（A1區），因為水流需5min才能到達O點。(二)t=45min時，逕流來自各等時線區的降雨：A1來自t=40min降雨、A2來自t=35min降雨...依此類推。(三)各5min時段有效降雨=[各時段降雨-φ]=各時段超過1mm/5min的部分，與各等時線面積卷積（IUH法），取最大值為尖峰逕流量。",
d:`<h4>一、背景資料</h4>等時線間距=5min；各區面積：A1=0.2、A2=0.8、A3=1.0、A4=1.2、A5=1.2、A6=1.0 km²<br>降雨損失φ=1mm/5min；各時段降雨（mm/5min）：0~5min=3、5~10min=10、10~15min=9、15~20min=7、20~25min=6、25~30min=4<h4>二、(一) t=15分鐘的直接逕流來源</h4>等時線代表水流到達O點的旅行時間，5min等時線以內的水在5min可到達O點。<br>t=15min時，能到達O點的逕流是在<b>t=10~15min</b>降下、來自<b>A1區（0~5min等時線範圍）</b>的降雨，以及t=5~10min降下來自A2的降雨等。<br>簡言之：t=15min的逕流由<b>A1（距O點最近）</b>在t=10~15min的降雨，加上A2在t=5~10min的降雨，以及A3在t=0~5min的降雨貢獻。<h4>三、(二) t=45分鐘的逕流時間來源</h4>t=45min時，各等時線區的貢獻：<ul><li>A1（5min到達）：來自t=40~45min的降雨（無降雨，=0）</li><li>A2（10min到達）：來自t=35~40min的降雨（無降雨）</li><li>A3（15min到達）：來自t=30~35min的降雨（無降雨）</li><li>A4（20min到達）：來自t=25~30min的降雨（4mm）</li><li>A5（25min到達）：來自t=20~25min的降雨（6mm）</li><li>A6（30min到達）：來自t=15~20min的降雨（7mm）</li></ul><h4>四、(三) 尖峰直接逕流量計算</h4>各時段有效降雨（扣除φ=1mm/5min）：3-1=2；10-1=9；9-1=8；7-1=6；6-1=5；4-1=3 mm/5min<br>IUH卷積（取最大流量時刻），尖峰通常在最大有效降雨後的某個時刻：<div class="fm">Q(t) = Σ[ie(τ) × A(t-τ)] / Δt</div>以t=30min計算（等時線全部都有貢獻）：<br>Q=（2×0.2+9×0.8+8×1.0+6×1.2+5×1.2+3×1.0）×10⁶/(5×60)<br>=(0.4+7.2+8.0+7.2+6.0+3.0)×10⁶/300=31.8×10⁶/300=<b>106,000 m³/s</b><br><div class="note">注意：此計算各項單位需統一（mm→m，km²→m²，5min→s）。實際考試時應仔細查對各時刻貢獻。</div>`},

// ═══ 110年 土壤物理與沖蝕 ═══
{yr:"110",sub:"土壤物理與沖蝕",type:"orig",n:"110e1",pts:20,
q:"試說明土壤水分（Soil moisture）的表示方式、測定目的、直接測定方法及對土壤沖蝕的影響。",
s:"表示方式：重量含水量w=Mw/Ms×100%；體積含水量θ=Vw/Vt；飽和度S=Vw/Vv×100%。測定目的：了解土壤水分狀態（入滲、逕流、崩塌風險）。直接測定：烘乾法（105°C，24hr，最準確）；中子散射法（現地）；時域反射法（TDR）。對沖蝕影響：前期含水量越高→入滲率越低→地表逕流越多→沖蝕加劇；但高含水量也代表基質吸力低，邊坡穩定性降低。",
d:`<h4>一、土壤水分表示方式</h4><table><tr><th>表示方式</th><th>公式</th><th>說明</th></tr><tr><td>重量含水量 w</td><td>w=Mw/Ms×100%（Mw=水質量，Ms=乾土質量）</td><td>最常用，烘乾法直接量測</td></tr><tr><td>體積含水量 θ</td><td>θ=Vw/Vt（Vw=水體積，Vt=土壤總體積）</td><td>與孔隙率有直接關係，θ=w×ρb/ρw</td></tr><tr><td>飽和度 S</td><td>S=Vw/Vv×100%（Vv=孔隙體積）</td><td>反映孔隙被水充填程度，飽和=100%</td></tr></table><h4>二、測定目的</h4><ul><li>了解土壤目前含水狀態（判斷入滲能力、崩塌風險）</li><li>監測田間水分動態，指導灌溉時機</li><li>驗証水文模型參數</li><li>評估邊坡孔隙水壓，進行穩定分析</li></ul><h4>三、直接測定方法</h4><table><tr><th>方法</th><th>原理</th><th>特點</th></tr><tr><td><b>烘乾法（標準法）</b></td><td>105°C烘烤24hr，前後質量差=水分質量</td><td>最精確；具破壞性；需採樣帶回實驗室</td></tr><tr><td><b>中子水分計法</b></td><td>快速中子被氫原子（=水）減速，量測慢速中子數推算含水量</td><td>現地量測；非破壞；需率定；放射性源管理</td></tr><tr><td><b>時域反射法（TDR）</b></td><td>電磁波在含水介質中的傳播速度與含水量相關</td><td>快速現地量測；可自動監測；需率定</td></tr></table><h4>四、土壤水分對沖蝕的影響</h4><ul><li><b>前期含水量↑→入滲率↓：</b>土壤越濕，基質吸力越小，入滲力減弱，地表逕流增加，沖蝕加劇（Dunne飽和逕流機制）</li><li><b>土壤含水量↑→強度↓：</b>有效應力降低（有效凝聚力下降），邊坡安全係數降低，增加崩塌風險</li><li><b>最佳狀態：</b>適中含水量（田間容水量附近）對農業最有利；過濕和過乾均對植生不利</li></ul>`},

{yr:"110",sub:"土壤物理與沖蝕",type:"orig",n:"110e2",pts:20,
q:"試說明影響土壤沖蝕的坡面地形特徵。",
s:"影響沖蝕的地形特徵：(1)坡度（S因子，坡度越陡→侵蝕越強）；(2)坡長（L因子，越長→逕流積累→侵蝕越大）；(3)坡形（直線/凸/凹坡影響逕流速度分布）；(4)坡向（影響濕度與植生）；(5)匯水面積（決定逕流量）；(6)溝壑密度（排水網密度）。USLE中LS因子即反映地形對沖蝕的綜合影響。",
d:`<h4>影響土壤沖蝕的坡面地形特徵</h4><table><tr><th>地形特徵</th><th>影響機制</th><th>對沖蝕的影響</th></tr><tr><td><b>坡度（S因子）</b></td><td>坡度越陡→逕流流速越快→剪切力τ=γRS增大→挾砂力↑</td><td>坡度增加→沖蝕量急劇增加（S與sinβ成正比），是USLE最重要地形因子</td></tr><tr><td><b>坡長（L因子）</b></td><td>坡長越長→逕流沿坡積累量越大→流量與流速均增加→侵蝕力增大</td><td>L因子=（坡長/22.13）^m，坡度越陡m值越大（0.2~0.5）</td></tr><tr><td><b>坡形（Slope shape）</b></td><td>直線坡：均勻侵蝕；凸坡：坡面下半段坡度較大→侵蝕集中；凹坡：坡面下半段坡度較小→下段常有沉積</td><td>凸坡底部侵蝕最強；凹坡（如梯田）有助減少沖蝕</td></tr><tr><td><b>坡向（Aspect）</b></td><td>南向（陽坡）日照強→蒸發大→土壤較乾燥→植生稀疏；北向（陰坡）較濕潤→植生茂密</td><td>陽坡植生稀疏→C值較高→沖蝕較大；陰坡相反</td></tr><tr><td><b>集水面積（Contributing area）</b></td><td>集水面積越大→聚集的逕流量越多→侵蝕能力越強</td><td>細溝及溝蝕的發生與集水面積密切相關</td></tr><tr><td><b>溝壑密度（Drainage density）</b></td><td>溝壑密度=排水網總長度/集水區面積，反映地形排水效率與侵蝕程度</td><td>高溝壑密度→地形支離破碎→侵蝕活躍；可作為區域侵蝕潛勢指標</td></tr></table>`},

{yr:"110",sub:"土壤物理與沖蝕",type:"orig",n:"110e3",pts:20,
q:"試說明利用降雨動能作為降雨沖蝕力的指標涵義及估算方式。",
s:"降雨動能（Kinetic energy, KE）：KE=½mv²，雨滴動能隨質量與速度平方增加。降雨沖蝕力指標：EI₃₀（USLE R值）=降雨動能×最大30分鐘雨強，綜合反映雨滴打擊土面的破壞力。估算方式：直接法（量測雨滴大小與速度）；間接法（Brown-Foster公式：KE=0.29[1-0.72exp(-0.05i)]，i=雨強mm/hr）；台灣Rm=Σ(EI₃₀)×修正係數。",
d:`<h4>一、降雨動能的意義</h4>雨滴落地時具有動能 KE=½mv²，其中雨滴質量m與直徑的立方成正比，終端速度v與直徑成正比，因此雨滴直徑越大，動能越大。降雨動能打擊土面→破壞土壤團粒結構→使土粒懸浮→加速雨濺蝕（Splash erosion）→結皮形成→入滲率降低。<h4>二、降雨沖蝕力指標（EI₃₀）</h4>USLE中的R值（台灣用Rm）採用EI₃₀作為降雨沖蝕力指標：<div class="fm">EI₃₀ = E × I₃₀</div>E：該場降雨的總動能（MJ/ha）；I₃₀：最大30分鐘降雨強度（mm/hr）<br>EI₃₀越大→降雨沖蝕力越強；台灣年R值（Rm）=各場降雨EI₃₀之年總和，台灣R值：3000~30000 MJ·mm/ha·hr·yr（遠高於美國）。<h4>三、降雨動能估算方式</h4><ul><li><b>直接量測法：</b>以雨滴感測儀（Disdrometer）量測雨滴粒徑分布與速度，直接計算動能。精確但設備昂貴。</li><li><b>Brown-Foster間接公式（1987）：</b></li></ul><div class="fm">KE = 0.29 × [1 - 0.72 × exp(-0.05 × i)]（MJ/ha per mm）</div>i=降雨強度（mm/hr），此公式廣泛應用於USLE計算。<ul><li><b>台灣修正公式（Wang & Tsai）：</b>依台灣降雨特性修正，得到台灣適用的KE-i關係式。</li></ul>`},

{yr:"110",sub:"土壤物理與沖蝕",type:"orig",n:"110e4",pts:20,
q:"試說明土壤侵蝕指標模式（Soil Erosion Index Model, SEIM）及其與通用土壤流失公式（USLE）之主要差別。",
s:"SEIM：以土壤侵蝕指標（SEI）直接評估侵蝕潛勢，通常以複合指標（坡度、植生覆蓋、土壤可蝕性等）的評分系統呈現，偏向定性到半定量。USLE：完整物理-統計公式A=R×K×L×S×C×P，可定量計算年均土壤流失量。主要差別：SEIM不需要精確R值，操作簡便但精度低；USLE需要完整參數，精度高但資料需求大。",
d:`<h4>一、SEIM（土壤侵蝕指標模式）</h4>SEIM是一種<b>半定量評估</b>方法，將影響土壤侵蝕的主要因子（降雨侵蝕力、土壤可蝕性、坡度坡長、植生覆蓋）以評分方式量化，得到綜合的「土壤侵蝕指標（SEI）」，用來比較不同地點或不同管理方案的侵蝕潛勢高低。<h4>二、USLE（通用土壤流失公式）</h4><div class="fm">A = R × K × L × S × C × P（ton/ha/yr）</div>各因子均有明確的物理定義與量化方式，輸出為具體的年均土壤流失量，可用於設計計算。<h4>三、SEIM與USLE的主要差別</h4><table><tr><th>比較項目</th><th>SEIM</th><th>USLE</th></tr><tr><td><b>輸出型態</b></td><td>侵蝕潛勢指標（相對比較）</td><td>年均土壤流失量（絕對數值，ton/ha/yr）</td></tr><tr><td><b>資料需求</b></td><td>較低，可用簡化指標替代</td><td>較高，需各因子精確數值</td></tr><tr><td><b>計算複雜度</b></td><td>簡單（評分系統）</td><td>中等（各因子查表或公式計算）</td></tr><tr><td><b>精度</b></td><td>較低，定性到半定量</td><td>較高，定量（但仍有統計誤差）</td></tr><tr><td><b>適用場合</b></td><td>大面積快速評估、資料不足地區</td><td>工程設計計算、沉砂池容量設計</td></tr><tr><td><b>物理基礎</b></td><td>概念性</td><td>統計-物理（大量實測資料率定）</td></tr></table>`},

{yr:"110",sub:"土壤物理與沖蝕",type:"orig",n:"110e5",pts:20,
q:"試說明開挖整地時，針對坡面土壤沖蝕控制之現場施工方法與措施。",
s:"現場施工控制措施：(1)分期分區開挖（減少同時裸露面積）；(2)臨時植生覆蓋（PE布、稻草蓆、草種噴植）；(3)臨時截水溝（坡頂攔截外來逕流）；(4)臨時沉砂池（攔截泥砂，面積≥1ha必設）；(5)施工圍籬（Silt fence，基地周界攔砂）；(6)洗車臺（防止泥土帶出）；(7)臨時覆蓋裸坡（PE布+壓重）；(8)縮短裸露時間（開挖後儘速進行保護措施）。",
d:`<h4>一、開挖整地期間土壤沖蝕控制的核心原則</h4><ul><li><b>縮短裸露時間：</b>開挖後立即進行臨時防護，不可長期裸露</li><li><b>減少裸露面積：</b>分期分區開挖，同時裸露面積≤總面積的1/3</li><li><b>源頭攔截：</b>攔截外來清水，防止清水沖過裸露坡面加速侵蝕</li><li><b>末端截留：</b>沉砂設施攔截泥砂，防止流出基地</li></ul><h4>二、現場施工控制方法與措施</h4><table><tr><th>措施</th><th>功能</th><th>施作要點</th></tr><tr><td><b>臨時截水溝</b></td><td>攔截來自上坡未開挖區的清水，防止清水沖過裸露坡面</td><td>設於開挖邊界上坡側3~5m；隨施工進度調整位置</td></tr><tr><td><b>臨時覆蓋（PE布/稻草蓆）</b></td><td>直接保護裸露坡面不受雨滴打擊，大幅降低C值</td><td>颱風前確認覆蓋完整；以竹樁或沙包壓重固定邊緣</td></tr><tr><td><b>臨時沉砂池</b></td><td>攔截施工期懸浮泥砂，保護下游水體；開發面積≥1公頃必設</td><td>有效容量≥裸露面積×100m³/ha；淤積達1/2即清淤</td></tr><tr><td><b>施工圍籬（Silt fence）</b></td><td>設置在基地周界下坡側，過濾含泥逕流，攔截細粒泥砂</td><td>支柱間距1~2m；布料埋入地下10~15cm防底部潛流</td></tr><tr><td><b>洗車臺</b></td><td>清除施工車輛輪胎泥土，防止帶出基地污染道路</td><td>鋪設礫石或設高壓水柱；汙水收集後處理</td></tr><tr><td><b>坡面排水溝</b></td><td>蒐集坡面逕流並導引至沉砂池，防止集中沖蝕</td><td>配合整地進度設置，確保任何時刻均有排水出口</td></tr><tr><td><b>分期分區開挖</b></td><td>降低同時裸露面積，減少暴露於暴雨的裸露面積</td><td>依施工期程表配合氣象預報，梅雨、颱風前避免大規模開挖</td></tr></table>`},

{yr:"110",sub:"坡地水文學",type:"orig",n:"110h1",pts:25,
q:"試述何謂雨量強度控制之入滲過程及入滲能力控制之入滲過程？某流域面積100 km²，2小時降雨累積雨量：t=0→0cm、30min→1cm、60min→2.5cm、90min→5.5cm、120min→5.7cm，φ指數=0.6 cm/hr，計算總地表逕流體積。",
s:"雨量強度控制：雨強<入滲能力，所有降雨均入滲，無逕流（低雨強期間）。入滲能力控制：雨強>入滲能力，超出部分形成地表逕流（高雨強期間）。各30min時段雨強：0~30min=2cm/hr；30~60min=3cm/hr；60~90min=6cm/hr；90~120min=0.4cm/hr。φ=0.6cm/hr：前兩段均>0.6，第四段<0.6。有效降雨深：(2-0.6)×0.5+(3-0.6)×0.5+(6-0.6)×0.5+(0)=0.7+1.2+2.7=4.6cm。逕流體積=0.046m×100×10⁶m²=4,600,000 m³。",
d:`<h4>一、兩種入滲過程的定義</h4><ul><li><b>雨量強度控制（Rainfall intensity-controlled）入滲：</b>此時降雨強度i&lt;土壤入滲能力fp，所有降雨均可滲入土壤，不產生地表逕流。入滲率等於降雨強度（f=i&lt;fp），土壤控制不了入滲速率，是由外在降雨強度決定。</li><li><b>入滲能力控制（Infiltration capacity-controlled）入滲：</b>此時降雨強度i&gt;土壤入滲能力fp，土壤入滲跟不上降雨供給速率，超出部分（i-fp）形成地表逕流（Hortonian overland flow）。</li></ul><h4>二、各時段雨強計算</h4><table><tr><th>時段</th><th>累積雨量差</th><th>延時</th><th>雨強（cm/hr）</th><th>有效降雨（cm/hr）</th></tr><tr><td>0~30min</td><td>1-0=1cm</td><td>0.5hr</td><td>2.0 cm/hr</td><td>2.0-0.6=1.4</td></tr><tr><td>30~60min</td><td>2.5-1=1.5cm</td><td>0.5hr</td><td>3.0 cm/hr</td><td>3.0-0.6=2.4</td></tr><tr><td>60~90min</td><td>5.5-2.5=3.0cm</td><td>0.5hr</td><td>6.0 cm/hr</td><td>6.0-0.6=5.4</td></tr><tr><td>90~120min</td><td>5.7-5.5=0.2cm</td><td>0.5hr</td><td>0.4 cm/hr</td><td>0（&lt;φ，無有效降雨）</td></tr></table><h4>三、有效降雨深與逕流體積</h4><div class="fm">有效降雨深 = (1.4+2.4+5.4)×0.5hr = 9.2×0.5 = 4.6 cm = 0.046 m</div><div class="fm">逕流體積 = 有效降雨深 × 集水區面積 = 0.046 × 100×10⁶ = <b>4,600,000 m³ = 4.6×10⁶ m³</b></div>`},

{yr:"110",sub:"坡地水文學",type:"orig",n:"110h2",pts:25,
q:"以Stokes理論推估密度2800 kg/m³、半徑1mm之泥沙顆粒在水中的終端沉降速度（m/sec）。",
s:"Stokes定律：vs=(2/9)×(ρs-ρw)×g×r²/μ。ρs=2800 kg/m³；ρw=1000 kg/m³；g=9.81 m/s²；r=0.001m；μ=1.002×10⁻³ Pa·s（20°C）。vs=(2/9)×(1800)×9.81×(0.001)²/(1.002×10⁻³)=(2/9)×1800×9.81×10⁻⁶/1.002×10⁻³。計算後vs≈3.92 m/s。但注意：Stokes定律適用層流（Re<1），需驗證雷諾數。",
d:`<h4>一、Stokes定律</h4>在層流條件下（Reynolds number Re &lt; 1），球形顆粒在靜止流體中的終端沉降速度：<div class="fm">vs = (2/9) × [(ρs - ρw) / μ] × g × r²</div>vs：終端沉降速度（m/s）；ρs：顆粒密度（kg/m³）；ρw：流體密度（kg/m³）；μ：流體動力黏滯係數（Pa·s=N·s/m²）；g：重力加速度（m/s²）；r：顆粒半徑（m）<h4>二、代入數值計算</h4>ρs=2800 kg/m³；ρw=1000 kg/m³；(ρs-ρw)=1800 kg/m³<br>r=1mm=0.001m；g=9.81 m/s²；μ=1.002×10⁻³ Pa·s（水在20°C）<div class="fm">vs = (2/9) × (1800/1.002×10⁻³) × 9.81 × (0.001)²</div>= (2/9) × 1,796,407 × 9.81 × 10⁻⁶<br>= (2/9) × 17.62<br>= 0.222 × 17.62<div class="fm">vs ≈ <b>3.92 m/s</b></div><h4>三、Stokes定律適用性驗證（雷諾數）</h4><div class="fm">Re = ρw × vs × d / μ = 1000 × 3.92 × 0.002 / (1.002×10⁻³) ≈ 7,825</div>Re >> 1（遠大於1），顆粒周圍為紊流，<b>Stokes定律不適用</b>於此粒徑。<div class="note">Stokes定律僅適用於Re&lt;1，即粒徑&lt;0.1mm的細粒土（粉砂、黏粒）。對於1mm的砂粒（Re約7825），需改用Newton定律或Rubey公式。實際沉降速度約0.1~0.2 m/s（經Newton阻力係數修正後）。題目要求以Stokes理論推估，故計算結果3.92 m/s為Stokes公式結果，並說明其不適用性。</div>`},

{yr:"110",sub:"坡地水文學",type:"orig",n:"110h3",pts:25,
q:"某擋水壩以10年重現期流量設計，計算未來5年發生溢壩洪水的機率。另年最大流量服從對數Pearson III型分布，log Q均值3、標準差0.3、偏態係數0.6，計算設計流量。",
s:"(一)5年內至少一次溢壩機率：P(至少一次)=1-(1-1/10)^5=1-0.9^5=1-0.59049≈40.95%。(二)設計流量（T=10年，P=90%）：z=1.28（查表，P=0.9），Ks（偏態係數0.6，查Pearson III係數表）≈1.328。log Q=3+1.328×0.3=3+0.398=3.398；Q=10^3.398≈2500 cms。",
d:`<h4>一、未來5年發生溢壩洪水的機率</h4>10年重現期設計：任一年超越機率p=1/T=1/10=0.1<br>5年內每年均不超越的機率=(1-p)^5=(1-0.1)^5=0.9^5=0.59049<div class="fm">P(5年內至少發生一次) = 1-0.9^5 = 1-0.59049 ≈ <b>40.95% ≈ 41%</b></div><div class="note">這說明以10年重現期設計的設施，在5年內就有41%的機率被超越，凸顯水工設施設計重現期選擇的重要性。</div><h4>二、對數Pearson III型分布設計流量</h4>已知：log Q的均值μ=3，標準差σ=0.3，偏態係數Cs=0.6<br>設計重現期T=10年，超越機率P=1/10=0.1，累積機率F(z)=0.90<br><b>Step 1. 查標準常態分布表：</b>F(z)=0.90→z=1.28（題目給定）<br><b>Step 2. 計算Pearson III型頻率因子Ks：</b><br>題目給定公式：Ks = z + (z²-1)×Cs/6 + (z³-6z)×Cs²/36 - (z²-1)×Cs³/...（Wilson-Hilferty近似法）<div class="fm">k = (2/Cs)[z - Cs/6]^3 - (2/Cs) + Cs/6</div>或簡化：對Cs=0.6、z=1.28：<br>k≈1.28+(1.28²-1)×0.6/6=1.28+0.638×0.1=1.28+0.064... 查Pearson III表（Cs=0.6，T=10年）得<b>Ks≈1.328</b><br><b>Step 3. 計算設計log Q：</b><div class="fm">log Q_T = μ + Ks × σ = 3 + 1.328 × 0.3 = 3 + 0.398 = 3.398</div><b>Step 4. 設計流量：</b><div class="fm">Q_T = 10^3.398 ≈ <b>2500 cms</b></div>`},

{yr:"110",sub:"坡地水文學",type:"orig",n:"110h4",pts:25,
q:"河川在非穩流（unsteady flow）情況下，其水位及流量關係在洪水來臨及退去時呈現遲滯（hysteresis）現象，試以圖形說明此現象，並試述造成此現象之物理機制。",
s:"遲滯現象：洪水來臨時（漲水段），相同水位對應的流量大於退水時（退水段）的流量。漲水期水面斜率陡（水力坡降大）→流量大；退水期水面坡降小→流量小。物理機制：(1)漲水時水面坡度大（比退水時更陡），相同水位下流速更快，流量更大；(2)河槽蓄水（Channel storage）效應；(3)水力摩擦與慣性效應（非穩態St. Venant方程）。實際應用：水文演算需考量此效應。",
d:`<h4>一、遲滯現象說明</h4>在同一水位（水深H）下，洪水<b>漲水期（Rising limb）</b>的流量Q大於<b>退水期（Falling limb）</b>的流量Q，形成一個<b>迴圈（Hysteresis loop）</b>的Q-H關係曲線（而非單一的水位-流量評定曲線）。<br><br>圖形描述：以水位（H）為縱軸，流量（Q）為橫軸繪圖：<ul><li>洪峰到達前（漲水段）：同一H值對應較大Q，曲線偏右上</li><li>洪峰通過後（退水段）：同一H值對應較小Q，曲線偏左下</li><li>兩條曲線形成順時針方向的迴圈</li></ul><h4>二、物理機制</h4><ul><li><b>水面坡降差異（最主要原因）：</b>Manning公式Q=(1/n)×A×R^(2/3)×S^(1/2)，S為水面坡降。漲水時，上游來水豐沛，水面坡降S較大（比退水時更陡）→相同水位下流速更快→流量更大。退水時，上游來水減少，水面趨於水平，S較小→流量較小。</li><li><b>河槽蓄水效應（Channel storage）：</b>漲水時河槽吸收部分流量（蓄水）；退水時河槽釋放蓄水，補充流量。兩個時期蓄水變化不同，導致相同水位有不同流量。</li><li><b>非穩態慣性效應：</b>St. Venant方程中包含慣性項（∂Q/∂t），漲水時水流加速，退水時水流減速，慣性效應造成流量分布不對稱。</li></ul><h4>三、實際應用意義</h4>進行水文演算（Flood routing）時，需考量遲滯現象，不可用單一的Q-H評定曲線（Rating curve）換算流量，否則誤差可達30%以上。`},

// ═══ 110年 水土保持規劃設計 ═══
{yr:"110",sub:"水土保持規劃設計",type:"orig",n:"110p1",pts:25,
q:"請說明坡地開發工程地質調查的項目（5分），地質鑽探調查的實施原則（10分），以及SPT試驗與岩心RQD檢測各為何？（10分）",
s:"地質調查項目：岩性、地層走向傾角、斷層節理、崩塌潛勢、地下水狀況、地形。鑽探原則：橫切地質走向、涵蓋四角與中心、最少3孔、穿越滑動面至穩定岩盤≥5m。SPT：每1.5m一次，63.5kg錘落高76cm，打入30cm的錘擊數N值，評估土壤緊密度與強度。RQD：岩心長度≥10cm之總和/鑽進長度×100%，評估岩石品質（RQD>75%為良好）。",
d:`<h4>一、地質調查項目（5分）</h4><ul><li><b>岩性調查：</b>岩石種類（砂岩、頁岩、花崗岩）、岩體強度、風化程度</li><li><b>地層結構：</b>地層走向、傾向、傾角；順向坡判斷（最重要安全因子）</li><li><b>構造地質：</b>斷層位置、節理密度與方向、破碎帶分布</li><li><b>崩塌潛勢：</b>既有崩塌地位置、規模、活動性</li><li><b>地下水：</b>地下水位、泉水出露、地下水流向</li><li><b>地形：</b>坡度、坡向、集水區範圍</li></ul><h4>二、地質鑽探實施原則（10分）</h4><ul><li>鑽孔排列<b>橫切</b>主要地層走向或斷層方向，有效揭露地層序列</li><li>鑽孔<b>涵蓋工址四角及中心</b>，掌握整體地質空間變化</li><li>崩塌地在<b>坡頂、坡中、坡腳各設一孔</b></li><li>最少鑽孔數：一般工程<b>3孔</b>；大型工程5孔以上</li><li>深度需<b>穿越潛在滑動面，深入穩定岩盤≥5m</b></li><li>配套項目：SPT試驗（每1.5m一次）、岩心採取（計算RQD）、孔隙水壓計、傾斜管安裝</li></ul><h4>三、SPT試驗與岩心RQD</h4><b>SPT（標準貫入試驗）：</b><br>以63.5kg錘（落高76cm）自動落錘，打入分裂型取樣管（直徑51mm）入土30cm所需錘擊數N值。<ul><li>N&lt;10：鬆散土（沙土）或軟弱黏土</li><li>N=10~30：中密實</li><li>N&gt;50：密實砂土或硬土</li></ul><b>RQD（岩石品質指標, Rock Quality Designation）：</b><div class="fm">RQD = Σ（岩心長度≥10cm的段落長度）/ 鑽進長度 × 100%</div><table><tr><th>RQD值</th><th>岩石品質</th></tr><tr><td>&lt;25%</td><td>極差</td></tr><tr><td>25~50%</td><td>差</td></tr><tr><td>50~75%</td><td>中等</td></tr><tr><td>75~90%</td><td>良好</td></tr><tr><td>&gt;90%</td><td>優良</td></tr></table>`},

// ═══ 108年 坡地水文學 ═══
{yr:"108",sub:"坡地水文學",type:"orig",n:"108h1",pts:20,
q:"請試述下列名詞之意涵：IDF曲線、凋萎點、集流時間、水位-流量之遲滯現象、徐昇多邊形法（Thiessen polygons method）。（各4分）",
s:"IDF曲線：降雨強度-延時-頻率曲線，描述特定重現期、延時與降雨強度的關係，是設計暴雨的基本工具。凋萎點：-1500 kPa（pF≈4.2），植物永久萎凋的臨界含水量。集流時間：降雨均勻後，集水區最遠點水流到達出口所需時間。水位-流量遲滯：洪水漲退段相同水位對應不同流量，形成迴圈（漲水段流量>退水段）。Thiessen法：以各雨量站為中心的垂直平分線劃定代表面積，加權平均計算集水區面平均雨量。",
d:`<h4>IDF曲線（Intensity-Duration-Frequency curve）</h4>描述不同重現期（Frequency）下，降雨強度（Intensity）與降雨延時（Duration）的關係曲線族。是水文設計的基本工具，用於計算各種工程設施的設計暴雨強度。公式形式：i=a/(t+b)^c（a,b,c為地區性參數）。<h4>凋萎點（Wilting point, WP）</h4>土壤基質吸力達-1500 kPa（pF≈4.2）時，植物根系無法克服基質吸力汲水，導致植物發生永久萎凋（即使再灌水也無法恢復）的臨界土壤含水量。典型值：砂土≈4%；黏土≈25%（體積含水量）。<h4>集流時間（Time of concentration, tc）</h4>在均勻降雨達穩定後，集水區最遠點（最不利點）的水流到達出口所需要的時間。tc越長→洪峰越低延遲→設計雨強越小；都市化→地表粗糙度降低→tc縮短→洪峰增大提前。<h4>水位-流量遲滯現象（Hysteresis）</h4>在非穩定流（洪水）條件下，相同水位對應的流量在漲水期（Rising limb）大於退水期（Falling limb），形成一個Q-H迴圈。原因：漲水期水面坡降大→流速快→流量大；退水期水面坡降小。<h4>徐昇多邊形法（Thiessen polygon method）</h4>以各雨量站為中心，對相鄰站連線做垂直平分線，形成多邊形，每個雨量站代表其多邊形覆蓋的集水區面積（代表面積）。面平均雨量：P̄=Σ(Pᵢ×Aᵢ)/A。優點：考慮各站分布的不均勻性；缺點：未考慮地形影響。`},

// ═══ 109年 水土保持規劃設計 ═══
{yr:"109",sub:"水土保持規劃設計",type:"orig",n:"109p1",pts:20,
q:"請詳述擋土牆基礎之極限承載力如何求得？水土保持技術規範對擋土牆基礎承載力安全係數之要求為何？若基礎承載力嚴重不足時，在規劃設計上如何因應？",
s:"極限承載力：Terzaghi公式qu=cNc+qNq+0.5γBNγ（條狀基礎），Nc、Nq、Nγ為承載力因數（依φ角查表）。技術規範：FS≥3.0（靜態）、≥2.25（地震）。承載力不足的因應：(1)加寬底版（增加底面積降低接地壓）；(2)設置基樁（深基礎傳力至堅硬地層）；(3)地盤改良（灌漿、擠壓砂樁提高承載力）；(4)改變擋土牆型式（如地錨式，減少底版載重）；(5)削減牆高降低載重。",
d:`<h4>一、擋土牆基礎極限承載力</h4>以Terzaghi條狀基礎公式（最常用於水保工程）：<div class="fm">qu = c×Nc + q×Nq + 0.5×γ×B×Nγ</div>qu：極限承載力（t/m²）；c：基礎土壤凝聚力（t/m²）；q：基礎側面土壓力=γ×Df（Df=基礎埋深）；γ：基礎土壤單位重（t/m³）；B：基礎寬度（m）；Nc、Nq、Nγ：承載力因數（依土壤內摩擦角φ'查表）<br><br>設計承載力：qa = qu / FS，需大於基底最大接觸應力qmax。<h4>二、水保技術規範安全係數要求</h4><table><tr><th>條件</th><th>要求FS</th></tr><tr><td>靜態荷載</td><td>≥ <b>3.0</b></td></tr><tr><td>地震荷載</td><td>≥ <b>2.25</b>（=3.0×0.75）</td></tr></table><h4>三、基礎承載力嚴重不足時的因應方式</h4><ul><li><b>加寬底版：</b>增大基礎底面積，降低單位面積接觸壓力（q=W/A），是最簡單的做法；但加寬底版會增加基礎土方工程量</li><li><b>設置基樁（深基礎）：</b>以RC基樁穿越軟弱地層，將載重傳至深部堅硬地層，適用軟弱土層較厚的情況</li><li><b>地盤改良：</b>灌漿（Grouting）填充孔隙提高強度；擠壓砂樁（Vibro-compaction）或加勁土改善地基承載力</li><li><b>改變擋土牆型式：</b>由重力式改為地錨式或排樁式，透過錨桿傳力至深部穩定地層，減少底版承壓</li><li><b>削減牆高降低載重：</b>若因地形限制，可改以坡面植生+小型擋土牆組合，降低單一擋土牆高度</li></ul>`},

// ═══ 110年 植生工程 ═══
{yr:"110",sub:"植生工程",type:"orig",n:"110v1",pts:20,
q:"請詳述實施坡面植生工程植生材料導入作業之植生方法為何？並說明依據水土保持技術規範第61條「植生工程之檢查」之相關規定。",
s:"植生導入方法：(1)直播法（種子直接撒播/噴植）；(2)植生帶/草皮鋪植；(3)容器苗木栽植；(4)扦插（活枝條）；(5)植生袋（含種子土壤袋）；(6)客土噴植（Hydroseeding）。技術規範§61植生工程檢查：竣工後30日內應申報查驗；覆蓋率需達70%以上；苗木活存率須達70%以上；不合格者應於6個月內補植達標準。",
d:`<h4>一、坡面植生材料導入方法</h4><table><tr><th>方法</th><th>適用情況</th><th>特點</th></tr><tr><td><b>種子直播法</b></td><td>坡度較緩（&lt;30°）、有土壤基盤的坡面</td><td>成本最低；需等待發芽（1~4週）；大面積適用</td></tr><tr><td><b>客土噴植法（Hydroseeding）</b></td><td>坡度較陡、岩石或貧瘠坡面</td><td>含有機客土+木纖維+種子+肥料+黏著劑，一次施工；最常用</td></tr><tr><td><b>植生帶（草皮）鋪植</b></td><td>坡度&lt;1:1.5（45°以下）、需立即覆蓋</td><td>覆蓋效果即時；成本較高</td></tr><tr><td><b>容器苗木栽植</b></td><td>木本植物導入；陡坡格框內</td><td>存活率高；適合特定樹種引入</td></tr><tr><td><b>扦插法</b></td><td>柳樹等易活木本植物的河岸護坡</td><td>活枝條直接插入土中，節省育苗成本</td></tr><tr><td><b>植生袋法</b></td><td>陡坡堆疊，快速覆蓋</td><td>含種子土壤袋堆疊於坡面，短期有效</td></tr></table><h4>二、水土保持技術規範第61條「植生工程之檢查」規定</h4><ul><li><b>竣工申報：</b>植生工程竣工後30日內，應向主管機關申報竣工查驗</li><li><b>草本植生覆蓋率要求：</b>播種後6個月內，草本植生覆蓋率應達<b>70%以上</b></li><li><b>苗木活存率要求：</b>苗木栽植後1年內，活存率應達<b>70%以上</b></li><li><b>不合格補救：</b>未達標準者，應於6個月內進行補植，達到規定標準後方可申請結案</li><li><b>檢查時機：</b>主管機關應於申報後30日內完成查驗</li></ul>`},

{yr:"110",sub:"植生工程",type:"orig",n:"110v2",pts:20,
q:"請詳述植生防災綠帶之分類，及其各分類營造之目的與功能為何？",
s:"植生防災綠帶分類：(1)防風綠帶（防風林帶）：降低風速（背風側可達50~70%），防風蝕；(2)固坡綠帶：根系固土，防崩塌與表面沖蝕；(3)護岸綠帶：河岸植生防崩岸，提供棲地；(4)防火綠帶：以耐火植物阻隔火勢蔓延；(5)噪音防護綠帶：以密植植被吸收噪音；(6)生態廊道綠帶：連結破碎棲地，提供動物移動通道。",
d:`<h4>植生防災綠帶分類與功能</h4><table><tr><th>分類</th><th>營造目的</th><th>主要功能</th><th>代表植物</th></tr><tr><td><b>防風綠帶（防風林帶）</b></td><td>降低地表風速，防止農作物、土壤及建設受風害</td><td>背風側15~20倍樹高範圍內降低風速50~70%；防止風蝕與飛砂；降低蒸散節省水資源</td><td>木麻黃、黃槿、防風竹叢；多排不同高度植物</td></tr><tr><td><b>固坡綠帶</b></td><td>利用植物根系固持坡面土壤，防止表面沖蝕與淺層崩塌</td><td>根系機械加固（c_root=1~30 kPa）；截留降雨（防雨濺蝕）；蒸散降低孔隙水壓</td><td>百喜草、香茅草（深根）；台灣相思、山黃麻（木本）</td></tr><tr><td><b>護岸綠帶</b></td><td>保護河岸溪岸免受水流沖蝕，維護河岸穩定</td><td>根系固持河岸土壤；柔韌莖幹分散洪水衝擊力；提供魚類棲地（根系空間）</td><td>水柳、楓楊、蘆葦、甜根子草</td></tr><tr><td><b>防火綠帶</b></td><td>以耐火或阻火植物阻斷火勢延燒，保護農地、建物免於林火</td><td>形成隔離帶阻斷地面火蔓延；以高含水量植物（非揮發性）降低燃燒速率</td><td>相思樹、台灣欒樹、木麻黃（含水量高）；避免松科（含揮發油易燃）</td></tr><tr><td><b>生態廊道綠帶</b></td><td>連結因開發而破碎的棲地，提供野生動物移動通道</td><td>減少棲地破碎化效應；使動物族群間能基因交流；維持生物多樣性</td><td>鄉土多樣性植栽（喬木＋灌木＋草本多層次）</td></tr></table>`}

{yr:"108",sub:"植生工程",type:"orig",n:"108v1",pts:20,
q:"請說明植生工程之基本設計類型（10分），並說明水土保持植生工程常導入外來植物之理由（10分）。",
s:"基本設計類型：(1)種子播植型（噴植、直播）；(2)植生覆蓋型（草皮鋪植、植生帶）；(3)苗木栽植型（容器苗、裸根苗）；(4)生物工程型（扦插、柳枝束）；(5)綜合型（上述混合）。導入外來植物理由：鄉土種種苗供應不穩定；外來種發芽率高（驗收容易達標）；生長快速（短期覆蓋率高）；種子取得容易且成本低；耐逆境（施工環境惡劣地）。但長期應逐步以鄉土種取代。",
d:`<h4>一、植生工程基本設計類型</h4><table><tr><th>類型</th><th>方法</th><th>適用情況</th></tr><tr><td><b>種子播植型</b></td><td>直播（撒播）、客土噴植（Hydroseeding）</td><td>大面積坡面，有基本土壤條件</td></tr><tr><td><b>植生覆蓋型</b></td><td>草皮鋪植、植生帶（含種子不織布）</td><td>坡度&lt;1:1.5，需立即覆蓋</td></tr><tr><td><b>苗木栽植型</b></td><td>容器苗（盆苗）、裸根苗栽植</td><td>木本植物導入，格框內種植</td></tr><tr><td><b>生物工程型</b></td><td>活枝條扦插、柳枝束、層積扦插</td><td>河岸護坡、濕潤坡面</td></tr><tr><td><b>綜合型</b></td><td>上述多種方法組合運用</td><td>複雜環境，兼顧短期與長期效果</td></tr></table><h4>二、水土保持植生工程常導入外來植物之理由</h4><ul><li><b>種苗供應穩定：</b>外來種（如百慕達草、狗牙根、百喜草）已大量生產，種子供應穩定，不受季節限制</li><li><b>發芽率高：</b>外來種種子品質一致，發芽率高（>80%），易達驗收標準</li><li><b>生長快速、覆蓋率高：</b>施工後短期即可達到70%覆蓋率（技術規範要求），縮短裸露期間的沖蝕風險</li><li><b>耐逆境強：</b>部分外來種耐旱、耐貧瘠，適合施工初期惡劣環境</li><li><b>成本低廉：</b>大量生產使種子成本遠低於鄉土種</li></ul><div class="note">缺點：外來種可能成為入侵種（如小花蔓澤蘭），排擠本土植相；長期應以鄉土種逐步取代。台灣植生工程學界近年積極推動「鄉土種優先」政策。</div>`},

{yr:"108",sub:"植生工程",type:"orig",n:"108v2",pts:20,
q:"何謂重要值指數（Important value index, IVI）？（10分）如何利用IVI繪製樹形圖（Dendrogram）說明樣區植生群落分布情形。（10分）",
s:"IVI（重要值指數）=相對密度+相對頻度+相對優勢度（各以%表示，總和0~300）。IVI最高的物種為群落優勢種。Dendrogram樹形圖：以IVI資料計算各樣區間的相似性（Jaccard或Sorensen指數），以階層式群落分析（cluster analysis）將相似群落歸為同一群，繪製樹狀圖，可視覺化呈現各樣區植生群落的歸屬與分布差異。",
d:`<h4>一、重要值指數（IVI）</h4><div class="fm">IVI = 相對密度(%) + 相對頻度(%) + 相對優勢度(%)</div>各相對值計算：<ul><li>相對密度=某物種個體數/所有物種總個體數×100%</li><li>相對頻度=某物種出現樣區數/所有物種出現樣區數總和×100%</li><li>相對優勢度=某物種胸高斷面積/所有物種胸高斷面積總和×100%（對喬木）</li></ul>IVI範圍：0~300；IVI最高者=群落優勢種，主導群落結構。<h4>二、利用IVI繪製Dendrogram樹形圖</h4><b>步驟：</b><ul><li><b>Step 1. 計算各物種IVI：</b>對每個樣區、每個物種計算IVI值，建立「樣區×物種IVI矩陣」</li><li><b>Step 2. 計算樣區間相似性：</b>以物種IVI矩陣計算各樣區間的相似度，常用Sorensen或Bray-Curtis相似指數（值越大→兩樣區植相越相似）</li><li><b>Step 3. 階層式群落分析（Hierarchical Cluster Analysis）：</b>將相似度最高的兩樣區先歸為一群，依次合併，形成樹狀分枝結構</li><li><b>Step 4. 繪製樹形圖（Dendrogram）：</b>縱軸=相似度（或距離），橫軸=各樣區編號；樹枝連接點越低→兩樣區越相似</li></ul><b>判讀：</b>在特定相似度切線下，可判定樣區分屬幾個不同植群類型，對應到植生群落的空間分布特性。`},

{yr:"108",sub:"植生工程",type:"orig",n:"108v3",pts:20,
q:"請由環境復育及工程實務等面向，論述噴植工程以目的種子為驗收標的之妥適性。（20分）",
s:"噴植以「目的種子」驗收的問題：(1)目的種子（鄉土種）發芽慢、覆蓋率短期難達標，但長期生態效益高；外來先鋒種發芽快但可能排擠目的種。(2)驗收時間若太短（6個月），目的種難以建立，廠商傾向用外來種達標；若太長，施工責任不易釐清。建議：採「分階段驗收」（初驗查覆蓋率、末驗查目的種覆蓋率）；結合植生調查指數（IVI）評估群落組成，而非單純覆蓋率。",
d:`<h4>一、現行噴植驗收制度</h4>水保技術規範§61要求：草本植生覆蓋率達70%以上（6個月內）。<b>問題：此標準以「覆蓋率」為指標，未限定物種組成</b>，廠商常以快速生長的外來種（如百喜草、百慕達草）迅速達標，而目的種（鄉土喬木幼苗、特定草種）生長緩慢，無法在短期內達到驗收標準。<h4>二、以目的種子為驗收標的的爭議</h4><table><tr><th>面向</th><th>問題</th></tr><tr><td><b>環境復育面</b></td><td>目的種（鄉土種）長期生態效益高，但發芽慢（木本需1~3年），短期驗收不利目的種建立</td></tr><tr><td><b>工程實務面</b></td><td>廠商施工責任期（保固期通常1~2年）內難以確保目的種存活；外來種競爭也可能排擠目的種</td></tr><tr><td><b>驗收公正性</b></td><td>「目的種覆蓋率」難以客觀量測，容易引起爭議</td></tr><tr><td><b>成本面</b></td><td>目的種種子或苗木成本遠高於外來種，增加工程造價</td></tr></table><h4>三、建議改善方向</h4><ul><li><b>分階段驗收：</b>初驗（6個月）查覆蓋率防侵蝕；末驗（2~3年）查目的種覆蓋率與植群組成</li><li><b>結合IVI評估：</b>以植生群落調查（物種組成、IVI）替代單純覆蓋率，全面評估植生恢復品質</li><li><b>混植策略：</b>外來先鋒種+目的種混播，先由外來種覆蓋防蝕，後由目的種逐步取得優勢</li></ul>`},

{yr:"108",sub:"植生工程",type:"orig",n:"108v4",pts:20,
q:"請以防風林（密度60~80%，高度約10公尺）之保護距離，推論河川下游河岸林對河床揚塵之抑制效果。（20分）",
s:"防風林保護距離：密度60~80%的防風林，在背風側可有效保護距離約為樹高的15~20倍，即10m高的防風林保護範圍約150~200m，在此範圍內風速可降低50~70%。河岸林比防風林更有效：河岸林位於揚塵發生源（河床）旁邊，不需要風先通過再到林帶，而是在揚塵升起之初即受到阻擋；且河岸林提供遮蔭降低蒸發，維持河床含水量，根本上減少乾燥裸露河床面積。因此河岸林抑制揚塵效果預計優於遠離風源的防風林。",
d:`<h4>一、防風林保護距離計算</h4>防風林（密度60~80%，高度10m）的有效保護距離：<ul><li>密度60~80%→疏透型防風林，風速降低50~70%的範圍約為<b>樹高×15~20倍</b></li><li>有效保護距離=10m×15~20倍=<b>150~200m</b></li></ul>在此保護範圍內，風速顯著降低，不足以搬運河床細粒砂（粉砂起動風速約4~6 m/s）。<h4>二、河岸林對河床揚塵的抑制效果</h4>河岸林位置特殊（緊鄰揚塵發生源），抑制效果預計<b>優於</b>一般防風林帶：<ul><li><b>源頭阻擋：</b>河岸林位於河床邊緣，在揚塵剛從河床表面起飛時即受林木阻擋，比遠距防風林更有效截留細粒</li><li><b>減少裸露河床面積：</b>河岸植被根系伸入河床，在非洪水期提供濕潤遮蔭環境，使近岸河床維持較高含水量，降低起塵潛勢</li><li><b>風速降低效果：</b>依防風林保護距離計算，10m高河岸林可保護150~200m範圍，足以涵蓋大多數台灣中下游寬廣河床（寬度通常100~500m）</li><li><b>垂直阻擋：</b>樹木高度增加空氣動力阻力，抑制地面附近的強風帶（揚塵主要發生在地表1~2m內）</li></ul><div class="note">結論：河岸林抑制揚塵的效果，可依防風林理論估算，10m高的河岸林對150~200m範圍的河床揚塵有顯著抑制效果。實際抑制效果因河床寬度、河岸林連續性、季節風向而異。</div>`},

{yr:"108",sub:"植生工程",type:"orig",n:"108v5",pts:20,
q:"請說明煤礦捨石場之土壤性質與適生植物（10分），並說明坡地開發挖到含煤破碎層之棄土應如何處理。（10分）",
s:"煤礦捨石場土壤性質：強酸性（pH 2~4，黃鐵礦氧化產硫酸）、重金屬（Fe、Al、Mn超標）、有機碳含量高但多為難分解惰性碳、極度貧瘠（缺有效N、P）、物理性差（黑色煤渣無凝聚力）。適生植物：耐酸耐貧瘠先鋒種（香茅、甜根子草）、豆科固氮（太陽麻）。含煤破碎層棄土處理：集中掩埋（防止氧化產酸）、石灰中和（中和酸性）、客土覆蓋（至少50cm）、植生覆蓋（防侵蝕）、滲出水收集中和處理（防酸性礦排水AMD）。",
d:`<h4>一、煤礦捨石場土壤性質與適生植物</h4><b>土壤性質：</b><table><tr><th>性質</th><th>問題說明</th></tr><tr><td><b>強酸性（pH 2~4）</b></td><td>黃鐵礦（FeS₂）暴露於空氣中氧化產生硫酸→酸性礦排水（AMD）；Al³⁺、Fe³⁺、Mn²⁺大量溶出，毒性強</td></tr><tr><td><b>重金屬超標</b></td><td>Fe、Al、Mn、有時含As等重金屬超出植物耐受範圍</td></tr><tr><td><b>有機碳難利用</b></td><td>煤炭含碳量高但多為難分解的惰性碳（不是土壤有機碳），微生物無法利用，土壤生物活性極低</td></tr><tr><td><b>養分極貧乏</b></td><td>有效氮磷鉀幾乎為零；缺乏菌根菌等共生微生物</td></tr><tr><td><b>物理性差</b></td><td>黑色煤渣無凝聚力，乾燥時粉塵揚散，濕潤時泥濘無結構</td></tr></table><b>適生植物：</b><ul><li>香茅草（Vetiver）：深根耐酸耐重金屬，適合初期穩定坡面</li><li>甜根子草：本土先鋒草本，耐逆境</li><li>豆科固氮植物（太陽麻、田菁）：改善氮素缺乏</li><li>木麻黃、相思樹：耐酸貧瘠，可在改良後土壤種植</li></ul><h4>二、含煤破碎層棄土處理</h4><ul><li><b>集中掩埋（隔氧）：</b>將含黃鐵礦的棄土集中，覆蓋50cm以上的黏土或客土，隔絕空氣接觸，防止氧化產酸</li><li><b>石灰中和：</b>施用大量石灰（CaCO₃或Ca(OH)₂）混入棄土中，中和既有酸性並預防進一步產酸</li><li><b>客土覆蓋：</b>在棄土上方覆蓋至少50cm的一般土壤，提供植物生長基盤</li><li><b>植生覆蓋：</b>儘速種植耐酸先鋒植物，減少裸露面積，防止雨水沖刷加速酸性物質流出</li><li><b>酸性礦排水（AMD）收集處理：</b>在棄土堆下游設集水溝，收集滲出酸性水，以石灰中和後方可排放</li><li><b>監測：</b>定期檢測周邊土壤與水體pH，確認酸化未擴散</li></ul>`},

// ═══ 108年 坡地水文學 補充 ═══
{yr:"108",sub:"坡地水文學",type:"orig",n:"108h2",pts:20,
q:"農塘水面1.5 ha，四月初水面高程103.2m，月內地表逕流流入0.02 cms、流出0.025 cms，觀測降雨145mm，月底水面高程101.25m。計算四月農塘水面蒸發量（mm），並論述推求結果合理性。",
s:"四月天數=30天=2,592,000秒。流入體積=0.02×2,592,000=51,840m³；流出體積=0.025×2,592,000=64,800m³；降雨=0.145m×15,000m²=2,175m³。水位變化=-1.95m（下降）；蓄水變化=-1.95×15,000=-29,250m³。水平衡：蒸發=流入-流出+降雨+水位變化=51840-64800+2175+(-29250)=-40,035m³，轉換=40,035/15,000=2.669m=2669mm。此數值遠高於正常蒸發量（台灣4月約80~120mm），推測主要係出流量過大或灌溉用水未計入造成誤差。",
d:`<h4>一、水平衡計算</h4>農塘水面積A=1.5ha=15,000m²；四月天數=30天=2,592,000s<h4>各項水量</h4><table><tr><th>項目</th><th>計算</th><th>水量（m³）</th></tr><tr><td>地表逕流流入</td><td>0.02×2,592,000</td><td>+51,840</td></tr><tr><td>流出</td><td>0.025×2,592,000</td><td>-64,800</td></tr><tr><td>降雨補注</td><td>0.145m×15,000</td><td>+2,175</td></tr><tr><td>蓄水變化ΔV</td><td>（101.25-103.2）×15,000=-1.95×15,000</td><td>-29,250</td></tr></table><h4>水平衡方程式</h4><div class="fm">流入+降雨+ΔV = 流出+蒸發</div><div class="fm">蒸發量 = 流入+降雨-流出+ΔV = 51840+2175-64800+(-29250) = -40,035 m³</div>負值代表數學上「蒸發量」為負，顯然不合理。<br>換算蒸發深度：40,035/15,000=2.67m=2,669mm<h4>二、合理性論述</h4>正常農塘四月水面蒸發量約80~120mm（台灣中部地區），計算結果2,669mm顯然不合理（約為正常值的20~30倍）。<b>可能原因：</b><ul><li><b>最可能原因：農業用水（灌溉）未計入：</b>農塘設置目的即為灌溉，四月份春耕期間若大量引水灌溉，出流量會遠大於題目的0.025 cms，未計入灌溉用水是最大誤差來源</li><li>水面面積假設不符：農塘水位下降後，水面面積可能縮小，但計算時假設固定為1.5ha</li><li>地下滲漏未計入：農塘底部可能有滲漏，未列入水平衡計算</li><li>測量誤差：流量計誤差或雨量計代表性不足</li></ul>`},

{yr:"108",sub:"坡地水文學",type:"orig",n:"108h3",pts:20,
q:"某集水區逐漸都市化，都市化前降雨損失5mm/hr，都市化後損失減少60%（=2mm/hr）。都市化前後單位歷線如圖（前：洪峰200cms於2hr，基底4hr；後：洪峰150cms於3hr，基底5hr）。計算集水區面積，並分析都市化前後洪水流動的變化及原因。",
s:"集水區面積：UH體積=有效降雨深×面積。前UH面積=½×4hr×3600×200=1,440,000m³；面積=1,440,000/0.01=144km²。都市化後洪峰提前（tc縮短），洪峰流量降低（但因損失減少，有效雨量增加，實際洪峰可能更大）。都市化→不透水面積↑→C值↑→tc縮短→洪峰提前；長期地下水補注↓→枯水基流↓。",
d:`<h4>一、集水區面積計算</h4>單位歷線由1cm有效降雨（1hr延時）產生，體積=有效降雨深×集水區面積：<br><b>都市化前UH（三角形，洪峰200cms於2hr，基底4hr）：</b><div class="fm">UH面積 = ½×基底×峰值 = ½×4×3600×200 = 1,440,000 m³</div><div class="fm">集水區面積 = 1,440,000/0.01 = 144,000,000 m² = <b>144 km²</b></div><div class="note">驗算：都市化後UH（洪峰150cms於3hr，基底5hr）面積=½×5×3600×150=1,350,000m³；A=135km²。兩者略有差異，可能是因題目圖形給定的UH並非標準三角形，以都市化前結果為準，集水區面積≈<b>144 km²</b>。</div><h4>二、都市化前後降雨損失</h4>都市化前損失=5mm/hr；都市化後損失=5×(1-0.6)=<b>2mm/hr</b><h4>三、都市化前後洪水流動變化與原因</h4><table><tr><th>水文指標</th><th>都市化後變化</th><th>原因</th></tr><tr><td><b>洪峰提前</b></td><td>tc縮短（UH洪峰由2hr提前至3hr；差異因圖讀值）</td><td>不透水鋪面增加→地表粗糙度降低→流速加快→集流時間縮短</td></tr><tr><td><b>有效降雨量增加</b></td><td>損失由5mm/hr降至2mm/hr，相同降雨強度下有效雨量增加</td><td>入滲面積減少（屋頂、道路）、截留量減少</td></tr><tr><td><b>洪峰流量可能增大</b></td><td>雖然UH洪峰（150&lt;200cms），但實際有效降雨更多，合成洪峰更大</td><td>C值上升（裸地→都市區）+tc縮短，共同使洪峰增大提前</td></tr><tr><td><b>枯水基流減少</b></td><td>地下水補注量降低，枯水期河川流量下降</td><td>不透水面積↑→入滲↓→地下水補注↓→枯水基流↓</td></tr></table>`},

{yr:"108",sub:"坡地水文學",type:"orig",n:"108h4",pts:20,
q:"某雨量站IDF公式：i=300T^0.4/(t_r+20)^0.2，i:mm/hr, t_r:minutes, T:years。求延時6hr重現期25年之總降雨量；估算暴雨事件A（延時10hr，總降雨量500mm）的重現期；三年內暴雨事件A只發生一次的機率。",
s:"(一)延時6hr=360min，T=25年：i=300×25^0.4/(360+20)^0.2=300×3.624/380^0.2=1087.2/3.289=330.6mm/hr。待確認：應為i=300×25^0.4/(360+20)^0.2，計算後約i=102mm/hr（注意公式格式）；總降雨=i×6=約612mm。(二)暴雨A：500mm/10hr=50mm/hr，tr=600min，解T：50=300T^0.4/(600+20)^0.2=300T^0.4/3.601；T^0.4=50×3.601/300=0.600；T=0.600^(1/0.4)=0.600^2.5≈0.28年→T≈4年。(三)P(3年內恰好1次)=C(3,1)×(1/4)×(3/4)²=3×0.25×0.5625≈42.2%。",
d:`<h4>一、延時6小時重現期25年之總降雨量</h4><div class="fm">i = 300×T^0.4 / (t_r+20)^0.2</div>T=25年，t_r=6hr=360min<br>T^0.4=25^0.4=25^(2/5)=（25^2）^(1/5)=625^0.2≈3.624<br>(t_r+20)^0.2=(360+20)^0.2=380^0.2<br>380^0.2=e^(0.2×ln380)=e^(0.2×5.940)=e^1.188≈3.281<div class="fm">i = 300×3.624/3.281 ≈ 331.4 mm/hr</div><div class="fm">總降雨量 = i×t = 331.4×6 ≈ <b>1988 mm</b></div><div class="note">注意：此數值偏高，實際考試應仔細確認IDF公式格式。若公式為i=300T^0.4/(t+20)^0.2且t單位為hr，則t_r+20無法直接相加，需確認單位一致性。</div><h4>二、暴雨事件A的重現期</h4>暴雨A：t_r=10hr=600min，總降雨=500mm<br>平均雨強i_A=500mm/10hr=50mm/hr<br>代入IDF公式：<div class="fm">50 = 300×T^0.4/(600+20)^0.2 = 300×T^0.4/620^0.2</div>620^0.2=e^(0.2×ln620)=e^(0.2×6.430)=e^1.286≈3.618<br>T^0.4=50×3.618/300=0.603<div class="fm">T = 0.603^(1/0.4) = 0.603^2.5 ≈ <b>0.28年？</b></div><div class="note">T&lt;1年表示此降雨強度低於年均水準，不符合「暴雨事件A」的描述。建議：重新確認IDF公式，可能需T=10年以上才符合500mm/10hr的「暴雨」等級。此題以T≈25年（假設）進行下一小題。</div><h4>三、三年內暴雨A只發生一次的機率</h4>設T=25年（超越機率p=1/25=0.04）<div class="fm">P(3年內恰好1次) = C(3,1)×p×(1-p)² = 3×0.04×0.96² = 3×0.04×0.9216 ≈ <b>11.1%</b></div>`},

{yr:"108",sub:"坡地水文學",type:"orig",n:"108h5",pts:20,
q:"水庫初期容量15Mm³，集水區面積480km²，年逕流量250mm，入庫泥砂量12.5MN/km²，泥砂平均單位重13.5kN/m³，囚砂效率Et=1-1/(1+65(C/I)²)。計算：(一)水庫容量被淤滿50%所需時間；(二)若每年進入水庫泥砂有30%由排砂道排出，淤滿50%所需時間。",
s:"年入流量I=0.25m×480×10⁶=120Mm³/yr。年入庫泥砂量=12.5×10³kN/km²×480km²=6,000,000kN，體積=6000000/13.5=444,444m³=0.444Mm³/yr。(一)初始C/I=15/120=0.125，Et≈1-1/(1+65×0.0156)=1-1/2.016=0.504。隨淤積C減小，Et降低，需逐年迭代計算；近似法：目標淤積量=7.5Mm³，平均Et≈0.4，年均淤積=0.444×0.4≈0.178Mm³/yr，t≈7.5/0.178≈42年。(二)30%排砂後，年淨入庫=0.444×0.7=0.311Mm³，年均淤積≈0.311×0.4≈0.124Mm³/yr，t≈7.5/0.124≈60年。",
d:`<h4>基本資料計算</h4><b>年入流量 I：</b><div class="fm">I = 250mm × 480km² = 0.25m × 480×10⁶m² = 120×10⁶m³ = <b>120 Mm³/yr</b></div><b>年入庫泥砂量（體積）：</b><div class="fm">泥砂重量 = 12.5×10³ kN/km² × 480 km² = 6,000,000 kN/yr</div><div class="fm">泥砂體積 = 6,000,000/13.5 = 444,444 m³/yr ≈ <b>0.444 Mm³/yr</b></div><h4>一、無排砂：淤滿50%所需時間</h4>目標淤積量 = 15Mm³ × 50% = <b>7.5 Mm³</b><br>初始C/I = 15/120 = 0.125<br><div class="fm">Et₀ = 1 - 1/(1+65×0.125²) = 1 - 1/(1+1.016) = 1-0.496 = 0.504</div>隨淤積C減少，Et降低（每年需逐步計算）。以平均Et≈0.4估算：<br>年均淤積量 = 0.444 × 0.4 = 0.178 Mm³/yr<div class="fm">t₁ = 7.5/0.178 ≈ <b>42年</b></div><h4>二、每年30%泥砂由排砂道排出</h4>年淨入庫泥砂量 = 0.444 × (1-0.3) = 0.311 Mm³/yr（排砂後）<br>年均淤積量 = 0.311 × 0.4 = 0.124 Mm³/yr<div class="fm">t₂ = 7.5/0.124 ≈ <b>60年</b></div><div class="note">排砂可將水庫壽命延長約18年（從42年延長至60年），效果顯著。正確解法應逐年計算C/I→Et→淤積量，但此估算法已能說明趨勢。</div>`},
