<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#F7F6F2;--card:#fff;--text:#1A1A1A;--text2:#555;--text3:#888;--border:#E0DED8;--green:#2D6A4F;--gl:#EAF4EE;--gb:#B7DFCA;--amber:#92400E;--al:#FEF3C7;--ab:#FCD34D;--blue:#1D4ED8;--bl:#EFF6FF;--bb:#BFDBFE}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Helvetica Neue",sans-serif;font-size:16px;line-height:1.7}
.topbar{background:var(--green);color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.topbar h1{font-size:17px;font-weight:600}

.fbar{background:var(--card);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.chip.yr.on{background:var(--amber);color:#fff;border-color:var(--amber)}
.stats{background:var(--card);border-bottom:1px solid var(--border);padding:6px 14px;font-size:12px;color:var(--text3)}
.stats b{color:var(--text)}
.main{padding:10px 10px 80px;max-width:960px;margin:0 auto}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden}
.qhdr{padding:12px 14px 8px;cursor:pointer}
.qhdr:active{background:var(--bg)}
.qtop{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.qnum{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px}
.qnum.orig{background:var(--bl);color:var(--blue)}
.qnum.self{background:var(--al);color:var(--amber)}
.qtxt{font-size:15px;line-height:1.6;flex:1;font-weight:500}

.arr{font-size:10px;transition:transform .2s;display:inline-block}
.arr.open{transform:rotate(180deg)}
.awrap{display:none;border-top:1px solid var(--border);padding:14px;background:var(--bg)}

.al2{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}

.da ul{padding-left:16px;margin:4px 0 8px}
.da li{margin-bottom:3px}
.da b{color:var(--text)}
.da table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.da th,.da td{border:1px solid var(--border);padding:5px 7px;text-align:left;vertical-align:top}
.da th{background:var(--gl);font-weight:600;color:var(--green)}

.fm{background:#1A1A1A;color:#7EE787;border-radius:6px;padding:5px 10px;font-family:"SF Mono",Menlo,monospace;font-size:13px;margin:5px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:pre-wrap;word-break:break-all}
.note{font-size:13px;background:var(--al);border-left:3px solid var(--ab);padding:7px 10px;border-radius:0 6px 6px 0;margin:6px 0;color:var(--amber)}
.rvbtn{margin-top:10px;padding:7px 14px;font-size:13px;border:1px solid var(--gb);border-radius:20px;background:var(--gl);color:var(--green);cursor:pointer;font-weight:500}
.rvbtn.done{background:var(--green);color:#fff;border-color:var(--green)}
.empty{text-align:center;padding:60px 20px;color:var(--text3);font-size:15px}
.bbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:8px;z-index:100}
.ptrack{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.pfill{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.plabel{font-size:12px;color:var(--text3);white-space:nowrap}
@media(min-width:768px){.main{padding:14px 20px 80px}}

<script>
var DB=[
// ═══ 土壤物理與沖蝕 ═══
{yr:"111",sub:"土壤物理與沖蝕",type:"orig",n:"111e1",pts:20,
q:"試說明土壤沖蝕之定義及造成沖蝕之動力類型。",
s:"土壤沖蝕=剝離→搬運→沉積三過程。動力類型：水蝕（雨濺蝕、片蝕、細溝蝕、溝蝕、河岸蝕）、風蝕（揚蝕、磨蝕）、重力蝕（崩塌、土石流、潛移）。",
d:`<h4>一、定義</h4>土壤顆粒受自然力發生<b>剝離→搬運→沉積</b>的連續過程，造成土地生產力下降。<h4>二、水蝕</h4><ul><li><b>雨濺蝕：</b>雨滴動能打擊土面，破壞結構、形成結皮</li><li><b>片蝕：</b>薄層逕流均勻帶走土粒，不易察覺</li><li><b>細溝侵蝕：</b>深&lt;30cm，農機可消除</li><li><b>溝蝕：</b>深&gt;30cm，不可逆，需工程處理</li><li><b>河岸侵蝕：</b>河流沖蝕側岸</li></ul><h4>三、風蝕</h4>揚蝕（直接吹揚）、磨蝕（沙粒磨損地表），台灣西部沿海較顯著。<h4>四、重力蝕</h4>崩塌、土石流（台灣最嚴重）、潛移（緩慢位移）。`},
{yr:"111",sub:"土壤物理與沖蝕",type:"orig",n:"111e2",pts:20,
q:"試說明獲得土壤水分特性曲線之方法及出現之遲滯現象（Hysteresis）。",
s:"測定方法：沙盤法（低吸力）、壓力板法（中吸力，最常用）、壓力膜法（高吸力）、WP4C（露點法）。遲滯現象：脫水與吸水曲線不重合，脫水時同含水量對應較高吸力，因瓶頸孔隙效應、接觸角差異、封閉氣泡所致。",
d:`<h4>一、測定方法</h4><table><tr><th>方法</th><th>吸力範圍</th><th>說明</th></tr><tr><td>沙盤法</td><td>pF 0~2</td><td>水柱高度控制低吸力</td></tr><tr><td>壓力板萃取法</td><td>pF 2~4.2</td><td>最常用，涵蓋農業有效水分</td></tr><tr><td>壓力膜法</td><td>pF 4.2+</td><td>高吸力，永久萎凋點以上</td></tr><tr><td>WP4C露點法</td><td>&gt;10 MPa</td><td>快速高吸力量測</td></tr></table><h4>二、遲滯現象</h4>脫水（Drainage）與吸水（Wetting）路徑不同，脫水時同含水量對應<b>較高吸力</b>。<br><b>成因：</b><ul><li><b>瓶頸孔隙效應（Ink-bottle）：</b>孔隙開口小，排水時大孔無法完全排空</li><li><b>接觸角差異：</b>前進接觸角大於後退接觸角</li><li><b>封閉氣泡：</b>浸潤時空氣被困於孔隙中</li></ul><div class="note">工程意義：邊坡分析須區分入滲與排水路徑，否則會低估崩塌風險。</div>`},
{yr:"111",sub:"土壤物理與沖蝕",type:"orig",n:"111e3",pts:20,
q:"試說明地表覆蓋分別在雨濺沖蝕及逕流沖蝕之防止功能。",
s:"雨濺蝕：覆蓋攔截雨滴動能，防打擊土面，避免結皮形成。逕流沖蝕：增加地表粗糙度（降流速）、腐植質增入滲率（減逕流）、物理屏障保護土粒。覆蓋率>70%時沖蝕幾乎消失（USLE C值可達0.001~0.01）。",
d:`<h4>一、防止雨濺沖蝕</h4><ul><li>葉面、殘株、枯葉攔截雨滴，消散動能，土面不受衝擊</li><li>防止結皮：孔隙不被細粒堵塞，維持入滲能力</li></ul><h4>二、防止逕流沖蝕</h4><ul><li><b>增加地表粗糙度：</b>殘株增加Manning n值，降低流速，減少剪切力τ</li><li><b>提高入滲率：</b>根系穿透土壤形成孔道，腐植質改善結構，減少地表逕流量</li><li><b>逕流分散：</b>覆蓋物使集中逕流分散成薄層流，避免形成細溝</li><li><b>物理保護：</b>直接保護土壤顆粒不被水流剝蝕</li></ul><div class="fm">USLE量化：裸地C=1.0，密集植生C=0.001~0.01，差距達100倍</div>`},
{yr:"111",sub:"土壤物理與沖蝕",type:"orig",n:"111e4",pts:20,
q:"某基地Rm=13145 MJ-mm/ha-hr-yr，Km=0.0342，開發中坡長34m高差1.2m；開發後坡長28m高差0.1m。依USLE估算開發中、後土壤流失量。",
s:"開發中：s=3.53%，LS≈0.465，C=1.0，A≈209 ton/ha/yr。開發後：s=0.357%，LS≈0.074，C=0.01（植生），A≈0.33 ton/ha/yr。開發後為開發中約1/630。",
d:`<div class="fm">A = R × K × L × S × C × P</div><h4>開發中</h4>s=1.2/34=3.53%；L=(34/22.13)^0.3=1.132；S=10.8×0.0353+0.03=0.411；LS=0.465；C=1.0<div class="fm">A中 = 13145×0.0342×0.465×1.0 ≈ 209 ton/ha/yr</div><h4>開發後</h4>s=0.1/28=0.357%；L=(28/22.13)^0.3=1.073；S=10.8×0.00357+0.03=0.069；LS=0.074；C=0.01<div class="fm">A後 = 13145×0.0342×0.074×0.01 ≈ 0.33 ton/ha/yr</div><table><tr><th>時期</th><th>LS</th><th>C</th><th>A（ton/ha/yr）</th></tr><tr><td>開發中</td><td>0.465</td><td>1.0</td><td>≈209</td></tr><tr><td>開發後</td><td>0.074</td><td>0.01</td><td>≈0.33</td></tr></table>`},
{yr:"111",sub:"土壤物理與沖蝕",type:"orig",n:"111e5",pts:20,
q:"針對影響土壤沖蝕人為因子，試說明其土壤沖蝕控制方法。",
s:"人為因子：山坡地開發裸露、農業耕作、道路開闢、森林砍伐、超限利用。控制方法：農藝法（覆蓋、輪作）、機械法（梯田、等高耕作）、植生法（噴植、造林）、工程法（攔砂壩、截排水、沉砂池）、法規管制（水保法）。",
d:`<table><tr><th>方法</th><th>具體措施</th><th>降低USLE因子</th></tr><tr><td><b>農藝</b></td><td>覆蓋作物、秸稈、輪作、等高種植</td><td>C↓、P↓</td></tr><tr><td><b>機械地形</b></td><td>梯田、等高草帶、土埂</td><td>LS↓、P↓</td></tr><tr><td><b>植生工程</b></td><td>百喜草、客土噴植、造林（最有效）</td><td>C↓</td></tr><tr><td><b>工程</b></td><td>攔砂壩、固床工、截排水、沉砂池、護岸</td><td>LS↓、截留泥砂</td></tr><tr><td><b>法規管制</b></td><td>水土保持法審查、施工中臨時防護</td><td>根本防止不當開發</td></tr></table>`},
{yr:"112",sub:"土壤物理與沖蝕",type:"orig",n:"112e1",pts:20,
q:"請詳述土壤可容許流失量定義與影響因子。",
s:"T值：維持土壤長期生產力前提下，允許的最大年侵蝕量（ton/ha/yr）。台灣T值約5~12 ton/ha/yr。影響因子：土壤形成速率、表土深度（最重要）、土壤肥力與有機質、坡度、土地利用型態。",
d:`<h4>一、T值定義</h4>在維持土壤長期生產力（可永續利用）的前提下，每年每公頃所允許的最大土壤流失量（ton/ha/yr）。台灣常見T值：<b>5~12 ton/ha/yr</b>。<h4>二、影響T值的因子</h4><table><tr><th>因子</th><th>說明</th><th>對T值影響</th></tr><tr><td>土壤形成速率</td><td>母質風化速率，約0.1~2 ton/ha/yr</td><td>形成速率高T值可略放寬</td></tr><tr><td><b>表土深度（最重要）</b></td><td>表土越深，侵蝕對生產力影響越小</td><td>表土&gt;1m：T≤12；表土&lt;30cm：T應降至3~5</td></tr><tr><td>有機質與肥力</td><td>有機質豐富的表土侵蝕後損失快</td><td>有機質高→T值應較保守</td></tr><tr><td>坡度</td><td>坡度越陡，侵蝕後自然恢復越困難</td><td>陡坡→T值應低</td></tr><tr><td>土地利用型態</td><td>農地比林地對T值要求更嚴格</td><td>農耕地T值5~11；林地可稍高</td></tr></table>`},
{yr:"112",sub:"土壤物理與沖蝕",type:"orig",n:"112e2",pts:20,
q:"請詳述坡面土壤改良一般用於那些土壤特性的坡面，並會用何種方式處理。",
s:"適用：強酸性（pH<4.5）、強鹼/鹽鹼（pH>8.5）、有機質極低（<1%）、物理性差（壓實/黏重/砂質）、重金屬污染。改良方式：石灰調酸、石膏改鹼、堆肥增有機質、深翻鬆土、客土替換、植生萃取（重金屬）。",
d:`<table><tr><th>土壤問題</th><th>改良方法</th></tr><tr><td>強酸性（pH&lt;4.5）</td><td>施用石灰（CaCO₃），1~5 ton/ha，分次施用</td></tr><tr><td>強鹼/鹽鹼（pH&gt;8.5）</td><td>石膏（CaSO₄）提供Ca²⁺置換Na⁺；配合灌溉洗鹽</td></tr><tr><td>有機質極低（&lt;1%）</td><td>施用堆肥、腐植土、生物炭；客土噴植含腐植土</td></tr><tr><td>物理性差（壓實）</td><td>深翻鬆土（Subsoiling）打破緊實層；打孔回填客土</td></tr><tr><td>物理性差（砂質）</td><td>混入黏土或腐植土；施用保水劑（PAM）</td></tr><tr><td>重金屬污染</td><td>客土隔離；蜈蚣草植生萃取（吸As）；石灰+磷酸鹽鈍化</td></tr></table>`},
{yr:"112",sub:"土壤物理與沖蝕",type:"orig",n:"112e3",pts:20,
q:"請詳述土壤顆粒密度、土壤含水量、飽和度、田間含水量與凋萎點定義。",
s:"顆粒密度ρs≈2.65 g/cm³；重量含水量w=Mw/Ms×100%；飽和度S=Vw/Vv；田間含水量（FC）：重力水排除後的含水量（-33 kPa，pF≈2.54）；凋萎點（WP）：植物無法汲水而永久萎凋（-1500 kPa，pF≈4.2）。",
d:`<table><tr><th>名詞</th><th>公式/定義</th><th>典型值</th></tr><tr><td><b>顆粒密度 ρs</b></td><td>ρs=Ms/Vs，礦物組成決定</td><td>≈2.65 g/cm³</td></tr><tr><td><b>重量含水量 w</b></td><td>w=Mw/Ms×100%</td><td>隨土壤狀態變化</td></tr><tr><td><b>體積含水量 θ</b></td><td>θ=Vw/Vt=w×ρb/ρw</td><td>0~孔隙率n</td></tr><tr><td><b>飽和度 S</b></td><td>S=Vw/Vv×100%，飽和時=100%</td><td>0~100%</td></tr><tr><td><b>田間含水量 FC</b></td><td>重力水排除後保留量，ψ=-33 kPa</td><td>砂土10%；壤土25%；黏土40%</td></tr><tr><td><b>凋萎點 WP</b></td><td>植物無法汲水，ψ=-1500 kPa（pF≈4.2）</td><td>砂土4%；壤土12%；黏土25%</td></tr></table><div class="fm">有效水分 PAW = FC - WP（壤土最大，農業最重要）</div>`},
{yr:"112",sub:"土壤物理與沖蝕",type:"orig",n:"112e4",pts:20,
q:"請詳述土壤侵蝕之控制方法。",
s:"控制方法四類：農藝法（覆蓋作物、輪作、等高耕作）；機械/地形改造（梯田、土埂、等高草帶）；植生工程（植草、噴植、造林）；工程（攔砂壩、截排水溝、護岸、沉砂池）。各方法對應USLE不同因子。",
d:`<div class="fm">A = R × K × L × S × C × P → 控制即降低A值</div><table><tr><th>方法</th><th>具體措施</th><th>降低因子</th></tr><tr><td><b>農藝方法</b></td><td>覆蓋作物、秸稈覆蓋、輪作、等高種植</td><td>C↓、P↓</td></tr><tr><td><b>機械地形改造</b></td><td>梯田、等高耕作、土埂、等高草帶</td><td>LS↓、P↓</td></tr><tr><td><b>植生工程</b></td><td>百喜草、客土噴植、造林（最顯著）</td><td>C↓</td></tr><tr><td><b>工程方法</b></td><td>攔砂壩、固床工、截排水溝、沉砂池、護岸</td><td>LS↓、截留泥砂</td></tr></table>`},
{yr:"112",sub:"土壤物理與沖蝕",type:"orig",n:"112e5",pts:20,
q:"裸露坡面總坡長270m，均分上中下三段（各90m），各段Km與坡度如題（上7%/Km=0.03693、中20%/Km=0.03857、下9%/Km=0.03214），Rm=24912，採Foster-Wischmeier公式推估全坡面土壤流失量及中邊坡比例。",
s:"各段累積LS：上=1.585、中=8.154、下=3.500。A_上=1458、A_中=7833、A_下=2803 ton/ha/yr。全坡面≈4031 ton/ha/yr。中邊坡比例≈64.8%（坡度20%最陡，貢獻最大）。",
d:`<h4>各段S因子</h4>S_上（7%）=10.8×0.07+0.03=<b>0.786</b>；S_中（20%，用大坡度公式）=16.8×0.20-0.50=<b>2.860</b>；S_下（9%）=10.8×0.09+0.03=<b>1.002</b><h4>各段累積L因子（m=0.5）</h4>L₁（90m）=(90/22.13)^0.5=2.016；L₂（180m）=2.851；L₃（270m）=3.493<h4>累積LS</h4>LS_上=2.016×0.786=1.585；LS_中=2.851×2.860=8.154；LS_下=3.493×1.002=3.500<h4>各段A值（C=P=1.0）</h4><div class="fm">A_上=24912×0.03693×1.585≈1,458 ton/ha/yr</div><div class="fm">A_中=24912×0.03857×8.154≈7,833 ton/ha/yr</div><div class="fm">A_下=24912×0.03214×3.500≈2,803 ton/ha/yr</div><div class="fm">全坡面=(1458+7833+2803)/3≈4,031 ton/ha/yr</div><div class="fm">中邊坡比例=7833/12094×100%≈64.8%</div><div class="note">中邊坡坡度20%最陡，LS=8.154最高，貢獻全坡面65%的流失量。</div>`},
{yr:"113",sub:"土壤物理與沖蝕",type:"orig",n:"113e1",pts:25,
q:"何謂土壤構造（soil structure）與土壤結構（soil consistence），並說明其重要性。",
s:"土壤構造：土壤一次顆粒聚集形成的自然排列單元（團粒），分粒狀、塊狀、板狀、柱狀。土壤結構：土壤在不同含水量下受外力的行為特性（硬度、可塑性、黏著性）。兩者影響入滲率、根系生長、耕作難易與沖蝕潛勢。",
d:`<h4>一、土壤構造（Soil Structure）</h4><table><tr><th>類型</th><th>形狀</th><th>常見位置</th></tr><tr><td>粒狀/團粒狀</td><td>近球形，疏鬆多孔</td><td>有機質豐富表土（農業最佳）</td></tr><tr><td>塊狀</td><td>不規則方形</td><td>亞表土，壓實或乾縮形成</td></tr><tr><td>板狀</td><td>水平薄層</td><td>耕犁底盤，阻礙排水</td></tr><tr><td>柱狀/稜柱狀</td><td>垂直柱形</td><td>乾旱區心土層</td></tr></table><b>重要性：</b>良好團粒→大孔隙→入滲率高→逕流少→沖蝕降低；根系穿透容易；碳固存於團粒內部。<h4>二、土壤結構（Soil Consistence）</h4><ul><li><b>硬度：</b>乾燥時抵抗破碎能力（決定農機耕作難易）</li><li><b>可塑性：</b>濕潤時塑形不破裂（決定耕作時機）</li><li><b>黏著性：</b>濕潤時黏附其他物體（影響農機附著）</li></ul>`},
{yr:"113",sub:"土壤物理與沖蝕",type:"orig",n:"113e2",pts:25,
q:"詳細說明砂土與黏土之土壤水分特徵曲線之差異，並解釋該曲線會受土壤何種物理特性影響。",
s:"砂土：進氣值低（大孔隙先排空），含水量在低吸力段急劇下降，曲線陡峭。黏土：進氣值高，曲線平緩，高吸力下仍保有大量水分，保水性強。影響因素：土壤質地（最主要）、孔隙大小分布、有機質含量、容積密度（壓實程度）。",
d:`<table><tr><th>特性</th><th>砂土</th><th>黏土</th></tr><tr><td>進氣值（AEV）</td><td>低（1~10 kPa）</td><td>高（可達100 kPa以上）</td></tr><tr><td>曲線形狀</td><td>陡峭，AEV附近急劇下降</td><td>平緩，含水量隨吸力緩慢降低</td></tr><tr><td>殘餘含水量</td><td>低（&lt;0.05）</td><td>高（0.15~0.30）</td></tr><tr><td>有效水分</td><td>窄</td><td>較寬，但部分植物難利用</td></tr></table><h4>影響SWCC的物理特性</h4><ul><li><b>土壤質地（最主要）：</b>黏粒越多→比表面積大→同吸力下含水量高→曲線右偏</li><li><b>孔隙大小分布：</b>孔隙均一（砂土）→曲線陡；分布廣（黏土）→平緩</li><li><b>有機質：</b>增加持水孔隙，SWCC整體向上平移</li><li><b>容積密度（壓實）：</b>壓實→大孔隙減少→進氣值升高</li></ul>`},
{yr:"113",sub:"土壤物理與沖蝕",type:"orig",n:"113e3",pts:25,
q:"詳細說明土壤沖蝕的間接量測方法。",
s:"間接量測：¹³⁷Cs/²¹⁰Pb放射性同位素法（長期累積侵蝕）；樹根暴露法（依暴露量推估侵蝕深度）；河川輸砂量+SDR法（集水區總侵蝕量）；DEM差異法（多期地形比較體積差）；USLE/RUSLE模式推估；湖泊/水庫沉積岩心法。",
d:`<h4>1. 放射性同位素法</h4><ul><li><b>¹³⁷Cs法：</b>比較未擾動基準地點與待測地點的Cs-137含量，含量差異代表侵蝕或堆積量，可推估過去50年累積侵蝕</li><li><b>²¹⁰Pb法：</b>分析土壤剖面Pb-210垂直分布推估近百年侵蝕速率</li></ul><h4>2. 樹根暴露法</h4>測量樹根露出地表以上長度，結合年輪推估根系暴露年數，計算地表侵蝕速率。<h4>3. 河川輸砂量法</h4>量測懸浮載＋床載，搭配泥砂傳遞比（SDR=0.05~0.5）換算集水區總侵蝕量。<h4>4. DEM差異法</h4>比較不同時期高精度地形模型（LiDAR/UAV），計算體積差異代表侵蝕或堆積量。<h4>5. 模式推估（USLE/RUSLE）</h4>由降雨、土壤、地形、植生參數估算侵蝕量，最廣泛應用但需率定驗證。<h4>6. 湖泊/水庫沉積物岩心法</h4>鑽取底泥岩心，依沉積速率重建集水區長期侵蝕歷史。`},
{yr:"113",sub:"土壤物理與沖蝕",type:"orig",n:"113e4",pts:25,
q:"說明土壤沖蝕推估模式種類與其評估概念。",
s:"三類：(1)經驗統計模式（USLE/RUSLE，統計迴歸，簡單但無物理過程）；(2)概念性模式（ANSWERS，簡化物理過程）；(3)物理過程模式（WEPP/EUROSEM，完整模擬剝離-搬運-沉積，精確但資料需求大）。評估需率定驗證，NSE>0.5為合格。",
d:`<table><tr><th>模式類型</th><th>代表</th><th>優點</th><th>缺點</th></tr><tr><td><b>經驗統計</b></td><td>USLE、RUSLE</td><td>資料少、計算快、廣泛應用</td><td>無物理過程、無法描述空間分布</td></tr><tr><td><b>概念性</b></td><td>ANSWERS、AGNPS</td><td>兼顧效率與空間分布</td><td>仍需率定，物理基礎不完整</td></tr><tr><td><b>物理過程</b></td><td>WEPP、EUROSEM</td><td>機制清楚、可預測極端情境</td><td>資料需求大、率定困難、計算時間長</td></tr></table><h4>評估重要概念</h4><ul><li><b>率定（Calibration）：</b>以部分實測資料調整模式參數</li><li><b>驗證（Validation）：</b>以獨立資料集驗證預測能力</li><li><b>評估指標：</b>Nash-Sutcliffe效率係數（NSE&gt;0.5為合格）、PBIAS（&lt;±25%）、R²</li><li><b>尺度適用性：</b>確認模式建立尺度（小區/坡面/集水區）是否符合應用場合</li></ul>`},
{yr:"114",sub:"土壤物理與沖蝕",type:"orig",n:"114e1",pts:25,
q:"請列舉說明影響土壤生成的重要因子，並說明各項因子對於土壤生成的影響機制。",
s:"土壤生成五大因子（CLORPT）：氣候（最主要，決定風化強度）、生物（提供有機質）、母質（決定礦物組成）、地形（影響排水與侵蝕）、時間（決定剖面成熟度）。Jenny（1941）：S=f(cl,o,r,p,t)。",
d:`<div class="fm">S = f(cl, o, r, p, t)（Jenny, 1941）</div><table><tr><th>因子</th><th>影響機制</th><th>台灣案例</th></tr><tr><td><b>氣候（最主要）</b></td><td>溫度↑→反應速率↑（每升10°C加倍）；降雨↑→淋洗強→偏酸；乾旱→鹼性鈣化層</td><td>中部低海拔高溫多濕→深厚紅壤</td></tr><tr><td><b>生物</b></td><td>凋落物→腐植質；根系→孔隙；微生物→礦化；蚯蚓→混合有機無機物</td><td>林地有機質含量高於農地</td></tr><tr><td><b>母質</b></td><td>決定礦物組成與pH初始值：石英多→砂質土；石灰岩→鈣質土</td><td>石灰岩母質→pH偏高</td></tr><tr><td><b>地形</b></td><td>坡頂排水良→氧化環境（紅土）；低窪積水→還原環境（灰藍潛育土）</td><td>坡腳堆積厚土；山頂薄土</td></tr><tr><td><b>時間</b></td><td>年輕土剖面分化不明顯；成熟土有完整A-B-C層，需數百至數萬年</td><td>河流沖積地→年輕土；台地→成熟土</td></tr></table>`},
{yr:"114",sub:"土壤物理與沖蝕",type:"orig",n:"114e2",pts:25,
q:"請詳述土砂顆粒在風蝕過程中的主要運動類型以及對應之風蝕防治原則。",
s:"三種運動：蠕移（>0.5mm，沿地面滾動，佔5~25%）、跳躍（0.1~0.5mm，彈跳，最主要佔50~80%）、懸浮（<0.1mm，長距輸送，佔15~40%）。防治：防風林降風速、殘株增粗糙度、灌溉增凝聚力、植生減裸露、沙柵攔截移動沙。",
d:`<table><tr><th>類型</th><th>粒徑</th><th>機制</th><th>比例</th></tr><tr><td><b>蠕移</b></td><td>&gt;0.5 mm</td><td>被跳躍顆粒碰撞後沿地面滾動</td><td>5~25%</td></tr><tr><td><b>跳躍（最主要）</b></td><td>0.1~0.5 mm</td><td>風力吹起→弧形彈跳→落地再彈，形成連鎖反應</td><td><b>50~80%</b></td></tr><tr><td><b>懸浮</b></td><td>&lt;0.1 mm</td><td>重力小於風力向上分量，長時間飄浮，可輸送數千公里</td><td>15~40%</td></tr></table><h4>防治原則</h4><table><tr><th>原則</th><th>方法</th><th>效果</th></tr><tr><td>降低風速</td><td>防風林帶、沙籬、防風牆</td><td>背風側15~20倍樹高距離降低風速50~70%</td></tr><tr><td>增加粗糙度</td><td>殘株覆蓋（免耕）、礫石覆蓋</td><td>增加地表阻力，降低近地面風速</td></tr><tr><td>增加凝聚力</td><td>灌溉保濕、PAM、增有機質</td><td>濕潤土壤水膜黏附，提高起動風速</td></tr><tr><td>減少裸露</td><td>植生覆蓋（覆蓋率&gt;50%顯著減少）</td><td>直接保護地表</td></tr><tr><td>攔截移動沙</td><td>沙柵（沙障）、固沙植生</td><td>攔截懸浮與跳躍沙粒使其沉積固定</td></tr></table>`},
{yr:"114",sub:"土壤物理與沖蝕",type:"orig",n:"114e3",pts:25,
q:"請詳細說明敷蓋（Mulching）與覆蓋（Crop covering）之間在定義、實施目的、常用材料、適用區位及維護管理等面向之差異。",
s:"敷蓋：將非生物材料舖設於土面（稻草、木屑、礫石、塑膠布），保水保溫抑草防蝕，適用果園/苗圃/裸坡，定期補充。覆蓋：種植活體植物（豆科/草類），光合固碳固氮，適用農耕坡地，需定期刈割。最大差異：敷蓋為非生物材料，覆蓋為活體植物。",
d:`<table><tr><th>面向</th><th>敷蓋（Mulching）</th><th>覆蓋（Crop Covering）</th></tr><tr><td>材料性質</td><td>非生物：有機（稻草、木屑、樹皮）或無機（礫石、塑膠布、不織布）</td><td>活體植物：豆科（賽芻豆、太陽麻）、禾本科（百喜草、狗牙根）</td></tr><tr><td>實施目的</td><td>保濕、調節土溫、抑制雜草、防雨濺蝕；有機敷蓋分解後增加有機碳</td><td>防雨濺蝕、根系固土、豆科固氮改善地力、建立生態防護植被</td></tr><tr><td>覆蓋速度</td><td>即時有效（舖設後立刻發揮）</td><td>需時間（1~3個月後才達有效覆蓋率）</td></tr><tr><td>適用區位</td><td>果園、苗圃、裸露坡面、施工中裸地（臨時防護）</td><td>農耕坡地（梯田行間）、坡面植生復育地</td></tr><tr><td>維護管理</td><td>有機敷蓋定期補充；塑膠布老化需更換</td><td>需定期刈割（避免競爭主作物）；豆科需接種根瘤菌</td></tr><tr><td>成本</td><td>材料成本較高（外購），人工少</td><td>種子成本低，但需施肥、管理人力</td></tr><tr><td>生態效益</td><td>較低（無機材料）；有機材料分解後增加土壤生物活性</td><td>高：固氮、提供棲地、增加生物多樣性</td></tr></table>`},
{yr:"114",sub:"土壤物理與沖蝕",type:"orig",n:"114e4",pts:25,
q:"請說明土壤質地（Soil texture）的定義，以及應用沉降法（Sedimentation method）分析土壤質地的原理與慣用方法。",
s:"土壤質地：砂粒（0.05~2mm）、粉砂（0.002~0.05mm）、黏粒（<0.002mm）三組分相對百分比，依USDA三角圖分為12種。沉降法依Stokes定律（vs∝d²），以比重計法（Hydrometer）或吸管法（Pipette）在不同時間深度取樣推算各粒徑含量。",
d:`<h4>一、土壤質地定義</h4><table><tr><th>粒徑組分</th><th>粒徑範圍</th><th>特性</th></tr><tr><td>砂粒（Sand）</td><td>0.05~2 mm</td><td>大孔隙多，排水快，保水差</td></tr><tr><td>粉砂（Silt）</td><td>0.002~0.05 mm</td><td>毛細管力中等，沖蝕性高</td></tr><tr><td>黏粒（Clay）</td><td>&lt;0.002 mm</td><td>比表面積大，保水強，透水性差</td></tr></table>依三組分比例在USDA質地三角圖定位，分為12種質地類別。<h4>二、沉降法原理（Stokes定律）</h4><div class="fm">vs = (γs-γw)×d² / (18μ)（粒徑越大沉降越快）</div><h4>三、慣用方法</h4><ul><li><b>比重計法（Hydrometer method）：</b>在特定時間以比重計讀取懸浮液密度，換算各粒徑百分比。操作簡便但精度略低。</li><li><b>吸管法（Pipette method）：</b>在特定時間特定深度以吸管抽取懸浮液，蒸乾秤重，精度高（標準方法）但費時。</li></ul><div class="note">前處理：先以H₂O₂去除有機質，HCl去除碳酸鈣，再以焦磷酸鈉使顆粒完全分散。</div>`},
// ═══ 水土保持工程 ═══
{yr:"111",sub:"水土保持工程",type:"orig",n:"111w1",pts:20,
q:"請詳述如何進行懸臂式擋土牆面版（stem）之鋼筋混凝土結構分析與配筋？依技術規範第120條，滑動、傾倒與基礎承載力安全係數要求分別為何？",
s:"面版視為懸臂梁，主動土壓力三角形分布（Ka=tan²(45-φ/2)），最大彎矩在底部。主筋設土壓力側（背面受拉），依彎矩As=Mu/(φfy(d-a/2))設計。安全係數：滑動FS≥1.5、傾倒FS≥2.0、基礎承載力FS≥3.0。",
d:`<h4>一、面版結構分析</h4>面版（Stem）固定於底版，承受Rankine主動土壓力。<div class="fm">Ka = tan²(45°-φ/2)；pa = Ka×γ×H（三角形分布）</div>最大彎矩（底部固定端）：Mmax = Ka×γ×H³/6<h4>配筋原則</h4><ul><li><b>主拉力筋：</b>設於土壓力側（背面），受拉側，As由彎矩設計</li><li><b>溫度收縮筋：</b>正面，間距≤300mm</li><li>保護層：土壤接觸面≥75mm，其他面≥40mm</li></ul><h4>二、技術規範第120條安全係數</h4><table><tr><th>項目</th><th>靜態FS</th><th>地震FS</th></tr><tr><td>抗滑動</td><td>≥<b>1.5</b></td><td>≥1.1</td></tr><tr><td>抗傾倒</td><td>≥<b>2.0</b></td><td>≥1.5</td></tr><tr><td>基礎承載力</td><td>≥<b>3.0</b></td><td>≥2.25</td></tr></table>`},
{yr:"111",sub:"水土保持工程",type:"orig",n:"111w2",pts:20,
q:"某野溪因極端降雨發生土石流，流動距離約600m、寬30~50m，距保全對象約50m。說明土石流三個區段及地形特徵，並詳述各區段整治工程規劃。",
s:"三區段：發生區（上游>30°，崩積物多）→流動區（中游15~30°，高速通道）→堆積區（下游<10°，沖積扇）。整治：發生區設攔砂壩+崩塌地復育；流動區設固床工+護岸；堆積區設導流堤+沉砂池+預警撤離。",
d:`<h4>三區段及地形特徵</h4><table><tr><th>區段</th><th>坡度</th><th>地形特徵</th><th>主要現象</th></tr><tr><td><b>發生區</b></td><td>&gt;30°</td><td>崩積物堆積，V形谷，地質破碎</td><td>崩塌、大量土砂供給，土石流啟動點</td></tr><tr><td><b>流動區</b></td><td>15~30°</td><td>溪道窄直，受地形約束</td><td>高速流動（2~20 m/s），沖蝕溪床與兩岸</td></tr><tr><td><b>堆積區</b></td><td>&lt;10°</td><td>扇形堆積，出口開闊</td><td>流速降低、泥砂沉積，保全對象多在此區前緣</td></tr></table><h4>各區段整治工程</h4><b>發生區：</b>攔砂壩（攔截崩積物）、崩塌地植生復育、護坡工程。<br><b>流動區：</b>固床工（防溪床下切）、護岸（本案30~50m寬需護岸）、確保通洪斷面順暢。<br><b>堆積區（最重要，距保全對象50m）：</b>導流堤（引導流動方向）、疏導壩（排洪兼攔砂）、沉砂池（使土砂沉積）、預警撤離系統（上游雨量計+地聲感測器）。`},
{yr:"111",sub:"水土保持工程",type:"orig",n:"111w3",pts:20,
q:"請繪流程圖說明邊坡穩定工程之設計流程。依技術規範第73條，永久性與臨時性邊坡穩定安全係數之要求分別為何？",
s:"設計流程：現地調查（地質、地下水）→室內試驗（強度參數c'、φ'）→滑動機制分析（選分析方法）→安全係數計算→改善措施設計（削坡/排水/支撐）→施工→監測。安全係數：永久邊坡FS≥1.5（靜態）、≥1.1（地震）；臨時邊坡FS≥1.3（靜態）。",
d:`<h4>邊坡穩定工程設計流程</h4><b>Step 1</b> 現地調查：地質（岩性、節理、斷層）、地下水位、坡面幾何、現有破壞跡象<br><b>Step 2</b> 室內試驗：三軸剪力試驗→c'、φ'；滲透係數<br><b>Step 3</b> 滑動機制分析：判斷滑動型態（圓弧/平面/楔形）→選適當分析方法（Bishop/Janbu/無限邊坡法）<br><b>Step 4</b> 安全係數計算：靜態FS、地震FS<br><b>Step 5</b> 改善措施設計（FS不足時）：削坡（減驅動力）、排水（降孔隙水壓）、坡腳支撐（擋土牆/排樁）、地盤加固（錨桿）<br><b>Step 6</b> 施工與監測<h4>技術規範第73條安全係數</h4><table><tr><th>邊坡類型</th><th>靜態FS</th><th>地震FS</th></tr><tr><td>永久性邊坡（使用期限&gt;2年）</td><td>≥<b>1.5</b></td><td>≥<b>1.1</b></td></tr><tr><td>臨時性邊坡（施工期間，≤2年）</td><td>≥<b>1.3</b></td><td>≥<b>1.0</b></td></tr></table>`},
{yr:"111",sub:"水土保持工程",type:"orig",n:"111w4",pts:20,
q:"請詳述在深層滑動區，地下排水工程之規劃設計原則。如何進行該規劃設計所需之調查工作？",
s:"地下排水目的：降低地下水位，減少孔隙水壓，提高有效應力，增加安全係數。工程種類：水平排水孔（最常用）、排水廊道（大規模）、集水井、截水管。調查：鑽探（滑動面深度）、孔隙水壓計、現地滲透試驗、傾斜管（監測位移）。",
d:`<h4>一、地下排水工程規劃設計原則</h4><table><tr><th>工程類型</th><th>適用情況</th><th>設計要點</th></tr><tr><td><b>水平排水孔（最常用）</b></td><td>滑動面在地表下5~30m，有明顯飽和帶</td><td>孔徑75~150mm，水平微傾1~5°排水，穿過滑動面，孔間距3~6m</td></tr><tr><td><b>排水廊道</b></td><td>深層（&gt;20m）大規模滑動</td><td>施設於滑動面下方穩定岩層，造價高但效果持久</td></tr><tr><td><b>集水井</b></td><td>地下水量大、廣泛分布</td><td>深井降水，需長期電動抽水維護</td></tr></table><h4>二、調查工作</h4><ul><li><b>鑽探：</b>確定地層序列、滑動面深度；標準貫入試驗（SPT）評估強度</li><li><b>孔隙水壓計：</b>各層地下水壓，對應不同含水層</li><li><b>傾斜管（Inclinometer）：</b>量測各深度水平位移，確定滑動面深度</li><li><b>現地滲透試驗：</b>落水頭試驗或Lugeon試驗取得滲透係數K</li><li><b>地球物理探測（ERT）：</b>輔助推測地下含水層分布</li></ul>`},
{yr:"111",sub:"水土保持工程",type:"orig",n:"111w5",pts:20,
q:"請繪流程圖說明滯洪池之設計流程。請說明以「側流堰」（side weir）配合滯洪池運作的優缺點為何？如何運作？",
s:"設計流程：計算開發前後洪峰→確認需削減量→初估滯洪量（三角形法）→選出口設施→建立水位-出流關係（Rating curve）→Modified Puls演算驗證→設計池體→安全檢核。側流堰優點：自動操作、超量自動分流；缺點：水力計算複雜、易淤積需清淤。",
d:`<h4>一、滯洪池設計流程</h4><b>Step 1：</b>計算開發前洪峰 Qbefore（合理化公式）<br><b>Step 2：</b>計算開發後洪峰 Qafter（C值增大、tc縮短）<br><b>Step 3：</b>確認需削減量 ΔQ = Qafter - Qbefore<br><b>Step 4：</b>初估滯洪量 Vs（三角形法：Vs≈ΔQ×tp/2）<br><b>Step 5：</b>選出口設施（圓形孔口/矩形堰/立管）<br><b>Step 6：</b>計算出流量-水位關係（Rating curve）<br><b>Step 7：</b>洪水演算（Modified Puls法）驗證最大出流量及所需水位<br><b>Step 8：</b>設計池體（平面尺寸、深度、護岸、緊急溢洪道）<br><b>Step 9：</b>安全檢核（堤頂超高≥0.3m、滲流安全）<h4>二、側流堰運作與優缺點</h4><b>運作：</b>側流堰設於主排水渠道側壁，堰頂=允許通過流量對應水深。流量≤設計值→水位低於堰頂，逕流全部沿主渠道流過；流量>設計值→超額自動溢入側流堰→進入滯洪池蓄滯。<br><b>優點：</b>自動操作無需人工控制；利用既有渠道空間。<br><b>缺點：</b>側流水力計算複雜（非恆定流）；堰口易淤積需定期清淤；初設成本較高。`},
{yr:"112",sub:"水土保持工程",type:"orig",n:"112w1",pts:20,
q:"水土保持義務人於山坡地從事開發建築用地時，依水土保持法第十二條，應先擬具水土保持計畫，試詳述該水土保持計畫章節名稱和大綱內容為何？",
s:"章節：(1)計畫概要；(2)基地現況調查（地形/地質/土壤/植生/水文）；(3)水土流失推估；(4)水土保持設施設計（截排水/沉砂池/固床工/護岸/擋土牆/植生）；(5)施工計畫（分期/臨時防護）；(6)植生復育計畫；(7)監測計畫；(8)維護管理計畫；(9)附件。",
d:`<table><tr><th>章節</th><th>大綱內容</th></tr><tr><td><b>一、計畫概要</b></td><td>基地位置、開發目的與規模（面積、用途）、計畫年限、法令依據（水保法§12）</td></tr><tr><td><b>二、基地現況調查</b></td><td>地形（等高線、坡度分析）、地質（岩性、斷層、崩塌潛勢）、土壤（質地、滲透率、K值）、植生（覆蓋率）、水文（IDF曲線、設計暴雨）、環境敏感區位</td></tr><tr><td><b>三、水土流失推估</b></td><td>開發前/中/後土壤流失量（USLE），設計洪峰流量（合理化公式）</td></tr><tr><td><b>四、水土保持設施設計</b></td><td>截排水系統、沉砂設施（容量計算）、固床工、護岸、擋土牆、植生工程，各附設計圖及計算書</td></tr><tr><td><b>五、施工計畫</b></td><td>分期施工程序（降低同時裸露面積）、臨時性防護措施（臨時截排水、沉砂池、PE布覆蓋）、施工期程表</td></tr><tr><td><b>六、植生復育計畫</b></td><td>植生方式（噴植/植草皮）、植栽種類（鄉土種優先）、養護計畫</td></tr><tr><td><b>七、監測計畫</b></td><td>施工期監測項目（坡面變形、沉砂池淤積）、監測頻率</td></tr><tr><td><b>八、維護管理</b></td><td>完工後各設施維護頻率與方式、管理責任歸屬</td></tr></table>`},
{yr:"112",sub:"水土保持工程",type:"orig",n:"112w2",pts:20,
q:"為減輕保育治理工程對生態環境造成的負面影響，試詳述「生態評估調查」的原則與方法為何？",
s:"原則：預防原則（先調查再施工）、迴避-縮小-減輕-補償四層次、生態系整體考量、在地知識整合、科學量化。方法：文獻回顧（特有種/保育類）、現地物種調查（植物/魚類/鳥類）、棲地品質評估（IEAT表）、生態敏感區位圖製作。",
d:`<h4>一、生態評估調查原則</h4><ul><li><b>預防原則：</b>工程施工前先完成生態調查，有不確定性應採保守態度</li><li><b>迴避→縮小→減輕→補償：</b>依序優先的保育策略層次</li><li><b>生態系整體考量：</b>評估整個棲地功能，不僅單一物種</li><li><b>科學量化：</b>以物種豐富度、Shannon多樣性指數等量化指標評估</li></ul><h4>二、生態評估調查方法</h4><ul><li><b>文獻回顧：</b>查詢特有種、保育類、入侵種名錄；確認環境敏感區（國家公園、野生動物保護區）</li><li><b>植物調查：</b>穿越線調查、樣區法，記錄覆蓋率、特有種</li><li><b>魚類調查：</b>電魚法（Electrofishing）或陷阱法</li><li><b>鳥類調查：</b>定點計數法（Point count）</li><li><b>棲地品質評估（IEAT表）：</b>評估溪流地形多樣性、底質、植被廊道寬度，分A~E等級</li><li><b>生態敏感區位圖：</b>整合調查結果，以GIS繪製迴避區/謹慎施工區/一般施工區</li></ul>`},
{yr:"112",sub:"水土保持工程",type:"orig",n:"112w3",pts:20,
q:"試詳述「透水性鋪面」的規劃設計原則為何？",
s:"規劃設計原則：選址（遠離污染源、地下水位≥1m、坡度≤5%）；水文設計（入滲率≥設計雨強）；結構設計（面層→過濾層→礫石蓄水基層→底層）；承載力（車行區需加強）；設溢流出口；定期維護（高壓水柱清孔）。",
d:`<h4>功能</h4>允許雨水透過鋪面滲入地下，削減地表逕流30~60%、補注地下水、降低都市熱島效應。<h4>選址原則</h4><ul><li>遠離污染源（加油站、化工廠），防止污染地下水</li><li>地下水位深度≥1.0m，確保有足夠淨化距離</li><li>坡度≤5%（過陡導致逕流流走無法入滲）</li><li>避開地層液化潛勢區</li></ul><h4>水文設計</h4><ul><li>設計入滲率≥設計雨強（mm/hr），確保不積水</li><li>必設溢流出口，超量雨水安全排放</li></ul><h4>結構設計</h4><table><tr><th>層次</th><th>材料</th><th>功能</th></tr><tr><td>面層</td><td>透水混凝土（孔隙率15~25%）、透水磚</td><td>受力+透水</td></tr><tr><td>過濾層</td><td>砂或地工織物</td><td>防細粒向上遷移堵塞面層</td></tr><tr><td>礫石蓄水基層</td><td>潔淨礫石，孔隙率約30~40%，厚20~50cm</td><td>暫時儲水緩衝</td></tr><tr><td>底層</td><td>依需求設計全透水或半透水（設溢流管）</td><td>讓水滲入土壤或導出</td></tr></table><div class="note">維護：定期以高壓水柱或吸塵機清除孔隙堵塞物（每年1~2次）；禁止在透水鋪面上堆置砂土。</div>`},
{yr:"112",sub:"水土保持工程",type:"orig",n:"112w4",pts:20,
q:"試詳述生態護岸，採用自然或人工資材的「仿自然護岸」之種類及工法為何？",
s:"三類：(A)純生物工程（直接扦插、柳枝束、層積扦插、植生捆）；(B)半工程（活木樁、木框格+植生、拋石+植生）；(C)仿自然硬式（乾砌石、石籠、預鑄植生塊）。原則：保留礫石底質、深潭淺瀨結構、確保魚類迴游通道。",
d:`<h4>（A）純生物工程（Soft Engineering）</h4><table><tr><th>工法</th><th>施作方式</th><th>適用流速</th></tr><tr><td>直接扦插</td><td>活枝條（水柳、台灣水蠟樹）直接插入濕潤河岸，間距30~50cm</td><td>&lt;1.5 m/s</td></tr><tr><td>柳枝束（Live fascine）</td><td>活枝條捆綁成束，橫向埋入等高線溝槽，覆土後萌芽</td><td>&lt;1.5 m/s</td></tr><tr><td>層積扦插</td><td>挖水平階梯溝槽，分層埋入活枝條束，多層根系固土</td><td>&lt;2.0 m/s</td></tr><tr><td>植生捆（Coir roll）</td><td>椰纖維製成圓柱捆，固定於常水位線，外側種植挺水植物</td><td>&lt;1.5 m/s</td></tr></table><h4>（B）半工程（Hybrid Engineering）</h4><ul><li><b>活木樁（Live stake）：</b>粗枝（徑3~10cm）打入坡腳，兼具結構支撐與植生</li><li><b>木框格（Crib wall）+植生：</b>圓木組成格框填土，多孔隙、透水、植生友善</li><li><b>拋石（Riprap）+植生：</b>坡腳拋石護坡，石縫間縫植草種</li></ul><h4>（C）仿自然硬式</h4><ul><li><b>乾砌石護岸：</b>石塊縫隙提供魚蝦棲地，透水，流速可達2~3 m/s</li><li><b>石籠護岸（Gabion）：</b>鋼絲網籠填礫石，柔性適應沉陷，可植生</li></ul>`},
{yr:"112",sub:"水土保持工程",type:"orig",n:"112w5",pts:20,
q:"試詳述「盲溝」的種類與適用範圍，並請敘明規劃設計原則和施工注意事項。",
s:"盲溝種類：礫石盲溝、礫石+穿孔管盲溝（最常用）、地工織物包覆盲溝、碎石盲溝。適用：邊坡排水降孔隙水壓、農地排水、道路基層排水、建築周邊防滲。設計原則：坡降≥0.5%、濾層設計（D15礫石/D85土<5）、孔眼朝下、出口暢通。施工：乾燥挖溝、地工織物環包、分層夯實、設標識樁。",
d:`<h4>一、盲溝種類與適用範圍</h4><table><tr><th>種類</th><th>構造</th><th>適用</th></tr><tr><td>礫石盲溝</td><td>填20~40mm潔淨礫石，無穿孔管</td><td>排水量小、坡降足夠的場合</td></tr><tr><td><b>礫石+穿孔管（最常用）</b></td><td>溝底設PVC或PE穿孔管（孔徑6~12mm），周圍填礫石</td><td>較深層地下水排除，集水效率高</td></tr><tr><td>地工織物包覆</td><td>先鋪地工織物再填礫石（防細粒進入堵塞）</td><td>周邊土壤細粒多（粉砂或砂質土）</td></tr><tr><td>碎石盲溝</td><td>就地取材填入破碎岩塊</td><td>偏遠礫石取得困難處</td></tr></table><h4>二、規劃設計原則</h4><ul><li>坡降≥<b>0.5%</b>（以1~3%為佳），確保水流</li><li>深度依需降低的地下水位決定，通常0.6~2.0m</li><li>濾層設計：D₁₅礫石/D₈₅土壤&lt;5，防細粒遷移堵塞</li><li>穿孔管孔眼朝下方兩側，防止淤積</li><li>出口需暢通，設防淤礫石包</li></ul><h4>三、施工注意事項</h4><ul><li>開挖保持乾燥，防溝壁坍塌污染礫石</li><li>地工織物需環包礫石上下及兩側，頂部覆蓋後才回填</li><li>回填土壤分層夯實，防地表下陷</li><li>設置標識樁，便於日後維護人員找到位置</li><li>完工後定期確認出口有水流出，若無需檢查是否堵塞</li></ul>`},
{yr:"113",sub:"水土保持工程",type:"orig",n:"113w1",pts:15,
q:"請詳述大規模崩塌潛勢區風險潛勢等級之評估方式。",
s:"風險=危害度×暴露度×脆弱度。危害度：坡度、地質、崩塌歷史、降雨分析；暴露度：影響範圍內人口、建物；脆弱度：建物結構、疏散能力。台灣採航照+GIS分析，分5個潛勢等級（極低~極高），高潛勢區優先治理。",
d:`<div class="fm">風險（Risk）= 危害度（Hazard）× 暴露度（Exposure）× 脆弱度（Vulnerability）</div><h4>各要素評估</h4><ul><li><b>危害度：</b>坡度（>30°崩塌潛勢顯著增加）、地質（破碎帶、順向坡）、崩塌歷史（多期航照判釋）、降雨觸發閾值</li><li><b>暴露度：</b>崩塌影響範圍內的人口數、建物數、道路長度</li><li><b>脆弱度：</b>建物結構（RC vs 磚木造）、居民疏散能力、預警系統完備程度</li></ul><h4>台灣大規模崩塌潛勢等級</h4><table><tr><th>等級</th><th>潛勢</th><th>管理措施</th></tr><tr><td>1</td><td>極低</td><td>一般定期監測</td></tr><tr><td>2</td><td>低</td><td>加強定期巡查</td></tr><tr><td>3</td><td>中</td><td>建置監測系統、預警機制</td></tr><tr><td>4</td><td>高</td><td>規劃治理工程、防災演練</td></tr><tr><td>5</td><td>極高</td><td>優先治理、撤離計畫、限制居住</td></tr></table>`},
{yr:"113",sub:"水土保持工程",type:"orig",n:"113w2",pts:20,
q:"國內外預鑄護岸種類眾多，請詳述主要類型及適用條件。",
s:"主要類型：互鎖型預鑄塊（ACB，適合2~4 m/s、不均勻沉陷）；緩坡護岸塊（適合2~3 m/s、坡度1:1.5以上）；箱籠（Gabion，3~5 m/s、就地取材）；植生型預鑄塊（1~2 m/s、生態敏感）；連鎖護坡磚（2~3 m/s）；透水格網護岸（<2 m/s、生態優先）。",
d:`<table><tr><th>類型</th><th>特徵</th><th>適用流速</th><th>優缺點</th></tr><tr><td><b>互鎖型（ACB）</b></td><td>各塊相互嵌合，可撓性佳</td><td>2~4 m/s</td><td>優：可適應沉陷；缺：需精確對位</td></tr><tr><td><b>緩坡護岸塊</b></td><td>楔形或梯形，鋪設於坡面</td><td>2~3 m/s</td><td>優：施工快速；缺：需完善排水</td></tr><tr><td><b>箱籠（Gabion）</b></td><td>鋼絲網籠填礫石，可疊砌</td><td>3~5 m/s</td><td>優：透水佳、生態友善；缺：鋼絲腐蝕老化</td></tr><tr><td><b>植生型預鑄塊</b></td><td>預留孔洞可植草</td><td>1~2 m/s</td><td>優：生態效益高；缺：植生建立需時間</td></tr><tr><td><b>連鎖護坡磚</b></td><td>扣合設計，可局部更換</td><td>2~3 m/s</td><td>優：維修方便；缺：整體性較差</td></tr><tr><td><b>透水格網護岸</b></td><td>格內填土植生</td><td>&lt;2 m/s</td><td>優：最佳生態效益；缺：承受衝擊力有限</td></tr></table>`},
{yr:"113",sub:"水土保持工程",type:"orig",n:"113w3",pts:30,
q:"請詳述預鑄護岸毀損原因類型（10分）；並推導只考量水流剪應力（拖曳力）的預鑄塊起動破壞條件式（20分）。",
s:"毀損類型：基礎淘空（最常見）、越頂沖蝕、背水壓力破壞、拖曳力起動、波浪衝擊、凍融破壞。起動條件：拖曳力FD與升力FL超過塊體摩擦力時起動。條件式：(ρw u²/2)×[CD As(cosθ+f sinθ)+CL An×f] > (γ-γw)V×(f cosθ-sinθ)。",
d:`<h4>一、毀損原因類型</h4><table><tr><th>類型</th><th>成因</th></tr><tr><td><b>基礎淘空（最常見）</b></td><td>水流沖蝕護岸底部，失去支撐而傾倒</td></tr><tr><td>越頂沖蝕</td><td>洪水超過護岸頂部，水流從頂部流過沖蝕背面填土</td></tr><tr><td>背水壓力破壞</td><td>排水孔阻塞，護岸背面水壓推倒護岸</td></tr><tr><td>拖曳力起動</td><td>高流速拖曳力及升力超過塊體摩擦力，使預鑄塊滑移</td></tr><tr><td>波浪衝擊破壞</td><td>波浪動壓力反覆衝擊，疲勞破壞</td></tr><tr><td>凍融循環</td><td>孔隙水結冰膨脹造成破碎（高緯度/高海拔）</td></tr></table><h4>二、起動破壞條件式推導</h4><b>預鑄塊受力（斜面與水平夾角θ，水流平行斜面）：</b><ul><li>有效重力：W=(γ-γw)V</li><li>拖曳力：FD=CD×As×(ρw u²/2)</li><li>升力：FL=CL×An×(ρw u²/2)</li></ul><b>沿斜面分解：</b><br>驅動力=W sinθ + FD cosθ<br>正向力=W cosθ - FL - FD sinθ<br>摩擦抵抗力=f×(W cosθ - FL - FD sinθ)<div class="fm">起動條件（抵抗力 &lt; 驅動力）：
f×[(γ-γw)V cosθ - CL An ρw u²/2 - CD As ρw u²/2 sinθ]
&lt; (γ-γw)V sinθ + CD As ρw u²/2 cosθ</div>整理後：<div class="fm">(ρw u²/2)×[CD As(cosθ+f sinθ)+CL An f] > (γ-γw)V×(f cosθ-sinθ)</div><div class="note">安全係數 FS = 摩擦抵抗力/驅動力 ≥ 1.5（規範要求）</div>`},
{yr:"113",sub:"水土保持工程",type:"orig",n:"113w4",pts:20,
q:"請詳述陡坡排水渠道之主要消能設施種類、適用條件及優缺點。",
s:"消能設施：跌水工（Drop structure，落差0.5~3m，中小流量）；消力池（水躍消能，大流量末端，消能效率60~70%）；斜槽消能坎（Baffled apron drop，陡坡15~40%，流量變化大）；拋石消能池（出口流速<3 m/s，臨時小型）；多級跌水（總落差大）。",
d:`<table><tr><th>消能設施</th><th>工作原理</th><th>適用條件</th><th>優/缺點</th></tr><tr><td><b>跌水工</b></td><td>垂直跌落後水墊消能，後接護坦</td><td>坡差0.5~3m，中小流量</td><td>優：結構簡單低造價；缺：多級需多次設置</td></tr><tr><td><b>消力池（水躍）</b></td><td>利用水躍從超臨界→亞臨界，動能轉化</td><td>大流量末端（如溢洪道末端）</td><td>優：消能效率高60~70%；缺：設計複雜、需控制水躍位置</td></tr><tr><td><b>斜槽消能坎（Baffled apron）</b></td><td>交錯排列消能塊，水流連續碰撞</td><td>坡度15~40%，流量變化大</td><td>優：不需水躍，適應流量變化；缺：消能塊需耐磨</td></tr><tr><td><b>拋石消能池</b></td><td>水流沖入拋石間隙消散動能</td><td>出口流速&lt;3 m/s，臨時小型</td><td>優：材料易取、施工簡易；缺：維護高，消能不穩定</td></tr><tr><td><b>多級跌水</b></td><td>單一大落差分為多個小落差</td><td>總落差&gt;3m，生態考量</td><td>優：各級落差小，可兼顧魚類迴游；缺：工程量大</td></tr></table>`},
{yr:"113",sub:"水土保持工程",type:"orig",n:"113w5",pts:15,
q:"請詳述水土保持工程施工階段的碳排來源及減碳作法。",
s:"碳排來源：建材製造（水泥40~60%最多、鋼筋）；施工機具燃油（怪手、卡車20~35%）；材料運輸（10~20%）；土方開挖與爆破；臨時設施電力。減碳：就地取材、低碳混凝土（SCM取代部分水泥）、生態工法（減少混凝土）、電動機具、挖填平衡優化、植生碳匯補償。",
d:`<h4>一、碳排來源</h4><table><tr><th>來源</th><th>比例</th><th>說明</th></tr><tr><td><b>建材製造（最大）</b></td><td>40~60%</td><td>水泥約800 kg CO₂/ton；鋼筋約0.5 ton CO₂/ton</td></tr><tr><td>施工機具燃油</td><td>20~35%</td><td>柴油燃燒約2.65 kg CO₂/L</td></tr><tr><td>材料運輸</td><td>10~20%</td><td>砂石、水泥長途卡車運輸</td></tr><tr><td>土方開挖與爆破</td><td>5~10%</td><td>大型開挖能耗、爆炸物</td></tr><tr><td>臨時設施</td><td>&lt;5%</td><td>工地發電機、臨時電力</td></tr></table><h4>二、減碳作法</h4><ul><li><b>就地取材：</b>優先使用工址附近石材，大幅減少運輸碳排</li><li><b>低碳混凝土（SCM）：</b>爐渣（GGBS）、飛灰取代10~50%水泥，減碳20~50%</li><li><b>生態工法：</b>砌石、木樁、植生護岸取代全混凝土，降低水泥用量</li><li><b>電動施工機具：</b>電動怪手、電動卡車，直接消除化石燃料排放</li><li><b>挖填平衡優化：</b>精確設計減少不必要土方移動</li><li><b>植生碳匯補償：</b>完工後加速植生復育，以植被固碳補償施工碳排</li></ul>`},
{yr:"114",sub:"水土保持工程",type:"orig",n:"114w1",pts:15,
q:"請繪出重力式與非重力式等擋土牆之示意圖，並說明擋土牆鑑定作業時現場勘查應紀錄那些項目？",
s:"重力式：依靠自身重量抵抗（混凝土重力牆、砌石牆、石籠牆）。非重力式：懸臂式（RC結構）、扶壁式（大型）、地錨式、加勁土壁。現場勘查：牆體裂縫（位置/寬度/型態）、傾斜量、差異沉陷、排水孔狀況、牆背排水、基礎掏空、坡面植生、近期降雨地震。",
d:`<h4>一、擋土牆類型</h4><table><tr><th>類型</th><th>穩定機制</th><th>適用</th></tr><tr><td><b>重力式</b></td><td>靠自身重量對抗傾覆與滑動</td><td>牆高&lt;5m，就地取材方便；代表：混凝土重力牆、漿砌石牆、石籠牆</td></tr><tr><td><b>懸臂式（非重力）</b></td><td>RC底版靠上方土重產生抵抗力矩</td><td>牆高5~8m，需精確結構計算</td></tr><tr><td><b>扶壁式（非重力）</b></td><td>懸臂式加設垂直扶壁增加剛性</td><td>牆高&gt;8m，大型擋土工程</td></tr><tr><td><b>地錨式（非重力）</b></td><td>錨桿拉力抵抗土壓</td><td>空間受限無法放大基礎、深開挖</td></tr><tr><td><b>加勁土壁（非重力）</b></td><td>土體內加入土工格柵形成複合體</td><td>高牆、需快速施工</td></tr></table><h4>二、現場勘查紀錄項目</h4><ul><li><b>牆體結構：</b>裂縫位置、走向、寬度（mm）、是否持續發展；牆面傾斜量；差異沉陷；混凝土剝落、鋼筋外露</li><li><b>排水系統：</b>排水孔是否阻塞；牆背排水層功能；地表逕流是否集中灌入牆背</li><li><b>基礎與坡腳：</b>基礎掏空（Undercut）；坡腳隆起（Heave）</li><li><b>環境因素：</b>近期降雨量（是否超設計標準）；地震記錄；人為增加載重</li></ul>`},
{yr:"114",sub:"水土保持工程",type:"orig",n:"114w2",pts:20,
q:"道路縱坡度長度限制公式L≤40/(G-3.3)⁴，今有（100m、6%）、（100m、7%）兩段，再銜接5%農路，其長度應為多少？並依農路設計規範說明各級農路避車道配置。",
s:"6%段最大允許長度=40/(6-3.3)^4=0.753m；7%段=40/(7-3.3)^4=0.213m。消耗當量：6%段100/0.753=132.8；7%段100/0.213=469.5，共602.3。5%段最大長度=40/(5-3.3)^4=4.79m，遠超限制，需插設緩坡段。避車道：30km/h→400m；20km/h→300m；10km/h→150m，寬2.5m×長20m。",
d:`<h4>坡度長度限制計算</h4><div class="fm">L_limit = 40/(G-3.3)⁴（G為縱坡度%，G>3.3%時適用）</div>6%：L_limit=40/(2.7)^4=40/53.14=<b>0.753m</b>；消耗當量=100/0.753=132.8<br>7%：L_limit=40/(3.7)^4=40/187.4=<b>0.213m</b>；消耗當量=100/0.213=469.5<br>已消耗總量=132.8+469.5=<b>602.3</b><br><br>5%段：L_limit=40/(1.7)^4=40/8.35=<b>4.79m</b><div class="note"><b>結論：</b>6%、7%兩段已超過設計限制，5%段接續時長度受限極短。需在6%或7%段間插入緩坡段（坡度≤3.3%，稱「休止段」）後，方可再接坡道。</div><h4>農路避車道規定</h4><table><tr><th>農路級別</th><th>設計速度</th><th>最大間隔</th><th>寬度</th><th>長度</th></tr><tr><td>一級農路</td><td>30 km/h</td><td>400 m</td><td>2.5 m</td><td>20 m</td></tr><tr><td>二級農路</td><td>20 km/h</td><td>300 m</td><td>2.5 m</td><td>20 m</td></tr><tr><td>三級農路</td><td>10 km/h</td><td>150 m</td><td>2.5 m</td><td>20 m</td></tr></table>`},
{yr:"114",sub:"水土保持工程",type:"orig",n:"114w3",pts:20,
q:"颱風豪雨後大量土砂入流野溪造成淤積與堰塞，相關清疏作業分為清淤與疏通，請說明可行水土保持工程手段及相關處理對策。",
s:"清淤：機械清淤（怪手+砂石車）、水力沖淤（開底閘門）、爆破清除（硬化堰塞體）。疏通：導水管疏通、開鑿溢流缺口（控制洩流速度）、隧道繞道。後續：透過型攔砂壩（格柵壩）防再淤積、固床工穩定溪床、定期清疏計畫、預警系統。",
d:`<h4>一、清淤作業（Dredging）</h4><ul><li><b>機械清淤：</b>以怪手直接挖取淤積土砂，配合砂石車外運。適用於有施工便道的野溪段。</li><li><b>水力沖淤（Sluicing）：</b>開放攔砂壩底部閘門，利用蓄水水頭沖刷淤積砂石下游輸送。</li><li><b>爆破清除：</b>對硬化或膠結的堰塞體，以炸藥爆破後機械清除。</li></ul><h4>二、疏通作業（Channelization）</h4><ul><li><b>導水管疏通：</b>在堰塞體埋設鋼管小流量緩慢洩流，降低水位後再大規模清除。</li><li><b>開鑿溢流缺口：</b>在堰塞體頂部開鑿缺口，控制疏流速度，防瞬間大量下洩危害下游。</li><li><b>隧道繞道：</b>在旁邊山坡開鑿短隧道繞過堰塞體排水，適用大型堰塞湖緊急處置。</li></ul><h4>三、後續防治對策</h4><table><tr><th>對策</th><th>工程手段</th></tr><tr><td>防止再淤積</td><td>透過型攔砂壩（格柵壩、縫隙壩），攔粗礫允許一般泥砂通過</td></tr><tr><td>穩定溪床</td><td>固床工（系列跌水），防止溪床下切造成側壁再次崩塌供砂</td></tr><tr><td>定期維護</td><td>每年汛前清查淤積量，維持攔砂壩有效庫容</td></tr><tr><td>預警系統</td><td>雨量計+地聲感測器，避免清疏施工期間發生二次土石流危害</td></tr></table>`},
{yr:"114",sub:"水土保持工程",type:"orig",n:"114w4",pts:15,
q:"野溪曲流地形成因說明，曲流半徑30m長40m寬10m，岩層出露於何側？並選用護岸與固床工各一工法進行治理，說明最有利於魚蝦棲地與岸坡植被的配置理由。",
s:"曲流成因：水流慣性偏向凹岸（離心力），凹岸侵蝕、凸岸堆積，循環擴大。岩層出露於凹岸（侵蝕側），凸岸為砂礫堆積。護岸選乾砌石（透水、石縫提供魚蝦棲地）；固床工選踏步式（多級小跌水，深潭提供棲息空間，落差小可魚類迴游）。",
d:`<h4>一、曲流地形成因</h4><ul><li>水流進入彎道時，受<b>離心力</b>影響，主流偏向外側（凹岸），流速快剪切力大，持續侵蝕凹岸。</li><li>受橫向環流（螺旋流）作用，底部水流由凹岸流向凸岸，泥沙在凸岸堆積（點砂洲）。</li></ul><h4>二、岩層出露位置</h4>岩層出露於<b>凹岸（外彎側）</b>。<br>原因：凹岸長期受主流沖蝕，鬆軟土層優先被移除，底層堅硬岩盤裸露；凸岸為砂礫堆積，不會有岩層出露。<h4>三、護岸與固床工選擇（兼顧生態）</h4><table><tr><th>類型</th><th>選用工法</th><th>理由</th></tr><tr><td>護岸</td><td><b>乾砌石護岸</b></td><td>石塊間縫隙提供魚蝦藏匿與產卵棲地；透水性佳，維持岸坡地下水交換，有利水柳等植物生長</td></tr><tr><td>固床工</td><td><b>踏步式固床工（複式）</b></td><td>多級小跌水設計，各踏步間形成深潭（Pool），提供魚蝦棲息空間；落差小（&lt;0.5m/級），魚類可逆游通過（具魚道功能）</td></tr></table>`},
// ═══ 水土保持規劃設計 ═══
{yr:"111",sub:"水土保持規劃設計",type:"orig",n:"111p1",pts:25,
q:"溪岸土體崩塌是野溪常見災害。試述溪岸發生土體崩塌之原因，以及其治理規劃原則？",
s:"原因：洪水沖蝕坡腳（移除支撐，最主要）、地下水位上升（孔隙水壓增大）、乾濕循環裂縫、植生喪失、地震觸發。治理原則：治水先治坡（先固床再護岸）、由上游至下游規劃、排水設計（降低地下水位）、適地選工法（硬式/生態）、植生復育。",
d:`<h4>一、溪岸土體崩塌成因</h4><table><tr><th>成因</th><th>說明</th></tr><tr><td><b>水力侵蝕（最主要）</b></td><td>洪水高流速直接沖刷坡腳，移除坡腳支撐力（toe erosion），上方土體失去支撐而崩塌</td></tr><tr><td>地下水壓升高</td><td>降雨入滲→地下水位上升→孔隙水壓u增大→有效應力σ'=σ-u降低→剪力強度降低→FS下降</td></tr><tr><td>乾濕循環裂縫</td><td>枯水期乾燥收縮形成裂縫，降雨時雨水快速滲入，產生水壓</td></tr><tr><td>植生喪失</td><td>河岸植物根系失去後，根系加固力消失，土體凝聚力降低</td></tr><tr><td>地震觸發</td><td>地震慣性力及土體液化，是台灣重要觸發因子</td></tr></table><h4>二、治理規劃原則</h4><ul><li><b>治水先治坡：</b>先設固床工穩定溪床，再護岸，否則護岸持續被掏空失效</li><li><b>由上游至下游規劃：</b>先治上游攔砂，穩定輸砂量後再維護下游護岸</li><li><b>排水設計：</b>設地面與地下排水，降低地下水位，減少孔隙水壓</li><li><b>適地適工：</b>重要設施旁→硬式護岸；生態敏感區→生態工法（木樁、拋石、植生）</li><li><b>植生復育：</b>護岸穩定後儘速植生，以多層次植被建立永久防護</li></ul>`},
{yr:"111",sub:"水土保持規劃設計",type:"orig",n:"111p2",pts:25,
q:"農塘50年重現期入流64 cms，孔口出流29 cms，圓形孔口直徑3.0m。計算(一)農塘所需滯洪量；(二)圓形孔口有效水深。",
s:"(一)滯洪量：ΔQ=35cms，以三角形法（假設tc=2hr）估算，滯洪量≈ΔQ×tp/2=35×7200/2=126,000m³（詳細需Modified Puls演算）。(二)孔口水深：Q=Cd×A×√(2gh)；29=0.62×7.069×√(19.62h)→h≈2.23m（孔口中心以上有效水深）。",
d:`<h4>（一）農塘所需滯洪量</h4>Qin=64 cms，Qout=29 cms，ΔQ=35 cms<br>三角形法估算（假設洪水延時8hr）：<br>入流體積=½×64×8×3600=921,600 m³<br>出流體積=29×8×3600=835,200 m³<div class="fm">滯洪量 Vs ≈ 921,600-835,200 ≈ 86,400 m³（三角形法粗估）</div><div class="note">精確值需用Modified Puls洪水演算法計算。</div><h4>（二）圓形孔口有效水深</h4><div class="fm">Q = Cd × A × √(2gh)</div>A=π/4×3²=7.069 m²；Cd=0.62；g=9.81 m/s²<br>29=0.62×7.069×√(19.62h)<br>29=4.383×√(19.62h)<br>√(19.62h)=6.617 → 19.62h=43.78<div class="fm">h = 43.78/19.62 = <b>2.23 m</b>（孔口中心以上有效水深）</div>孔口頂部以上水深=2.23-1.5=0.73m（孔口半徑r=1.5m）。`},
{yr:"111",sub:"水土保持規劃設計",type:"orig",n:"111p3",pts:25,
q:"渠道兩岸及底床因材質不同而有不同的粗糙係數。已知梯形渠道（底寬8.0m、邊坡1:0.5、水深2.5m）綜合粗糙係數n=0.023，兩岸邊壁n=0.014，試計算底床粗糙係數。",
s:"兩岸邊壁各濕周=2.5×√(1+0.25)=2.795m；底床=8.0m；總濕周=13.59m。以Horton法：n³/²_composite×P=Σni³/²×Pi；解出n_bottom≈0.028。",
d:`<h4>一、梯形渠道幾何計算</h4>底寬b=8.0m；水深y=2.5m；邊坡z=0.5<br>邊坡長=y×√(1+z²)=2.5×√1.25=2.795m（單側）<br>各分區濕周：左岸=2.795m；右岸=2.795m；底床=8.0m；<b>總濕周P=13.59m</b><h4>二、Horton複合粗糙係數公式</h4><div class="fm">n_composite = [(Σni^1.5 × Pi) / P]^(2/3)</div>已知：n_composite=0.023；n_left=n_right=0.014；n_bottom=?<br><br>0.023^(3/2)=0.003489；0.014^(3/2)=0.001656<br><br>左邊：0.003489×13.59=0.04742<br>已知項：0.001656×2.795×2=0.009257<br>0.04742=0.009257+n_b^1.5×8.0<br>n_b^1.5=(0.04742-0.009257)/8.0=0.004770<div class="fm">n_bottom = 0.004770^(2/3) ≈ <b>0.0283</b></div><div class="note">底床n≈0.028 > 邊壁n=0.014，合理（底床通常較粗糙，有礫石或不規則底床）。</div>`},
{yr:"111",sub:"水土保持規劃設計",type:"orig",n:"111p4",pts:25,
q:"試舉出土石流潛勢溪流治理之計畫土砂量及其相應治理措施？同時，各土砂量間之關係為何？",
s:"計畫土砂量分為：計畫崩塌土砂量（Vs）→計畫流出土砂量/到達量（Vd）→計畫攔截土砂量（Vc）→計畫排出土砂量（Vout）。關係：Vd=Vc+Vout。相應措施：Vs→崩塌地復育；Vc→攔砂壩；Vout→導流堤+沉砂池。",
d:`<h4>一、計畫土砂量定義與關係</h4><table><tr><th>土砂量</th><th>定義</th><th>計算方式</th></tr><tr><td><b>計畫崩塌土砂量 Vs</b></td><td>設計降雨條件下，集水區可能崩塌進入溪道的總土砂量</td><td>航照判釋崩塌面積×深度</td></tr><tr><td><b>計畫流出土砂量 Vd</b></td><td>土石流到達沖積扇頂（規劃線）的土砂量</td><td>Vd=Vs×到達率（依坡度與流動距離）</td></tr><tr><td><b>計畫攔截土砂量 Vc</b></td><td>攔砂壩群等可攔截的土砂量</td><td>攔砂壩有效庫容總和</td></tr><tr><td><b>計畫排出土砂量 Vout</b></td><td>允許排出至沖積扇的土砂量</td><td>Vout=Vd-Vc</td></tr></table><div class="fm">Vd = Vc + Vout（到達量 = 攔截量 + 排出量）</div><h4>二、各土砂量對應治理措施</h4><ul><li><b>減少Vs：</b>崩塌地植生復育、護坡工程（從源頭減少土砂）</li><li><b>增加Vc：</b>攔砂壩群（透過型或不透過型）、固床工</li><li><b>管控Vout：</b>導流堤（引導方向）、沉砂池（攔截細砂）、沖積扇整備</li></ul>`},
{yr:"112",sub:"水土保持規劃設計",type:"orig",n:"112p1",pts:25,
q:"請詳述野溪進行河床質調查的方法及繪製之圖示？又請問其調查之目的為何？",
s:"方法：(1)沃爾曼鵝卵石計數法（Wolman Pebble Count，最常用，隨機取100顆以上量測中間軸直徑b軸）；(2)方格採樣法；(3)面積採樣法；(4)輸砂鉗採樣（床載）。圖示：半對數粒徑分布曲線（x=粒徑mm對數軸，y=累積通過百分率%）。目的：設計固床工/護岸、評估河道穩定性（沖淤趨勢）、攔砂壩設計、生態棲地評估。",
d:`<h4>一、河床質調查方法</h4><ul><li><b>沃爾曼鵝卵石計數法（最常用）：</b>調查人員沿河床穿越線行走，每隔固定步距隨機以腳尖踢起一顆礫石，量測其<b>中間軸（b軸）直徑</b>（mm），至少取100顆以上樣本，繪製粒徑分布曲線。</li><li><b>方格採樣法：</b>在河床劃設方格網，每格取代表性樣本，適用需精確空間分布的調查。</li><li><b>面積採樣法：</b>在固定面積（1m²）內蒐集所有礫石，適用小粒徑床質。</li><li><b>輸砂採樣：</b>Helley-Smith採樣器採集床載，配合流量計算輸砂率。</li></ul><h4>二、粒徑分布曲線（半對數曲線）</h4>橫軸：粒徑（mm），對數刻度；縱軸：累積通過百分率（%）。<br>重要特徵值：D₅₀（中值粒徑）、D₈₄（84%通過）、D₁₆（16%通過）；σg=√(D₈₄/D₁₆)（幾何標準差，反映均一性）<h4>三、調查目的</h4><ul><li><b>設計固床工、護岸：</b>以D₅₀、D₈₄計算河床起動流速與臨界剪切力</li><li><b>評估河道穩定性：</b>比較歷年D₅₀變化，判斷沖淤趨勢</li><li><b>攔砂壩設計：</b>確定需攔截粒徑範圍，設計壩體缺口大小</li><li><b>生態棲地評估：</b>D₅₀>60mm的礫石底質為魚類重要產卵棲地</li></ul>`},
{yr:"112",sub:"水土保持規劃設計",type:"orig",n:"112p2",pts:25,
q:"請詳述並對應說明何謂水土保持處理與維護的技師簽證規定？又其簽證的種類及規模為何？",
s:"依《水土保持法》§17及《技師法》，水土保持計畫之規劃設計及施工監造需由合格技師簽證。簽證種類：(1)規劃設計簽證（送審前）；(2)施工監造簽證（施工期間）；(3)竣工查驗簽證（完工後）。簽證技師：水土保持/大地工程/土木/水利工程技師。面積較小者可提簡易水土保持申報書免簽證。",
d:`<h4>一、法規依據</h4><ul><li>《水土保持法》第17條：水土保持計畫應由依法登記執業之技師規劃設計及監造</li><li>《技師法》：技師執行業務範圍及簽證義務</li></ul><h4>二、簽證種類</h4><table><tr><th>簽證類別</th><th>時機</th><th>內容</th></tr><tr><td><b>規劃設計簽證</b></td><td>送審前</td><td>對計畫書圖（水文計算、設施設計圖、土方計算）進行簽證，確認符合技術規範</td></tr><tr><td><b>施工監造簽證</b></td><td>施工期間</td><td>定期赴工地監督施工品質，確認符合設計圖說；重要工項完成後出具監造報告</td></tr><tr><td><b>竣工查驗簽證</b></td><td>完工後</td><td>確認各水保設施均依圖完成，出具竣工報告供主管機關查驗</td></tr></table><h4>三、可簽證技師類別與規模對應</h4><table><tr><th>規模</th><th>可簽證技師</th></tr><tr><td>一般水保計畫</td><td>水土保持技師、大地工程技師、土木工程技師、水利工程技師</td></tr><tr><td>較大規模或特殊工程</td><td>應由水土保持技師主責，或由各專業技師聯合簽證</td></tr><tr><td>簡易水保申報書（面積較小）</td><td>免技師簽證，由義務人自行申報</td></tr></table>`},
{yr:"112",sub:"水土保持規劃設計",type:"orig",n:"112p3",pts:25,
q:"請說明水土保持計畫審核期限的規定為何？為何往往提送後要三至六個月才會核定？核定後多久時間一定要申報開工？",
s:"審核期限：受理完整計畫起60日內完成審核（不計補件時間）。實際需3~6個月原因：退件補正次數多（送件品質參差）、主管機關人力不足、現地勘查排程、跨機關會辦（林管處等）。核定後申報開工：1年內申報開工，逾期計畫失效，有正當理由可申請展期（最多1年）。",
d:`<h4>一、審核期限規定</h4>依《水土保持計畫審核監督辦法》第7條：<br>主管機關應自受理<b>完整計畫</b>之日起<b>60日</b>內完成審核。<br>關鍵：「完整計畫」——若資料不齊需補正，補正期間<b>不計入60日</b>審核期限。<h4>二、實際需3~6個月的原因</h4><ul><li><b>補件退件多次：</b>業者送件品質不一，常因資料不完整、計算錯誤而退件，每次來回耗時2~4週</li><li><b>現地勘查排程：</b>需協調技師、義務人、相關機關時間，排程需3~4週</li><li><b>跨機關會辦：</b>涉及國有林地等需會辦林務局，各機關回覆通常14~30日</li><li><b>主管機關人力不足：</b>縣市政府水保審查人力有限，案量多時積壓嚴重</li></ul><h4>三、核定後申報開工期限</h4><ul><li>應自核定日起<b>1年內</b>向主管機關申報開工</li><li>逾期未申報→計畫核定失效，需重新申請</li><li>有正當理由可在期限前申請展期（最多再延<b>1年</b>）</li></ul>`},
{yr:"112",sub:"水土保持規劃設計",type:"orig",n:"112p4",pts:25,
q:"某集水區面積15公頃，集流時間15分鐘，開發前/中/後逕流係數0.75/1.00/0.95，各重現期暴雨量如題（10年355mm/day，25年417mm/day），計算所需臨時與永久滯洪量體。",
s:"臨時（10年）：Qbefore=0.75×i₁₀×15/360；Qduring=1.00×i₁₀×15/360；以合理化公式計算ΔQ，再以三角形法估算Vs_臨。永久（25年）：Qafter=0.95×i₂₅×15/360；ΔQ=Qafter-Qbefore；Vs_永=ΔQ×tc/2。（i值需由題目暴雨量換算15min雨強）",
d:`<h4>一、設計重現期選用</h4>臨時滯洪設施（施工中）取<b>10年重現期</b>；永久滯洪設施（完工後）取<b>25年重現期</b>。<h4>二、雨強換算</h4>由一日暴雨量換算15min雨強（以IDF曲線），此題設：<br>10年/15min雨強 i₁₀ ≈ 80 mm/hr；25年/15min雨強 i₂₅ ≈ 95 mm/hr（以台灣中部地區IDF典型值估算）<h4>三、洪峰流量計算（Q=CiA/360，A=15ha）</h4><div class="fm">臨時（i=80mm/hr）：Q前=0.75×80×15/360=2.50 cms；Q中=1.00×80×15/360=3.33 cms</div><div class="fm">永久（i=95mm/hr）：Q前=0.75×95×15/360=2.97 cms；Q後=0.95×95×15/360=3.76 cms</div><h4>四、滯洪量估算（三角形法，tp=tc=15min=900s）</h4><div class="fm">Vs_臨 = ΔQ×tp/2 = (3.33-2.50)×900/2 ≈ 374 m³</div><div class="fm">Vs_永 = ΔQ×tp/2 = (3.76-2.97)×900/2 ≈ 356 m³</div><div class="note">注意：實際設計需以Modified Puls洪水演算法精確計算；i值應以工址鄰近氣象站IDF曲線查取。</div>`},
{yr:"113",sub:"水土保持規劃設計",type:"orig",n:"113p1",pts:25,
q:"為減輕公共工程對生態環境造成之負面影響，進行工程生態檢核工作，請說明生態檢核之生態保育策略。",
s:"生態保育策略四層次（Mitigation Hierarchy）：迴避（Avoid）→縮小（Minimize）→減輕（Mitigate）→補償（Compensate）。生態檢核在規劃設計、施工、維護三階段執行，以科學調查為基礎，確保公共工程對生態的淨正面效益。",
d:`<h4>台灣工程生態檢核制度</h4>行政院108年推動「公共工程生態檢核機制」，要求各階段納入生態保育策略。<h4>生態保育四層次策略</h4><table><tr><th>層次</th><th>策略</th><th>水保工程案例</th></tr><tr><td><b>第1層：迴避（Avoid）</b></td><td>從規劃階段調整位置或設計，完全避免影響敏感生態；優先選項</td><td>護岸路線繞開魚蝦產卵棲地；治理工程避開稀有動植物棲息地</td></tr><tr><td><b>第2層：縮小（Minimize）</b></td><td>縮小施工範圍、縮短工期、減少擾動面積</td><td>施工圍籬框定最小作業範圍；避開魚類繁殖季（3~6月）施工</td></tr><tr><td><b>第3層：減輕（Mitigate）</b></td><td>採用對生態友善的工法或材料</td><td>乾砌石或植生護岸取代全混凝土；踏步型固床工兼顧魚道</td></tr><tr><td><b>第4層：補償（Compensate）</b></td><td>無法避免的損失，以更大生態效益在其他地點補償</td><td>異地植生造林（面積≥受損面積）；設置人工魚礁</td></tr></table><h4>三階段生態檢核執行</h4><ul><li><b>規劃設計：</b>生態資料調查、敏感區位確認、替代方案比較、友善設計納入圖說</li><li><b>施工：</b>生態監測人員現場駐守、施工人員教育訓練</li><li><b>維護管理：</b>定期監測生態回復狀況、必要時補植或棲地補充</li></ul>`},
{yr:"113",sub:"水土保持規劃設計",type:"orig",n:"113p2",pts:25,
q:"農塘規劃設計時，其灌溉水量如何決定。",
s:"步驟：(1)確認作物種類與面積；(2)計算作物蒸發散量ET_c=K_c×ET_0（作物係數×Penman-Monteith公式）；(3)計算有效降雨量Pe=α×P；(4)淨灌溉需水量NIR=ET_c-Pe；(5)總灌溉需水量GIR=NIR/E_i（灌溉效率）；(6)設計農塘容量≥最不利年（乾旱年）灌溉需求。",
d:`<h4>灌溉需水量計算步驟</h4><b>Step 1</b> 確認作物種類與面積（水稻>旱作>果樹，面積以ha計）<br><b>Step 2</b> 計算作物蒸發散量：<div class="fm">ET_c = K_c × ET_0</div>ET_0：Penman-Monteith公式（由溫度、輻射、風速、濕度計算）；K_c：作物係數（台灣水稻≈1.0~1.3；蔬菜≈0.7~1.0）<br><b>Step 3</b> 計算有效降雨量：<div class="fm">Pe = α × P（P=月降雨量，α=0.7~0.85）</div><b>Step 4</b> 淨灌溉需水量：<div class="fm">NIR = ET_c - Pe（若ET_c > Pe則需灌溉）</div><b>Step 5</b> 總灌溉需水量：<div class="fm">GIR = NIR / E_i（灌溉效率：滴灌≈0.85~0.95；漫灌≈0.5~0.65）</div><b>Step 6</b> 設計農塘容量：<div class="fm">農塘有效容量 ≥ Σ月灌溉需水量（以75%保證率/25年一遇乾旱年為基準）</div><div class="note">農塘容量設計需同時扣除蒸發損失（水面蒸發×面積）及滲漏損失，並確認補注水量（集水面積×逕流）足夠。</div>`},
{yr:"113",sub:"水土保持規劃設計",type:"orig",n:"113p3",pts:25,
q:"請就水土保持技術規範，說明水土保持計畫中沉砂設施容量設計原則。",
s:"沉砂設施容量設計：(1)計畫沉砂量=裸露面積×侵蝕率×工程期（或取100m³/ha估算）；(2)有效容量≥計畫沉砂量；(3)水面積=Q/vs（vs依Stokes定律，目標粒徑≥0.02mm）；(4)有效水深1~2m；(5)安全係數×1.5~2.0；(6)淤積達1/2容量即清除；(7)開發面積≥1公頃必設。",
d:`<h4>一、計畫沉砂量估算</h4><div class="fm">Vs = A_裸露 × E_r × T（E_r=年侵蝕率，T=工程期）</div>簡化法：各裸露面積×100m³/ha（台灣規範初估基準）<h4>二、有效容量要求</h4><div class="fm">沉砂設施有效容量 V_eff ≥ 計畫沉砂量 V_s</div><h4>三、水面積計算</h4><div class="fm">A_池 = Q / vs（Q=設計流量，vs=目標粒徑沉降速度）</div>台灣規範要求去除粒徑≥<b>0.02mm</b>（細砂/粉砂）的顆粒，vs依Stokes定律計算（約0.3~0.5mm/s）<h4>四、設計附屬規定</h4><table><tr><th>規定項目</th><th>標準</th></tr><tr><td>有效水深</td><td>1.0~2.0 m</td></tr><tr><td>安全係數</td><td>計算值×1.5~2.0倍（因應短路流效率損失）</td></tr><tr><td>清淤規定</td><td>淤積量達有效容量1/2時即須清除</td></tr><tr><td>入出口設計</td><td>入口設擋板（baffle）使水流均勻分散；出口設溢流堰</td></tr><tr><td>設置門檻</td><td>開發面積≥<b>1公頃</b>之水土保持計畫必須設置</td></tr></table>`},
{yr:"113",sub:"水土保持規劃設計",type:"orig",n:"113p4",pts:25,
q:"農塘平均水面1.5 ha、堤頂101.10m、降雨前水面100.03m，5天降雨：流入1.0cms、流出1.1cms、降雨450cm、蒸發60cm。分析農塘是否有改善需求。",
s:"5天=432,000s；水面=15,000m²。入流+432,000m³；出流-475,200m³；降雨+67,500m³；蒸發-9,000m³；ΔV=+15,300m³。水位上升=15,300/15,000=1.02m；5天後水位=101.05m。距堤頂僅0.05m＜規範要求0.3m超高，需改善。",
d:`<h4>水平衡計算（5天=432,000秒）</h4><table><tr><th>項目</th><th>計算</th><th>水量（m³）</th></tr><tr><td>流入</td><td>1.0×432,000</td><td>+432,000</td></tr><tr><td>流出</td><td>1.1×432,000</td><td>-475,200</td></tr><tr><td>降雨（450cm=4.5m）</td><td>4.5×15,000</td><td>+67,500</td></tr><tr><td>蒸發（60cm=0.6m）</td><td>0.6×15,000</td><td>-9,000</td></tr><tr><td><b>淨水量 ΔV</b></td><td>432,000-475,200+67,500-9,000</td><td><b>+15,300 m³</b></td></tr></table><div class="fm">水位上升 Δh = 15,300/15,000 = 1.02 m</div><div class="fm">5天後水位 = 100.03+1.02 = 101.05 m</div><h4>判斷是否需要改善</h4>堤頂高程101.10m；5天後水位101.05m；超高=0.05m<div class="note"><b>結論：超高僅0.05m＜規範要求0.3m，需改善。</b><br>改善方向：①提高堤頂至101.35m以上（加高0.25m）；②增設或擴大溢洪道（增加出流量）；③增加農塘庫容（擴大面積或加深）。</div>`},
{yr:"114",sub:"水土保持規劃設計",type:"orig",n:"114p1",pts:25,
q:"請詳述進行地質鑽探時，鑽孔數量及配置原則。",
s:"數量：依工址面積、地質複雜度與工程規模，一般間距20~50m設一孔，複雜地質加密至10~20m，最少3孔。配置：橫切地質走向、涵蓋工址四角與中心、沿邊坡上中下各設、穿越滑動面至穩定岩盤≥5m、必要時設傾斜孔。",
d:`<h4>一、鑽孔數量</h4><table><tr><th>工程類別</th><th>建議間距</th><th>最少孔數</th></tr><tr><td>一般道路、排水</td><td>50~100 m</td><td>3孔</td></tr><tr><td>擋土牆、護岸</td><td>20~50 m</td><td>3孔</td></tr><tr><td>崩塌地穩定</td><td>依崩塌範圍</td><td>3~5孔</td></tr><tr><td>大型滯洪池或壩體</td><td>15~30 m</td><td>5孔以上</td></tr><tr><td>地質複雜（斷層帶）</td><td>加密10~20 m</td><td>依需要增加</td></tr></table><h4>二、鑽孔配置原則</h4><ul><li><b>橫切地質走向：</b>垂直於主要地層走向或斷層方向，能有效揭露地層序列</li><li><b>涵蓋工址四角及中心：</b>掌握整體地質空間變化，確認是否有局部軟弱帶</li><li><b>沿邊坡上中下各設：</b>崩塌地需在坡頂（發生區）、坡中（滑動面）、坡腳（堆積區）各設鑽孔</li><li><b>深度要求：</b>必須穿越預計滑動面，並深入穩定岩盤至少5m</li><li><b>傾斜孔：</b>當滑動面傾斜，垂直孔無法有效穿越時採傾斜鑽孔</li></ul><h4>三、鑽孔配套項目</h4><ul><li>SPT（標準貫入試驗）：每1.5m一次，了解土層強度</li><li>岩心採取與RQD：岩石品質指標</li><li>孔隙水壓計、傾斜管：安裝後長期監測</li><li>Lugeon試驗或落水頭試驗：取得滲透係數</li></ul>`},
{yr:"114",sub:"水土保持規劃設計",type:"orig",n:"114p2",pts:25,
q:"於圖1中標示深度z處之朗金主動土壓力，並推導朗金主動土壓力係數Ka=(1-sinφ')/(1+sinφ')=tan²(45-φ'/2)。",
s:"深度z處：σ'₀=γz（大主應力），σ'ₕ=Ka×γz（小主應力）。Mohr圓與破壞包絡線相切：sinφ'=(σ'₀-σ'ₕ)/(σ'₀+σ'ₕ)=(1-Ka)/(1+Ka)。解出Ka=(1-sinφ')/(1+sinφ')。再以半角公式（1-sinφ')/(1+sinφ')=(cosφ/2-sinφ/2)²/(cosφ/2+sinφ/2)²=tan²(45-φ'/2)。（完整推導如詳細解答）",
d:`<h4>一、深度z處的應力狀態</h4><ul><li>垂直有效應力（大主應力）：σ'₀=γz</li><li>水平有效應力（小主應力）：σ'ₕ=Ka×γz</li><li>主動狀態：牆向外移動，側向土壓力降至最小</li></ul><h4>二、推導Ka</h4>Mohr圓與Mohr-Coulomb破壞包絡線相切：<div class="fm">sin φ' = (σ'₀-σ'ₕ)/(σ'₀+σ'ₕ)</div>代入 σ'ₕ=Ka×σ'₀：<div class="fm">sin φ' = (1-Ka)/(1+Ka)</div>解出Ka：sin φ'×(1+Ka)=1-Ka → Ka(1+sinφ')=1-sinφ'<div class="fm">Ka = (1-sinφ')/(1+sinφ') ——①</div><h4>三、證明等於 tan²(45°-φ'/2)</h4>利用半角公式：<div class="fm">1-sinφ' = (cos(φ'/2)-sin(φ'/2))²</div><div class="fm">1+sinφ' = (cos(φ'/2)+sin(φ'/2))²</div>代入①：<div class="fm">Ka = [(cos(φ'/2)-sin(φ'/2))/(cos(φ'/2)+sin(φ'/2))]²</div>分子分母除以cos²(φ'/2)，利用 tan(45°-φ'/2)=(1-tanφ'/2)/(1+tanφ'/2)：<div class="fm"><b>Ka = tan²(45°-φ'/2) ——（證畢）</b></div>`},
{yr:"114",sub:"水土保持規劃設計",type:"orig",n:"114p3",pts:25,
q:"邊坡穩定若依據區位（坡頂、坡面和坡腳）進行處理時，請詳述各區位可採用的適當工法之內容。",
s:"坡頂：截水溝（攔截外來逕流）、卸坡（削方減驅動力）、裂縫填補、預力地錨。坡面：格框護坡、植生工程、噴漿護坡+錨釘、水平排水孔（最有效）、階段整坡。坡腳：擋土牆、護岸（最重要，防坡腳被掏空）、反壓填築、排樁。整合原則：坡頂截水→坡面排水+固坡→坡腳支撐，排水工程優先。",
d:`<table><tr><th>區位</th><th>問題特性</th><th>工法</th><th>說明</th></tr><tr><td rowspan="3"><b>坡頂</b></td><td rowspan="3">附加荷載與地表水入滲增加驅動力</td><td>截水溝</td><td>設於坡頂3~5m外，攔截外來逕流，防止滲入坡體增加孔隙水壓</td></tr><tr><td>卸坡（削方）</td><td>移除坡頂不穩定土體，減少驅動力矩</td></tr><tr><td>預力地錨</td><td>向下傾斜施設，增加正向力，適用深層滑動面</td></tr><tr><td rowspan="4"><b>坡面</b></td><td rowspan="4">表面防護：雨水沖蝕、淺層崩落</td><td>格框護坡</td><td>RC格框在坡面，格框內植生或填礫石，可加設錨桿</td></tr><tr><td>植生工程</td><td>噴植草種，根系固持表層土壤，適合坡度&lt;55°</td></tr><tr><td>噴漿護坡+錨釘</td><td>岩石或破碎坡面，噴覆混凝土10~20cm，防風化剝落</td></tr><tr><td><b>水平排水孔（最有效）</b></td><td>排除坡體地下水，降低孔隙水壓，是坡面穩定最有效手段</td></tr><tr><td rowspan="3"><b>坡腳</b></td><td rowspan="3">移除支撐（最危險）：溪流沖蝕、開挖掏空</td><td>護岸工程</td><td>防止溪流沖蝕坡腳（最常見失穩原因），優先採生態護岸</td></tr><tr><td>擋土牆</td><td>設於坡腳，提供被動抵抗力；依牆高選重力式或懸臂式</td></tr><tr><td>反壓填築</td><td>坡腳外側填土增重，提供被動抵抗力矩，適合緊急處置</td></tr></table><div class="note"><b>整合原則：</b>「坡頂截水→坡面排水+固坡→坡腳支撐」順序規劃；排水工程優先於支撐工程，降低孔隙水壓是最根本穩定手段。</div>`},
{yr:"114",sub:"水土保持規劃設計",type:"orig",n:"114p4",pts:25,
q:"請詳述以合理化公式規劃設計滯洪池的設計流程。",
s:"設計流程：①計算開發前Qbefore（合理化公式）→②計算開發後Qafter（C增大、tc縮短）→③確認需削減量ΔQ→④初估滯洪量（三角形法）→⑤選出口設施型式→⑥建立水位-出流關係→⑦Modified Puls洪水演算驗證→⑧設計池體與緊急溢洪道→⑨安全檢核。",
d:`<h4>完整設計流程（9步驟）</h4><b>Step 1：</b>計算開發前洪峰 <div class="fm">Qbefore = C_before × i × A / 360</div><b>Step 2：</b>計算開發後洪峰（C增大、tc縮短→雨強i'增大）<div class="fm">Qafter = C_after × i' × A / 360</div><b>Step 3：</b>確認滯洪目標：目標出流量Qout≤Qbefore；需削減量ΔQ=Qafter-Qbefore<br><b>Step 4：</b>初估滯洪量（三角形法）：<div class="fm">Vs（初估）≈ ΔQ × tp / 2（tp≈tc）</div><b>Step 5：</b>選出口設施：<table><tr><th>型式</th><th>特點</th></tr><tr><td>圓形孔口</td><td>出流穩定，設計簡單，最常用</td></tr><tr><td>矩形堰</td><td>出流量較大</td></tr><tr><td>立管（Riser）</td><td>兼具小流量孔口+大流量堰雙功能</td></tr></table><b>Step 6：</b>建立水位-出流關係（Rating curve）：<div class="fm">孔口：Q=Cd×A×√(2gh)；矩形堰：Q=(2/3)Cd×L×√(2g)×H^(3/2)</div><b>Step 7：</b>Modified Puls洪水演算驗證→確認最大出流量≤Qbefore<br><b>Step 8：</b>設計池體（平面面積、有效水深1.5~3m、緊急溢洪道）<br><b>Step 9：</b>安全檢核：堤頂超高≥0.3~0.5m；滲流安全；出口防掏空`},

{yr:"111",sub:"坡地水文學",type:"orig",n:"111h1",pts:20,
q:"為因應氣候變遷碳中和目標，試說明集水區中如何透過水土保持處理維護創造碳匯。",
s:"碳匯創造：植生造林（光合作用固碳，台灣造林每公頃每年5~10 ton C）、減少土壤沖蝕（保留土壤有機碳SOC）、農藝保育耕作（免耕減少有機碳礦化）、濕地保育（泥炭地固碳）、農塘/滯洪池攔截含有機碳泥砂。整合策略：「保土→保碳→造林→增碳」。",
d:`<h4>一、碳匯與碳源概念</h4>碳匯（Carbon Sink）：吸收CO₂的系統（植物光合、土壤有機碳積累）；水土保持透過以下途徑創造碳匯：<table><tr><th>措施</th><th>碳匯機制</th><th>效果</th></tr><tr><td><b>植生造林復育</b></td><td>光合作用固定CO₂，儲存於地上生物量、根系及凋落物</td><td>台灣造林每公頃每年固碳約5~10 ton C</td></tr><tr><td><b>減少土壤沖蝕</b></td><td>固床工、護岸減少侵蝕，土壤有機碳（SOC）保存於原地</td><td>沖蝕後礦質土SOC低，保留有機表土維持碳匯功能</td></tr><tr><td><b>農藝保育耕作</b></td><td>免耕/少耕減少土壤翻動，降低有機碳礦化速率</td><td>長期免耕使SOC每年增加0.1~0.5 ton C/ha</td></tr><tr><td><b>濕地保育</b></td><td>維持農塘、濕地不乾燥，防止有機碳氧化釋放</td><td>泥炭地固碳密度極高，保護比造林更重要</td></tr><tr><td><b>農塘/滯洪池</b></td><td>攔截地表沖蝕泥砂（含有機碳），沉積於池底長期儲存</td><td>小型水體沉積物是集水區碳匯重要補充</td></tr></table>`},
{yr:"111",sub:"坡地水文學",type:"orig",n:"111h2",pts:20,
q:"試說明運用自然為本的解決方案（Nature-based Solutions, NbS）之準則有哪些。",
s:"IUCN八大準則：1.以自然保護為主體；2.涵蓋生物多樣性；3.達到淨自然效益；4.可行經濟性；5.以科學為基礎；6.服務所有利害關係人（在地社區）；7.適應性管理（持續監測調整）；8.永續財務。核心：利用自然過程解決社會問題，同時創造生態效益。",
d:`<h4>NbS定義（IUCN 2020）</h4>保護、永續管理和恢復自然或改良生態系統，有效應對社會挑戰（洪水、乾旱、崩塌），同時為人類福祉和生物多樣性提供效益。<table><tr><th>準則</th><th>說明</th><th>水保應用</th></tr><tr><td><b>1. 以自然保護為主體</b></td><td>優先保護現有自然生態系，而非僅關注服務</td><td>保護集水區天然林，而非僅植樹造林</td></tr><tr><td><b>2. 涵蓋生物多樣性</b></td><td>NbS設計必須維護或增進生物多樣性</td><td>護岸採多樣本土植栽，而非單一草種</td></tr><tr><td><b>3. 達到淨自然效益</b></td><td>介入後生態系完整性應優於介入前</td><td>野溪整治後需評估魚類棲地恢復</td></tr><tr><td><b>4. 可行經濟性</b></td><td>在經濟上可行，能吸引長期投資與維護</td><td>生態護岸長期維護成本應低於混凝土護岸</td></tr><tr><td><b>5. 以科學為基礎</b></td><td>有科學依據，量化生態效益</td><td>以水文模擬量化植林對洪峰的削減效益</td></tr><tr><td><b>6. 服務所有利害關係人</b></td><td>納入在地社區與原住民知識</td><td>水保計畫邀集農民、部落共同參與規劃</td></tr><tr><td><b>7. 適應性管理</b></td><td>持續監測評估，因應環境變化調整策略</td><td>建立集水區長期生態水文監測系統</td></tr><tr><td><b>8. 永續財務</b></td><td>建立長期穩定資金機制，非依賴短期補助</td><td>結合碳權交易、生態系服務付費（PES）</td></tr></table>`},
{yr:"111",sub:"坡地水文學",type:"orig",n:"111h3",pts:20,
q:"集水區面積29.8 km²，兩場4hr連續降雨（3.8cm+2.8cm），出口流量歷線給定，試推求降雨過程之平均入滲率。",
s:"基流分割（5cms水平線）→DRO積分→V=1,490,400m³→逕流深=5.0cm→入滲深=6.6-5.0=1.6cm→平均入滲率=1.6cm/8hr=0.20 cm/hr=2.0 mm/hr。",
d:`<h4>一、基流分割（水平法，Qb=5 cms）</h4>DRO（cms）：t=0~6hr各0；12hr=8；18hr=21；24hr=16；30hr=11；36hr=7；42hr=4；48hr=2；54~60hr各0<h4>二、DRO體積（梯形法，Δt=21600s）</h4><div class="fm">V = 21600×(0+4+14.5+18.5+13.5+9+5.5+3+1+0) = 21600×69 = 1,490,400 m³</div><h4>三、入滲率</h4><div class="fm">逕流深 = 1,490,400/(29.8×10⁶) = 5.0 cm</div>總降雨P=6.6cm；總延時=8hr；入滲深F=6.6-5.0=1.6cm<div class="fm">平均入滲率 f̄ = 1.6/8 = <b>0.20 cm/hr = 2.0 mm/hr</b></div>`},
{yr:"111",sub:"坡地水文學",type:"orig",n:"111h4",pts:20,
q:"某一野溪流量記錄如表（各流量區間發生次數），水輪機最高效率流量為30 cms，估算一年中有多少日數水輪機可達最高效率。",
s:"統計流量≥30.1 cms的發生天數（140~30.1各區間）：6+20+45+60+100+200+230=661天。總記錄天數=1086天（約3年）。一年可達最高效率=661/1086×365≈222天/年。",
d:`<h4>流量資料整理</h4><table><tr><th>流量區間（cms）</th><th>發生次數</th><th>是否≥30 cms</th></tr><tr><td>140~120.1</td><td>6</td><td>✓</td></tr><tr><td>120~100.1</td><td>20</td><td>✓</td></tr><tr><td>100~80.1</td><td>45</td><td>✓</td></tr><tr><td>80~60.1</td><td>60</td><td>✓</td></tr><tr><td>60~50.1</td><td>100</td><td>✓</td></tr><tr><td>50~40.1</td><td>200</td><td>✓</td></tr><tr><td>40~30.1</td><td>230</td><td>✓</td></tr><tr><td>30~25.1</td><td>170</td><td>✗</td></tr><tr><td>25以下</td><td>255</td><td>✗</td></tr></table><div class="fm">符合日數 = 6+20+45+60+100+200+230 = <b>661天</b></div><div class="fm">總記錄天數 = 1086天（約3年）</div><div class="fm">一年可達最高效率 = 661/1086×365 ≈ <b>222天/年</b></div>`},
{yr:"111",sub:"坡地水文學",type:"orig",n:"111h5",pts:20,
q:"坡地社區面積0.80 km²、坡度0.005、最長行徑1.0km，tc=0.02(L/S⁰·⁵)⁰·⁷⁷（min），25年重現期降雨深-延時關係給定，求最大降雨強度與洪峰流量。",
s:"tc=31.5 min；內插P(31.5min)≈51mm；i≈97mm/hr；Q=0.85×97×80/360≈18.4 cms。",
d:`<div class="fm">tc = 0.02×(1000/√0.005)^0.77 = 0.02×14142^0.77 ≈ 31.5 min</div>內插（30min→50mm；40min→57mm）：<div class="fm">P(31.5) = 50+(57-50)×1.5/10 = 51.05 mm</div><div class="fm">i = 51.05/(31.5/60) ≈ 97.2 mm/hr</div>C=0.85（全建築道路），A=80ha<div class="fm">Q = 0.85×97.2×80/360 ≈ <b>18.4 cms</b></div>`},
{yr:"112",sub:"坡地水文學",type:"orig",n:"112h1",pts:20,
q:"請試述下列名詞：管湧（piping）、凋萎點（wilting point）、崩積土（colluvial soils）、受壓地下水。",
s:"管湧：地下水在土體形成管狀流道，侵蝕土粒造成空洞，可導致地表下陷或堤壩潰決。凋萎點：-1500 kPa（pF≈4.2），植物永久萎凋的臨界含水量。崩積土：重力移動堆積的鬆散碎屑（分選差、不均質），易再崩塌。受壓地下水：被不透水層包夾，水壓高於靜水壓，鑽孔後水位上升至含水層頂部以上。",
d:`<h4>管湧（Piping）</h4>地下水沿滲流路徑侵蝕細顆粒，形成管狀流道，上方土體失去支撐而塌陷，可導致堤壩潰決。防治：截水牆、增加滲流路徑長度（反濾層）。<h4>凋萎點（WP）</h4>土壤基質吸力達-1500 kPa（pF≈4.2），植物根系無法克服吸力汲水，發生永久萎凋。典型值：砂土4%；黏土25%（體積含水量）。<h4>崩積土（Colluvial soils）</h4>由重力移動（崩落、蠕移、淺層崩塌）從上坡搬運堆積的鬆散碎屑物。特性：分選差、孔隙率大、缺明顯層理，颱風豪雨後易再崩塌（土石流重要物源）。<h4>受壓地下水（Confined groundwater）</h4>位於兩個不透水地層之間的含水層，水壓高於靜水壓，鑽孔後水位上升至含水層頂部以上（甚至自噴=自流井）。工程意義：基礎開挖可能引發底板隆起或噴砂。`},
{yr:"112",sub:"坡地水文學",type:"orig",n:"112h2",pts:20,
q:"試說明水文循環中，入滲（Infiltration）、滲漏（Percolation）與滲流（Seepage）的差異，包括其定義、流動方式與方向。",
s:"入滲：地表→土壤（垂直向下為主，受表土條件控制，Green-Ampt/Richards方程式）。滲漏：不飽和帶中繼續向下移動至地下水面（垂直為主，基質吸力+重力驅動）。滲流：飽和帶中的側向流動（水平為主，Darcy定律，向河川排洩=基流，向坡腳湧出）。",
d:`<table><tr><th>項目</th><th>入滲</th><th>滲漏</th><th>滲流</th></tr><tr><td><b>位置</b></td><td>地表-土壤界面</td><td>不飽和帶（地下水位以上）</td><td>飽和帶（地下水位以下）</td></tr><tr><td><b>主要方向</b></td><td>垂直向下</td><td>垂直向下</td><td>水平（主），由高水頭→低水頭</td></tr><tr><td><b>驅動力</b></td><td>重力+基質吸力（初期）</td><td>重力+基質吸力梯度</td><td>水力梯度（Darcy定律）</td></tr><tr><td><b>控制方程</b></td><td>Green-Ampt/Richards</td><td>Richards方程式</td><td>Darcy定律：q=-K∇h</td></tr><tr><td><b>工程意義</b></td><td>決定逕流量；入滲使孔隙水壓增加→邊坡危險</td><td>地下水補注；污染物遷移</td><td>坡腳滲水→不穩定；維持基流</td></tr></table>`},
{yr:"112",sub:"坡地水文學",type:"orig",n:"112h3",pts:20,
q:"在山坡地中，植生對水文環境有很大的影響，用水文循環中的各個因子來說明植生的重要性。",
s:"截留（減少10~40%）→蒸散（年700~1200mm）→入滲（根系使入滲率提高3~10倍）→地表逕流（洪峰減少30~70%）→地下水補注（增加20~50%）→基流（枯水期穩定）。整體：削峰延遲、穩定枯水、減少泥砂（覆蓋率>70%減少沖蝕80~95%）。",
d:`<table><tr><th>水文因子</th><th>植生影響</th><th>量化效果</th></tr><tr><td><b>截留</b></td><td>葉面攔截降雨直接蒸發；消散雨滴動能防雨濺蝕</td><td>密林截留年雨量10~40%</td></tr><tr><td><b>蒸發散</b></td><td>葉片蒸散+土面蒸發+截留蒸發</td><td>台灣森林年蒸散700~1200mm</td></tr><tr><td><b>入滲</b></td><td>根系大孔隙提高入滲率；枯落物防表土結皮</td><td>林地入滲率為裸地3~10倍</td></tr><tr><td><b>地表逕流</b></td><td>截留與入滲增加→逕流量減少；莖葉增加粗糙度延遲逕流</td><td>洪峰流量比裸地低30~70%</td></tr><tr><td><b>地下水補注</b></td><td>入滲率高→更多水補注地下水</td><td>林地補注量比裸地高20~50%</td></tr><tr><td><b>基流</b></td><td>地下水補注穩定→枯水期基流量充足</td><td>有植生集水區枯水流量明顯較高</td></tr></table>`},
{yr:"112",sub:"坡地水文學",type:"orig",n:"112h4",pts:20,
q:"山坡地中，土地及濱溪廊道的開發利用對生態會產生那些影響，說明評估的步驟。",
s:"影響：水文改變（逕流增加/洪峰提前）、棲地破壞與破碎化、濱溪廊道切斷（阻礙動物移動）、水質劣化（泥砂/農藥）、微氣候改變（水溫升高）、外來種入侵。評估步驟：基線調查→敏感度分析→衝擊預測→衝擊評估（可逆性）→替代方案比較→緩解措施設計→監測計畫。",
d:`<h4>一、開發對生態的主要影響</h4><table><tr><th>影響類別</th><th>說明</th></tr><tr><td><b>水文改變</b></td><td>不透水面積增加→逕流係數升高→洪峰增大提前；枯水期基流減少</td></tr><tr><td><b>棲地喪失與破碎化</b></td><td>植被移除使棲地直接消失；大面積開發使棲地破碎（阻礙基因交流）</td></tr><tr><td><b>濱溪廊道喪失</b></td><td>動物移動通道切斷；失去水質淨化（過濾農藥、泥砂）功能</td></tr><tr><td><b>水質劣化</b></td><td>施工期大量泥砂進入溪流（溶氧降低）；農藥化肥隨逕流進入水體</td></tr><tr><td><b>微氣候改變</b></td><td>樹冠遮蔭消失→水溫升高（冷水魚類敏感）</td></tr><tr><td><b>外來種入侵</b></td><td>開發擾動為外來種（小花蔓澤蘭、銀合歡）提供入侵機會</td></tr></table><h4>二、生態衝擊評估步驟</h4><ul><li><b>Step 1 基線調查：</b>開發前完整調查植物、動物、水質、棲地型態</li><li><b>Step 2 敏感度分析：</b>確認保育類、特有種、法定保護區位置</li><li><b>Step 3 衝擊預測：</b>預測水文、泥砂、水溫、棲地面積等變化</li><li><b>Step 4 衝擊評估：</b>判斷衝擊嚴重性（可逆/不可逆）、範圍（局部/廣域）、持續性</li><li><b>Step 5 替代方案比較：</b>比較不同方案的衝擊差異，選衝擊最小者</li><li><b>Step 6 緩解措施：</b>依迴避→縮小→減輕→補償設計</li><li><b>Step 7 監測計畫：</b>施工期及完工後定期監測關鍵指標，驗證緩解措施有效性</li></ul>`},
{yr:"112",sub:"坡地水文學",type:"orig",n:"112h5",pts:20,
q:"利用合理化公式計算尖峰逕流量（Q=CiA/360），試說明如何降低規劃區的C值。",
s:"C值降低方法：增加植生覆蓋（最有效，林地C=0.1~0.3 vs 裸地C=0.9）、設置透水鋪面、建立雨水花園/下沉式綠地、設置滲透溝、屋頂綠化（削減屋頂逕流50~80%）、保留自然植被緩衝帶（兩岸各10~30m），以LID低衝擊開發理念分散布置於源頭。",
d:`<div class="fm">Q = C × i × A / 360</div>C值=降雨中轉化為地表逕流的比例（0~1），C越高→逕流越多→洪峰越大。<h4>降低C值方法</h4><table><tr><th>方法</th><th>效果</th></tr><tr><td><b>增加植生覆蓋（最有效）</b></td><td>覆蓋率0%→80%，C從0.9降至0.35，減少最顯著</td></tr><tr><td>透水性鋪面</td><td>透水混凝土、透水磚取代不透水鋪面（停車場、廣場）</td></tr><tr><td>雨水花園/下沉式綠地</td><td>低窪處蒐集逕流使其入滲，每個服務上游5~10倍不透水面積</td></tr><tr><td>滲透溝/滲透池</td><td>地下礫石填充，收集逕流逐漸入滲，減少進入地表排水系統流量</td></tr><tr><td>屋頂綠化</td><td>可削減屋頂逕流50~80%</td></tr><tr><td>保留植被緩衝帶</td><td>溪流兩岸、道路側邊至少10~30m自然植被，讓逕流入滲</td></tr></table>`},
{yr:"113",sub:"坡地水文學",type:"orig",n:"113h1",pts:20,
q:"請說明雨量資料校正的方法與影響降水的因子。",
s:"校正方法：(1)雙累積曲線法（偵測系統誤差，以斜率比值校正，最常用）；(2)統計一致性檢定（t/F檢定）；(3)迴歸分析法（與鄰站建立方程式）。影響降水因子：地形（迎風坡多雨，最重要）、緯度、海拔、天氣系統（颱風/梅雨/東北季風）、距海距離。",
d:`<h4>一、雨量資料校正方法</h4><ul><li><b>雙累積曲線法（最常用）：</b>待查站累積雨量對鄰近參考站平均累積雨量作圖，折點=資料不一致；以折點前後斜率比值校正</li><li><b>統計一致性檢定：</b>t檢定或F檢定比較折點前後均值是否顯著差異（α=0.05）</li><li><b>迴歸分析法：</b>問題期間與鄰站建立迴歸方程式，預測待查站應有雨量</li></ul><h4>二、影響降水的因子</h4><table><tr><th>因子</th><th>影響機制</th><th>台灣案例</th></tr><tr><td><b>地形（最重要）</b></td><td>迎風坡強迫抬升→地形雨；背風坡焚風效應→雨量少</td><td>中央山脈東側&gt;3000mm；西部平原&lt;2000mm</td></tr><tr><td>緯度</td><td>決定氣溫帶與天氣系統路徑</td><td>北部冬雨型；南部夏雨型</td></tr><tr><td>海拔</td><td>至最大雨量帶（1000~2000m）前隨高度增加</td><td>阿里山&gt;4000mm</td></tr><tr><td>天氣系統</td><td>颱風、梅雨、東北季風各有不同特性</td><td>颱風提供台灣年雨量30~40%</td></tr><tr><td>距海距離</td><td>海洋水汽供給，離海越遠越乾燥</td><td>台灣海峽水汽豐沛</td></tr></table>`},
{yr:"113",sub:"坡地水文學",type:"orig",n:"113h2",pts:20,
q:"請說明常用的雨量資料補遺的方法與等雨量線法計算平均雨量。",
s:"補遺方法：算術平均法（鄰站平均，地形均一）；正常雨量比法（加權比值，年雨量差>10%）；等雨量線法（內插繪製等雨量線，面積加權，最精確）；IDW反距離加權法。等雨量線法平均雨量：P̄=Σ(Pᵢ×Aᵢ)/A，Pᵢ=相鄰等雨量線均值，Aᵢ=對應面積。",
d:`<h4>一、雨量資料補遺方法</h4><ul><li><b>算術平均法：</b>Px=(P₁+P₂+...+Pn)/n，適用地形均一、各站年雨量差異&lt;10%</li><li><b>正常雨量比法：</b>Px=(Nx/3)×(P₁/N₁+P₂/N₂+P₃/N₃)，適用年雨量差&gt;10%，以年雨量比值加權</li><li><b>等雨量線法：</b>在集水區地圖繪製等雨量線，計算各等雨量線間面積，加權平均（精度最高）</li><li><b>IDW反距離加權法：</b>Px=Σ(Pᵢ/dᵢᵖ)/Σ(1/dᵢᵖ)，p通常取2，適用資料完整的數位環境</li></ul><h4>二、等雨量線法計算面平均雨量</h4><b>計算步驟：</b><ol style="padding-left:16px"><li>在集水區底圖標示各測站位置與雨量值</li><li>利用內插法繪製等雨量線（每隔固定雨量間距）</li><li>量測各相鄰等雨量線之間的集水區面積（Aᵢ）</li><li>取每相鄰兩條等雨量線的平均值（Pᵢ）</li><li>計算面積加權平均雨量：</li></ol><div class="fm">P̄ = Σ(Pᵢ × Aᵢ) / A_total</div>優點：考慮空間分布，精度最高；缺點：需足夠站密度，工作量大。`},
{yr:"113",sub:"坡地水文學",type:"orig",n:"113h3",pts:20,
q:"請說明氣候變遷對坡地水文過程可能造成的改變與因應措施。",
s:"改變：降雨強度增加（極端事件頻率升高）→洪峰增大；乾旱期延長→枯水期流量減少；蒸散量增加（氣溫升高）→土壤趨乾；崩塌頻率可能增加（乾濕交替極端化）。因應：提高設計重現期、增加滯洪設施、植生保水、強化預警系統、土地使用管制。",
d:`<h4>一、氣候變遷對坡地水文的改變</h4><table><tr><th>水文過程</th><th>改變方向</th><th>說明</th></tr><tr><td><b>降雨強度</b></td><td>↑增加</td><td>氣溫升高使大氣持水增加（每升1°C增加7%），導致強降雨更強烈；台灣短延時強降雨已呈增加趨勢</td></tr><tr><td><b>洪峰流量</b></td><td>↑增加</td><td>更高雨強→更多超滲逕流→更大洪峰，現有排水設施容量不足</td></tr><tr><td><b>枯水期基流</b></td><td>↓減少</td><td>乾旱延長使地下水補注不足，枯水期基流降低</td></tr><tr><td><b>蒸發散量</b></td><td>↑增加</td><td>氣溫升高使蒸散加劇，土壤含水量降低</td></tr><tr><td><b>崩塌頻率</b></td><td>可能↑</td><td>極端降雨增加→土壤飽和崩塌觸發頻率增加；乾旱後突然強降雨（乾濕交替）特別危險</td></tr></table><h4>二、因應措施</h4><ul><li><b>工程面：</b>提高設計重現期（5年→25年）；增設滯洪設施、透水鋪面；加強護岸耐久性</li><li><b>非工程面：</b>精進預警系統（雨量閾值動態調整）；加強水文監測網；土地使用管制</li><li><b>生態面：</b>植生保水（增入滲緩衝洪峰）；崩塌地快速復育（減少裸露地脆弱度）</li></ul>`},
{yr:"113",sub:"坡地水文學",type:"orig",n:"113h4",pts:20,
q:"定流率抽水試驗，距100m處：s=1m（t=100min）、s=3m（t=1000min），Q=5×10³ m³/day，求流通係數T與儲水係數S。",
s:"Jacob直線法：每對數循環Δs=2m。T=2.303×5000/(4π×2)≈458 m²/day。延伸至s=0求t₀=31.6min，S=2.25×458×0.02197/10000≈2.26×10⁻³。",
d:`<h4>Jacob直線近似法</h4>(t₁=100min, s₁=1m)；(t₂=1000min, s₂=3m)；r=100m；Q=5000 m³/day<div class="fm">Δs = s₂-s₁ = 2 m（t₂/t₁=10，一個對數循環）</div><h4>求T</h4><div class="fm">T = 2.303×Q/(4π×Δs) = 2.303×5000/(4π×2) ≈ 458 m²/day</div><h4>求S</h4>延伸直線至s=0時的t₀：s₁=1m=Δs/2，t₀=t₁/10^0.5=31.6min=0.02197 day<div class="fm">S = 2.25×T×t₀/r² = 2.25×458×0.02197/10000 ≈ <b>2.26×10⁻³</b></div><div class="note">T≈458 m²/day，S≈2.3×10⁻³（承壓含水層合理範圍）</div>`},
{yr:"113",sub:"坡地水文學",type:"orig",n:"113h5",pts:20,
q:"請說明落水頭滲透儀與水力傳導係數計算公式，並請繪圖說明之。",
s:"落水頭法適用低滲透性土壤（黏土、粉砂）。設備：細管（截面積a）+試樣（截面積A、長度L）。水頭由h₁降至h₂，記錄時間t。公式：K=(aL)/(At)×ln(h₁/h₂)。",
d:`<h4>一、原理</h4>對於低滲透性土壤（K&lt;10⁻⁵ cm/s），恆水頭法流量極小難以量測，改用落水頭法量測細管水頭隨時間的下降速率。<h4>二、設備組成</h4><ul><li>細管（Stand pipe）：截面積a，初始水頭h₁，終止水頭h₂</li><li>試樣（Soil sample）：截面積A，長度L</li><li>試樣飽和（排除氣泡）</li></ul><h4>三、公式推導</h4>在dt內，細管水頭下降dh，由連續方程式：<div class="fm">K×A×h/L = -a×(dh/dt)</div>分離變數積分後：<div class="fm">K = (a×L)/(A×t) × ln(h₁/h₂)</div>K=水力傳導係數（cm/s）；a=細管截面積；A=試樣截面積；L=試樣長度；t=試驗時間<h4>四、注意事項</h4><ul><li>試樣需完全飽和，否則K值偏低</li><li>h₂/h₁以0.2~0.5為宜</li><li>試驗溫度需記錄，K值校正至20°C標準溫度</li></ul>`},
{yr:"114",sub:"坡地水文學",type:"orig",n:"114h1",pts:20,
q:"請試述下列名詞之意涵：比流量、土壤水分特徵曲線、雙累積曲線、臨前降雨指數、儲水係數。（各4分）",
s:"比流量=Q/A(cms/km²)；SWCC=土壤吸力vs含水量關係曲線（反映持水特性）；雙累積曲線=兩站累積雨量作圖偵測系統誤差；API=前期降雨衰減指數（APIₙ=ΣPᵢkⁱ）；儲水係數=單位面積單位水頭降下釋水量（承壓層小，無壓層大=比出水率）。",
d:`<h4>比流量（Specific Discharge）</h4>q=Q/A，單位cms/km²或L/s/km²。消除面積差異，便於比較各集水區洪水特性。<h4>土壤水分特徵曲線（SWCC）</h4>描述土壤基質吸力（ψ）與體積含水量（θ）關係的曲線。砂土陡峭（進氣值低），黏土平緩（保水力強）。存在遲滯現象（脫水與吸水路徑不同）。<h4>雙累積曲線（Double Mass Curve）</h4>以待查站累積雨量對鄰近參考站平均累積雨量作圖，正常為直線，折點代表資料不一致，折點前後斜率比值即為校正係數。<h4>臨前降雨指數（API）</h4><div class="fm">APIₙ = Σ Pᵢ×kⁱ（k=衰減係數0.85~0.98）</div>API越高→前期土壤越濕→本次降雨逕流越大。<h4>儲水係數（Storativity, S）</h4>單位水平面積上當水頭降低一單位時所釋出的水量。<ul><li><b>承壓含水層：</b>S=10⁻⁵~10⁻³（壓縮性決定）</li><li><b>無壓含水層：</b>S≈比出水率Sy=0.1~0.35（重力排水）</li></ul>`},
{yr:"114",sub:"坡地水文學",type:"orig",n:"114h2",pts:20,
q:"水文循環可以分為地面水與地下水兩大系統，請列出各自水平衡方程式並加以說明之。",
s:"地面水：P=ET+Q_surface+ΔS_surface+R（降雨=蒸發散+地表逕流+地表蓄水變化+深層入滲補注）。地下水：R+Qgw_in=D+Qgw_out+ΔS_gw（補注+側向流入=排洩+側向流出+蓄水變化）。兩系統透過入滲量R連結。",
d:`<h4>一、地面水水平衡方程式</h4><div class="fm">P = ET + Q_surface + ΔS_surface + R</div><table><tr><th>符號</th><th>說明</th></tr><tr><td>P</td><td>降水量</td></tr><tr><td>ET</td><td>蒸發散量（土壤蒸發+植物蒸散+截留蒸發）</td></tr><tr><td>Q_surface</td><td>地表逕流量（含快速壤中流）</td></tr><tr><td>ΔS_surface</td><td>地表蓄水變化量（土壤含水、窪地積水）</td></tr><tr><td>R</td><td>深層入滲補注量（連結地面與地下水的橋樑）</td></tr></table><h4>二、地下水水平衡方程式</h4><div class="fm">R + Q_gw_in = D + Q_gw_out + ΔS_gw</div><ul><li>R：垂直入滲補注量（等同地面水平衡的R）</li><li>D：排洩量（泉水、基流、抽水井）</li><li>ΔS_gw：地下水蓄水變化量（水位升降代表蓄水增減）</li></ul><h4>三、兩系統連結</h4>連結點為入滲量R：地面水的「損失」即為地下水的「補注」。<br>長期平均（ΔS趨近0）：P ≈ ET + Q_surface + D`},
{yr:"114",sub:"坡地水文學",type:"orig",n:"114h3",pts:20,
q:"說明地表下水流在地下水位之上（未飽和層）與地下水位之下（飽和層）的兩個區域，其水流流動機制有何不同？",
s:"未飽和層：驅動力=基質吸力梯度+重力，Richards方程式控制，K(θ)隨含水量非線性變化，乾燥時K值可降低數個數量級。飽和層：驅動力=水頭梯度（重力為主），Darcy定律控制，K=飽和水力傳導係數（常數），流動相對穩定。",
d:`<table><tr><th>比較項目</th><th>未飽和層（Vadose Zone）</th><th>飽和層（Saturated Zone）</th></tr><tr><td><b>孔隙狀態</b></td><td>孔隙中同時含有水和空氣</td><td>孔隙完全被水充滿</td></tr><tr><td><b>驅動力</b></td><td>基質吸力梯度+重力（總水勢=基質勢+重力勢）</td><td>水頭梯度（壓力差+高度差）</td></tr><tr><td><b>控制方程式</b></td><td>Richards方程式：∂θ/∂t=∇[K(θ)∇(ψ+z)]</td><td>Darcy定律：q=-K∇h；擴散方程：∇²h=(Ss/K)∂h/∂t</td></tr><tr><td><b>水力傳導係數</b></td><td>K(θ)：隨含水量非線性變化，乾燥時降低數個數量級</td><td>K_s：飽和水力傳導係數，為常數</td></tr><tr><td><b>主要影響因子</b></td><td>土壤質地、初始含水量、有機質、土壤結構</td><td>K_s、含水層厚度、水頭梯度、抽水量</td></tr><tr><td><b>工程意義</b></td><td>崩塌觸發（基質吸力喪失）、邊坡穩定分析</td><td>地下水抽水設計、地下排水工程</td></tr></table>`},
{yr:"114",sub:"坡地水文學",type:"orig",n:"114h4",pts:20,
q:"邊坡地下水調查可提供作為崩塌區內邊坡穩定分析與治理工程規劃時所需要的基本資料，試詳述邊坡地下水調查內容應包含哪些？",
s:"調查內容：地下水位量測（水位計/孔隙水壓計）、水文地質參數（現地滲透試驗/抽水試驗）、地下水流向流速（示蹤試驗）、泉水出露點調查、季節性水位變化監測、地球物理探測（ERT/地震折射輔助）、降雨-地下水位反應關係分析。",
d:`<h4>一、地下水位調查</h4><ul><li><b>開放式水位計：</b>PVC管，電子水位計讀取，操作簡單但反應較慢</li><li><b>多點孔隙水壓計（Vibrating wire）：</b>各層孔隙水壓，反應快，適合颱風期間快速變化監測</li><li><b>長期自動記錄：</b>每小時~每分鐘頻率自動記錄，建立水位-降雨時序關係</li></ul><h4>二、水文地質參數</h4><ul><li><b>落水頭試驗（土層）：</b>量測水位回升速率計算K_s</li><li><b>Lugeon試驗（岩盤）：</b>壓水試驗計算透水率（Lugeon值）</li><li><b>抽水試驗：</b>定流率抽水，求流通係數T與儲水係數S</li><li><b>示蹤試驗（Tracer test）：</b>注入鹽水或染料，推估地下水流向、流速與含水層連通性</li></ul><h4>三、地表調查</h4><ul><li>泉水出露點：位置、出水量、水溫，判斷補注區與排洩條件</li><li>滲流跡象：坡面濕潤帶、植被特別茂密處（指示地下水位高）</li><li>季節性水位變化：比較枯豐水期差異，掌握季節變動幅度</li></ul><h4>四、地球物理探測（輔助）</h4><ul><li>電阻率剖面法（ERT）：高含水量帶電阻率低，推測地下水分布</li><li>地震折射法：判斷岩盤深度與地下水位</li></ul>`},
{yr:"114",sub:"坡地水文學",type:"orig",n:"114h5",pts:20,
q:"下圖為集水區1cm有效降雨/1hr延時的單位歷線U(1,t)（洪峰100cms於t=2hr，基底6hr）。兩場降雨：第一場5.8cm/2hr，間隔1hr，第二場3.9cm/1hr，入滲指數0.9cm/hr，基流10cms。求集水區面積、平均逕流係數C、河川流量歷線Q(t)。",
s:"面積：UH三角形面積=½×6×3600×100=1,080,000m³；A=1,080,000/0.01=108km²。有效雨：第一場=4.0cm；第二場=3.0cm。C=7.0/9.7≈0.72。Q(t)以疊加原理：洪峰於t=2hr及t=5hr均達410cms，雙洪峰現象。",
d:`<h4>一、集水區面積</h4><div class="fm">UH面積 = ½×基底×峰值 = ½×6×3600×100 = 1,080,000 m³</div><div class="fm">A = 1,080,000/0.01 = 108 km²</div><h4>二、有效降雨與逕流係數</h4>φ=0.9 cm/hr<br>第一場（雨強2.9cm/hr）：有效=2.0cm/hr×2hr=<b>4.0cm</b><br>第二場（雨強3.9cm/hr）：有效=3.0cm/hr×1hr=<b>3.0cm</b><div class="fm">C = (4.0+3.0)/(5.8+3.9) = 7.0/9.7 ≈ 0.72</div><h4>三、流量歷線（疊加法）</h4>DRO₁=4.0×U（t=0起），DRO₂=3.0×U（t=3hr起）<table><tr><th>時間(hr)</th><th>DRO₁</th><th>DRO₂</th><th>合計</th><th>Q(t)</th></tr><tr><td>0</td><td>0</td><td>0</td><td>0</td><td>10</td></tr><tr><td>1</td><td>200</td><td>0</td><td>200</td><td>210</td></tr><tr><td>2</td><td>400</td><td>0</td><td>400</td><td><b>410</b></td></tr><tr><td>3</td><td>300</td><td>0</td><td>300</td><td>310</td></tr><tr><td>4</td><td>200</td><td>150</td><td>350</td><td>360</td></tr><tr><td>5</td><td>100</td><td>300</td><td>400</td><td><b>410</b></td></tr><tr><td>6</td><td>0</td><td>225</td><td>225</td><td>235</td></tr><tr><td>9</td><td>0</td><td>0</td><td>0</td><td>10</td></tr></table>`},
