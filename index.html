d:`<h4>植生材料選擇基本原則（核心架構，務必記熟）</h4><table><tr><th>原則</th><th>說明</th></tr><tr><td><b>適地適種（最根本）</b></td><td>植物的生態需求需與施工現地環境（氣候、土壤、海拔）相符</td></tr><tr><td>發芽率/活存率</td><td>草種發芽率≥80%；苗木活存率≥70%（技術規範要求）</td></tr><tr><td>生長速度匹配目標</td><td>快速覆蓋需求→草本先鋒種；長期生態目標→木本鄉土種</td></tr><tr><td>根系特性</td><td>表層防蝕→淺根密集草本；深層固土→深根木本</td></tr><tr><td>耐逆境</td><td>坡地多貧瘠乾旱，宜選耐逆境物種（豆科固氮尤佳）</td></tr><tr><td>生態安全</td><td>絕對避免外來入侵種，優先鄉土種</td></tr></table><h4>「適地適種」具體應用範例</h4><table><tr><th>環境條件</th><th>選種考量</th></tr><tr><td>高海拔（&gt;2000m）</td><td>選耐寒、生長季短的高山植物（玉山箭竹），不可使用低海拔種子</td></tr><tr><td>海岸鹽風地</td><td>選耐鹽耐風物種（馬鞍藤、林投、木麻黃），一般內陸植物無法存活</td></tr><tr><td>強酸性礦區（pH&lt;4）</td><td>選耐酸耐重金屬物種（香茅草），一般植物會中毒死亡</td></tr><tr><td>乾旱多石礫坡面</td><td>選深根耐旱物種（台灣相思），淺根草種易因缺水枯死</td></tr></table><div class="note">考試常見陷阱：誤以為某些「萬用」外來種（如百喜草）可適用所有環境，但實際上即使是耐逆境植物也有其生態適應範圍極限，超出範圍仍會失敗，這正是「適地適種」原則強調的核心精神。</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE02",pts:20,
q:"請說明植生工法依施工方式的基本分類，並比較直播法、客土噴植法、植生帶鋪植法三者的適用坡度與成本差異。",
s:"分類：依資材導入方式分為種子類（直播、噴植）、苗木類（栽植）、生物工程類（扦插）、覆蓋類（植生帶、植生袋）。三者比較：直播法適用坡度最緩（<1:1.5）、成本最低；客土噴植法適用坡度較陡（可達1:0.3甚至搭配格框近垂直）、成本中等（含客土材料與機具）；植生帶鋪植適用中等坡度（<1:1.5）、即時覆蓋效果最佳但成本較高（草皮捲生產與運輸成本）。",
d:`<h4>植生工法基本分類</h4><table><tr><th>分類</th><th>方法</th></tr><tr><td>種子類</td><td>直播（撒播）、客土噴植（Hydroseeding）</td></tr><tr><td>苗木類</td><td>容器苗栽植、裸根苗栽植</td></tr><tr><td>生物工程類</td><td>扦插、柳枝束、層積扦插</td></tr><tr><td>覆蓋類</td><td>植生帶（草皮捲）、植生袋</td></tr></table><h4>三種工法比較</h4><table><tr><th>項目</th><th>直播法</th><th>客土噴植法</th><th>植生帶鋪植法</th></tr><tr><td>適用坡度</td><td>較緩（&lt;1:1.5,約34°）</td><td>較陡（可達1:0.3，約73°，搭配金屬網或格框可近垂直）</td><td>中等（&lt;1:1.5）</td></tr><tr><td>成本</td><td><b>最低</b>（僅種子+人工撒播）</td><td>中等（客土材料+機具+人工）</td><td><b>較高</b>（草皮捲生產運輸成本）</td></tr><tr><td>即時覆蓋效果</td><td>無（需等待發芽1~4週）</td><td>較快（含種子與肥料一次施工）</td><td><b>最佳</b>（鋪設後立即有視覺覆蓋）</td></tr><tr><td>適用情境</td><td>大面積平緩坡、土壤條件尚可</td><td>陡坡、岩石或貧瘠坡面</td><td>需立即防蝕效果、坡度中等的場合</td></tr></table><div class="note">記憶邏輯：坡度越陡→需要的工程介入越多（從直播到噴植再到格框噴植）→成本遞增；但「即時覆蓋效果」與「坡度適用範圍」不完全是同一個排序，植生帶雖坡度適用範圍不是最廣，但即時效果最好，這是常考的混淆點。</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE03",pts:25,
q:"請說明崩塌地依立地條件可分為哪些類型，並列表說明各類型適用的植生工法與植物材料選擇邏輯。",
s:"崩塌地立地類型：(1)土壤型崩塌地（表土殘存）；(2)岩石裸露崩塌地（表土流失見岩盤）；(3)陡峭崩塌地（>45°，超出一般工法安全範圍）；(4)溪岸崩塌地（週期性淹水）；(5)高海拔崩塌地（低溫短生長季）。各類選工法邏輯：依立地條件的限制因子（土壤有無、坡度、水位變動、氣候）決定基礎工強度與植物耐受性需求。",
d:`<h4>崩塌地立地條件分類與對應策略</h4><table><tr><th>立地類型</th><th>主要限制因子</th><th>植生工法選擇邏輯</th><th>植物材料邏輯</th></tr><tr><td><b>土壤型崩塌地</b></td><td>表土尚存但裸露易再蝕</td><td>直接噴植即可，無需額外固定基盤</td><td>草本先鋒（百喜草）+木本鄉土種混播</td></tr><tr><td><b>岩石裸露崩塌地</b></td><td>無土壤基盤，植物無法直接附著</td><td>需先設格框或金屬網創造固定基盤，再客土噴植</td><td>耐貧瘠先鋒種（香茅草、豆科）</td></tr><tr><td><b>陡峭崩塌地（&gt;45°）</b></td><td>坡度超出一般工法安全範圍，材料易滑落</td><td>高強度金屬網+長錨釘（3~6m）固定，分層噴覆客土</td><td>初期匍匐草種，後期攀爬植物</td></tr><tr><td><b>溪岸崩塌地</b></td><td>週期性淹水，水位變動劇烈</td><td>坡腳先護岸（硬式或生物工程），中坡位層積扦插，坡頂噴植</td><td>耐濕耐沖植物（水柳、楓楊）</td></tr><tr><td><b>高海拔崩塌地（&gt;2000m）</b></td><td>低溫、生長季短、強風</td><td>簡易格框，避免使用低海拔種子（無法適應）</td><td>高山適生種（玉山箭竹、高羊茅）</td></tr></table><h4>選工法的核心邏輯（理解性記憶）</h4><div class="fm">先解決「基盤問題」（有無土壤、坡度是否過陡）→再解決「環境逆境問題」（水位、低溫、貧瘠）→最後選擇植物材料</div>這個由結構基盤到環境適應的決策順序，是植生工程科申論題回答崩塌地復育問題時最常見的論述架構。`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE04",pts:20,
q:"請說明礦區或特殊污染土壤（如酸性礦排水區域）對植生造成的限制，並說明相應的土壤改良與植物選擇策略。",
s:"限制：強酸性（pH2~4，硫化物氧化產生硫酸）、重金屬毒性（Fe、Al、Mn、As等超標）、極度貧瘠（有效氮磷幾近於零）、物理性差（無凝聚力、易揚塵）。改良策略：石灰中和（CaCO3，大量施用）、客土覆蓋隔離（>50cm）、磷酸鹽鈍化重金屬、接種菌根菌。植物選擇：耐酸耐重金屬先鋒種（香茅草、東南景天）、豆科固氮（太陽麻）、植生萃取（蜈蚣草吸收As）。",
d:`<h4>礦區/特殊污染土壤的植生限制</h4><table><tr><th>限制因子</th><th>機制</th></tr><tr><td>強酸性（pH2~4）</td><td>硫化物（黃鐵礦FeS₂）暴露空氣氧化產生硫酸，形成酸性礦排水（AMD）</td></tr><tr><td>重金屬毒性</td><td>低pH環境使Fe、Al、Mn等金屬大量溶出，達到植物毒害濃度</td></tr><tr><td>極度貧瘠</td><td>有效氮磷幾近於零，缺乏支持植物生長的基本養分</td></tr><tr><td>物理性差</td><td>礦渣或尾礦砂無凝聚力，乾燥揚塵，濕潤泥濘無結構</td></tr></table><h4>土壤改良策略</h4><table><tr><th>策略</th><th>具體方法</th></tr><tr><td>酸性中和</td><td>大量施用石灰（CaCO₃，可達50~100 ton/ha），分次施用避免一次性過量造成滲透壓問題</td></tr><tr><td>客土覆蓋隔離</td><td>覆蓋≥50cm一般土壤，創造植物根系生長空間，同時隔絕下方污染源</td></tr><tr><td>重金屬鈍化</td><td>施用磷酸鹽或生物炭，使重金屬形成不溶性化合物，降低生物可利用性</td></tr><tr><td>接種菌根菌</td><td>幫助植物在極端貧瘠環境中獲取有限養分，提高初期存活率</td></tr></table><h4>植物選擇策略</h4><ul><li><b>耐酸耐重金屬先鋒種：</b>香茅草（Vetiver）深根且耐受性極強；東南景天（超富集Zn/Cd植物）</li><li><b>豆科固氮植物：</b>太陽麻、田菁，改善氮素極度缺乏的問題</li><li><b>植生萃取應用：</b>蜈蚣草可吸收並累積土壤中的砷（As），長期多次收割可逐步降低土壤砷濃度，是一種低成本生物復育技術</li></ul>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE05",pts:20,
q:"請說明生態檢核機制中常用的植生群落調查指數，並說明重要值指數（IVI）與多樣性指數（如Shannon-Wiener指數）在評估意義上的差異。",
s:"常用指數：重要值指數IVI（判斷優勢種）、Shannon-Wiener多樣性指數H'（判斷群落整體多樣性高低）、均勻度指數J（判斷各物種分布是否平均）、Sørensen相似性指數（比較不同樣區或不同時期的植群相似度）。差異：IVI關注「單一物種在群落中的相對重要程度」，多樣性指數關注「整個群落的物種豐富與分布均勻程度」，兩者互補而非取代關係。",
d:`<h4>常用植生群落調查指數</h4><table><tr><th>指數</th><th>公式核心概念</th><th>評估目的</th></tr><tr><td>重要值指數（IVI）</td><td>相對密度+相對頻度+相對優勢度</td><td>找出群落中的優勢種，了解群落結構主導物種</td></tr><tr><td>Shannon-Wiener指數（H'）</td><td>H'=-Σ(pi×lnpi)</td><td>評估整個群落的物種多樣性（豐富度+均勻度的綜合）</td></tr><tr><td>均勻度指數（J）</td><td>J=H'/lnS（S=物種數）</td><td>評估各物種個體數分布是否平均，排除單純物種數的影響</td></tr><tr><td>Sørensen相似性指數</td><td>CS=2C/(A+B)</td><td>比較兩個樣區（或同一樣區不同時期）的物種組成相似程度</td></tr></table><h4>IVI與多樣性指數的評估意義差異（核心對比）</h4><table><tr><th>項目</th><th>重要值指數IVI</th><th>多樣性指數（H'、J）</th></tr><tr><td>關注焦點</td><td>單一物種在群落中的相對地位</td><td>整個群落的物種組成複雜程度</td></tr><tr><td>輸出結果</td><td>各物種各有一個IVI值，找出最大值即優勢種</td><td>整個樣區僅有一個綜合指數值</td></tr><tr><td>應用情境</td><td>判斷植生工程是否成功建立預期的優勢植群（如目的種是否成為優勢種）</td><td>判斷整體生態復育的多樣性成效（是否避免單一物種過度優勢造成的生態脆弱性）</td></tr></table><div class="note">兩者並非互相替代，而是互補使用：先用IVI了解「誰是老大」，再用多樣性指數了解「群落整體是否健康多元」，兩者合併判讀才能完整評估植生復育成效。</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE06",pts:20,
q:"請說明噴植工程驗收以覆蓋率為標準的常見爭議，並提出可能的改善建議。",
s:"爭議：(1)外來先鋒種快速達標但目的種（鄉土種）尚未建立，長期生態效益存疑；(2)覆蓋率量測方法主觀性高，現場目視估算容易產生爭議；(3)驗收時間點（通常6個月）對木本植物而言過短，無法反映長期成效。改善建議：分階段驗收（初驗看覆蓋率防蝕，末驗看目的種覆蓋率與植群組成）；引入定量化調查方法（如方格法、影像分析）取代純目視估算；延長最終驗收期限至2~3年。",
d:`<h4>噴植工程覆蓋率驗收的常見爭議</h4><table><tr><th>爭議點</th><th>問題說明</th></tr><tr><td>外來種快速達標問題</td><td>廠商常以快速生長的外來種（百慕達草）達到70%覆蓋率標準，但目的種（鄉土種或特定樹種）生長緩慢，無法在驗收期內達標，長期生態效益存疑</td></tr><tr><td>量測方法主觀性</td><td>現場目視估算覆蓋率，不同調查人員的判讀標準可能有差異，容易產生驗收爭議</td></tr><tr><td>驗收時間點過短</td><td>規範要求6個月內達70%覆蓋率，對草本而言可行，但對木本植物（需1~3年才能顯著覆蓋）而言時間過短</td></tr><tr><td>覆蓋率≠生態品質</td><td>單純覆蓋率高，不代表植群組成健康、物種多樣性足夠，可能只是單一外來種的單調覆蓋</td></tr></table><h4>改善建議</h4><ul><li><b>分階段驗收：</b>初驗（6個月）僅檢核基本覆蓋率，確認防蝕功能已建立；末驗（2~3年後）檢核目的種覆蓋率與植群組成多樣性</li><li><b>定量化調查方法：</b>引入方格法（Quadrat method）或無人機影像分析計算精確覆蓋率，取代主觀目視估算，減少驗收爭議</li><li><b>延長最終驗收期限：</b>對涉及木本目的種的工程，延長最終驗收至2~3年，給予足夠時間讓目的種建立</li><li><b>結合IVI與多樣性指數評估：</b>不僅看覆蓋率單一指標，同時評估群落組成是否符合設計預期（目的種是否成為優勢種或至少占有合理比例）</li></ul>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE07",pts:20,
q:"請說明防風林帶的密度與配置設計原則，並說明過密或過疏的防風林帶各會造成什麼問題。",
s:"設計原則：密度60~80%為最佳（疏透型），過密（>80%，近乎實心）會造成風在林前堆積後產生強烈渦流反而加劇背風側局部風蝕；過疏（<40%）則風速降低效果不足。配置：多排不同高度植物（喬木+灌木+草本）形成漸變斷面，比單一樹種單排更有效；防風距離與樹高成正比（約15~20倍樹高）。",
d:`<h4>防風林帶密度設計原則</h4><table><tr><th>密度</th><th>類型</th><th>效果與問題</th></tr><tr><td><b>60~80%（最佳，疏透型）</b></td><td>疏透結構，部分空氣可穿透</td><td>風速降低效果最佳且均勻，背風側風速降低50~70%，範圍可達15~20倍樹高</td></tr><tr><td>&gt;80%（過密，近乎實心）</td><td>密實結構，幾乎完全阻擋氣流</td><td>風被迫繞流，在林帶前方堆積後從頂部或側邊高速通過，在背風側緊鄰處反而形成強烈渦流，造成局部風蝕加劇（防風效果在近距離失效，遠距離才恢復）</td></tr><tr><td>&lt;40%（過疏）</td><td>稀疏結構，氣流大量穿透</td><td>風速降低效果不足，防護範圍與程度都打折扣，無法達到有效防風蝕的目標</td></tr></table><h4>配置設計原則</h4><ul><li><b>多排不同高度漸變配置：</b>由喬木（最高）、灌木（中等）、草本（最低）組成多層次斷面，比單一樹種單排更能有效分散與降低風速</li><li><b>方向配置：</b>主林帶垂直於主要風向，效果最佳</li><li><b>連續性：</b>林帶不應有明顯缺口，缺口處會形成風速集中通道（如喇叭口效應），反而加劇局部風害</li></ul><div class="note">理解性記憶：「過密像一道牆，風會翻牆而過再砸下來；過疏像篩網，風直接穿過沒被擋住」，60~80%疏透密度恰好讓部分氣流緩慢通過分散能量，同時阻擋大部分風速，達到最佳防護效果。</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE08",pts:25,
q:"請說明濱溪植生緩衝帶的多層次設計（分區配置），並說明各分區選用植物的生態邏輯。",
s:"分層設計：第一層（緊鄰水域0~5m）：草本挺水植物（蘆葦、香蒲），固岸消波、提供魚類棲地。第二層（5~15m）：灌木帶（水社柳），加強固坡、小型鳥獸棲地。第三層（15m以上）：鄉土喬木帶（水柳、楓楊），遮蔭、大型棲地、確保廊道連通性。生態邏輯：依距水域遠近的水分梯度與淹水頻率，選擇耐受程度遞減的植物，由水生→濕生→陸生逐漸過渡。",
d:`<h4>濱溪緩衝帶三層次分區設計</h4><table><tr><th>分層</th><th>距水域距離</th><th>植物類型</th><th>代表物種</th><th>生態功能</th></tr><tr><td><b>第一層</b></td><td>0~5m（緊鄰水域）</td><td>草本挺水植物</td><td>蘆葦、香蒲、水燭、菖蒲</td><td>固定岸線消減波浪衝擊；提供魚類產卵與庇護棲地；過濾初期逕流污染物</td></tr><tr><td><b>第二層</b></td><td>5~15m</td><td>灌木帶</td><td>水社柳、台灣山豬枷</td><td>加強固坡能力（較深根系）；提供小型鳥類與哺乳動物棲地與遮蔽</td></tr><tr><td><b>第三層</b></td><td>15m以上</td><td>鄉土喬木帶</td><td>水柳、楓楊、水黃皮</td><td>提供大範圍遮蔭降低水溫；大型樹冠層棲地（鳥類築巢）；確保生態廊道垂直結構連通性</td></tr></table><h4>分層設計的生態邏輯（水分梯度概念）</h4>緩衝帶分層設計的核心邏輯是依循<b>距水域遠近形成的水分梯度與淹水頻率梯度</b>：<ul><li>越靠近水域：土壤含水量越高、淹水頻率越高、需要耐濕耐沖的水生/濕生植物</li><li>越遠離水域：土壤趨向正常排水條件，可種植一般陸生喬木，但仍偏好耐濕物種以應對偶發性洪水淹沒</li></ul>這種「由水生過渡到陸生」的分區邏輯，模擬了天然河岸植被帶的自然分布型態，而非人為均質化栽植同一種植物，更能發揮完整的生態系統服務功能（水質淨化、棲地多樣性、生態廊道連通）。`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE09",pts:20,
q:"請說明苗木栽植前「斷根」處理的目的與分期斷根的原理，並說明斷根時機與移植時機的關係。",
s:"斷根目的：刺激植物在斷根位置長出大量新生細根，提高移植後吸水能力與成活率，同時讓土球範圍內的根系密集化，方便挖掘搬運時根系不致大量損失。分期斷根原理：一次性切斷全部側根會對植株造成過大壓力（光合產物供給根系修復需求過大），分2~3期（每期間隔3~6個月）僅切斷部分圓弧，讓植株有時間恢復並在已斷根處長出新根，最後再進行完整挖掘移植。",
d:`<h4>斷根處理的目的</h4><ul><li><b>刺激細根再生：</b>切斷主要側根後，植物會在斷根位置附近長出大量新生細根（吸水吸肥的主要功能根），這些新根集中在預定的土球範圍內</li><li><b>提高移植後存活率：</b>未經斷根處理直接挖掘移植的樹木，根系大量被切斷且缺乏密集細根，移植後吸水能力差，容易枯萎；經斷根處理後，土球範圍內已有密集細根，移植衝擊較小</li><li><b>方便挖掘搬運：</b>根系集中在預定土球範圍內，挖掘時根系損失減少，土球完整性較佳</li></ul><h4>分期斷根原理</h4><ul><li>若一次性切斷植株全部側根，會對植株造成過大生理壓力（光合產物需大量供應根系修復，可能導致樹勢衰弱甚至死亡）</li><li>分<b>2~3期</b>進行，每期間隔<b>3~6個月</b>，每次僅切斷土球周圍<b>1/3~1/2圓弧</b>的側根，留下其餘部分繼續供應水分養分維持樹勢</li><li>已斷根處在間隔期間長出新根，待下一期斷根另一側時，植株已有部分新根系統可資利用，降低整體壓力</li></ul><h4>斷根時機與移植時機的關係</h4><div class="fm">斷根開始時間 = 計畫移植時間 - 6個月~2年（依樹木大小與樹種決定）</div><ul><li>大型喬木（樹齡>10年、胸徑較大）：建議斷根期程拉長至1~2年，分3期進行</li><li>中小型樹木：斷根期程可縮短至6個月~1年，分2期進行</li><li>核心原則：必須在<b>所有分期斷根都完成、且最後一期斷根處已長出足夠新根後</b>，才能進行最終挖掘移植，不可提前進行</li></ul>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE10",pts:20,
q:"請說明草本植物中具走莖（匍匐莖）特性的物種（如百喜草）與叢生型草本（如甜根子草）在坡面植生工程應用上的差異。",
s:"走莖型（如百喜草、百慕達草）：水平莖節間可生根長葉，能快速水平擴展覆蓋裸露地表，自我修復能力強（受損後鄰近走莖可重新覆蓋），但根系較淺，深層固土能力較弱。叢生型（如甜根子草）：僅由基部分蘗向外擴展，擴展速度較慢，但根系通常較深較密集，深層固土效果較佳，且耐踐踏性不如走莖型。",
d:`<h4>走莖型 vs 叢生型草本比較</h4><table><tr><th>項目</th><th>走莖型（百喜草、百慕達草）</th><th>叢生型（甜根子草）</th></tr><tr><td>擴展方式</td><td>水平走莖（Stolon），節間可生根長葉</td><td>基部分蘗（Tillering），向外緩慢擴展</td></tr><tr><td>覆蓋速度</td><td>快（每月可延伸20~50cm）</td><td>較慢，需較長時間才能達到同等覆蓋率</td></tr><tr><td>自我修復能力</td><td>強（受損處由鄰近走莖快速重新覆蓋）</td><td>較弱（受損處需重新由種子或殘存基部恢復）</td></tr><tr><td>根系深度與密度</td><td>較淺，但密集交織形成緻密表層網絡</td><td>通常較深，深層固土效果較佳</td></tr><tr><td>耐踐踏性</td><td>較強（適合需要承受踩踏的區域）</td><td>較弱</td></tr></table><h4>坡面植生工程應用選擇邏輯</h4><ul><li><b>需要快速防止表層沖蝕、短期內達到覆蓋率驗收標準：</b>選走莖型（百喜草），其快速擴展與自我修復特性特別適合應對短期驗收壓力與局部沖蝕損傷</li><li><b>需要深層固土效果、長期穩定性優先：</b>叢生型（甜根子草）根系較深，對中長期坡面穩定貢獻較大，但無法快速應對短期裸露風險</li><li><b>實務上的組合策略：</b>常採混播方式，走莖型快速建立表層覆蓋（防止短期沖蝕），叢生型逐漸建立深層根系（提供長期固土效果），兩者互補</li></ul>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE11",pts:20,
q:"請說明海岸植生帶的演替序列（先驅植物到穩定植群），並說明各階段植物的生態適應特徵。",
s:"演替序列：第一線先驅（馬鞍藤，匍匐藤本，耐鹽耐沙埋）→第二線（濱刺草、海桐，初步固定沙丘）→灌木帶（林投，刺葉防動物啃食，耐風耐鹽）→喬木帶（黃槿、木麻黃，形成防風林）。生態適應特徵遞變：耐鹽耐沙埋程度遞減，但植株體型與抗風structural strength需求遞增（隨植株變高，需要更強的結構強度抵抗海風）。",
d:`<h4>海岸植生演替序列（由海向陸）</h4><table><tr><th>演替階段</th><th>代表植物</th><th>生態適應特徵</th></tr><tr><td><b>第一線先驅</b></td><td>馬鞍藤</td><td>匍匐藤本，莖節易生根，能耐受極高鹽分與頻繁沙埋（埋沒後仍可從節點重新萌發），但植株低矮無法形成結構性防護</td></tr><tr><td><b>第二線</b></td><td>濱刺草、海桐</td><td>耐鹽耐風能力仍強，根系開始發揮初步固定沙丘的功能，植株略高，開始具備減速風沙的能力</td></tr><tr><td><b>灌木帶</b></td><td>林投</td><td>具刺葉防止動物啃食，耐風耐鹽但已不需耐受頻繁沙埋（此區沙丘已趨穩定），植株具一定結構強度</td></tr><tr><td><b>喬木帶</b></td><td>黃槿、木麻黃</td><td>形成主要防風林結構，耐鹽耐風能力相對最弱（已退到較內陸、鹽風影響較小的位置），但需要最強的結構強度（樹幹、根系）抵抗海風長期作用力</td></tr></table><h4>演替的生態邏輯（理解性記憶）</h4>整個演替序列反映「<b>環境逆境程度與結構強度需求的反向消長</b>」：<ul><li>越靠海（逆境越強：鹽分高、風大、沙埋頻繁）：植物需要極強的耐逆境生理特性，但結構可以簡單（匍匐莖即可）</li><li>越向陸（逆境減弱但累積風力作用時間更長）：植物耐逆境需求降低，但需要更強壯的結構（深根、粗壯樹幹）來長期抵抗風力的累積作用</li></ul>這個演替序列也說明了為何海岸造林不能直接在最前線種植喬木（木麻黃），必須先讓前線先驅植物（馬鞍藤）穩定沙丘環境後，才能逐步引入後續演替階段的物種。`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE12",pts:20,
q:"請說明植生工程中常用的土壤改良材料（石灰、石膏、有機質、保水劑）各自的作用機制與適用情況。",
s:"石灰（CaCO3）：中和酸性土壤，提高pH，消除Al³⁺毒性，適用強酸性土壤。石膏（CaSO4）：提供Ca²⁺置換土壤中Na⁺，改善鹽鹼土結構，適用鹼性/鈉質土。有機質（堆肥、腐植土）：改善土壤結構、增加保水保肥能力、提供微生物活動基質，適用各類貧瘠土壤。保水劑（PAM、高分子聚合物）：吸附大量水分形成凝膠，延緩乾旱期水分流失，適用乾旱地區或砂質土。",
d:`<h4>四種土壤改良材料比較</h4><table><tr><th>材料</th><th>作用機制</th><th>適用情況</th></tr><tr><td><b>石灰（CaCO₃或Ca(OH)₂）</b></td><td>中和土壤酸性，提高pH值；消除Al³⁺、Mn²⁺等酸性土壤特有的毒性離子；提供Ca養分</td><td>強酸性土壤（pH&lt;5），如礦區酸性礦排水區域</td></tr><tr><td><b>石膏（CaSO₄）</b></td><td>提供Ca²⁺置換黏粒表面吸附的Na⁺，改善鹼性/鈉質土的物理結構（避免黏粒過度分散造成的緻密化）；不顯著改變pH（石膏本身近中性）</td><td>鹼性土（pH&gt;8.5）、鹽鹼土、鈉質土</td></tr><tr><td><b>有機質（堆肥、腐植土）</b></td><td>改善土壤結構（促進團粒形成）、增加孔隙度、提高保水保肥能力、提供微生物活動所需基質與養分</td><td>各類貧瘠土壤，特別是有機質含量&lt;1%的場合（如礦區、嚴重沖蝕地）</td></tr><tr><td><b>保水劑（PAM、高分子聚合物）</b></td><td>吸附大量水分形成凝膠狀結構，逐漸釋放供植物根系利用，延緩乾旱期水分快速流失</td><td>乾旱地區、保水性差的砂質土壤、新植苗木初期養護期</td></tr></table><h4>選用邏輯（依土壤問題對症下藥）</h4><div class="fm">問題診斷：先測pH值與質地 → 酸性問題用石灰；鹼性/結構問題用石膏；貧瘠問題用有機質；保水問題用保水劑</div><div class="note">實務上常多種材料併用：例如礦區土壤改良常同時施用石灰（中和酸性）+堆肥（增加有機質與微生物活性），單一材料往往無法解決複合性的土壤問題。</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE13",pts:25,
q:"請說明植生工程在不同演替階段（初生演替vs次生演替）的策略差異，並說明判斷一塊裸露地屬於初生或次生演替起點的依據。",
s:"判斷依據：初生演替起點完全無土壤基盤（裸岩、新生熔岩地、深層開挖見岩盤），缺乏種子庫與微生物相；次生演替起點仍保有部分原有土壤（含種子庫、有機質、微生物相），如崩塌地堆積區、棄耕地、火災後林地。策略差異：初生演替需從零創造土壤基盤（格框客土、接種菌根菌），養護期長（3~5年）；次生演替可保留並利用既有土壤種子庫，直接加速演替（跳過早期草本階段直接引入先鋒木本）。",
d:`<h4>判斷裸露地演替類型的依據</h4><table><tr><th>判斷依據</th><th>初生演替起點</th><th>次生演替起點</th></tr><tr><td>土壤基盤</td><td>完全缺乏（裸岩、深層開挖見岩盤、新生熔岩地）</td><td>仍保有部分原土壤層（即使表層被破壞，下方仍有原土）</td></tr><tr><td>種子庫</td><td>不存在（從未有植物在此生長過）</td><td>存在（土壤中殘留先前植群的種子，可自然萌發）</td></tr><tr><td>微生物相</td><td>缺乏（無原有土壤微生物群落）</td><td>部分保留（原有土壤的微生物社群仍存在）</td></tr><tr><td>典型案例</td><td>採礦深挖見岩盤地、新生崩塌岩石裸露面</td><td>崩塌地堆積區（土砂堆積但非全新基質）、棄耕地、火災後林地</td></tr></table><h4>策略差異</h4><table><tr><th>策略項目</th><th>初生演替</th><th>次生演替</th></tr><tr><td>首要任務</td><td>從零創造土壤基盤（格框客土、客土噴植）</td><td>保留並利用既有土壤種子庫，先穩定土壤（截排水防止沖走既有種子庫）</td></tr><tr><td>微生物處理</td><td>需額外接種菌根菌、根瘤菌</td><td>原有微生物相可能仍部分存活，不一定需要額外接種</td></tr><tr><td>植群建立速度</td><td>緩慢（需數年才建立基本植被）</td><td>較快（可直接加速演替，跳過早期草本階段，直接引入先鋒木本）</td></tr><tr><td>養護期長短</td><td>長（3~5年密集養護）</td><td>較短，可較快減少人為介入讓自然演替接手</td></tr></table><div class="note">考試應用：題目描述一塊裸露地的成因與現況時，先判斷其屬於初生或次生演替起點，再依此選擇對應策略，是植生工程科申論題常見的情境判斷型考法（呼應113年考古題的演替地植生工程設計）。</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE14",pts:20,
q:"請說明植生工程驗收後，植物未能成功建立常見的問題類型，並說明各類問題對應的補救措施。",
s:"常見問題類型：(1)發芽率不足（種子品質/施工季節不當）；(2)初期乾旱致苗木死亡（養護不足）；(3)沖蝕沖走客土與種子（颱風豪雨/排水不良）；(4)外來種競爭排擠目的種；(5)野生動物啃食。對應補救：補播/補植、增加澆水頻率、改善排水並重新客土噴植、移除競爭外來種並補植目的種、設置防護網或忌避劑。",
d:`<h4>植生建立失敗常見問題與對應補救</h4><table><tr><th>問題類型</th><th>常見原因</th><th>補救措施</th></tr><tr><td>發芽率不足</td><td>種子品質不佳、施工季節不當（如乾季施工）、種子覆土深度不當</td><td>補播（選擇雨季前施工）；改用品質確認的種子來源；調整覆土深度與噴植配比</td></tr><tr><td>初期苗木死亡（乾旱）</td><td>種植後養護不足，特別是初期建立期缺乏澆水</td><td>增加澆水頻率（前3個月每週至少2次）；施用保水劑改善土壤保水能力；補植死亡苗木</td></tr><tr><td>沖蝕沖走客土與種子</td><td>颱風豪雨、排水設施不足、施工時機不當（雨季前未完工）</td><td>改善上方截排水系統；重新客土噴植受損區域；考慮加設金屬網或地工織物增加附著穩定性</td></tr><tr><td>外來入侵種競爭排擠</td><td>周邊存在強勢入侵種（小花蔓澤蘭、銀合歡）的種源</td><td>人工移除入侵種；補植目的種苗木加速建立優勢；定期巡查監控入侵種再生</td></tr><tr><td>野生動物啃食</td><td>山羊、野豬等動物啃食幼苗</td><td>設置防護網或圍籬；施用動物忌避劑；選擇較不易被啃食的物種</td></tr></table><div class="note">驗收後的問題排除是植生工程實務管理的重要環節，考試常以情境題形式詢問「某地植生工程完工後3個月發現XX問題，應如何處理」，回答時應先判斷問題類型（發芽/養護/沖蝕/競爭/動物），再對應提出具體補救措施，而非籠統建議「補植」。</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE15",pts:20,
q:"請說明植生工程在碳匯（Carbon sink）功能上的角色，並說明森林植生與草本植生在碳匯效果上的差異。",
s:"植生碳匯角色：透過光合作用固定大氣CO2，儲存於生物量（地上部+地下根系）與土壤有機碳。森林植生（喬木）：碳儲存量遠高於草本，且儲存時間長（樹木壽命數十至數百年），地上生物量碳儲存是主要貢獻。草本植生：碳儲存量較低，但週轉快、根系分泌物對土壤有機碳（SOC）的貢獻可能更直接顯著，適合短期快速增加土壤碳匯。",
d:`<h4>植生工程在碳匯功能上的角色</h4>植物透過光合作用將大氣CO₂轉化為有機碳，儲存於：<ul><li>地上生物量（樹幹、枝葉）</li><li>地下根系生物量</li><li>枯落物層</li><li>土壤有機碳（SOC，部分來自根系分泌物與微生物轉化）</li></ul><h4>森林植生 vs 草本植生碳匯效果比較</h4><table><tr><th>項目</th><th>森林植生（喬木）</th><th>草本植生</th></tr><tr><td>單位面積碳儲存量</td><td><b>遠高</b>（每公頃可達數十至上百ton C）</td><td>較低（每公頃通常數ton C級別）</td></tr><tr><td>碳儲存穩定性/時間</td><td>長（樹木壽命可達數十至數百年，碳被長期鎖在木質部）</td><td>短（草本植物生命週期短，地上部碳會較快透過分解循環釋回大氣）</td></tr><tr><td>主要碳儲存部位</td><td>地上生物量（木質部）為主</td><td>地下根系與根系分泌物對土壤有機碳貢獻相對重要</td></tr><tr><td>固碳速率（早期）</td><td>較慢（樹木生長初期固碳速率不如草本）</td><td>較快（草本生長快速，短期內即可大量固碳）</td></tr><tr><td>適合策略</td><td>長期穩定碳匯建立（崩塌地造林復育）</td><td>短期快速增加植被覆蓋與初步碳匯（先鋒階段）</td></tr></table><h4>水土保持工程的碳匯應用意義</h4>崩塌地復育的演替策略（先草本快速覆蓋，後續木本逐步建立）恰好同時兼顧了「短期快速碳匯累積（草本）」與「長期穩定大量碳匯（木本）」的雙重效益，這也呼應了台灣2050淨零排放路徑中，植生造林與崩塌地復育作為重要碳匯策略的政策定位。`},
{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA16",pts:20,
q:"【計算題】已知某土壤：砂粒45%、粉砂35%、黏粒20%，有機質2%，結構等級2（細粒狀），滲透等級3（中等）。依Wischmeier nomograph估算公式，M=(粉砂+極細砂%)×(100-黏粒%)。求M值，並判斷此土壤的Km大小趨勢（偏高或偏低）及原因。",
s:"M=(35+0)×(100-20)=35×80=2800。M值中等偏低，因有機質2%尚可（有機質越高K越低）、結構為細粒狀（良好，K較低）、滲透中等。綜合判斷Km約0.02~0.03，屬中低可蝕性。",
d:`<h4>M值計算</h4><div class="fm">M = (粉砂% + 極細砂%) × (100 - 黏粒%)</div>本題未給極細砂資料，僅以粉砂35%計算：<div class="fm">M = 35 × (100-20) = 35 × 80 = <b>2800</b></div><h4>Km大小趨勢判斷</h4><table><tr><th>因素</th><th>本題條件</th><th>對Km影響</th></tr><tr><td>M值（粉砂含量）</td><td>M=2800，中等</td><td>偏低（粉砂35%不算極高）</td></tr><tr><td>有機質</td><td>2%，尚可</td><td>降低Km（有機質↑→Km↓）</td></tr><tr><td>結構等級2（細粒狀）</td><td>良好團粒結構</td><td>降低Km</td></tr><tr><td>滲透等級3（中等）</td><td>排水中等</td><td>中性影響</td></tr></table><div class="fm">綜合判斷：Km ≈ 0.02~0.03（中低可蝕性）</div><div class="note">記憶口訣：「高粉砂、低有機質、差結構、低滲透」→Km高（易蝕）；反之Km低（抗蝕）。這四個因素是Km nomograph的核心，務必能判斷各因素對Km的方向性影響。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA17",pts:20,
q:"【計算題】某坡面坡長分三段：上段40m坡度5%、中段30m坡度18%、下段50m坡度8%，採Foster-Wischmeier複合坡面公式，求各段累積LS值（m=0.5）。",
s:"累積坡長：上段末40m、中段末70m、下段末120m。L₁=(40/22.13)^0.5=1.345；L₂=(70/22.13)^0.5=1.779；L₃=(120/22.13)^0.5=2.328。S₁（5%<9%）=10.8×0.05+0.03=0.570；S₂（18%≥9%）=16.8×0.18-0.50=2.524；S₃（8%<9%）=10.8×0.08+0.03=0.894。LS₁=1.345×0.570=0.767；LS₂=1.779×2.524=4.489；LS₃=2.328×0.894=2.081。",
d:`<h4>Step 1. 累積坡長與L因子（m=0.5）</h4><table><tr><th>段落</th><th>累積坡長λ</th><th>L=(λ/22.13)^0.5</th></tr><tr><td>上段末</td><td>40m</td><td>(40/22.13)^0.5=1.808^0.5=<b>1.345</b></td></tr><tr><td>中段末</td><td>70m</td><td>(70/22.13)^0.5=3.163^0.5=<b>1.779</b></td></tr><tr><td>下段末</td><td>120m</td><td>(120/22.13)^0.5=5.421^0.5=<b>2.328</b></td></tr></table><h4>Step 2. 各段S因子（注意9%門檻）</h4><table><tr><th>段落</th><th>坡度</th><th>公式選用</th><th>S值</th></tr><tr><td>上段</td><td>5%（&lt;9%）</td><td>10.8×0.05+0.03</td><td><b>0.570</b></td></tr><tr><td>中段</td><td>18%（≥9%）</td><td>16.8×0.18-0.50</td><td><b>2.524</b></td></tr><tr><td>下段</td><td>8%（&lt;9%）</td><td>10.8×0.08+0.03</td><td><b>0.894</b></td></tr></table><h4>Step 3. 各段累積LS</h4><div class="fm">LS₁=1.345×0.570=<b>0.767</b></div><div class="fm">LS₂=1.779×2.524=<b>4.489</b></div><div class="fm">LS₃=2.328×0.894=<b>2.081</b></div><div class="note">⚠️ 最常見失分點：S因子在9%是分水嶺，一定要先看坡度再選公式，不可全部套同一個公式。中段18%的LS值遠大於其他兩段，說明中段雖然坡長最短，卻是全坡面侵蝕最嚴重的區段。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA18",pts:15,
q:"【法規記憶】請默寫USLE中S因子（坡度因子）的兩段公式，並說明9%為何是分界點。",
s:"坡度<9%：S=10.8×sinβ+0.03。坡度≥9%：S=16.8×sinβ-0.50。9%為分界點原因：實測資料顯示坡度在9%附近，坡面侵蝕型態從以片蝕為主轉變為以細溝蝕為主，侵蝕速率的增加趨勢有顯著轉折，兩段線性公式各自擬合對應坡度範圍的實測資料。",
d:`<h4>S因子公式（必背，考場直接默寫）</h4><div class="fm">坡度 < 9%：S = 10.8 × sinβ + 0.03</div><div class="fm">坡度 ≥ 9%：S = 16.8 × sinβ - 0.50</div>（β為坡面角度，sinβ≈tanβ=坡度百分比/100）<h4>快速換算示例</h4><table><tr><th>坡度%</th><th>sinβ≈</th><th>公式選用</th><th>S值</th></tr><tr><td>5%</td><td>0.05</td><td>小坡度</td><td>10.8×0.05+0.03=0.57</td></tr><tr><td>9%</td><td>0.09</td><td>大坡度（臨界）</td><td>16.8×0.09-0.50=1.01</td></tr><tr><td>15%</td><td>0.15</td><td>大坡度</td><td>16.8×0.15-0.50=2.02</td></tr><tr><td>20%</td><td>0.20</td><td>大坡度</td><td>16.8×0.20-0.50=2.86</td></tr></table><div class="note">記憶技巧：小坡度公式係數小（10.8）、截距正；大坡度公式係數大（16.8）、截距負。兩個公式在9%交界點的S值應接近（驗算：小坡度公式得0.97，大坡度公式得1.01，接近但不完全相同，考試不必強求完全相等）。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA19",pts:20,
q:"【計算題】落水頭法試驗：細管截面積a=1.5 cm²，試樣截面積A=60 cm²，試樣長L=8 cm，水頭從h₁=40 cm降至h₂=15 cm，耗時t=480秒。求K值，並判斷此土壤質地類型。",
s:"K=(aL)/(At)×ln(h₁/h₂)=(1.5×8)/(60×480)×ln(40/15)=12/28800×ln(2.667)=0.0004167×0.9808≈4.09×10⁻⁴ cm/s。此K值約屬粉砂質壤土至粉質黏壤土範圍（10⁻⁴~10⁻⁵ cm/s為低滲透性土壤）。",
d:`<h4>落水頭法計算</h4><div class="fm">K = (a×L)/(A×t) × ln(h₁/h₂)</div>代入：a=1.5；L=8；A=60；t=480；h₁=40；h₂=15<div class="fm">K = (1.5×8)/(60×480) × ln(40/15) = 12/28800 × ln(2.667)</div>ln(2.667)=ln(8/3)≈0.9808<div class="fm">K = 4.167×10⁻⁴ × 0.9808 ≈ <b>4.09×10⁻⁴ cm/s</b></div><h4>質地判斷</h4><table><tr><th>K值範圍（cm/s）</th><th>對應土壤質地</th></tr><tr><td>&gt;10⁻² </td><td>粗砂、礫石（高滲透）→用恆水頭法</td></tr><tr><td>10⁻³~10⁻²</td><td>細砂、砂質壤土</td></tr><tr><td><b>10⁻⁴~10⁻³</b></td><td><b>粉砂質壤土、粉質黏壤土（本題約此範圍）</b></td></tr><tr><td>10⁻⁵~10⁻⁴</td><td>黏壤土</td></tr><tr><td>&lt;10⁻⁵</td><td>黏土（極低滲透）→落水頭法最適用</td></tr></table>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA20",pts:15,
q:"【法規記憶】請說明土壤可容許流失量（T值）在台灣的一般設定範圍，並列出決定T值高低的三個最重要因素及其影響方向。",
s:"台灣T值範圍：5~12 ton/ha/yr（深厚土層最高12，淺薄土層最低3~5）。三個最重要因素：①土層深度（最重要，越深T越高）；②土壤形成速率（越快T可適度放寬）；③土地利用目的（農地比林地要求更嚴格，T值應較低）。",
d:`<h4>台灣T值範圍（背起來）</h4><div class="fm">台灣一般T值：5~12 ton/ha/yr</div><table><tr><th>土層深度</th><th>建議T值</th></tr><tr><td>&gt;1m（深厚）</td><td>最高可達12 ton/ha/yr</td></tr><tr><td>30~100cm（中等）</td><td>5~8 ton/ha/yr</td></tr><tr><td>&lt;30cm（淺薄）</td><td>降至3~5 ton/ha/yr</td></tr></table><h4>決定T值的三大因素</h4><table><tr><th>因素</th><th>影響方向</th></tr><tr><td>①土層深度（最重要）</td><td>越深→T越高（資源庫存越大，可承受越高侵蝕速率）</td></tr><tr><td>②土壤形成速率</td><td>越快→T可適度放寬（新生速率補充侵蝕損失）</td></tr><tr><td>③土地利用目的</td><td>農耕地&lt;林地（農地對表土肥力更敏感，T值應更嚴格）</td></tr></table><div class="note">考試常問「T值的意義」配合「決定因素」，兩個概念要能合在一起回答：T值本質是「允許的資源消耗速率上限」，因此決定T值的因素都是在衡量「資源庫存量」與「消耗影響程度」。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB16",pts:20,
q:"【計算題】某矩形擋土牆，牆高H=5m（含入土深1m），底寬B=2.5m，混凝土單位重2.4 t/m³，牆體為矩形截面寬0.6m。回填砂土φ=32°、γ=1.8 t/m³、c=0，背填坡度0°。求主動土壓力Pa及其對牆趾的傾覆力矩Mo。",
s:"Ka=tan²(45-16°)=tan²29°=0.3073。Pa=½×Ka×γ×H²=½×0.3073×1.8×25=6.91 t/m。Pa作用點在H/3=5/3=1.667m處。Mo=Pa×H/3=6.91×1.667=11.52 t·m/m。",
d:`<h4>Step 1. 主動土壓力係數Ka</h4>φ=32°，背填坡度0°（水平），採Rankine公式：<div class="fm">Ka = tan²(45°-φ/2) = tan²(45°-16°) = tan²29°</div>tan29°=0.5543，tan²29°=<b>0.3073</b><h4>Step 2. 主動土壓力Pa（三角形分布）</h4>H=5m（含入土深1m，計算土壓力時用全高）<div class="fm">Pa = ½ × Ka × γ × H² = ½ × 0.3073 × 1.8 × 25 = <b>6.91 t/m</b></div><h4>Step 3. 傾覆力矩Mo（對牆趾）</h4>三角形土壓力分布，合力作用點在H/3處：<div class="fm">作用點高度 = H/3 = 5/3 = 1.667 m</div><div class="fm">Mo = Pa × H/3 = 6.91 × 1.667 ≈ <b>11.52 t·m/m</b></div><div class="note">重要提醒：本題c=0（砂土），主動土壓力為純三角形分布，合力作用在H/3處。若有凝聚力c≠0，則分布變成梯形，合力作用點計算更複雜（需分別計算矩形與三角形部分再合成）。考試遇到c≠0時千萬別忘記處理凝聚力項。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB17",pts:20,
q:"【計算題】某梯形明渠：底寬3m、邊坡1:1、水深1.5m、Manning n=0.022、坡降0.2%。求流量Q與平均流速v。",
s:"A=(3+1×1.5)×1.5=4.5×1.5=6.75 m²。P=3+2×1.5×√2=3+4.243=7.243 m。R=A/P=6.75/7.243=0.932 m。R^(2/3)=0.932^0.667=0.954。S^0.5=0.002^0.5=0.04472。Q=(1/0.022)×6.75×0.954×0.04472=45.45×6.75×0.04271≈13.09 cms。v=Q/A=13.09/6.75=1.94 m/s。",
d:`<h4>梯形斷面幾何計算</h4>底寬b=3m；邊坡z=1（1:1）；水深y=1.5m<div class="fm">A = (b+zy)×y = (3+1×1.5)×1.5 = 4.5×1.5 = <b>6.75 m²</b></div><div class="fm">P = b+2y√(1+z²) = 3+2×1.5×√2 = 3+4.243 = <b>7.243 m</b></div><div class="fm">R = A/P = 6.75/7.243 = <b>0.932 m</b></div><h4>Manning公式計算流量</h4>n=0.022；S=0.002（坡降0.2%）<div class="fm">R^(2/3) = 0.932^0.667 ≈ 0.954</div><div class="fm">S^(1/2) = √0.002 ≈ 0.04472</div><div class="fm">Q = (1/n)×A×R^(2/3)×S^(1/2) = (1/0.022)×6.75×0.954×0.04472</div><div class="fm">= 45.45 × 6.75 × 0.04271 ≈ <b>13.09 cms</b></div><h4>平均流速</h4><div class="fm">v = Q/A = 13.09/6.75 ≈ <b>1.94 m/s</b></div><div class="note">驗算福祿數：Fr=v/√(gy)=1.94/√(9.81×1.5)=1.94/3.836=0.51＜1，屬亞臨界流（緩流），符合一般渠道設計預期。若Fr>1則為急流，需考慮消能措施。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB18",pts:15,
q:"【法規記憶】請列出水土保持技術規範中，擋土牆抗滑動、抗傾倒、基礎承載力三項安全係數的靜態與地震狀態要求數值，並說明三者數值遞增的邏輯原因。",
s:"靜態：滑動≥1.5、傾倒≥2.0、承載力≥3.0。地震：滑動≥1.1、傾倒≥1.5、承載力≥2.25（各為靜態的0.75倍）。遞增邏輯：承載力破壞一旦發生是最難挽回的（地基破壞後整體失穩，無法局部修復），傾倒居次（傾斜後仍有機會加固），滑動最輕（可在滑移後補設齒槎）；破壞後果越嚴重，FS要求越高。",
d:`<h4>三項安全係數數值表（必背）</h4><table><tr><th>項目</th><th>靜態FS</th><th>地震FS</th></tr><tr><td>抗滑動</td><td>≥<b>1.5</b></td><td>≥<b>1.1</b></td></tr><tr><td>抗傾倒</td><td>≥<b>2.0</b></td><td>≥<b>1.5</b></td></tr><tr><td>基礎承載力</td><td>≥<b>3.0</b></td><td>≥<b>2.25</b></td></tr></table><div class="fm">地震FS = 靜態FS × 0.75（各項規律）</div><h4>數值遞增的邏輯（理解才能永遠不忘記）</h4><table><tr><th>破壞模式</th><th>破壞後的可修復性</th><th>FS要求</th></tr><tr><td>滑動</td><td>最可修復（補設基礎齒槎、加大底寬）</td><td>最低（1.5）</td></tr><tr><td>傾倒</td><td>居中（傾斜後仍有機會加固）</td><td>居中（2.0）</td></tr><tr><td>基礎承載破壞</td><td>最難修復（地基整體破壞，幾乎需重建）</td><td>最高（3.0）</td></tr></table><div class="note">記憶口訣：「1.5、2.0、3.0」，間距不均等（0.5和1.0），承載力特別嚴格是因為「基礎壞了等於全壞」。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB19",pts:20,
q:"【計算題】某滯洪池，集流時間tc=25分鐘，開發前洪峰Q前=1.8 cms，開發後洪峰Q後=4.2 cms。以三角形法估算永久滯洪設施所需滯洪量Vs，並計算若採用直徑25cm圓形孔口（Cd=0.6）作為出水口，孔口中心以上需多高水頭h才能達到設計出流量。",
s:"ΔQ=4.2-1.8=2.4 cms。tp=tc=25min=1500s。Vs=ΔQ×tp/2=2.4×1500/2=1800 m³。出流目標=Q前=1.8 cms。A=π/4×0.25²=0.04909 m²。Q=Cd×A×√(2gh)→1.8=0.6×0.04909×√(19.62h)=0.02945×√(19.62h)。√(19.62h)=61.12，19.62h=3735.6，h≈190m？重新算：1.8=0.02945×4.429×√h，1.8=0.1304×√h，√h=13.80，h=190.4m（明顯錯誤，應確認單位）。修正：v=Q/A=1.8/0.04909=36.67m/s，h=v²/(2gCd²)=36.67²/(2×9.81×0.36)=1344/(7.06)=190m不合理。重新：Q=Cd×A×√(2gh)，A=0.04909，1.8=0.6×0.04909×√(19.62×h)，61.12=√(19.62h)，h=190m─出流量設計應調整孔口尺寸，25cm直徑不夠大。",
s:"ΔQ=2.4 cms；Vs=2.4×1500/2=1800 m³。孔口A=π/4×0.0625=0.04909m²；出流目標1.8cms；1.8=0.6×0.04909×√(19.62h)→√(19.62h)=61.1→h≈190m（水頭過大，說明孔口太小，實際設計需加大孔徑）。",
d:`<h4>Step 1. 滯洪量（三角形法）</h4><div class="fm">ΔQ = Q後-Q前 = 4.2-1.8 = 2.4 cms</div><div class="fm">tp = tc = 25min = 1500s</div><div class="fm">Vs = ΔQ×tp/2 = 2.4×1500/2 = <b>1800 m³</b></div><h4>Step 2. 孔口水頭計算</h4>設計出流量目標 = Q前 = 1.8 cms（使開發後出流不超過開發前洪峰）<br>D=25cm=0.25m；A=π/4×0.25²=<b>0.04909 m²</b><div class="fm">Q = Cd×A×√(2gh)：1.8 = 0.6×0.04909×√(19.62×h)</div><div class="fm">1.8 = 0.02945 × √(19.62h)</div><div class="fm">√(19.62h) = 1.8/0.02945 = 61.1 → 19.62h = 3733 → h ≈ 190 m</div><div class="note">⚠️ h≈190m顯然不合理（一般滯洪池水頭僅0.5~3m）！這表示<b>25cm孔口直徑太小</b>，無法在合理水頭下通過1.8cms的設計出流量。<br><br><b>反算合理孔徑：</b>設h=1.5m（合理水頭目標），Q=Cd×A×√(2gh)→1.8=0.6×A×√(29.43)→A=1.8/(0.6×5.424)=0.553m²→D=√(4A/π)=0.839m≈<b>直徑需約85cm以上</b>。<br><br>這題的設計陷阱正是考試愛考的：「給定孔口尺寸後計算水頭，若結果不合理，要能判斷出孔口需要放大，並說明判斷邏輯」。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB20",pts:15,
q:"【法規記憶】請說明永久性與臨時性邊坡的定義差異，並列出兩者各自的靜態安全係數最低要求，說明為何臨時邊坡允許較低的安全係數。",
s:"永久性邊坡：使用年限超過2年者，靜態FS≥1.5、地震FS≥1.1。臨時性邊坡：施工期間使用（≤2年），靜態FS≥1.3、地震FS≥1.0。允許較低FS的理由：使用期短，遭遇極端事件機率低；施工期間有現場監測與人員，異常時可即時應變撤離；過高FS要求使臨時防護成本過高，不符合成本效益。",
d:`<h4>邊坡安全係數要求（必背）</h4><table><tr><th>邊坡類型</th><th>定義</th><th>靜態FS</th><th>地震FS</th></tr><tr><td>永久性邊坡</td><td>使用年限 &gt; 2年</td><td>≥<b>1.5</b></td><td>≥<b>1.1</b></td></tr><tr><td>臨時性邊坡</td><td>施工期，≤ 2年</td><td>≥<b>1.3</b></td><td>≥<b>1.0</b></td></tr></table><h4>臨時邊坡允許較低FS的三個理由</h4><ul><li><b>暴露期短：</b>使用≤2年，遭遇設計以外極端降雨或地震的機率遠低於永久邊坡</li><li><b>即時監測與應變能力：</b>施工現場有人員監測，異常時可立即暫停施工、加強支撐或撤離，比永久邊坡更有彈性</li><li><b>成本效益：</b>臨時防護若要達到FS≥1.5，防護成本可能遠超工程本身，不符合比例原則</li></ul><div class="note">FS=1.0（地震/臨時）的意義：驅動力=抵抗力，恰好平衡，沒有安全餘裕。這代表「剛好不破壞」，現實中僅在地震暫態衝擊期間短暫允許此狀態。考試常問「為何地震FS可以比靜態低」，答案就是地震是暫態事件，不是持續荷載，結構短暫承受後即恢復。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC16",pts:20,
q:"【計算題】某開發基地面積3公頃，集流時間tc=18分鐘，當地25年重現期18分鐘雨強i=105mm/hr。開發前C=0.40，開發後C=0.75。求：①需削減的洪峰流量；②永久滯洪量（三角形法）；③若採矩形堰（寬L=0.8m，Cd=0.6），出流水頭H=？",
s:"Q前=0.40×105×3/360=0.350cms；Q後=0.75×105×3/360=0.656cms。ΔQ=0.306cms。tp=18min=1080s，Vs=0.306×1080/2=165.2m³。矩形堰：Q前=0.350=(2/3)×0.6×√(2×9.81)×0.8×H^1.5=1.772×0.8×H^1.5=1.418H^1.5。H^1.5=0.350/1.418=0.2468，H=0.2468^(1/1.5)=0.2468^0.667≈0.391m。",
d:`<h4>Step 1. 洪峰流量計算（Q=CiA/360，A=3ha）</h4><div class="fm">Q前 = 0.40×105×3/360 = 126/360 = <b>0.350 cms</b></div><div class="fm">Q後 = 0.75×105×3/360 = 236.25/360 = <b>0.656 cms</b></div><div class="fm">ΔQ（需削減）= 0.656-0.350 = <b>0.306 cms</b></div><h4>Step 2. 永久滯洪量（三角形法）</h4><div class="fm">tp = tc = 18min = 1080s</div><div class="fm">Vs = ΔQ×tp/2 = 0.306×1080/2 = <b>165.2 m³</b></div><h4>Step 3. 矩形堰水頭</h4>設計出流量目標 = Q前 = 0.350 cms<div class="fm">Q = (2/3)×Cd×√(2g)×L×H^(3/2)</div><div class="fm">(2/3)×0.6×√19.62 = 0.4×4.429 = 1.772</div><div class="fm">0.350 = 1.772×0.8×H^1.5 = 1.418×H^1.5</div><div class="fm">H^1.5 = 0.350/1.418 = 0.2469</div><div class="fm">H = 0.2469^(2/3) ≈ <b>0.391 m ≈ 0.39 m</b></div><div class="note">此題完整串接三步驟：①合理化公式求洪峰→②三角形法求滯洪量→③矩形堰公式反求水頭，是規劃設計科最高頻的計算題組合，務必練到流暢。矩形堰公式中(2/3)×Cd×√(2g)=1.772是固定常數（Cd=0.6時），建議背起來省時間。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC17",pts:15,
q:"【法規記憶】請列出《水土保持法》規定水土保持計畫審核完成的期限，並說明「補正期間」如何計算。另外，核定後多久需要申報開工？逾期未申報的後果？",
s:"審核期限：受理完整計畫起60日內完成審核。補正期間：主管機關通知補正後，義務人補正期間不計入60日審核期限（補正通知→收到補正資料這段時間凍結計時）。申報開工：核定後1年內申報開工，有正當理由可申請展期最多1年。逾期後果：計畫核定失效，須重新申請（不可僅展期，需整案重審）。",
d:`<h4>水保計畫審核期限（關鍵數字，必背）</h4><table><tr><th>事項</th><th>期限</th></tr><tr><td>審核完成期限</td><td>受理<b>完整計畫</b>之日起 <b>60日</b>內</td></tr><tr><td>補正期間</td><td><b>不計入</b>60日（暫停計時）</td></tr><tr><td>核定後申報開工</td><td><b>1年</b>內申報開工</td></tr><tr><td>展期（有正當理由）</td><td>最多再延 <b>1年</b></td></tr><tr><td>逾期未申報開工</td><td>計畫核定<b>失效</b>，需重新申請</td></tr></table><h4>「60日」的陷阱</h4><ul><li>60日計算起點是「完整計畫」受理日，不是送件日</li><li>若送件資料不齊，主管機關會先要求補正，補正通知到義務人回補期間<b>不計入</b>60日</li><li>這也解釋了為何實際審核往往3~6個月才核定——多次補正往返大量消耗時間</li></ul><div class="note">記憶口訣：「完整60天、補正暫停、核定1年開工、逾期失效重來」。「完整」兩字是關鍵，資料不齊就不算開始計時。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC18",pts:20,
q:"【計算題】某農塘水面積1.2公頃，月初高程102.5m、月底高程101.8m，當月流入0.015cms、流出0.018cms，降雨120mm。以水平衡方程式求當月水面蒸發量（mm）。",
s:"水面積=12000m²，時間=30天=2,592,000s。流入=0.015×2592000=38880m³；流出=0.018×2592000=46656m³；降雨=0.12×12000=1440m³；水位下降=(102.5-101.8)×12000=8400m³（蓄水減少）。水平衡：流入+降雨=流出+蒸發+蓄水增量。蒸發=流入+降雨-流出-（-8400）=38880+1440-46656+8400=2064m³。蒸發深=2064/12000=0.172m=172mm。",
d:`<h4>水平衡方程式</h4><div class="fm">流入 + 降雨 = 流出 + 蒸發 + ΔS（蓄水增加量）</div>→ <div class="fm">蒸發 = 流入 + 降雨 - 流出 - ΔS</div><h4>各項計算（時間=30天=2,592,000s；水面積=12,000m²）</h4><table><tr><th>項目</th><th>計算</th><th>水量（m³）</th></tr><tr><td>流入</td><td>0.015×2,592,000</td><td>+38,880</td></tr><tr><td>降雨</td><td>0.12m×12,000</td><td>+1,440</td></tr><tr><td>流出</td><td>0.018×2,592,000</td><td>-46,656</td></tr><tr><td>ΔS（蓄水變化）</td><td>(102.5-101.8)×12,000=0.7×12,000（水位下降=蓄水減少）</td><td>-8,400（減少）</td></tr></table><div class="fm">蒸發 = 38,880+1,440-46,656-(-8,400) = 38,880+1,440-46,656+8,400 = <b>2,064 m³</b></div><div class="fm">蒸發深 = 2,064/12,000 = 0.172 m = <b>172 mm</b></div><div class="note">台灣農塘月蒸發量一般約80~150mm（夏季高溫可達130~160mm），172mm偏高但在合理邊緣。注意ΔS的正負方向：水位下降代表蓄水減少（ΔS為負值），帶入公式時要減去ΔS（即減去負值等於加）。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC19",pts:15,
q:"【法規記憶】請說明《水土保持技術規範》對沉砂設施設計的三個核心數字：(1)設置門檻面積；(2)淤積多少比例需清淤；(3)目標去除粒徑。並說明容量設計的計算基準。",
s:"(1)設置門檻：開發面積≥1公頃必設沉砂設施。(2)清淤門檻：淤積量達有效容量1/2時即須清除。(3)目標粒徑：去除粒徑≥0.02mm（細砂/粉砂）的顆粒（依Stokes沉降速度vs計算）。容量計算基準：簡化法V=裸露面積（ha）×100m³/ha；精確法依USLE估算輸砂量。",
d:`<h4>沉砂設施三個核心數字（必背）</h4><table><tr><th>項目</th><th>數字</th></tr><tr><td>設置門檻</td><td>開發面積 ≥ <b>1公頃</b> 必設</td></tr><tr><td>清淤門檻</td><td>淤積達有效容量 <b>1/2</b> 時即清除</td></tr><tr><td>目標去除粒徑</td><td>≥ <b>0.02 mm</b>（細砂/粉砂）</td></tr></table><h4>容量設計計算基準</h4><table><tr><th>方法</th><th>計算方式</th><th>適用</th></tr><tr><td>簡化法</td><td>V = 裸露面積(ha) × <b>100 m³/ha</b></td><td>初步估算、小型工程</td></tr><tr><td>精確法</td><td>依USLE估算施工期輸砂量，加安全係數1.5~2.0倍</td><td>正式設計、大面積開發</td></tr></table><h4>0.02mm目標粒徑的意義</h4>0.02mm是粉砂（Silt）與細砂（Fine sand）的交界附近，此粒徑在靜止水中的Stokes沉降速度約0.3~0.5mm/s，可在一般沉砂池設計水深（1~2m）與滯留時間內有效沉降。更細的黏粒（<0.002mm）沉降極慢，一般沉砂池無法去除（需化學混凝），規範以0.02mm作為現實可達到的去除目標。`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC20",pts:15,
q:"【法規記憶】請說明朗金（Rankine）主動土壓力係數Ka的公式，並列出φ=25°、30°、35°三種常見土壤的Ka值（計算到小數點後三位）。",
s:"Ka=tan²(45°-φ/2)。φ=25°：Ka=tan²(32.5°)=0.6009²=0.406。φ=30°：Ka=tan²(30°)=0.5774²=0.333。φ=35°：Ka=tan²(27.5°)=0.5206²=0.271。φ越大（土壤內摩擦角越大）Ka越小（主動土壓力越小），抗剪能力越強。",
d:`<h4>朗金主動土壓力係數公式（必背）</h4><div class="fm">Ka = tan²(45° - φ/2)</div><h4>三種常見φ值對應Ka（背起來省計算時間）</h4><table><tr><th>φ值</th><th>45°-φ/2</th><th>tan值</th><th>Ka=tan²</th></tr><tr><td>25°（一般黏土）</td><td>32.5°</td><td>tan32.5°=0.637</td><td><b>0.406</b></td></tr><tr><td><b>30°（最常考）</b></td><td><b>30°</b></td><td><b>tan30°=0.577</b></td><td><b>0.333</b></td></tr><tr><td>35°（緻密砂土）</td><td>27.5°</td><td>tan27.5°=0.521</td><td><b>0.271</b></td></tr></table><div class="fm">φ越大 → Ka越小 → 主動土壓力越小（土壤自身抗剪能力越強，對牆施加的側壓力越小）</div><div class="note">φ=30°的Ka=1/3=0.333是最常用的數值，因為台灣一般回填砂土或礫質土φ大約落在28°~32°之間，φ=30°是工程設計最常採用的保守代表值。務必把Ka=0.333在φ=30°時能夠直接默寫出來。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD16",pts:20,
q:"【計算題】某雨量站IDF公式i=600T^0.35/(t+30)^0.65（i:mm/hr, t:min, T:yr）。求：①10年重現期、延時60分鐘的設計雨強；②延時2小時的總降雨量；③若集水區面積80ha、C=0.65、tc=60分鐘，求設計洪峰流量。",
s:"①i=600×10^0.35/(60+30)^0.65=600×2.239/90^0.65=1343.4/22.45=59.84mm/hr。②總雨量=59.84×2=119.7mm（延時2hr=120min，i=600×10^0.35/(120+30)^0.65=1343.4/150^0.65=1343.4/32.24=41.67mm/hr，總量=41.67×2=83.3mm）。③Q=CiA/360=0.65×59.84×80/360=3114/360=8.65cms。",
d:`<h4>① 設計雨強（T=10yr, t=60min）</h4><div class="fm">T^0.35 = 10^0.35 = 2.239</div><div class="fm">(t+30)^0.65 = (60+30)^0.65 = 90^0.65</div>90^0.65：ln90=4.500，0.65×4.500=2.925，e^2.925=18.64（或用計算機）<div class="fm">i = 600×2.239/18.64 ≈ <b>72.0 mm/hr</b></div><div class="note">注意：計算中 90^0.65 需用計算機，考場必帶！</div><h4>② 延時2小時（t=120min）總降雨量</h4><div class="fm">(120+30)^0.65 = 150^0.65</div>150^0.65：ln150=5.011，0.65×5.011=3.257，e^3.257=25.96<div class="fm">i(120min) = 600×2.239/25.96 ≈ <b>51.7 mm/hr</b></div><div class="fm">總降雨量 = 51.7×2 = <b>103.4 mm</b></div><h4>③ 洪峰流量（tc=60min，採tc時雨強最大）</h4>採t=tc=60min對應的雨強i≈72.0mm/hr（設計最不利延時）<div class="fm">Q = C×i×A/360 = 0.65×72.0×80/360 = 3744/360 ≈ <b>10.4 cms</b></div><div class="note">IDF公式計算的關鍵在於指數運算要用計算機，考試時別忘了先確認指數的計算步驟（ln→乘指數→e^x）。洪峰計算記得採用t=tc時的雨強（而非t=2hr的雨強），因為tc時洪峰流量最大。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD17",pts:20,
q:"【計算題】以Jacob直線法分析抽水試驗：Q=3000 m³/day，距井r=100m，t=100min時s=1.2m，t=1000min時s=3.6m。求流通係數T與儲水係數S。",
s:"Δs=3.6-1.2=2.4m（一個對數循環，t比值=10）。T=2.303Q/(4πΔs)=2.303×3000/(4π×2.4)=6909/30.16=229.1m²/day。延伸至s=0求t₀：直線方程截距，Δs=2.4m/cycle，斜率=2.4/1cycle，s=0時對應t₀：由(t₀,0)和(100,1.2)：1.2/log(100/t₀)=2.4→log(100/t₀)=0.5→100/t₀=3.162→t₀=31.62min=0.02196day。S=2.25Tt₀/r²=2.25×229.1×0.02196/10000=11.32/10000=1.132×10⁻³。",
d:`<h4>Jacob直線法步驟</h4>Q=3000 m³/day；r=100m；(t₁=100min, s₁=1.2m)；(t₂=1000min, s₂=3.6m)<h4>Step 1. 求T（流通係數）</h4>t₁/t₂=1/10，一個對數循環，降深差Δs=3.6-1.2=2.4m<div class="fm">T = 2.303×Q / (4π×Δs) = 2.303×3000 / (4π×2.4) = 6909 / 30.16 ≈ <b>229 m²/day</b></div><h4>Step 2. 求t₀（直線延伸至s=0）</h4>半對數圖上直線方程：每對數循環降深2.4m<br>從(t₁=100, s₁=1.2)出發，往回延伸：<br>s=0時，需往回0.5個對數循環：log(100/t₀)=1.2/2.4=0.5<br>100/t₀=10^0.5=3.162 → t₀=31.62min=<b>0.02196 day</b><h4>Step 3. 求S（儲水係數）</h4><div class="fm">S = 2.25×T×t₀ / r² = 2.25×229×0.02196 / 100² = 11.31/10000 ≈ <b>1.13×10⁻³</b></div><div class="note">S≈10⁻³屬承壓含水層合理範圍（承壓層S：10⁻⁵~10⁻³；非承壓層S≈比出水率Sy：0.1~0.35）。Jacob法的關鍵步驟是：①找Δs（一個對數循環的降深差）→求T；②延伸直線找t₀→求S。這個兩步驟結構要練到熟。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD18",pts:15,
q:"【法規記憶】請說明合理化公式Q=CiA/360中A的單位對公式結果的影響，並說明若A改用km²、i改用mm/hr，公式常數應如何修正。",
s:"標準台灣用法：A以公頃(ha)計、i以mm/hr計、Q以cms計，常數360=3.6×100。推導：Q(m³/s)=C×i(mm/hr)/1000×A(ha)×10000/3600=C×i×A/360。若A改用km²：1km²=100ha，公式變Q=CiA×100/360=CiA/3.6（常數改3.6）。若A改用m²：1ha=10000m²，Q=C×i/1000×A/3600=C×iA/3,600,000（常數改3,600,000）。",
d:`<h4>合理化公式推導（理解常數360的由來）</h4><div class="fm">Q (m³/s) = C × [i(mm/hr)/1000 m/mm] × [A(ha) × 10000 m²/ha] / [3600 s/hr]</div><div class="fm">= C × i × A × (10000/1000/3600) = C × i × A / <b>360</b></div><h4>不同單位下的常數對照</h4><table><tr><th>面積單位</th><th>公式</th><th>常數</th></tr><tr><td>公頃（ha）【台灣標準】</td><td>Q = CiA/360</td><td><b>360</b></td></tr><tr><td>km²</td><td>Q = CiA/3.6</td><td><b>3.6</b>（1km²=100ha，常數縮小100倍）</td></tr><tr><td>m²</td><td>Q = CiA/3,600,000</td><td><b>3,600,000</b></td></tr></table><div class="note">考試最常犯的錯誤：面積給km²但忘記換算，直接代入360，導致答案差100倍。看到題目給面積時，第一步先確認單位是ha還是km²！快速判斷法：合理的台灣山坡地開發案洪峰流量通常在0.1~50 cms之間，算出來如果是幾千cms顯然是單位換算出錯了。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD19",pts:20,
q:"【計算題】某集水區tc=30分鐘，UH（1cm/1hr延時）洪峰=80cms出現在t=2hr。本次降雨：0~1hr降雨3cm，入滲率φ=0.8cm/hr；1~2hr降雨1.5cm，基流量8cms。求：①各時段有效降雨；②洪峰流量；③洪峰出現時間。",
s:"有效降雨：第1時段=3-0.8=2.2cm；第2時段=1.5-0.8=0.7cm。UH疊加：第1時段貢獻=2.2×UH（t=0起）；第2時段貢獻=0.7×UH（t=1hr起）。洪峰在t=2hr：DRO=2.2×80+0.7×（t=2hr時第2段UH）。第2段t=1hr起，t=2hr時為其第1hr，UH(1hr)=80cms×(1/2)=40cms（假設三角形UH，洪峰在2hr，1hr時為一半）。總DRO=2.2×80+0.7×40=176+28=204cms。Q=204+8=212cms。",
d:`<h4>Step 1. 各時段有效降雨（φ=0.8cm/hr）</h4><table><tr><th>時段</th><th>降雨強度</th><th>有效降雨</th></tr><tr><td>0~1hr</td><td>3.0 cm/hr</td><td>3.0-0.8=<b>2.2 cm</b></td></tr><tr><td>1~2hr</td><td>1.5 cm/hr</td><td>1.5-0.8=<b>0.7 cm</b></td></tr></table><h4>Step 2. 疊加計算（假設三角形UH）</h4>UH洪峰80cms在t=2hr（從降雨開始算），UH基底約4hr（假設對稱三角形）<br><b>第1時段貢獻（t=0起算）：</b><br>t=2hr：UH=80cms → DRO₁=2.2×80=176 cms<br><b>第2時段貢獻（t=1hr起算，即需用UH的t=1hr值）：</b><br>第2段在其自己的t=1hr時，UH值=80cms（洪峰）→ DRO₂=0.7×80=56 cms<div class="fm">洪峰DRO合計（發生在t=2hr）= 176+56 = <b>232 cms</b></div><div class="fm">洪峰Q = 232 + 8（基流）= <b>240 cms</b></div><div class="note">⚠️ 本題的關鍵是第2時段的貢獻計算：第2段從t=1hr開始，到t=2hr時已過了1hr，此時是第2段自己的「第1hr」—— 如果UH洪峰在第2hr，第1hr的UH值需查UH圖或按比例推算（若題目給UH各時刻流量表就查表；若只說洪峰值則需做合理假設）。考試時題目通常會給完整UH表，要依表查值，不要自己猜測。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD20",pts:15,
q:"【法規記憶】請說明永久滯洪設施與臨時滯洪設施的設計重現期選用原則，並說明合理化公式使用上「集流時間tc」的設計邏輯（為何設計延時選tc而非其他延時）。",
s:"永久設施採25年重現期、臨時設施（施工期）採10年重現期。tc設計邏輯：當降雨延時=tc時，集水區全部面積同時在貢獻逕流（最遠端剛好也到達出口），此時出口洪峰流量最大；延時<tc時部分面積尚未貢獻，洪峰較小；延時>tc雖全面積貢獻，但雨強更低（依IDF曲線特性），洪峰反而更小。因此tc是洪峰最大的設計最不利延時。",
d:`<h4>設計重現期選用原則</h4><table><tr><th>設施類型</th><th>設計重現期</th></tr><tr><td>臨時滯洪設施（施工期）</td><td><b>10年</b>重現期</td></tr><tr><td>永久滯洪設施（完工後）</td><td><b>25年</b>重現期</td></tr></table><h4>設計延時選tc的邏輯（重要觀念）</h4><table><tr><th>降雨延時</th><th>貢獻面積</th><th>雨強</th><th>洪峰Q</th></tr><tr><td>&lt; tc</td><td>部分（遠端未到達）</td><td>較高</td><td>較小（面積不完整）</td></tr><tr><td><b>= tc（設計選用）</b></td><td><b>全部（最遠端恰好到達）</b></td><td><b>中等</b></td><td><b>最大（最不利情況）</b></td></tr><tr><td>&gt; tc</td><td>全部</td><td>更低（IDF特性）</td><td>較小（雨強不夠）</td></tr></table><div class="note">這個「延時=tc時洪峰最大」的觀念是合理化公式的核心假設之一，也是水文設計中「設計最不利情況」概念的體現。考試常問「為何選tc作為設計延時」，答案就是「此時所有面積同時貢獻逕流，洪峰達到理論最大值」。</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE16",pts:20,
q:"【計算題】某坡面噴植工程，施工後6個月進行驗收，樣方法調查結果：樣方面積1m²×20個，各樣方記錄如下：出現百喜草的樣方=16個，百喜草總植株數=120株，百喜草總投影覆蓋面積=13m²（20個樣方合計）。求百喜草的頻度、密度、覆蓋率，並判斷是否通過技術規範驗收標準。",
s:"頻度=16/20=80%。密度=120株/20m²=6株/m²。覆蓋率=13/20=65%。技術規範要求覆蓋率≥70%，本案65%<70%，未通過驗收，需補植後6個月內重驗。",
d:`<h4>三項植生調查指標計算</h4><table><tr><th>指標</th><th>公式</th><th>計算</th><th>結果</th></tr><tr><td>頻度（Frequency）</td><td>出現樣方數/總樣方數×100%</td><td>16/20×100%</td><td><b>80%</b></td></tr><tr><td>密度（Density）</td><td>總植株數/總樣方面積</td><td>120株/20m²</td><td><b>6株/m²</b></td></tr><tr><td>覆蓋率（Cover）</td><td>植物投影覆蓋面積/總樣方面積×100%</td><td>13/20×100%</td><td><b>65%</b></td></tr></table><h4>驗收判斷</h4><table><tr><th>規範要求</th><th>本案結果</th><th>判定</th></tr><tr><td>覆蓋率≥70%</td><td>65%</td><td>❌ 未通過</td></tr></table><div class="note">依水土保持技術規範§61：草本植生覆蓋率需在施工後6個月內達70%以上，未達標者應於6個月內補植並達到規定標準後方可結案。本案需進行補植作業（加密種植或補播），並在補植後的下一個驗收時間點重新量測覆蓋率。頻度80%和密度6株/m²表現尚可，但覆蓋率才是規範的唯一查驗指標，其他指標做參考。</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE17",pts:15,
q:"【法規記憶】請說明植生工程技術規範中「客土噴植」的定義，並列出客土噴植材料通常包含的五大成分及各自功能。",
s:"客土噴植：以噴植機將含有機客土、種子、肥料、黏著劑等混合材料高壓噴附於坡面，形成含種子的人工土壤基盤，適用貧瘠或岩石裸露坡面。五大成分：①有機客土（腐植土/木纖維）－提供植生基盤；②草木種子－植生來源；③緩效複合肥料（N:P:K）－初期養分；④木纖維或稻草碎－保濕與物理固定；⑤黏著劑（PAM或乳膠）－增加材料與坡面黏著力、防雨水沖走。",
d:`<h4>客土噴植定義</h4>以噴植機（Hydroseeder）將含有機客土、種子、肥料、黏著劑等混合材料加水調配後，利用高壓噴附於坡面，形成一層厚度5~15cm含種子的人工土壤基盤，提供植物發芽生長所需的立地條件，適用於無土壤基盤的岩石或貧瘠裸露坡面。<h4>五大成分及功能（必背）</h4><table><tr><th>成分</th><th>功能</th><th>典型用量</th></tr><tr><td>①有機客土（腐植土/木纖維）</td><td>提供植物根系生長的土壤基盤，保水保肥</td><td>主體成分，佔60~70%體積</td></tr><tr><td>②草木種子</td><td>植生來源，依立地條件選擇適地適種的物種組合</td><td>依物種發芽率計算適當播種量</td></tr><tr><td>③緩效複合肥料（N:P:K）</td><td>提供植物初期生長所需氮磷鉀基礎養分</td><td>約100~200 kg/ha</td></tr><tr><td>④木纖維或稻草碎</td><td>增加材料保濕性（像海綿含水）；物理上增加材料間連結，防止整體材料在乾燥前滑落</td><td>300~500 kg/ha</td></tr><tr><td>⑤黏著劑（PAM或乳膠）</td><td>增加噴植材料與坡面的黏著力，防止降雨沖刷造成材料流失（尤其噴植初期尚未發芽時最重要）</td><td>少量但關鍵</td></tr></table>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE18",pts:20,
q:"【計算題】某坡面植生復育調查，設置5個樣區（各20m²），各樣區出現目的種（台灣相思）株數：4、6、3、5、2株，各樣區目的種基底面積（胸高截面積）：0.8、1.2、0.5、0.9、0.4 m²。計算台灣相思的相對密度、相對頻度（假設全部5樣區都有出現其他物種共3種，各種出現樣區數為：台灣相思5個、山黃麻4個、白匏子3個）、並說明IVI計算需要哪些資料才能完成。",
s:"相對密度：台灣相思總株數=4+6+3+5+2=20株，假設總株數=20+其他種（需知其他種株數才能算相對值）。各樣區都出現=頻度=5/5=100%；山黃麻=4/5=80%；白匏子=3/5=60%；總頻度=240%。台灣相思相對頻度=100/240=41.7%。IVI還需要：各物種總株數（求相對密度）、各物種胸高斷面積合計（求相對優勢度）才能完整計算。",
d:`<h4>已知資料整理</h4>5個樣區（各20m²）；台灣相思株數：4,6,3,5,2<br>台灣相思各樣區基底面積：0.8,1.2,0.5,0.9,0.4 m²<h4>Step 1. 頻度計算</h4><table><tr><th>物種</th><th>出現樣區數</th><th>頻度</th></tr><tr><td>台灣相思</td><td>5</td><td>5/5=100%</td></tr><tr><td>山黃麻</td><td>4</td><td>4/5=80%</td></tr><tr><td>白匏子</td><td>3</td><td>3/5=60%</td></tr><tr><td>頻度總和</td><td>-</td><td>240%</td></tr></table><div class="fm">台灣相思相對頻度 = 100/240 × 100% ≈ <b>41.7%</b></div><h4>Step 2. 優勢度計算（用本題給定資料）</h4>台灣相思總基底面積=0.8+1.2+0.5+0.9+0.4=<b>3.8 m²</b><br>（需要其他物種的基底面積資料才能計算相對優勢度）<h4>IVI完整計算需要的資料</h4><table><tr><th>指標</th><th>需要資料</th></tr><tr><td>相對密度（RD）</td><td>各物種在所有樣區的<b>總株數</b></td></tr><tr><td>相對頻度（RF）</td><td>各物種<b>出現的樣區數</b>（本題已有）</td></tr><tr><td>相對優勢度（RDo）</td><td>各物種的<b>胸高斷面積（基底面積）合計</b></td></tr></table><div class="fm">IVI = 相對密度(%) + 相對頻度(%) + 相對優勢度%，範圍0~300</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE19",pts:15,
q:"【法規記憶】請說明植生工程驗收的主要查驗時機、查驗對象（草本與木本各自的標準），以及未達標準的後續處理程序。",
s:"查驗時機：竣工後申報，主管機關應於30日內完成查驗。草本標準：播種後6個月內覆蓋率≥70%。木本標準：種植後1年內活存率≥70%。未達標準處理程序：應於6個月內進行補植，補植後達到規定標準再申請複驗；反覆未達標準者，主管機關可要求義務人限期改善，仍未改善者移送裁處。",
d:`<h4>植生工程驗收標準（技術規範§61，必背）</h4><table><tr><th>植生類型</th><th>查驗時機</th><th>合格標準</th></tr><tr><td>草本植生（噴植、播種）</td><td>播種後<b>6個月</b>內</td><td>覆蓋率 ≥ <b>70%</b></td></tr><tr><td>木本植生（苗木栽植）</td><td>種植後<b>1年</b>內</td><td>活存率 ≥ <b>70%</b></td></tr></table><h4>查驗期限</h4>義務人竣工後申報，主管機關應於<b>30日</b>內完成查驗。<h4>未達標準的後續處理程序</h4><ol style="padding-left:16px;margin:8px 0"><li>未達標準 → 義務人應於<b>6個月</b>內完成補植</li><li>補植後再申請複驗</li><li>複驗仍未達標 → 主管機關限期改善</li><li>限期仍未改善 → 移送裁處（依水保法相關罰則）</li></ol><div class="note">記憶口訣：「草6個月70覆蓋；木1年70活存；未達標6個月補植複驗」。三個「6」很好記：驗收後複查時限都是6個月、草本驗收時間也是6個月，這個數字在植生工程科非常重要。</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE20",pts:20,
q:"【計算題/概念】某海岸沙丘防風林高度H=12m，密度75%（疏透型）。依防風林保護距離理論，求：①有效防護距離範圍；②背風側距林帶6H處的風速降低百分比（假設在有效保護範圍內，風速降低與距離關係近似線性）；③若沙丘移動沙粒起動風速為4m/s，原風速為10m/s，需在距保護目標多遠處種植防風林才能使保護目標處風速低於起動風速？",
s:"①有效防護距離=15~20×H=15×12~20×12=180~240m。②6H=72m，在180m範圍內，降低比例（線性假設）=6H/20H×最大降低率=30%×70%=21%（粗略估算）；更精確：密度75%可降低50~70%，取平均60%，在6H（距離不到1/3）降低效果約30~40%。③需降低到4m/s，降低比例=(10-4)/10=60%。防風林密度75%，最大降低60~70%，中線60%在15H距離達到；需在距保護目標15H=180m處種植防風林，使保護目標剛好在最大有效防護距離端，風速可降至≈4m/s。",
d:`<h4>防風林保護距離計算</h4>H=12m；密度75%（疏透型最佳範圍60~80%）<h4>① 有效防護距離</h4><div class="fm">有效防護距離 = 15~20 × H = 15×12 ~ 20×12 = <b>180~240 m</b></div><h4>② 6H處風速降低估算</h4>密度75%（最佳疏透型）→最大可降低風速<b>50~70%</b>（取60%）<br>線性近似（在有效範圍內）：6H=72m；有效範圍上限≈20H=240m<div class="fm">6H處風速降低估算 ≈ 60% × (6H/20H的位置效果) ≈ <b>約40~50%降低</b></div>（實際分布非線性，近林帶最大，遠端逐漸減弱）<h4>③ 所需防風林位置</h4>需降低比例=(10-4)/10=<b>60%</b><br>密度75%可達60%降低，通常在距林帶約<b>10~15H</b>距離內有效達到60%降低<div class="fm">種植位置距保護目標 ≈ 10×12 = <b>120m</b> 處</div><div class="note">實際防風林設計中，風速降低與距離的關係非完全線性（近林帶降低效果更顯著），本題採線性簡化估算，考試遇到此類題時，重要的是能說明「密度影響最大降低率、距離影響有效範圍」這個核心概念，並合理估算，不必過度追求精確數值。</div>`},
{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA21",pts:20,
q:"請說明土壤質地三角圖（USDA系統）的三軸組成，並判斷下列三種土壤各屬何種質地：①砂粒60%、粉砂20%、黏粒20%；②砂粒20%、粉砂60%、黏粒20%；③砂粒30%、粉砂30%、黏粒40%。並說明三種質地對入滲率與可蝕性的影響方向。",
s:"三軸：砂粒（Sand，2~0.05mm）、粉砂（Silt，0.05~0.002mm）、黏粒（Clay，<0.002mm）三組分百分比。①砂60/粉20/黏20→壤土（Loam）；②砂20/粉60/黏20→粉砂壤土（Silt loam）；③砂30/粉30/黏40→黏土（Clay）。入滲率：壤土中等、粉砂壤土偏低、黏土最低。可蝕性：粉砂壤土K值最高（粉砂含量最高，缺凝聚力）、壤土中等、黏土較低（凝聚力強）。",
d:`<h4>USDA土壤質地三角圖（必懂架構）</h4>三個軸分別代表：<ul><li><b>砂粒（Sand）：</b>2~0.05mm，沿底邊軸</li><li><b>粉砂（Silt）：</b>0.05~0.002mm，沿右邊軸</li><li><b>黏粒（Clay）：</b>&lt;0.002mm，沿左邊軸</li></ul>三組分之和=100%，在三角圖上交點即為質地類別。<h4>三種土壤質地判斷</h4><table><tr><th>土壤</th><th>組成</th><th>質地名稱</th></tr><tr><td>①</td><td>砂60%/粉20%/黏20%</td><td><b>壤土（Loam）</b>——中心偏砂側</td></tr><tr><td>②</td><td>砂20%/粉60%/黏20%</td><td><b>粉砂壤土（Silt loam）</b>——粉砂主導</td></tr><tr><td>③</td><td>砂30%/粉30%/黏40%</td><td><b>黏土（Clay）</b>——黏粒超過40%</td></tr></table><h4>三種質地對水文與可蝕性的影響</h4><table><tr><th>性質</th><th>壤土</th><th>粉砂壤土</th><th>黏土</th></tr><tr><td>入滲率</td><td>中等（最佳農業土壤）</td><td>偏低（大孔隙少）</td><td>最低（幾乎不透水）</td></tr><tr><td>K值（可蝕性）</td><td>中等</td><td><b>最高</b>（粉砂缺凝聚力，最易被剝離）</td><td>較低（黏粒間強烈電化學鍵結）</td></tr><tr><td>保水力</td><td>最佳（PAW最大）</td><td>中等偏高</td><td>高但部分不可利用</td></tr></table><div class="note">記憶口訣：質地圖的使用——找到三個組分百分比後，分別從三個軸往內畫平行線，三線交點即為該土壤的質地類別位置。12種質地類別中，「壤土（Loam）」在三角圖中心，農業生產力最佳；「粉砂壤土（Silt loam）」可蝕性最高，台灣丘陵地常見，是USLE計算中K值最值得關注的類型。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA22",pts:20,
q:"請說明泥砂傳遞比（Sediment Delivery Ratio, SDR）的定義，並說明SDR受哪些集水區特性影響。若某集水區USLE估算年坡面流失量為500 ton/ha/yr、集水區面積10ha，SDR=0.25，求年輸出泥砂量。",
s:"SDR=集水區出口年輸砂量/集水區總年侵蝕量，代表坡面侵蝕的土砂實際輸出到集水區出口的比例（餘下在坡腳、溪道或凹地沉積）。影響因素：集水區面積（越大SDR越低，因輸送距離越長沉積機會越多）、地形連通性（溪道連通越好SDR越高）、植生覆蓋、坡度。計算：總流失量=500×10=5000 ton/yr；SDR=0.25，年輸出量=5000×0.25=1250 ton/yr。",
d:`<h4>泥砂傳遞比（SDR）定義</h4><div class="fm">SDR = 集水區出口年輸砂量 / 集水區年總侵蝕量</div>SDR介於0~1之間，值越低代表越多侵蝕土砂在集水區內部沉積，未能輸出到出口。<h4>SDR的物理意義</h4>坡面侵蝕產生的土砂，並非全部直接輸出集水區——大量土砂在坡腳凹地、水體前緣、溪道沿岸等地方重新沉積，SDR描述「實際被輸出的比例」。<h4>影響SDR的集水區特性</h4><table><tr><th>因素</th><th>影響方向</th></tr><tr><td>集水區面積</td><td>越大→輸送距離越長→SDR越低（典型關係：SDR∝A^(-0.2)）</td></tr><tr><td>地形連通性</td><td>溪道直接連通各侵蝕源→SDR高；侵蝕源與溪道間有植生緩衝→SDR低</td></tr><tr><td>地形坡度</td><td>整體坡度越陡→輸送能力越強→SDR越高</td></tr><tr><td>植生覆蓋</td><td>覆蓋率高→攔截坡面輸砂→SDR降低</td></tr></table><h4>計算年輸出泥砂量</h4><div class="fm">年總侵蝕量 = 500 ton/ha/yr × 10 ha = 5,000 ton/yr</div><div class="fm">年輸出量 = 5,000 × SDR = 5,000 × 0.25 = <b>1,250 ton/yr</b></div><div class="note">USLE估算的A值是坡面侵蝕量，要轉換成集水區出口的輸砂量必須乘以SDR，這是常被忽略的步驟。台灣山坡地SDR典型值0.1~0.5，集水區越小SDR越高（接近源頭時幾乎全部輸出），越大越低（長途輸送損耗大）。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA23",pts:20,
q:"請說明RUSLE（修正通用土壤流失公式）相較於USLE的主要改進項目，並說明哪些改進對台灣山坡地的應用有特別重要的意義。",
s:"RUSLE主要改進：①R因子：更精確的計算方法，增加月、季節變化；②K因子：增加季節性K值變化（考量土壤冬春季凍融）；③LS因子：新增複合坡形LS計算（凸坡/凹坡/不規則坡），Foster公式延伸；④C因子：改為逐月子因子乘積，反映植生隨季節的變化（台灣尤其重要）；⑤P因子：新增等高草帶、覆蓋作物等的量化計算。對台灣重要的改進：C因子季節性（颱風季裸露vs冬季植生）與LS因子複合坡形計算。",
d:`<h4>RUSLE vs USLE 主要改進對照</h4><table><tr><th>因子</th><th>USLE（原版）</th><th>RUSLE（修正版）改進</th></tr><tr><td>R（降雨侵蝕力）</td><td>年均EI₃₀累加</td><td>增加月分布，考慮半月時段分布變化</td></tr><tr><td>K（土壤可蝕性）</td><td>單一年均值</td><td>引入季節性K值（冬春凍融循環影響）</td></tr><tr><td><b>LS（地形因子）</b></td><td>僅適用均一坡度</td><td><b>新增複合坡形計算（凸坡、凹坡、不規則坡），引入Foster-McCool公式</b></td></tr><tr><td><b>C（覆蓋管理）</b></td><td>單一年均C值</td><td><b>改為逐月子因子乘積（PLU、CC、SC、SR、SM五個子因子），反映植生季節變化</b></td></tr><tr><td>P（保育措施）</td><td>有限的查表數值</td><td>新增等高草帶、覆蓋作物等更多措施的P值計算</td></tr></table><h4>對台灣特別重要的改進</h4><ul><li><b>C因子季節性（最重要）：</b>台灣農業有明顯季節性——梅雨颱風季（6~10月）農地輪作後裸露期恰逢最高雨強，C值偏高；冬季植生覆蓋較好，C值較低。逐月C值計算比年均C值更能反映這個高風險裸露時段</li><li><b>LS因子複合坡形：</b>台灣山坡地常見上陡下緩的凸形坡、梯田後緣等複合地形，新的Foster-McCool公式能更準確描述這些複雜地形的侵蝕空間分布</li></ul>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA24",pts:20,
q:"請說明土壤毛細現象（Capillarity）的物理原理，並說明毛細上升高度與土壤孔徑的關係公式hc=4T/γwd（T=表面張力，γw=水單位重，d=孔徑），以及毛細現象在邊坡穩定上的正反兩面意義。",
s:"原理：土壤孔隙如毛細管，水分子與固體間的附著力（adhesion）大於水分子間的凝聚力（cohesion）時，水面呈凹液面，產生向上的毛細壓力使水上升。公式：hc=4T/γwd，孔徑d越小→hc越高（黏土毛細上升可達數公尺，砂土僅數公分）。邊坡穩定意義：正面—非飽和帶毛細壓力產生「假凝聚力（apparent cohesion）」，增加有效應力與剪力強度；反面—若地下水位上升至毛細上升區，原有的毛細壓力消失，有效應力突然降低，可能觸發邊坡破壞。",
d:`<h4>毛細現象物理原理</h4>土壤孔隙中，水分子與土粒表面的<b>附著力（Adhesion）</b>大於水分子間的<b>凝聚力（Cohesion）</b>，使水面形成凹液面（meniscus），凹液面產生向上的毛細壓力，克服重力將水引上。<h4>毛細上升高度公式</h4><div class="fm">hc = 4T / (γw × d)</div>T=水的表面張力（≈0.073 N/m，20°C）；γw=水的單位重（9810 N/m³）；d=孔隙直徑（m）<table><tr><th>土壤類型</th><th>孔徑d</th><th>毛細上升高度hc</th></tr><tr><td>粗砂</td><td>~1mm</td><td>~3cm（幾乎無毛細效果）</td></tr><tr><td>細砂</td><td>~0.1mm</td><td>~30cm</td></tr><tr><td>粉砂</td><td>~0.02mm</td><td>~1.5m</td></tr><tr><td>黏土</td><td>~0.002mm</td><td>可達10m以上</td></tr></table><h4>邊坡穩定的正反兩面意義</h4><table><tr><th>面向</th><th>說明</th></tr><tr><td><b>正面：假凝聚力（有利穩定）</b></td><td>非飽和帶毛細壓力相當於「負的孔隙水壓」，增加有效應力（σ'=σ-u，u為負值），使剪力強度提高，這是非飽和黏土坡面即使沒有真正凝聚力仍能維持垂直面的原因</td></tr><tr><td><b>反面：假凝聚力驟失（危險）</b></td><td>降雨入滲使地下水位上升至毛細帶時，孔隙水壓由負轉正，原有的假凝聚力瞬間消失，有效應力急劇降低，可能觸發邊坡突然破壞——這正是乾旱後突然降雨「第一場雨」危險性高的原因之一</td></tr></table>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA25",pts:20,
q:"請比較USLE、RUSLE、WEPP三種土壤侵蝕推估模式的模式性質（經驗vs物理）、適用尺度、主要輸入資料需求與優缺點。",
s:"USLE：經驗統計，坡面尺度，輸入R/K/L/S/C/P，簡單快速但無空間過程、無法模擬單場事件。RUSLE：改良經驗統計，坡面/小集水區，輸入更細緻（季節性因子），較精確但仍有統計模式限制。WEPP（Water Erosion Prediction Project）：物理過程模式，坡面/小流域，輸入氣候/土壤/植生/地形詳細資料，能模擬單場事件、空間分布，精確但資料需求大且率定困難。",
d:`<h4>三種模式比較（核心知識點整合）</h4><table><tr><th>項目</th><th>USLE</th><th>RUSLE</th><th>WEPP</th></tr><tr><td>模式性質</td><td>經驗統計（regression）</td><td>改良經驗統計</td><td>物理過程（physically-based）</td></tr><tr><td>適用尺度</td><td>坡面（均一條件）</td><td>坡面至小集水區</td><td>坡面至小流域</td></tr><tr><td>時間解析度</td><td>年均</td><td>年均（可分月）</td><td>單場降雨事件至長期</td></tr><tr><td>輸入資料</td><td>R、K、L、S、C、P六因子（少）</td><td>六因子+季節性子因子（中）</td><td>氣候（逐日）、土壤水文性質、植生生長模型、詳細地形（多）</td></tr><tr><td>輸出結果</td><td>年均坡面侵蝕量（單一數值）</td><td>年均坡面侵蝕量（可分月）</td><td>逐場事件侵蝕量、空間分布、泥砂輸出歷線</td></tr><tr><td>主要優點</td><td>簡單、廣泛驗證、工程設計常用</td><td>比USLE精確、考慮季節與複合地形</td><td>機制清楚、可預測未量測情境、能模擬空間分布</td></tr><tr><td>主要缺點</td><td>無物理過程、不適用溝蝕與大尺度、僅年均</td><td>仍為統計模式，仍有USLE的根本限制</td><td>資料需求大、率定驗證困難、計算耗時、不確定性高</td></tr></table><div class="note">工程實務選用邏輯：設計計算（沉砂池容量、臨時防護）→USLE/RUSLE；研究或精確評估特定事件空間分布→WEPP。台灣水保計畫規範目前仍以USLE/RUSLE為主要工具。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB21",pts:20,
q:"農路設計規範中，縱坡度長度限制公式L≤40/(G-3.3)^4（G=縱坡度%），請說明此公式的設計邏輯，並計算：①坡度6%時的最大允許連續長度；②坡度8%時的最大允許連續長度；③若連接兩段坡度8%各30m的農路，計算連續坡度當量值是否超限。",
s:"①L(6%)=40/(6-3.3)^4=40/2.7^4=40/53.14=0.753m（極短，說明6%坡度需頻繁設置休止段）。②L(8%)=40/(8-3.3)^4=40/4.7^4=40/487.1=0.082m。③兩段各30m，超出量=30/0.753+30/0.082=39.8+365.9=405.7（單位當量），遠超限制，需在中間設置休止段（坡度≤3.3%的平坦段）。",
d:`<h4>農路縱坡度長度限制公式</h4><div class="fm">L ≤ 40/(G-3.3)⁴（G=縱坡度%，G>3.3%時適用）</div><b>設計邏輯：</b>農路縱坡度越陡，車輛煞車負擔越重，允許連續行駛的距離越短，超過限制需設「休止段（Grade break）」讓車輛煞車冷卻。公式中3.3%是基準坡度（以下無需限制），4次方關係使坡度稍增就急劇縮短允許長度。<h4>計算各坡度最大允許長度</h4><div class="fm">① G=6%：L = 40/(6-3.3)⁴ = 40/2.7⁴ = 40/53.14 ≈ <b>0.75 m</b></div><div class="fm">② G=8%：L = 40/(8-3.3)⁴ = 40/4.7⁴ = 40/487.1 ≈ <b>0.082 m</b></div><div class="note">⚠️ 這兩個數字看起來驚人地短（&lt;1m），但這正是公式的警示意義：6%和8%的農路坡度在沒有適當休止段下，幾乎任何長度都超限。</div><h4>連續坡度當量計算</h4>消耗當量 = 各段實際長度 / 對應最大允許長度<div class="fm">當量總和 = 30/0.75 + 30/0.082 = 40 + 365.9 = <b>405.9（遠超限制）</b></div>結論：兩段8%各30m的農路設計嚴重超限，需在中間（或兩段之間）插入<b>休止段（坡度≤3.3%，長度≥30m）</b>，消化累積坡度負擔後才能繼續接坡段。<h4>避車道配置（補充）</h4>農路設計除縱坡度限制外，還需在適當間距設置避車道（寬2.5m、長20m），使對向車輛得以交會。`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB22",pts:20,
q:"請說明跌水工（Drop structure）下游消能設施——護坦（Apron）與消力池（Stilling basin）的設計原理差異，並說明水躍（Hydraulic jump）在消能上的作用機制。",
s:"護坦：在跌水落點下游設置平坦混凝土板，延長水流作用距離，逐步消散動能，適用落差小、流速不過高的場合。消力池：在護坦基礎上加深形成池槽，利用水躍（從超臨界流Fr>1轉為亞臨界流Fr<1）集中消能，消能效率60~70%，適用大流量高落差。水躍消能機制：超臨界流進入水池後，流深突然增加、流速降低，動能轉化為紊流渦動能再消散為熱能，水躍長度約為躍後水深的5~7倍。",
d:`<h4>護坦 vs 消力池設計原理</h4><table><tr><th>項目</th><th>護坦（Apron）</th><th>消力池（Stilling basin）</th></tr><tr><td>設計原理</td><td>延長水流在硬面上的作用距離，透過摩擦逐步消散動能</td><td>利用<b>水躍</b>集中消能，在短距離內完成超臨界→亞臨界轉換</td></tr><tr><td>消能效率</td><td>較低（20~40%）</td><td>較高（<b>60~70%</b>）</td></tr><tr><td>適用場合</td><td>落差小（&lt;1m）、流速不高、中小流量</td><td>大落差、大流量，如溢洪道末端、高固床工下游</td></tr><tr><td>結構複雜度</td><td>較簡單</td><td>較複雜（需精確控制水躍位置）</td></tr></table><h4>水躍（Hydraulic Jump）消能機制</h4><div class="fm">水躍發生條件：Fr₁ > 1（超臨界流）→ 水躍後 → Fr₂ < 1（亞臨界流）</div>水躍中發生的過程：<ul><li>流速急劇從高（超臨界）降至低（亞臨界）</li><li>流深急劇從淺增至深</li><li>超額動能轉化為<b>強烈紊流渦動</b>，最終以熱能形式消散</li><li>水面出現劇烈翻騰（可見白色泡沫），這就是動能消散的視覺表現</li></ul><div class="fm">水躍後水深共軛關係（Sequent depth）：y₂/y₁ = ½[√(1+8Fr₁²)-1]</div><div class="note">工程應用：設計消力池時需確保水躍在池內發生（不能讓水躍跑到池外的軟質河床，否則會造成嚴重沖蝕）。調控水躍位置的方法包括：調整護坦高程、設置消能塊（Baffle blocks）。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB23",pts:20,
q:"請說明石籠（Gabion）護岸的構造特性、適用流速範圍，並說明其相較於混凝土護岸在生態性與工程耐久性上的優缺點比較。",
s:"構造：鋼絲網籠（鍍鋅或PVC被覆）填充天然礫石，單元0.5~1m³，可堆疊或疊置。適用流速：3~5m/s（依石材粒徑與鋼絲強度）。生態優點：透水性好（維持地下水交換）、孔隙提供生物棲地、可植生（縫隙）、隨沉陷自動調整（柔性）。工程缺點：鋼絲腐蝕老化（20~30年壽命）、填充石料易流失（若鋼絲破損）、維護需定期檢查更換。混凝土護岸優點：耐久性強（50+年）、強度高；缺點：不透水（阻斷地下水）、生態廊道切斷、脆性（沉陷易開裂）。",
d:`<h4>石籠（Gabion）構造特性</h4><ul><li><b>構成：</b>鍍鋅鋼絲網籠（或PVC被覆）填充天然礫石，石料粒徑通常80~200mm</li><li><b>單元尺寸：</b>標準1m×1m×0.5m或1m×1m×1m，可現場靈活堆疊組合</li><li><b>力學特性：</b>柔性結構，可適應地基沉陷而不開裂（與混凝土剛性結構的根本差異）</li></ul><h4>適用流速</h4>依石籠填充石料粒徑與鋼絲強度，石籠護岸容許流速約<b>3~5 m/s</b>（比單純拋石強，但低於混凝土）。<h4>石籠 vs 混凝土護岸全面比較</h4><table><tr><th>項目</th><th>石籠護岸</th><th>混凝土護岸</th></tr><tr><td>透水性</td><td>✓ 高（孔隙約35%）</td><td>✗ 幾乎不透水</td></tr><tr><td>生態廊道</td><td>✓ 維持連通（底棲生物、根系可穿透）</td><td>✗ 完全阻斷</td></tr><tr><td>植生可能性</td><td>✓ 孔隙可植生，覆蓋後自然融入環境</td><td>✗ 難以植生</td></tr><tr><td>抗沉陷能力</td><td>✓ 柔性，可適應不均勻沉陷</td><td>✗ 脆性，沉陷易裂</td></tr><tr><td>耐久性</td><td>△ 20~30年（鋼絲腐蝕），PVC被覆可延長</td><td>✓ 50年以上</td></tr><tr><td>容許流速</td><td>3~5 m/s</td><td>可達8~10 m/s</td></tr><tr><td>施工難度</td><td>較簡單，就地取材礫石</td><td>較複雜，需模板、養護</td></tr><tr><td>維護需求</td><td>需定期檢查鋼絲腐蝕</td><td>定期檢查裂縫</td></tr></table><div class="note">現代生態工程趨勢：在容許流速範圍內優先採用石籠護岸，必要時在石籠面填土並種植鄉土植物，達到「工程+生態」雙重效益。混凝土護岸保留給流速>5 m/s或結構安全要求極高（如橋梁基礎旁）的場合。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB24",pts:20,
q:"請說明預鑄護岸塊（如ACB，Articulated Concrete Block）在水流中可能發生的起動破壞條件，並說明設計上如何以安全係數（FS≥1.5）確保不起動。",
s:"起動破壞：水流拖曳力FD與升力FL合力超過塊體有效重量W'的抵抗力時，塊體滑動或翻轉起動。力學條件（斜面）：驅動力=FD×cosθ+W'×sinθ；抵抗力=f×(W'×cosθ-FL-FD×sinθ)。FS=抵抗力/驅動力≥1.5。設計方法：選用足夠重量的塊體（增加W'）、採用互鎖型（增加f）、控制設計流速使FD不超過安全值。",
d:`<h4>預鑄護岸塊受力分析（斜面上，坡角θ）</h4>塊體受到的主要力：<ul><li><b>有效重量 W'：</b>（γ_block-γ_water）×V，方向向下</li><li><b>拖曳力 FD：</b>水流對塊體施加的水平推力（=CD×A_s×ρw×v²/2）</li><li><b>升力 FL：</b>水流在塊體上下壓差產生的向上力（=CL×A_n×ρw×v²/2）</li></ul><h4>起動條件（以沿斜面滑動模式）</h4><div class="fm">驅動力 = FD×cosθ + W'×sinθ</div><div class="fm">抵抗力 = f×(W'×cosθ - FL - FD×sinθ)</div>f=塊體與基礎的摩擦係數（互鎖型ACB通常f更高）<div class="fm">FS = 抵抗力/驅動力 = f×(W'cosθ-FL-FD sinθ) / (FD cosθ+W'sinθ) ≥ <b>1.5</b></div><h4>設計確保不起動的方法</h4><table><tr><th>方法</th><th>說明</th></tr><tr><td>增加塊體重量W'</td><td>選用較重（較厚）的塊體，直接增大抵抗力矩</td></tr><tr><td>採用互鎖設計</td><td>ACB塊體相互嵌合，使f等效提高，增加抵抗力</td></tr><tr><td>控制設計流速</td><td>確認最大設計流速下的FD、FL不超過安全範圍，或選擇容許流速更高的較重塊體</td></tr><tr><td>設計坡角</td><td>坡度越陡θ越大→W'sinθ（驅動分量）越大→需更重塊體或更高f</td></tr></table><div class="note">這題的計算公式直接對應到113年考古題「推導預鑄塊起動破壞條件式」，是考試明確出現過的推導題型，務必理解力的分解與安全係數的設定邏輯。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB25",pts:15,
q:"【法規記憶】請說明水土保持技術規範中，農路縱坡度、避車道、路面寬度的主要設計規定，並說明避車道的設置目的。",
s:"縱坡度：一般≤12%，最大不超過18%（需配合路面材質與車速）；坡度超過3.3%需考慮縱坡度長度限制。避車道：長20m、寬2.5m，設置間距：一級農路（30km/h）400m、二級農路（20km/h）300m、三級農路（10km/h）150m。路面寬度：一級≥4.5m、二級≥3.5m、三級≥3.0m。避車道目的：單線農路對向車輛交會用，避免因無法交會而封路。",
d:`<h4>農路主要設計規定（必背數字）</h4><table><tr><th>規定項目</th><th>規定值</th></tr><tr><td>縱坡度上限</td><td>一般≤12%；最大不超過18%</td></tr><tr><td>縱坡長度限制（G>3.3%）</td><td>L≤40/(G-3.3)⁴（需設休止段）</td></tr><tr><td>路面寬度（一級）</td><td>≥4.5m（可雙向通行）</td></tr><tr><td>路面寬度（二級）</td><td>≥3.5m</td></tr><tr><td>路面寬度（三級）</td><td>≥3.0m（單線，需設避車道）</td></tr></table><h4>避車道規定</h4><table><tr><th>農路級別</th><th>設計速度</th><th>避車道間距</th><th>避車道尺寸</th></tr><tr><td>一級農路</td><td>30 km/h</td><td>≤400m</td><td>寬2.5m、長20m</td></tr><tr><td>二級農路</td><td>20 km/h</td><td>≤300m</td><td>寬2.5m、長20m</td></tr><tr><td>三級農路</td><td>10 km/h</td><td>≤150m</td><td>寬2.5m、長20m</td></tr></table><h4>避車道設置目的</h4>農路通常為單線道（寬度不足兩車交會），在規定間距內設置避車道，提供對向車輛讓車的空間，確保農路通行暢通。<div class="note">記憶口訣：避車道「寬2.5×長20m」固定尺寸；間距隨速度增加——10km/h→150m、20km/h→300m、30km/h→400m（速度每增10km/h，間距增加100~150m）。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC21",pts:20,
q:"請說明水土保持技師簽證的種類，並列表說明各種簽證的時機、簽證技師資格與法規依據。",
s:"簽證種類：①規劃設計簽證（送審前）；②施工監造簽證（施工期間）；③竣工查驗簽證（完工後）。法規依據：水保法§17、技師法。可簽證技師資格：水土保持技師（主要）、大地工程技師、土木工程技師、水利工程技師（各依其執業範圍）。重要：技師需依法登記執業，並對簽證內容負連帶法律責任。",
d:`<h4>水土保持技師簽證制度（必背架構）</h4>依《水土保持法》第17條及《技師法》，水土保持計畫之規劃設計及施工監造，應由依法登記執業之技師規劃設計及監造，技師對其簽證內容負法律責任。<table><tr><th>簽證種類</th><th>時機</th><th>主要內容</th></tr><tr><td><b>規劃設計簽證</b></td><td>計畫送審前</td><td>對計畫書圖、水文計算、設施設計圖與計算書進行審查確認，確認符合技術規範後簽名蓋章</td></tr><tr><td><b>施工監造簽證</b></td><td>施工期間（定期赴工地）</td><td>確認施工過程符合核定設計圖說；重要工項完成後出具監造紀錄；發現異常應立即通報並要求改善</td></tr><tr><td><b>竣工查驗簽證</b></td><td>完工後申報時</td><td>確認各水土保持設施均依核定圖說完成施作；出具竣工報告供主管機關查驗</td></tr></table><h4>可簽證技師資格</h4><table><tr><th>技師類別</th><th>簽證範圍</th></tr><tr><td><b>水土保持技師</b></td><td>所有水土保持計畫（最完整）</td></tr><tr><td>大地工程技師</td><td>可執行地質、地盤、邊坡相關設計監造</td></tr><tr><td>土木工程技師</td><td>可執行土木結構設施部分</td></tr><tr><td>水利工程技師</td><td>可執行水文水利計算設施部分</td></tr></table><div class="note">技師簽證的法律意義：技師簽證不只是行政程序，技師對其簽證的設計、監造內容負有民事與刑事的連帶法律責任，這也是水土保持計畫品質保障的核心機制。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC22",pts:20,
q:"請說明SPT標準貫入試驗與岩心RQD的定義、試驗方式與工程應用，並說明N值（SPT）=10、30、50分別代表什麼土壤緊密狀態。",
s:"SPT：63.5kg落錘，落高76cm，打入分裂管（51mm）入土30cm的錘擊數N值。N<10鬆軟；N=10~30中密；N>50緻密（或拒打）。應用：推估土壤強度（φ、cu）、承載力、液化潛能。RQD：岩心長度≥10cm之累計長度/鑽進長度×100%；RQD>75%良好、50~75%中等、25~50%差、<25%極差。應用：評估岩盤可開挖性、隧道支撐設計、岩盤承載力。",
d:`<h4>SPT（標準貫入試驗）</h4><b>試驗方式：</b>以63.5kg重錘（落高76cm）自動落下，打入分裂型取樣管（外徑51mm），計算打入土層30cm所需錘擊數N值。<table><tr><th>N值範圍</th><th>土壤緊密狀態</th><th>應用意義</th></tr><tr><td>N &lt; 4</td><td>極鬆（很軟的黏土或鬆砂）</td><td>承載力極低，需特殊處理</td></tr><tr><td>N = 4~10</td><td>鬆軟</td><td>承載力低，不宜直接基礎</td></tr><tr><td>N = 10~30</td><td>中密實</td><td>一般建築物可用，需計算確認</td></tr><tr><td>N = 30~50</td><td>密實</td><td>良好承載力</td></tr><tr><td>N &gt; 50（拒打）</td><td>極密實或岩石</td><td>承載力高，但需確認是否為孤石</td></tr></table><h4>RQD（岩石品質指標）</h4><div class="fm">RQD = Σ（岩心長度≥10cm的各段長度）/ 鑽進長度 × 100%</div><table><tr><th>RQD值</th><th>岩石品質</th></tr><tr><td>&gt;90%</td><td>優良</td></tr><tr><td>75~90%</td><td>良好</td></tr><tr><td>50~75%</td><td>中等</td></tr><tr><td>25~50%</td><td>差</td></tr><tr><td>&lt;25%</td><td>極差</td></tr></table><div class="note">SPT和RQD是地質鑽探的兩大必做項目：SPT用於土層（評估強度與液化），RQD用於岩石段（評估岩盤品質）。兩者在水保計畫的鑽探報告中必須同時呈現，是技師在審查計畫時核對地質調查完整性的基本指標。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC23",pts:20,
q:"請說明坡地崩塌調查應包含的主要調查項目，並說明現地調查與室內分析各自的角色分工。",
s:"現地調查項目：崩塌位置（GPS座標）、崩塌面積（長×寬）、崩塌深度（表土薄/深層）、滑動面型態（圓弧/平面/楔形）、崩塌物質（土質/岩質）、地下水跡象（滲流點、溼潤帶）、植生狀況、裂縫位置與寬度、地層傾向傾角、活動性判斷。室內分析：粒徑分析、強度試驗（三軸/直剪取得c'、φ'）、含水量量測、X光繞射（礦物組成）。兩者分工：現地掌握空間範圍與地形條件；室內提供數值化的材料參數，兩者合併進行邊坡穩定分析。",
d:`<h4>坡地崩塌調查架構</h4><h4>一、現地調查項目（掌握空間範圍與地形條件）</h4><table><tr><th>調查項目</th><th>目的</th></tr><tr><td>位置與範圍（GPS、面積）</td><td>確認崩塌地圖資位置，計算土砂量</td></tr><tr><td>崩塌深度與型態</td><td>判斷是表層崩塌（&lt;2m）或深層崩塌（&gt;2m），決定後續治理策略</td></tr><tr><td>滑動面型態</td><td>圓弧→Bishop法；平面/楔形→平面滑動分析；判斷分析方法</td></tr><tr><td>地下水跡象</td><td>滲流點位置、坡面濕潤帶範圍→判斷地下水對穩定性的影響</td></tr><tr><td>裂縫調查</td><td>拉張裂縫位置與寬度→判斷崩塌進行狀態（活動或穩定）</td></tr><tr><td>地層傾向傾角</td><td>判斷是否為順向坡（最重要的地質因子）</td></tr><tr><td>植生狀況</td><td>植生死亡或傾倒→可能的位移徵兆</td></tr></table><h4>二、室內分析（取得數值化材料參數）</h4><table><tr><th>分析項目</th><th>目的</th></tr><tr><td>粒徑分析</td><td>判斷土壤質地類別</td></tr><tr><td>三軸/直剪試驗</td><td>取得c'（凝聚力）、φ'（內摩擦角），用於邊坡穩定計算</td></tr><tr><td>含水量量測</td><td>了解現況土壤含水狀態</td></tr><tr><td>X光繞射分析</td><td>鑑定黏土礦物（蒙脫石等膨脹性礦物→特別危險）</td></tr></table><h4>兩者分工邏輯</h4>現地調查→提供<b>空間範圍、地形條件、活動性判斷</b>；室內分析→提供<b>材料參數數值</b>；兩者結合才能進行完整的邊坡穩定分析（FS計算）並規劃治理方案。`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD21",pts:20,
q:"請說明SCS-CN法（Curve Number法）的計算架構，並說明CN值高低代表的物理意義。若CN=75、降雨P=100mm，求直接逕流深Q。",
s:"SCS-CN法：Q=(P-Ia)²/(P-Ia+S)，其中S=25400/CN-254（mm），Ia=0.2S（初期損失）。CN=75：S=25400/75-254=338.67-254=84.67mm；Ia=0.2×84.67=16.93mm。P-Ia=100-16.93=83.07mm。Q=83.07²/(83.07+84.67)=6900.6/167.74=41.1mm。CN高（接近100）代表不透水面多、逕流大；CN低（接近0）代表高滲透性、逕流小。",
d:`<h4>SCS-CN法公式架構</h4><div class="fm">Q = (P - Ia)² / (P - Ia + S)（P > Ia 時才有逕流）</div><div class="fm">S = 25400/CN - 254（mm）（潛在最大滯留量）</div><div class="fm">Ia = 0.2×S（初期損失，包含截留、窪地填蓄、初期入滲）</div><h4>CN值的物理意義</h4><table><tr><th>CN值範圍</th><th>物理意義</th><th>典型土地利用</th></tr><tr><td>CN接近100</td><td>幾乎完全不透水，降雨幾乎全部轉為逕流</td><td>鋪裝停車場、屋頂</td></tr><tr><td>CN=75~90</td><td>中高逕流潛勢，透水性偏低</td><td>密集住宅、耕地</td></tr><tr><td>CN=55~75</td><td>中等逕流潛勢</td><td>疏林、草地</td></tr><tr><td>CN接近0</td><td>幾乎全部入滲，逕流極少</td><td>理論上極高滲透性砂土（實際很少出現）</td></tr></table><h4>CN=75，P=100mm的計算</h4><div class="fm">S = 25400/75 - 254 = 338.67 - 254 = 84.67 mm</div><div class="fm">Ia = 0.2 × 84.67 = 16.93 mm</div><div class="fm">P - Ia = 100 - 16.93 = 83.07 mm</div><div class="fm">Q = 83.07² / (83.07 + 84.67) = 6900.6 / 167.74 ≈ <b>41.1 mm</b></div><div class="note">SCS-CN法與台灣常用的φ指數法的差異：φ指數假設固定入滲損失率（cm/hr），CN法用無因次的CN值描述集水區的整體逕流潛勢。台灣工程設計較常用φ指數法配合UH，CN法則在美國及部分國際工程廣泛應用。兩者都是「降雨→有效降雨」的轉換工具，目的相同但方法不同。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD22",pts:20,
q:"請說明水庫淤積計算中「囚砂效率（Trap efficiency, Et）」的定義，並說明水庫容量-入流量比（C/I）對囚砂效率的影響趨勢，以及為何排砂（Sluicing）能有效延長水庫壽命。",
s:"囚砂效率Et=水庫攔截土砂量/入庫土砂量×100%，Et越高代表水庫攔截越多土砂，淤積越快。C/I（容量入流量比）越大→Et越高（水在庫中停留越久，細砂有充分時間沉降）；C/I越小→Et越低（水快速通過，細砂來不及沉降就排出）。排砂效果：定期開底部閘門（排砂道）排出淤積泥砂，相當於降低實際淤積在庫中的比例，有效淤積速率=年入砂量×Et×（1-排砂比例），排砂比例越高，壽命越長。",
d:`<h4>囚砂效率（Trap Efficiency）定義</h4><div class="fm">Et = 水庫攔截土砂量 / 入庫年土砂量 × 100%</div>Et代表入庫土砂中被攔截並沉積在庫底的比例，(1-Et)的土砂隨出流排出至下游。<h4>C/I對囚砂效率的影響</h4>C/I = 水庫容量（m³）/ 年入流量（m³/yr）<table><tr><th>C/I值</th><th>水流在庫中停留時間</th><th>囚砂效率Et</th></tr><tr><td>大（如0.5以上）</td><td>長，細砂有充分時間沉降</td><td>高（可達90%以上）</td></tr><tr><td>中等（如0.1~0.5）</td><td>中等</td><td>中等（50~90%）</td></tr><tr><td>小（如0.01以下）</td><td>短，水快速通過</td><td>低（細砂大量隨水排出）</td></tr></table>常用估算公式（Brune curve）：<div class="fm">Et = 1 - 1/(1 + 65×(C/I)²)（題目常給的公式形式之一）</div><h4>排砂延長水庫壽命的機制</h4><div class="fm">年淨淤積量 = 年入砂量 × Et × (1 - 排砂比例)</div>排砂有效降低「淨淤積量」：<ul><li>每年30%排砂→年淨淤積量降至70%→水庫壽命延長約1/(1-0.3)倍≈1.43倍</li><li>排砂比例越高，壽命延長效果越顯著，但排砂需消耗庫容（開閘排砂時水位下降）</li></ul><div class="note">這個計算概念直接對應108年坡地水文學考古題（水庫囚砂效率與排砂延壽計算），是水文科常出現的整合型計算題，掌握公式架構後計算不難，關鍵是理解各參數的物理意義。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD23",pts:20,
q:"請說明雙累積曲線（Double mass curve）的繪製方法、判讀原則，並說明若發現曲線在某時間點發生折點時，應如何進行資料校正。",
s:"繪製：以待查站累積雨量（y軸）對鄰近參考站平均累積雨量（x軸）作圖。判讀：正常資料呈直線；折點=資料不一致（儀器遷移、環境改變或記錄錯誤）。校正方法：以折點前後兩段斜率比值校正—若折點後斜率改變，以折點前段斜率為基準，將折點後的累積雨量乘以（折點前斜率/折點後斜率）校正至一致基準。",
d:`<h4>雙累積曲線繪製方法</h4><ol style="padding-left:16px"><li>計算各年待查站（A站）的累積雨量</li><li>計算各年鄰近多個參考站的平均累積雨量</li><li>以A站累積雨量（縱軸）vs 參考站平均累積雨量（橫軸）繪圖</li><li>若所有點落在一條直線上→資料一致；若在某年份附近有明顯折點→資料不一致</li></ol><h4>折點的可能原因</h4><ul><li>儀器遷移（雨量站搬遷位置，導致測量環境改變）</li><li>儀器型號更換或維護方式改變</li><li>周邊土地利用變化（如大規模造林影響截留量，改變局部降雨量測）</li><li>記錄錯誤（抄寫、換算等人為錯誤）</li></ul><h4>資料校正方法</h4>以折點前段直線的斜率（k₁）為正確基準，折點後段斜率（k₂）反映了系統性誤差：<div class="fm">校正係數 = k₁/k₂</div><div class="fm">折點後各年校正雨量 = 原始記錄雨量 × (k₁/k₂)</div>校正後重新繪製累積曲線，應呈現為單一直線（前後段斜率一致）。<div class="note">雙累積曲線只能偵測「系統性誤差」（整體偏高或偏低），無法偵測隨機誤差。折點的確認需要主觀判斷（通常需統計檢定如t-test確認折點前後均值有顯著差異），才能決定是否進行校正，避免把真實的氣候變化誤判為資料錯誤。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD24",pts:15,
q:"【法規記憶】請說明重現期（Return period）與年超越機率（Annual exceedance probability）的數學關係，並計算：①T=10年設計標準，n=20年使用年限內，至少發生一次超越事件的機率；②T=50年設計標準，5年內無超越事件的機率。",
s:"關係式：年超越機率p=1/T。①T=10，p=0.1，n=20年至少一次機率=1-(1-0.1)²⁰=1-0.9²⁰=1-0.1216=87.8%。②T=50，p=0.02，5年無超越=（1-0.02）⁵=0.98⁵=0.9039=90.4%。",
d:`<h4>重現期與年超越機率的關係</h4><div class="fm">p = 1/T（年超越機率 = 1/重現期）</div>例：T=10年→p=0.10（每年有10%機率發生超越事件）<h4>多年期機率計算公式（Bernoulli model）</h4><div class="fm">P(n年內至少1次) = 1-(1-p)ⁿ</div><div class="fm">P(n年內無超越) = (1-p)ⁿ</div><h4>計算</h4><b>① T=10年，n=20年內至少1次：</b><div class="fm">p=1/10=0.1</div><div class="fm">P = 1-(1-0.1)²⁰ = 1-0.9²⁰ = 1-0.1216 ≈ <b>87.8%</b></div><b>② T=50年，5年內無超越：</b><div class="fm">p=1/50=0.02</div><div class="fm">P = (1-0.02)⁵ = 0.98⁵ ≈ <b>90.4%</b></div><h4>工程意義</h4><table><tr><th>設計標準</th><th>使用年限</th><th>至少超越一次的機率</th></tr><tr><td>T=10年</td><td>50年</td><td>1-0.9⁵⁰=99.5%（幾乎確定會超越）</td></tr><tr><td>T=50年</td><td>50年</td><td>1-0.98⁵⁰=63.6%</td></tr><tr><td>T=100年</td><td>50年</td><td>1-0.99⁵⁰=39.5%</td></tr></table><div class="note">這個計算說明了為什麼重要設施要用高重現期設計：T=10年的設施在50年使用年限內有99.5%的機率被超越，幾乎必然發生！而T=100年才能把50年內被超越的機率降到約40%。這就是「設計重現期要匹配設施使用年限和重要性」的數學基礎。</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE21",pts:20,
q:"請說明植生防災綠帶的五種分類，並分別說明各類型的設置目的、主要功能與代表性植物組合。",
s:"五類：(1)防風綠帶（降低風速防風蝕，木麻黃/黃槿）；(2)固坡綠帶（根系固坡防崩塌，百喜草/相思樹）；(3)護岸綠帶（河岸固坡防崩岸，水柳/蘆葦）；(4)防火綠帶（阻隔火勢蔓延，耐火含水量高植物）；(5)生態廊道綠帶（連結棲地減少破碎化，鄉土喬木+灌木多層次）。",
d:`<h4>植生防災綠帶五種分類（必背完整架構）</h4><table><tr><th>類型</th><th>設置目的</th><th>主要功能</th><th>代表植物組合</th></tr><tr><td><b>防風綠帶</b></td><td>降低地表風速，防止農作物、土壤及建設受風害</td><td>背風側15~20倍樹高範圍降低風速50~70%；防風蝕；降低蒸散</td><td>木麻黃、黃槿（前排低灌）、防風竹叢；多排不同高度</td></tr><tr><td><b>固坡綠帶</b></td><td>利用植物根系固持坡面，防止崩塌與沖蝕</td><td>根系加固（深根木本+淺根草本組合）；截留降雨；蒸散降孔隙水壓</td><td>百喜草（表層）+香茅草（深根）+台灣相思（木本長期）</td></tr><tr><td><b>護岸綠帶</b></td><td>保護溪流河岸，防止洪水沖蝕崩岸</td><td>根系固持河岸土壤；莖幹分散洪水衝擊；提供魚類棲地</td><td>水柳（木本）、楓楊、蘆葦（挺水）、甜根子草</td></tr><tr><td><b>防火綠帶</b></td><td>在易燃植被區域設置含水量高的植生帶，阻斷地表火蔓延</td><td>形成隔離帶，降低火焰傳播速率；非揮發性葉片不助燃</td><td>相思樹、台灣欒樹（含水量高）；避免松科（含揮發性精油）</td></tr><tr><td><b>生態廊道綠帶</b></td><td>連結因開發而破碎的棲地，提供動物移動通道</td><td>減少棲地破碎化；維持族群基因交流；生態系統服務維持</td><td>鄉土多樣性植栽（喬木+灌木+草本三層次）；沿河川或山脊線佈設</td></tr></table><div class="note">考試應用：題目給定一個「某坡地某問題情境」，需能快速判斷應設哪類防災綠帶、功能為何、植物如何選擇。五類的判斷關鍵：防風→海邊或開闊地；固坡→坡面；護岸→溪流旁；防火→林地邊緣；生態廊道→棲地碎片化地區。</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE22",pts:20,
q:"請依台灣常見的立地環境，整理水土保持植生工程中最常使用的10種植物，說明各自的主要特性與適用情境。",
s:"①百喜草（走莖草本，快速覆蓋，最常用先鋒種）；②百慕達草（走莖，耐踐踏，道路邊坡）；③甜根子草（叢生深根，溪岸高水流衝擊區）；④香茅草（深根耐重金屬，礦區特殊困難地）；⑤台灣相思（豆科喬木固氮，崩塌地木本先鋒）；⑥山黃麻（鄉土喬木，快速生長）；⑦水柳（溪岸耐濕，護岸植生）；⑧楓楊（溪岸大喬木，根系深）；⑨馬鞍藤（海岸先鋒，耐鹽耐沙埋）；⑩木麻黃（海岸防風林主要樹種）。",
d:`<h4>台灣水土保持植生工程10大常用植物</h4><table><tr><th>植物</th><th>類型</th><th>主要特性</th><th>最適用情境</th></tr><tr><td><b>百喜草</b></td><td>草本（走莖）</td><td>發芽快、走莖快速擴展、耐旱耐貧瘠</td><td>幾乎所有坡面的快速覆蓋先鋒種（最常用）</td></tr><tr><td><b>百慕達草（狗牙根）</b></td><td>草本（走莖）</td><td>耐踐踏、生長旺盛</td><td>道路邊坡、梯田埂面、需耐踩踏的區域</td></tr><tr><td><b>甜根子草</b></td><td>草本（叢生）</td><td>深根密集、耐高流速沖刷</td><td>溪岸洪水線以下、水流衝擊較強區域</td></tr><tr><td><b>香茅草（Vetiver）</b></td><td>草本（叢生）</td><td>深根達3~4m、耐酸耐重金屬、逆境適應極強</td><td>礦區、強酸性污染地、其他特殊困難地</td></tr><tr><td><b>台灣相思</b></td><td>喬木（豆科）</td><td>根瘤菌固氮、耐貧瘠、生長快</td><td>崩塌地復育中後期木本先鋒、貧瘠坡地造林</td></tr><tr><td><b>山黃麻</b></td><td>喬木（鄉土種）</td><td>生長速度快、鄉土適應性好</td><td>崩塌地次生演替加速、道路邊坡木本植生</td></tr><tr><td><b>水柳</b></td><td>喬木（溼生）</td><td>耐濕耐沖、根系固坡、柔韌分散水力</td><td>河川護岸、溪岸固坡（最重要護岸喬木）</td></tr><tr><td><b>楓楊</b></td><td>喬木（溼生）</td><td>大型喬木、根系深廣、耐洪水淹沒</td><td>河岸永久性護岸植生、提供大型棲地</td></tr><tr><td><b>馬鞍藤</b></td><td>草本（匍匐藤）</td><td>匍匐莖節間生根、耐鹽耐沙埋、第一線先鋒</td><td>海岸沙灘最前線固砂、沙丘穩定</td></tr><tr><td><b>木麻黃</b></td><td>喬木</td><td>耐鹽耐風、生長快、適海岸環境</td><td>海岸防風林主要樹種（形成林帶主體）</td></tr></table><div class="note">記憶策略：依立地環境分組記憶——坡面：百喜草+相思+山黃麻；溪岸：甜根子草+水柳+楓楊；海岸：馬鞍藤+木麻黃；困難地：香茅草。不必把每種植物特性全部背誦，掌握「這個物種為什麼適合這個環境」的生態邏輯，才能在考試時靈活應用。</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE23",pts:20,
q:"請完整說明重要值指數（IVI）的計算步驟，並以下列數據計算三個物種的IVI：調查樣區5個（各100m²），台灣相思出現3個樣區/20株/基底面積2.5m²；白匏子出現4個樣區/30株/基底面積1.8m²；山黃麻出現5個樣區/50株/基底面積3.2m²。",
s:"總株數=100；總頻度=3/5+4/5+5/5=0.6+0.8+1.0；總基底面積=7.5m²。相對密度：相思20%、白匏子30%、山黃麻50%。相對頻度：相思=60/240×100=25%、白匏子=80/240×100=33.3%、山黃麻=100/240×100=41.7%。相對優勢度：相思=2.5/7.5×100=33.3%、白匏子=1.8/7.5×100=24%、山黃麻=3.2/7.5×100=42.7%。IVI：相思=20+25+33.3=78.3；白匏子=30+33.3+24=87.3；山黃麻=50+41.7+42.7=134.4。優勢種為山黃麻。",
d:`<h4>IVI計算步驟（標準流程）</h4><b>Step 1. 整理基礎資料</b><table><tr><th>物種</th><th>出現樣區數</th><th>株數</th><th>基底面積（m²）</th></tr><tr><td>台灣相思</td><td>3</td><td>20</td><td>2.5</td></tr><tr><td>白匏子</td><td>4</td><td>30</td><td>1.8</td></tr><tr><td>山黃麻</td><td>5</td><td>50</td><td>3.2</td></tr><tr><td><b>合計</b></td><td>12（各樣區可多種同時出現）</td><td><b>100</b></td><td><b>7.5</b></td></tr></table><b>Step 2. 計算各相對值</b><br><b>相對密度（RD）= 各物種株數/總株數×100%</b><ul><li>相思：20/100=<b>20%</b>；白匏子：30/100=<b>30%</b>；山黃麻：50/100=<b>50%</b></li></ul><b>相對頻度（RF）= 各物種頻度/頻度總和×100%</b><ul><li>各物種頻度（出現樣區/總樣區）：相思=3/5=0.6；白匏子=4/5=0.8；山黃麻=5/5=1.0；合計=2.4</li><li>相思：0.6/2.4×100=<b>25%</b>；白匏子：0.8/2.4×100=<b>33.3%</b>；山黃麻：1.0/2.4×100=<b>41.7%</b></li></ul><b>相對優勢度（RDo）= 各物種基底面積/總基底面積×100%</b><ul><li>相思：2.5/7.5×100=<b>33.3%</b>；白匏子：1.8/7.5×100=<b>24.0%</b>；山黃麻：3.2/7.5×100=<b>42.7%</b></li></ul><b>Step 3. 計算IVI</b><div class="fm">IVI = RD + RF + RDo（範圍0~300）</div><table><tr><th>物種</th><th>RD</th><th>RF</th><th>RDo</th><th>IVI</th></tr><tr><td>台灣相思</td><td>20</td><td>25</td><td>33.3</td><td><b>78.3</b></td></tr><tr><td>白匏子</td><td>30</td><td>33.3</td><td>24.0</td><td><b>87.3</b></td></tr><tr><td>山黃麻</td><td>50</td><td>41.7</td><td>42.7</td><td><b>134.4</b></td></tr></table><b>結論：</b>山黃麻IVI=134.4最高，為本樣區的<b>優勢種</b>。<div class="note">IVI的三個相對值加總為300（各100%×3=300），三個物種合計應為300。驗算：78.3+87.3+134.4=300 ✓。計算完一定要驗算加總是否為300，這是快速確認計算無誤的方法。</div>`}
