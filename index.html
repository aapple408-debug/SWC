{yr:"109",sub:"坡地水文學",type:"orig",n:"109h2",pts:25,
q:"某雨量站IDF曲線已知6小時延時T=10年雨強=25mm/hr、T=25年雨強=40mm/hr，該站6小時延時年最大降雨量具對數常態分布。求：(一)6小時延時年最大降雨量中位數；(二)6小時延時2年重現期之平均降雨強度；(三)6小時延時重現期100年之降雨深度。",
s:"(一)中位數=2年重現期對應值，對數常態分布中，中位數=幾何平均數=exp(μ_logX)。(二)T=2年：F(z)=0.5，z=0，i₂=中位數/6。(三)T=100年：F(z)=0.99，z=2.326（查表）；由T=10yr（z=1.282）與T=25yr（z=1.751）建立對數常態參數，再求T=100yr（z=2.326）對應降雨量。設P=6hr總降雨量：P₁₀=25×6=150mm，P₂₅=40×6=240mm，log P₁₀=2.176，log P₂₅=2.380。μ+1.282σ=2.176；μ+1.751σ=2.380，解出μ=1.748，σ=0.336。P₁₀₀=10^(1.748+2.326×0.336)=10^(2.530)≈339mm。",
d:`<h4>基本設定</h4>6小時降雨量：P₁₀=25mm/hr×6hr=150mm；P₂₅=40mm/hr×6hr=240mm<br>設log₁₀P~N(μ, σ²)（對數常態分布）<h4>建立分布參數</h4>T=10年：F(z)=0.90，z=1.282（查表）→ μ+1.282σ=log₁₀(150)=2.176 ——①<br>T=25年：F(z)=0.96，z=1.751（查表）→ μ+1.751σ=log₁₀(240)=2.380 ——②<br>②-①：0.469σ=0.204 → <b>σ=0.435</b><br>代回①：μ=2.176-1.282×0.435=2.176-0.558=<b>1.618</b><h4>一、6小時延時年最大降雨量中位數</h4>中位數=T=2年（F=0.5，z=0）：<div class="fm">log P_median = μ + 0×σ = 1.618</div><div class="fm">P_median = 10^1.618 ≈ <b>41.5 mm</b></div><h4>二、T=2年之平均降雨強度</h4><div class="fm">平均雨強 = P_median/6hr = 41.5/6 ≈ <b>6.9 mm/hr</b></div><h4>三、T=100年之降雨深度</h4>T=100年：F(z)=0.99，z=2.326（查表）<div class="fm">log P₁₀₀ = 1.618 + 2.326×0.435 = 1.618 + 1.012 = 2.630</div><div class="fm">P₁₀₀ = 10^2.630 ≈ <b>427 mm</b></div><div class="note">注意：不同參數估算方法（用哪兩個已知點）會影響結果，以上用T=10年與T=25年兩點建立對數常態分布參數。</div>`},

{yr:"109",sub:"植生工程",type:"orig",n:"109v1",pts:20,
q:"試述坡地開發整地既有樹木之保留與處理原則。（20分）",
s:"保留原則：(1)大樹優先保留（胸徑>20cm）；(2)鄉土種優先保留；(3)稀有種、保育類植物必須保留；(4)位於開挖邊界外側者保留；(5)可提供遮蔭、防風、景觀功能者保留。處理原則：需移除者應先進行斷根（移植前6個月~2年）再移植；無法保留者以環狀剝皮或藥劑方式除去；移除的木材應作為生物炭或覆蓋材回用，不可任意棄置；列入水土保持計畫植生補植計畫。",
d:`<h4>一、既有樹木保留原則</h4><ul><li><b>大樹優先保留：</b>胸徑（DBH）>20cm的大樹已具備重要生態功能（碳匯、棲地），移植費用高且存活率低，應設計時繞開保留</li><li><b>鄉土種優先保留：</b>鄉土種適應當地環境、生態功能高，尤其是稀有或特有種需嚴格保護</li><li><b>法定保護植物必須保留：</b>保育類植物（台灣蘇鐵、台灣穗花杉等）及古木、珍貴樹木，法令禁止移除</li><li><b>位於施工邊界外者保留：</b>施工圍籬外的樹木不得任意挖除；圍籬與樹幹距離應大於樹冠半徑</li><li><b>功能性保留：</b>可提供防風、遮蔭、景觀、水土保持功能的樹木，應納入設計保留</li></ul><h4>二、既有樹木處理原則</h4><ul><li><b>需移植者：</b>移植前6個月~2年進行分期斷根（每次1/3~1/2圓弧），刺激細根再生；移植時挖取足夠土球（DBH×8~10倍），移植後定樁支撐2年、定期澆水</li><li><b>無法保留或移植者：</b>以環狀剝皮（殺木）方式除去，避免根部殘留感染病蟲害；或以藥劑灌注方式除根</li><li><b>木材資源化利用：</b>移除的木材切碎作為木屑覆蓋材（Mulch）回用於坡面保護；或製作生物炭（Biochar）增加碳匯</li><li><b>補植計畫：</b>移除的樹木應在水土保持計畫中規劃等量（面積）的補植，維持植生覆蓋量不減少</li></ul>`},

{yr:"109",sub:"植生工程",type:"orig",n:"109v2",pts:20,
q:"試述海岸河口沙洲與沙丘之形成機制，並比較其土壤理化性質與揚塵抑制工法之不同。（20分）",
s:"沙洲成因：河流輸砂入海，受波浪與潮流作用堆積成沙洲（與河流、海流互動，縱向或橫向沙洲）。沙丘成因：乾燥裸露沙地（海岸或河岸）受風搬運沙粒，在障礙物背風處堆積形成（橫向、縱向、新月形沙丘）。土壤差異：沙洲含水量較高（鄰近水域）、鹽分較高；沙丘乾燥、鹽分可能較低（大陸性）。揚塵抑制：沙洲採植生（馬鞍藤、林投）；沙丘需先設沙籬固定移動沙再植生（濱刺草、木麻黃防風林）。",
d:`<h4>一、沙洲（Sandbar/Spit）與沙丘（Sand dune）形成機制</h4><table><tr><th>特徵</th><th>河口沙洲</th><th>沙丘</th></tr><tr><td><b>形成動力</b></td><td>河流輸砂×波浪×潮流，在河口受波浪折射與潮流堆積形成</td><td>風力搬運沙粒，在障礙物背風側（植生、地形變化處）堆積形成</td></tr><tr><td><b>位置</b></td><td>河口、海灣、海岸突出點</td><td>海岸沙灘後方、河川中游河岸（內陸型）</td></tr><tr><td><b>形態</b></td><td>平坦至略有起伏，隨水流和波浪方向改變</td><td>新月形、縱向、橫向等多種形態，隨主風向移動</td></tr></table><h4>二、土壤理化性質比較</h4><table><tr><th>性質</th><th>河口沙洲</th><th>沙丘</th></tr><tr><td>含水量</td><td>較高（鄰近水域、地下水位高）</td><td>較低（乾燥，地下水位深）</td></tr><tr><td>鹽分</td><td>高（海水、潮汐影響；電導度高）</td><td>較低（遠離海水，但海岸沙丘仍受鹽霧影響）</td></tr><tr><td>有機質</td><td>較高（海洋有機物沉積）</td><td>極低（細粒有機物被風吹走）</td></tr><tr><td>質地</td><td>砂質為主，可能含貝殼碎片</td><td>風選砂（粒徑均一，0.1~0.3mm細砂）</td></tr></table><h4>三、揚塵抑制工法比較</h4><table><tr><th>工法</th><th>河口沙洲</th><th>沙丘</th></tr><tr><td><b>植生選擇</b></td><td>耐鹽耐水濕植物（馬鞍藤、濱刺草、林投）；挺水植物（蘆葦、香蒲）護岸</td><td>先設沙籬固定移動沙→再種耐旱耐風植物（濱刺草、木麻黃、黃槿防風林）</td></tr><tr><td><b>工程措施</b></td><td>植生捆（Coir roll）護岸；護岸工程防波浪侵蝕</td><td>沙籬（蘆葦籬、竹籬）固定沙面，降低局部風速；必要時噴灑固沙劑</td></tr><tr><td><b>難度</b></td><td>水位變動大，植生建立較困難</td><td>沙面移動，植生根系易被埋或裸露，需分期維護</td></tr></table>`},

{yr:"109",sub:"植生工程",type:"orig",n:"109v3",pts:20,
q:"國土生態綠網所推動之河川綠帶可減低棲地破碎化的衝擊，試述如何規劃濱水區植生緩衝帶寬度。（20分）",
s:"濱水區植生緩衝帶（Riparian buffer）寬度規劃依據：(1)保護目標（水質、洪水、野生動物）；(2)地形坡度（坡度越陡需越寬）；(3)土壤特性（砂質滲透快，緩衝帶可較窄）；(4)生態需求（兩棲類、鳥類需要之最小棲地寬度，通常≥30m）。台灣推薦：城市段≥10m，自然河段≥30m，敏感物種棲地≥50m以上。分區設計：緊鄰水域→草本/挺水植物帶；中間→灌木帶；外側→喬木帶（多層次）。",
d:`<h4>一、河川綠帶（濱水區植生緩衝帶）功能</h4><ul><li>截留農業逕流中的農藥、肥料，保護水質</li><li>穩定河岸，減少崩岸與侵蝕</li><li>提供野生動物（兩棲類、魚類、鳥類）棲地與移動廊道</li><li>連結破碎化棲地，是國土生態綠網的主要架構</li></ul><h4>二、緩衝帶寬度規劃因素</h4><table><tr><th>影響因素</th><th>建議寬度調整</th></tr><tr><td><b>保護目標</b></td><td>僅水質保護：10~20m；包含野生動物廊道：≥30m；稀有物種棲地：≥50m</td></tr><tr><td><b>地形坡度</b></td><td>坡度越陡→農藥肥料流失越快→需更寬緩衝帶攔截（坡度每增加10%，建議加寬5m）</td></tr><tr><td><b>土壤特性</b></td><td>砂質土滲透快（緩衝效果好，可略窄）；黏質土地表逕流多（需較寬）</td></tr><tr><td><b>土地利用強度</b></td><td>農地比城市緩衝需求更大；有機農業可比慣行農業窄</td></tr></table><h4>三、台灣建議緩衝帶寬度</h4><ul><li><b>都市河川段：</b>≥10m（空間受限）</li><li><b>農業區自然河段：</b>≥30m（雙側合計60m）</li><li><b>敏感生態區、保護類物種棲地：</b>≥50m</li></ul><h4>四、緩衝帶分層設計</h4><ul><li><b>第一層（緊鄰水域0~5m）：</b>草本挺水植物帶（蘆葦、香蒲），固岸消波，提供魚類棲地</li><li><b>第二層（5~15m）：</b>灌木帶（水社柳、台灣山豬枷），加強固坡，提供小型鳥獸棲地</li><li><b>第三層（15m以上）：</b>鄉土喬木帶（水柳、楓楊），提供大型遮蔭與樹冠層棲地，確保廊道連通性</li></ul>`},

{yr:"109",sub:"水土保持規劃設計",type:"orig",n:"109p2",pts:20,
q:"請詳述如何評估集水區內之坡地災害潛勢與風險。（20分）",
s:"評估架構：風險=危害度×暴露度×脆弱度。危害度評估：坡度分析、地質（斷層/順向坡）、歷史崩塌資料（航照判釋）、降雨觸發閾值分析。暴露度：影響範圍內的人口、建物、道路統計。脆弱度：建物結構、疏散能力、預警系統。台灣採用GIS整合分析，以崩塌、土石流、洪水三種主要災害類型分別評估，交疊得到綜合風險圖。",
d:`<h4>一、評估架構</h4><div class="fm">風險（Risk）= 危害度（Hazard）× 暴露度（Exposure）× 脆弱度（Vulnerability）</div><h4>二、各要素評估方法</h4><b>（1）危害度評估</b><table><tr><th>災害類型</th><th>評估方法</th><th>關鍵指標</th></tr><tr><td>崩塌</td><td>坡度分析（>30°高潛勢）、地質調查（斷層、破碎帶、順向坡）、多期航照判釋既有崩塌面積</td><td>坡度、地質、植生覆蓋率、地下水位</td></tr><tr><td>土石流</td><td>土石流潛勢溪普查（水保局資料庫）、歷史災害紀錄、降雨觸發閾值分析</td><td>溪床坡度（>10°）、可移動土砂量、集水區面積</td></tr><tr><td>洪水</td><td>水文頻率分析、洪水模擬（HEC-RAS）、歷史洪水淹水範圍</td><td>集水區面積、河道坡度、土地利用</td></tr></table><b>（2）暴露度評估</b><ul><li>影響範圍內的人口數、建物數（Google地圖或地籍資料）</li><li>重要設施：學校、醫院、橋梁、道路</li><li>農業設施：農地、灌溉渠道</li></ul><b>（3）脆弱度評估</b><ul><li>建物結構（RC vs 磚木造）</li><li>居民疏散能力（老弱比例、疏散道路條件）</li><li>預警系統完備程度（雨量站、地聲感測器）</li></ul><h4>三、風險評估整合（GIS方法）</h4>以GIS整合各要素空間資料，依格網（100m×100m）計算各格網的危害度、暴露度、脆弱度分數，相乘得到風險分數，繪製風險分布圖，作為優先治理排序的依據。`},

{yr:"109",sub:"水土保持規劃設計",type:"orig",n:"109p3",pts:25,
q:"請詳述土石流、深層崩塌與堰塞壩潰壩等災害之防治對策與規劃設計要點為何？（25分）",
s:"土石流防治：攔砂壩（攔截土砂）、固床工（穩定溪床）、護岸（防崩岸擴大土砂供給）、導流堤（保護沖積扇）、預警撤離系統。深層崩塌防治：地下排水（水平排水孔降孔隙水壓）、地錨、格框護坡、長期監測（傾斜管）。堰塞壩潰壩防治：緊急疏通（開鑿缺口、導水管）、下游緊急撤離、長期監測與備案撤離計畫。各類災害均需結合預警系統與非工程措施（土地使用管制）。",
d:`<h4>一、土石流防治對策</h4><table><tr><th>防治策略</th><th>工程手段</th><th>說明</th></tr><tr><td>源頭控制</td><td>崩塌地植生復育、護坡工程</td><td>減少可移動土砂供給</td></tr><tr><td>途中攔截</td><td>攔砂壩（透過型/不透過型）、固床工</td><td>攔截大塊岩石，穩定溪床避免下切</td></tr><tr><td>末端防護</td><td>導流堤、沉砂池（沖積扇治理）</td><td>引導流向，保護保全對象</td></tr><tr><td>預警系統</td><td>雨量計+地聲感測器+CCTV</td><td>達閾值即啟動撤離，非工程最重要措施</td></tr></table><h4>二、深層崩塌防治對策</h4><ul><li><b>地下排水（最有效）：</b>設置水平排水孔（穿越滑動面），排除坡體地下水，降低孔隙水壓，提高安全係數</li><li><b>地錨（預力式）：</b>施設預力地錨穿越潛在滑動面，提供額外抵抗力</li><li><b>格框護坡：</b>結合RC格框+植生，穩定表層土體</li><li><b>長期監測：</b>安裝傾斜管（Inclinometer）、地下水位計，持續監測位移與孔隙水壓變化</li><li><b>土地使用管制：</b>影響範圍內禁止新建，危及聚落應規劃撤離安置</li></ul><h4>三、堰塞壩潰壩防治對策</h4><ul><li><b>緊急疏通：</b>在堰塞體上開鑿缺口（控制洩流速度）；埋設導水管（小流量緩洩）；機械清除；必要時開鑿旁道隧道</li><li><b>下游緊急應對：</b>立即啟動下游疏散撤離；建立臨時攔截工事</li><li><b>監測：</b>安裝水位計、裂縫計，連續監測堰塞體穩定狀況</li><li><b>長期防治：</b>疏通後加固潰壩殘體，設永久監測站；完整地質調查了解潰壩後再崩塌的可能性</li></ul>`},

{yr:"110",sub:"水土保持工程",type:"orig",n:"110w1",pts:25,
q:"請說明預鑄生態槽護岸工程設計之注意事項。（25分）",
s:"預鑄生態槽護岸：預留孔洞供植生生長的預鑄護岸。設計注意事項：(1)水力：流速計算（容許流速依設計規範）、設計洪水（重現期）；(2)結構：基礎深度（防掏空）、抗滑動傾倒安全係數；(3)生態：孔洞尺寸（至少10cm×10cm）、填土材質（腐植土+客土）、植生選擇（鄉土種）；(4)施工：單元重量（人工可搬運）、錯縫搭接、基礎整平；(5)維護：定期補植、汛後巡查有無移位掏空。",
d:`<h4>預鑄生態槽護岸定義</h4>預鑄生態槽（Ecological precast block）是在傳統預鑄混凝土護岸塊上預留植生孔洞，使植物根系可穿透生長，兼具工程護岸強度與生態功能。<h4>設計注意事項</h4><table><tr><th>面向</th><th>注意事項</th></tr><tr><td><b>水力設計</b></td><td>計算設計洪水流量（重現期10~50年）；確認護岸可承受流速（預鑄塊容許流速通常2~4 m/s）；設計坡腳基礎深度防止洪水淘空基礎</td></tr><tr><td><b>結構設計</b></td><td>基礎埋深需超過最大沖刷深度（以HEC-18公式估算）；抗滑動FS≥1.5、抗傾倒FS≥2.0；單元重量足以抵抗水流拖曳力（參考Shields參數）</td></tr><tr><td><b>生態設計</b></td><td>植生孔洞尺寸≥10cm×10cm（確保根系伸展）；孔洞內填充有機質豐富客土（腐植土+砂）；選用鄉土植物（水柳、挺水植物）；每排護岸塊留設水平縫隙供底棲生物通過</td></tr><tr><td><b>施工注意</b></td><td>基礎整平（避免不均勻沉陷）；錯縫搭接（上下排塊體交錯，提高整體性）；塊體間填縫（砂漿或礫石）；施工時不可破壞護岸背面排水設施</td></tr><tr><td><b>維護管理</b></td><td>每年汛前汛後巡查有無移位、掏空、植生死亡；植生未建立前（0~6個月）定期補水；洪水後立即檢查孔洞內客土流失情況並補充</td></tr></table>`},

{yr:"110",sub:"水土保持工程",type:"orig",n:"110w2",pts:25,
q:"請以流量歷線圖與連續方程式說明滯洪池與蓄洪池之蓄洪量大小和防洪效益。（25分）",
s:"連續方程式：dS/dt=I(t)-O(t)，S=蓄洪量，I=入流，O=出流。滯洪池：出口固定（孔口或堰），洪水來時蓄積，洪峰過後緩慢排放，目的是削減洪峰；洪峰後出流>入流，蓄洪量逐漸排空。蓄洪池：出口可控制（閘門），洪水來時蓄積，後長期蓄存（灌溉用水），不立即排放；蓄洪量較大，但需水資源管理。防洪效益：滯洪池削峰效果明顯，出口流量≤開發前洪峰；蓄洪池同時達到削峰與水資源利用，但成本高。",
d:`<h4>一、連續方程式</h4><div class="fm">dS/dt = I(t) - O(t)</div>S：蓄洪量（m³）；I(t)：入流歷線（m³/s）；O(t)：出流歷線（m³/s）<br>蓄洪量變化=入流量-出流量：當I>O時，S增加（蓄洪）；當I&lt;O時，S減少（洩洪）<h4>二、滯洪池（Detention pond）</h4><b>特點：</b>出口為固定孔口或堰，無閘門控制，洪水自動蓄積後緩慢排放。<br><b>運作方式：</b><ul><li>洪水來臨時（I>O）：蓄洪量增加，水位上升，出流量隨水位增加而增加</li><li>洪峰過後（I&lt;O）：蓄洪量逐漸排空，最終恢復低水位</li></ul><b>蓄洪量：</b>較小，約等於入出流歷線圍成的面積差（通常幾百至數千m³）<br><b>防洪效益：</b>削減洪峰流量（Qout≤開發前Qpeak），延遲洪峰到達時間；不具水資源利用功能。<h4>三、蓄洪池（Retention pond）</h4><b>特點：</b>具閘門或可控出口，洪水蓄積後長期保留，可供灌溉或其他用途（如農塘）。<br><b>運作方式：</b><ul><li>洪水來臨時：閘門關閉（或出流受限），全部蓄積</li><li>洪峰後：依水資源需求緩慢排放（供灌溉），排放前一直保留蓄水量</li></ul><b>蓄洪量：</b>較大，需儲存完整洪水體積<br><b>防洪效益：</b>削峰效果更好（出流量可很小甚至為零）；同時具水資源利用功能；但需較大土地面積，成本高。<h4>四、比較</h4><table><tr><th>項目</th><th>滯洪池</th><th>蓄洪池</th></tr><tr><td>出口型式</td><td>固定孔口/堰（無閘門）</td><td>閘門控制</td></tr><tr><td>蓄洪量大小</td><td>較小</td><td>較大</td></tr><tr><td>洪後恢復</td><td>自動排空</td><td>長期蓄水</td></tr><tr><td>附加功能</td><td>無</td><td>灌溉、生態、景觀</td></tr><tr><td>水土保持應用</td><td>開發基地永久滯洪設施</td><td>農塘、集水區蓄水設施</td></tr></table>`},

{yr:"110",sub:"水土保持規劃設計",type:"orig",n:"110p2",pts:25,
q:"請說明特定水土保持區中水庫保護帶的劃設與管制原則（15分）。又特定水土保持廢止的原則為何？（10分）",
s:"水庫保護帶：依《水土保持法》§16，主管機關得劃定水庫集水區為特定水土保持區，設保護帶禁止或限制開發。劃設原則：以水庫正常蓄水位為基準，向上游延伸至集水區邊界；保護帶範圍包含水庫周邊一定距離（通常200m~集水區）。管制原則：禁止廢棄物棄置、禁止採礦、限制農藥施用、林地不得開墾。廢止原則：水庫廢棄（不再使用）、保護目的已達成且不再需要管制、依法律程序重新評估確認安全無虞。",
d:`<h4>一、水庫保護帶劃設原則</h4>依《水土保持法》第16條，直轄市或縣市主管機關得劃定「特定水土保持區」，設置水庫保護帶：<ul><li><b>劃設範圍：</b>以水庫「正常蓄水位」（滿水位）為基準，向上游延伸至集水區邊界，一般包含整個集水區</li><li><b>緩衝帶設置：</b>水庫岸線向陸地延伸至少200m（或至集水區分水嶺）設為保護帶</li><li><b>主要劃設目的：</b>防止水庫集水區受污染（減少農藥、肥料、廢棄物流入）；防止集水區崩塌加速水庫淤積；維護水源水質</li></ul><h4>二、水庫保護帶管制原則</h4><table><tr><th>管制事項</th><th>說明</th></tr><tr><td>禁止廢棄物棄置</td><td>禁止傾倒任何廢棄物（含農業廢棄物）</td></tr><tr><td>禁止採礦採石</td><td>禁止在集水區採礦、採取土石，防止大量裸露</td></tr><tr><td>限制農業開發</td><td>禁止開墾原始林地；現有農地農藥施用受限，鼓勵有機農業</td></tr><tr><td>限制建築開發</td><td>禁止新建住宅、工廠；保護帶內現有建物不得擴建</td></tr><tr><td>水土保持維護</td><td>農地需做好水土保持措施；林地不得砍伐</td></tr></table><h4>三、特定水土保持廢止原則</h4>依《水土保持法施行細則》，下列情況得廢止特定水土保持區：<ul><li><b>目的消滅：</b>水庫永久廢棄（停止蓄水使用）、保護目標不再存在</li><li><b>目的達成：</b>經評估水土保持處理已達到保護效果，自然環境已恢復穩定，不再需要嚴格管制</li><li><b>法定程序：</b>主管機關應公告廢止，並說明廢止理由；廢止前需進行環境評估，確認廢止後不會造成水土保持危害</li></ul>`},

{yr:"110",sub:"水土保持規劃設計",type:"orig",n:"110p3",pts:25,
q:"實際執行之坡地開發與核定水保計畫有差異時：何種情況應辦理變更水保計畫（10分）？何種情況可免辦理變更（10分）？何種情況僅應報主管機關備查（5分）？",
s:"應辦理變更：(1)開發規模擴大；(2)開發性質改變；(3)主要設施型式或位置重大改變；(4)地質條件差異過大需重新設計；(5)刪除核定的保育設施。免辦理但技師認定安全無虞：(1)工程量±10%以內；(2)因地制宜小幅調整但功能不變；(3)材料規格小幅更換但強度相當；(4)非主要設施位置微調。僅備查：(1)計畫期限延展；(2)義務人（地主）更名；(3)施工廠商更換。",
d:`<h4>一、應辦理變更水土保持計畫（10分）</h4>依《水土保持計畫審核監督辦法》，下列情況應向主管機關申請變更設計，重新核定後方可施工：<ul><li><b>開發規模擴大：</b>開發面積增加、挖填土方量大幅增加（超過核定量20%以上）</li><li><b>開發性質改變：</b>從農業用地改為建築用地等使用目的根本性改變</li><li><b>主要設施重大變更：</b>擋土牆型式改變（如從重力式改為懸臂式）；滯洪池、沉砂池容量大幅減少；設施位置移動超出合理範圍</li><li><b>地質條件重大差異：</b>施工發現地質條件與原計畫差異過大（如發現斷層、軟弱地層），需重新設計</li><li><b>刪除保育設施：</b>刪除原計畫核定的沉砂池、截水溝等保育設施</li></ul><h4>二、免辦理變更，但需技師認定安全無虞（10分）</h4><ul><li><b>工程量小幅增減（±10%以內）：</b>施工過程中因現地條件差異造成的合理誤差</li><li><b>因地制宜細部調整：</b>排水溝路線因地形略有不同而小幅調整，功能不受影響</li><li><b>材料規格調整：</b>材料規格有微小差異但強度不低於原設計（如混凝土強度由210提高至280 kg/cm²）</li><li><b>非主要設施位置微調：</b>截水溝、植生範圍的小幅調整，不影響整體水土保持功能</li></ul><h4>三、僅需報主管機關備查（5分）</h4><ul><li><b>計畫期限延展：</b>因正當理由（氣候、工程複雜度）申請展期</li><li><b>義務人（地主）更名：</b>因土地買賣或繼承導致義務人變更</li><li><b>施工廠商更換：</b>更換承包商，但設計不變</li></ul>`,},

{yr:"110",sub:"水土保持規劃設計",type:"orig",n:"110p4",pts:25,
q:"水保技術規範中擋土牆設計的安定條件規定為何（10分）？某重力式擋土牆頂寬0.6m、牆有效高3m、入土深2m、牆面坡度1:0.3（牆背垂直）、載重1t/m²、土層單位重2.0t/m³、混凝土單位重2.4t/m³、背填土坡度0°、內摩擦角30°、凝聚力0.1t/m²、土壤極限承載力45t/m²，檢討傾倒、滑動與承載安定性是否符合要求。（15分）",
s:"安定條件規定：滑動FS≥1.5、傾倒FS≥2.0、承載力FS≥3.0。幾何計算：牆底寬B=頂寬+3m×0.3=0.6+0.9=1.5m；Ka=tan²(45-15°)=tan²30°=0.333；主動土壓力Pa=0.5×Ka×γ×H²+Ka×q×H（H=牆有效高+入土深=5m）；各安定係數計算後需逐一檢核。",
d:`<h4>一、水保技術規範擋土牆安定條件</h4><table><tr><th>安定項目</th><th>靜態FS要求</th><th>地震FS要求</th></tr><tr><td>抗滑動</td><td>≥<b>1.5</b></td><td>≥1.1</td></tr><tr><td>抗傾倒</td><td>≥<b>2.0</b></td><td>≥1.5</td></tr><tr><td>基礎承載力</td><td>≥<b>3.0</b></td><td>≥2.25</td></tr></table><h4>二、幾何計算</h4>牆面坡度1:0.3（水平:垂直）→底寬B=0.6+3×0.3=<b>1.5m</b><br>總高H（含入土深）=3+2=5m；設計用有效高H=3m（計算土壓用3m）<br>Ka=tan²(45°-φ/2)=tan²(45°-15°)=tan²30°=(0.5774)²=<b>0.333</b><h4>三、主動土壓力計算</h4><div class="fm">Pa = ½×Ka×γ×H² + Ka×q×H = ½×0.333×2.0×3² + 0.333×1×3</div>= ½×0.333×2.0×9 + 0.333×3 = 2.997 + 0.999 ≈ <b>4.0 t/m</b><br>作用點高度：Pa作用點=H/3=1.0m（三角形土壓部分）+均布部分在H/2=1.5m<br>水平分量Pah=Pa×cos0°=4.0 t/m（背填土0°，無垂直分量）<h4>四、牆體自重計算（梯形截面）</h4>面積=（頂寬+底寬）/2×H=(0.6+1.5)/2×3=3.15m²<br>W_牆=3.15×2.4=<b>7.56 t/m</b><br>載重：q×B=1.0×1.5=<b>1.5 t/m</b>，W_total=7.56+1.5=<b>9.06 t/m</b><h4>五、各安定係數計算</h4><b>抗滑動FS：</b><br>抗滑力=(W_total×tan δ + c×B)=9.06×tan35°+0.1×1.5=9.06×0.700+0.15=6.342+0.15=6.49t/m<div class="fm">FS滑動 = 6.49/4.0 = <b>1.62 > 1.5 ✓</b></div><b>抗傾倒FS：</b><br>以趾部為轉動支點，抵抗力矩=W_total×作用點距趾端距離<br>W_牆作用點≈B/2=0.75m；Mr=9.06×0.75=6.795 t·m/m<br>傾覆力矩=Pah×1.0=4.0×1.0=4.0 t·m/m<div class="fm">FS傾倒 = 6.795/4.0 = <b>1.70 &lt; 2.0 ✗（不足）</b></div><b>承載力FS：</b><br>垂直合力N=9.06 t/m；基底合力作用點=B/2+(Mr-Mo)/N=(0.75+(6.795-4.0)/9.06)=0.75+0.308=1.058m<br>偏心e=B/2-1.058=0.75-1.058（偏心在B/6=0.25m外，需注意）<br>q_max=N/B×(1+6e/B)（略估）<div class="fm">FS承載 = 45/q_max（需完整計算）</div><div class="note">結論：抗滑動FS=1.62>1.5（符合）；抗傾倒FS=1.70&lt;2.0（<b>不符合</b>，需加寬底版或加大自重）；承載力需完整計算核對。</div>`},

{yr:"110",sub:"植生工程",type:"orig",n:"110v3",pts:20,
q:"植生工程施工需配合應用多種資材，請說明植生資材選用之原則，並列表說明植生工程常用資材之分類、種類及其特性。（20分）",
s:"選用原則：(1)適地適種（與施工環境相符）；(2)生態安全（優先本土種，非入侵種）；(3)耐逆境（貧瘠、乾旱、強日照）；(4)取得容易且成本合理；(5)施工方便（種子發芽率>80%、苗木活存率>70%）。常用資材分類：種子類（草種、木本種子）；苗木類（容器苗、裸根苗）；覆蓋資材（稻草蓆、椰纖維網、不織布）；結構資材（金屬網、土工格網）；改良材（客土、腐植土、緩效肥）。",
d:`<h4>一、植生資材選用原則</h4><ul><li><b>適地適種：</b>資材（種子、苗木）的生態需求（氣候、土壤、海拔）需與施工現地環境相符，是成活率的根本保障</li><li><b>生態安全：</b>優先選擇本土種（Ecotype）；嚴格禁止使用外來入侵種（小花蔓澤蘭種子、銀合歡苗木等）</li><li><b>耐逆境：</b>施工坡面通常貧瘠、排水快、強日照，應選耐貧瘠、耐旱的物種（豆科固氮植物尤佳）</li><li><b>取得性與成本：</b>種子或苗木需能在施工季節穩定取得，量大時需提前訂購</li><li><b>施工規範要求：</b>草種發芽率≥80%（CNS標準）；苗木1年後活存率≥70%（技術規範§61）</li></ul><h4>二、植生工程常用資材分類</h4><table><tr><th>類別</th><th>種類</th><th>特性與適用情況</th></tr><tr><td rowspan="2"><b>種子類</b></td><td>草本種子（百喜草、狗牙根、賽芻豆）</td><td>發芽快、覆蓋率高、成本低；適合大面積快速覆蓋</td></tr><tr><td>木本種子（相思樹、山黃麻）</td><td>發芽較慢；用於客土噴植中混入或直播造林</td></tr><tr><td rowspan="2"><b>苗木類</b></td><td>容器苗（盆苗）</td><td>根系完整、活存率高；適合特定樹種引入；成本較高</td></tr><tr><td>裸根苗</td><td>成本低；需在適當季節（休眠期）種植；活存率較容器苗低</td></tr><tr><td rowspan="3"><b>覆蓋資材</b></td><td>稻草蓆、稻草繩網</td><td>天然可分解；防雨濺蝕、保濕；適合緩坡</td></tr><tr><td>椰纖維網（Coir net）</td><td>天然可分解；強度高於稻草；保水；適合中等坡度</td></tr><tr><td>不織布（人工合成）</td><td>耐久性高；防草（抑制雜草）；不可分解需回收</td></tr><tr><td rowspan="2"><b>結構資材</b></td><td>金屬網（高張力鋼絲網）</td><td>高強度；錨釘固定後作為客土噴植基盤；適合陡坡</td></tr><tr><td>土工格網（Geogrid）</td><td>增加表層土體強度；防坡面滑動；埋設於地表下</td></tr><tr><td rowspan="2"><b>改良材</b></td><td>客土（腐植土+砂+肥料）</td><td>為植生提供土壤基盤；用於客土噴植或格框填充</td></tr><tr><td>緩效複合肥料（N:P:K）</td><td>供植物初期生長養分；緩效型避免快速淋失</td></tr></table>`},

{yr:"110",sub:"植生工程",type:"orig",n:"110v4",pts:20,
q:"請列表說明道路邊坡實施植生工程作業之調查項目及不同地質坡面之護坡與適用植生方法。（20分）",
s:"調查項目：坡度、坡向、岩性與地質、土層深度、土壤pH與肥力、含水量、植生現況、氣候（年雨量、乾濕季）。不同地質坡面護坡方法：硬岩→噴漿護坡+鋼絲網+縫植；軟岩→格框植生或噴漿+噴植；石質土→格框客土噴植；礫質土→直接噴植+植生帶；砂質土→植生帶+客土噴植；黏質/壤質土→直接噴植或草皮鋪植（適合大多數草種）。",
d:`<h4>一、道路邊坡植生工程調查項目</h4><table><tr><th>調查類別</th><th>調查項目</th><th>目的</th></tr><tr><td><b>地形調查</b></td><td>坡度（度/百分比）、坡向（N/S/E/W）、坡形（直線/凸/凹）</td><td>判斷適用植生工法（坡度越陡需越強的固定基盤）</td></tr><tr><td><b>地質土壤調查</b></td><td>岩性（硬岩/軟岩/土壤）、節理密度、土層深度、礫石含量</td><td>選擇護坡方式（岩石→噴漿；土坡→直接噴植）</td></tr><tr><td><b>土壤理化性質</b></td><td>pH值、有機質含量、肥力（N、P、K）、含水量、貫入阻力</td><td>判斷是否需土壤改良（調pH、施肥、客土）</td></tr><tr><td><b>植生調查</b></td><td>現有植被種類、覆蓋率、入侵種分布</td><td>了解演替階段，決定導入物種</td></tr><tr><td><b>氣候調查</b></td><td>年均雨量、乾濕季分布、最大月降雨量、溫度</td><td>選擇種植時機（雨季前後）及耐旱植物</td></tr></table><h4>二、不同地質坡面護坡與適用植生方法</h4><table><tr><th>地質坡面</th><th>護坡方式</th><th>適用植生方法</th></tr><tr><td><b>硬岩（岩盤）</b></td><td>噴覆混凝土（Shotcrete，10~20cm）+高強度鋼絲網+長錨釘（L=3~6m）</td><td>縫植（石縫間填土植草）；格框客土噴植；攀爬植物</td></tr><tr><td><b>軟岩（泥岩/頁岩）</b></td><td>RC格框（3×3m）+錨釘；或噴漿+鋼絲網</td><td>格框內客土噴植；格框植生（百喜草+木本混植）</td></tr><tr><td><b>石質土</b></td><td>格框護坡（RC格框或木格框）</td><td>格框內填客土後噴植；以豆科先鋒種+木本種子混播</td></tr><tr><td><b>礫質土</b></td><td>植生帶（草皮捲）直接鋪植；必要時輔以椰纖網</td><td>植生帶鋪植（百慕達草、百喜草）；噴植（發芽率較低）</td></tr><tr><td><b>砂質土</b></td><td>椰纖維網+客土噴植；不織布覆蓋防流失</td><td>客土噴植（混入黏著劑PAM增加附著力）；植生帶</td></tr><tr><td><b>黏質土/壤質土</b></td><td>一般坡度（&lt;1:1）可直接施工；較陡坡面輔以竹樁固定植生帶</td><td>直接噴植（發芽率高）；草皮鋪植；扦插（柳類）</td></tr></table>`},

{yr:"110",sub:"植生工程",type:"orig",n:"110v5",pts:20,
q:"植生工程施工基地針對植物生育有顯著障礙之酸鹼性土壤、土層淺薄、石礫地或嚴重污染地等不良土壤，在前期作業常需實施客土或土壤改良，請說明如何採用植生客土處理及實施土壤改良？（20分）",
s:"客土處理：客土噴植法（噴覆有機客土+種子）、格框填充客土、人工挖穴回填（苗木用）。土壤改良：酸性→施石灰（CaCO₃，用量依緩衝容量計算）；鹼性/鹽鹼→石膏+洗鹽；有機質低→大量堆肥（>5 ton/ha）；壓實→深翻鬆土；重金屬→鈍化（石灰+磷酸鹽）+客土隔離；土層淺薄→打孔回填客土（徑30cm、深60~100cm）；石礫地→清除大礫石後覆客土。",
d:`<h4>一、植生客土處理方法</h4><table><tr><th>客土方式</th><th>施作方法</th><th>適用情況</th></tr><tr><td><b>客土噴植法（最常用）</b></td><td>以噴植機將有機客土（腐植土60%+砂20%+緩效肥+黏著劑+種子）混合噴覆於坡面，厚度5~15cm</td><td>大面積裸岩、貧瘠坡面；坡度&lt;1:0.3</td></tr><tr><td><b>格框填充客土</b></td><td>先設置RC格框（3×3m）或木格框，框內人工填充有機客土15~30cm厚後再植生</td><td>陡坡（>60°）岩石或極貧瘠坡面</td></tr><tr><td><b>人工挖穴回填</b></td><td>以人工或機械挖植穴（50×50×50cm），填入有機客土後種植容器苗</td><td>苗木栽植；礫石地無法全面客土時</td></tr></table><h4>二、不同問題土壤的改良方法</h4><table><tr><th>土壤問題</th><th>改良方法</th><th>說明</th></tr><tr><td><b>酸性土（pH&lt;5）</b></td><td>施用石灰（CaCO₃或Ca(OH)₂），用量1~5 ton/ha；分次施用</td><td>提高pH至5.5~6.5，消除Al³⁺毒性；施用後需等待3~6個月再種植</td></tr><tr><td><b>鹼性/鹽鹼土（pH&gt;8.5）</b></td><td>施用石膏（CaSO₄）置換Na⁺；配合灌溉淋洗鹽分</td><td>改善土壤結構；洗鹽需有排水系統，將鹽分導出</td></tr><tr><td><b>有機質極低（&lt;1%）</b></td><td>施用大量堆肥（5~20 ton/ha）、腐植土或生物炭</td><td>提高保水保肥性；增加微生物活性；分次施用避免過度礦化</td></tr><tr><td><b>壓實（貫入阻力&gt;2000 kPa）</b></td><td>深翻鬆土（Subsoiling，30~60cm深）；打孔機打孔</td><td>打破緊實層，恢復大孔隙；操作前確認坡面穩定</td></tr><tr><td><b>重金屬污染</b></td><td>客土覆蓋隔離（≥50cm）；石灰+磷酸鹽鈍化；植生萃取（蜈蚣草吸As）</td><td>隔離為最快速方法；植生萃取需多年持續收割</td></tr><tr><td><b>土層淺薄（&lt;30cm）</b></td><td>打孔回填客土（徑30~50cm，深60~100cm，間距1m）；或全面客土覆蓋30~50cm</td><td>為苗木根系創造足夠生長空間</td></tr><tr><td><b>石礫地</b></td><td>清除大礫石（&gt;15cm）；礫石地表填充細土；石礫含量&lt;50%可直接客土噴植</td><td>礫石本身排水良好，主要問題是無保水保肥能力</td></tr></table>`}

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA01",pts:20,
q:"請說明USLE公式A=R×K×L×S×C×P中各因子的物理意義，並說明此公式的適用限制。",
s:"R降雨沖蝕指數（外力）；K土壤可蝕性（抗力）；L坡長因子；S坡度因子；C植生覆蓋因子；P保育措施因子。限制：僅適用面蝕（片蝕、細溝蝕），不適用溝蝕、崩塌、河岸侵蝕；為年平均經驗統計模式，無法模擬單場暴雨事件；不考慮泥砂在坡面內的沉積（僅算流失量非輸出量）。",
d:`<h4>一、USLE公式回顧（喚醒記憶用）</h4><div class="fm">A = R × K × L × S × C × P</div>這是整個土壤物理與沖蝕科的核心公式，幾乎每年必考，務必能默寫。<h4>二、各因子物理意義</h4><table><tr><th>因子</th><th>代表意義</th><th>決定於</th></tr><tr><td>R</td><td>降雨沖蝕力（外力驅動）</td><td>降雨動能×最大30分鐘雨強（EI₃₀）</td></tr><tr><td>K</td><td>土壤對侵蝕的抵抗能力倒數（抗力）</td><td>粒徑組成、有機質、結構、滲透性</td></tr><tr><td>L</td><td>坡長對侵蝕的放大效果</td><td>(λ/22.13)^m，坡度越陡m越大</td></tr><tr><td>S</td><td>坡度對侵蝕的放大效果</td><td>坡度<9%：10.8sinβ+0.03；≥9%：16.8sinβ-0.50</td></tr><tr><td>C</td><td>植生覆蓋的保護效果</td><td>裸地=1.0；密植=0.001~0.01</td></tr><tr><td>P</td><td>水土保持措施的保護效果</td><td>等高耕作、梯田等，數值<1</td></tr></table><h4>三、適用限制（容易被忽略但常考）</h4><ul><li>僅適用<b>面蝕</b>（片蝕Sheet erosion、細溝蝕Rill erosion），<b>不適用</b>溝蝕（Gully）、崩塌、河岸侵蝕</li><li>屬<b>年平均</b>經驗統計模式，無法模擬單場暴雨的逐次反應</li><li>僅估算坡面<b>流失量</b>（Soil loss），非河川出口的<b>輸出量</b>（需再乘SDR泥砂傳遞比）</li><li>是統計迴歸模式，缺乏完整物理機制，不同地區套用前需先用當地資料校正</li></ul>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA02",pts:20,
q:"請比較片蝕（Sheet erosion）、細溝蝕（Rill erosion）、溝蝕（Gully erosion）三者的特徵與防治方式差異。",
s:"片蝕：薄層均勻侵蝕，不易察覺，深度<幾mm，靠植生覆蓋防治。細溝蝕：逕流集中形成淺溝，深<30cm，可用農機整地消除，靠等高耕作防治。溝蝕：深>30cm，不可逆，需工程處理（固床工、護坡）。三者隨侵蝕程度遞增，防治手段也從植生→農藝→工程遞增。",
d:`<h4>侵蝕程度遞進關係（重要記憶架構）</h4><div class="fm">片蝕 → 細溝蝕 → 溝蝕（侵蝕程度遞增，防治難度遞增）</div><table><tr><th>類型</th><th>特徵</th><th>深度</th><th>是否可逆</th><th>主要防治</th></tr><tr><td><b>片蝕</b></td><td>薄層逕流均勻帶走表土，肉眼不易察覺，但長期累積流失量大</td><td>&lt;幾mm</td><td>可逆（植生即可恢復）</td><td>地表覆蓋、植生（C值降低）</td></tr><tr><td><b>細溝蝕</b></td><td>逕流集中形成可見的小溝，沿坡面分布</td><td>&lt;30cm</td><td>可逆（農機整地可消除）</td><td>等高耕作、梯田（P值降低）</td></tr><tr><td><b>溝蝕</b></td><td>持續發展的深溝，農機無法消除</td><td>&gt;30cm</td><td>不可逆</td><td>固床工、護坡工程、跌水消能</td></tr></table><div class="note">記憶技巧：片蝕→細溝→溝蝕，就像「症狀輕微→中度→重症」，治療手段也從預防保養（植生）逐漸升級到積極治療（工程）。USLE公式僅能描述片蝕與細溝蝕，溝蝕已超出USLE適用範圍。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA03",pts:20,
q:"請說明土壤三相（固相、液相、氣相）的基本關係，並寫出孔隙率、空隙比、飽和度的定義與相互關係。",
s:"土壤由固體顆粒(Vs)、水分(Vw)、空氣(Va)組成，孔隙Vv=Vw+Va。孔隙率n=Vv/Vt；空隙比e=Vv/Vs；飽和度S=Vw/Vv。關係式：n=e/(1+e)；e=n/(1-n)。這是計算題的基礎，務必能直接默寫換算。",
d:`<h4>土壤三相圖（喚醒基本概念）</h4>土壤體積Vt由：固體顆粒體積Vs + 孔隙體積Vv組成；孔隙又分水(Vw)與空氣(Va)：Vv=Vw+Va<h4>基本定義公式</h4><table><tr><th>名詞</th><th>公式</th><th>意義</th></tr><tr><td>孔隙率 n</td><td>n = Vv/Vt</td><td>孔隙體積占總體積比例，0~1（或%）</td></tr><tr><td>空隙比 e</td><td>e = Vv/Vs</td><td>孔隙體積與固體體積之比，可>1</td></tr><tr><td>飽和度 S</td><td>S = Vw/Vv × 100%</td><td>孔隙中被水佔據的比例</td></tr></table><h4>n與e的相互換算（必考公式）</h4><div class="fm">n = e / (1+e)</div><div class="fm">e = n / (1-n)</div><h4>推導邏輯（幫助記憶）</h4>設Vs=1，則Vv=e（依e定義）；Vt=Vs+Vv=1+e<br>n=Vv/Vt=e/(1+e) ✓<div class="note">考試技巧：拿到n或e任一個，立刻用上述公式互換，這是USLE計算題前常見的暖身小題，務必滾瓜爛熟。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA04",pts:20,
q:"已知某土壤孔隙率n=0.45，顆粒密度ρs=2.65 g/cm³，含水量w=20%（重量基準），求體積密度ρb、體積含水量θ、飽和度S。",
s:"e=n/(1-n)=0.45/0.55=0.818。ρb=ρs/(1+e)=2.65/1.818=1.458 g/cm³。θ=w×ρb/ρw=0.20×1.458/1=0.292。S=θ/n=0.292/0.45=64.8%。",
d:`<h4>Step 1. 求空隙比e</h4><div class="fm">e = n/(1-n) = 0.45/0.55 = 0.818</div><h4>Step 2. 求體積密度ρb</h4>設Vs=1cm³，則Ms=ρs×Vs=2.65g；Vv=e=0.818cm³；Vt=1+0.818=1.818cm³<div class="fm">ρb = Ms/Vt = 2.65/1.818 ≈ 1.458 g/cm³</div><h4>Step 3. 求體積含水量θ</h4><div class="fm">θ = w × ρb/ρw = 0.20 × 1.458/1.0 ≈ 0.292（即29.2%）</div><h4>Step 4. 求飽和度S</h4><div class="fm">S = θ/n = 0.292/0.45 ≈ 0.648 = <b>64.8%</b></div><div class="note">完整解題鏈：n→e→ρb→θ→S，每一步都是基本定義公式的直接套用，這條鏈務必練到反射動作。常見失分點是w（重量含水量）與θ（體積含水量）搞混，記住w永遠要乘ρb/ρw才能變成θ。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA05",pts:25,
q:"某坡面坡長120m、坡度12%，K=0.035，R=15000 MJ-mm/ha-hr-yr。比較裸地（C=1.0,P=1.0）與施作等高耕作的草生地（C=0.08,P=0.6）的年土壤流失量，並計算後者減少的百分比。",
s:"L=(120/22.13)^0.5=2.330。坡度12%≥9%用大坡度公式：S=16.8×0.12-0.50=1.516。LS=2.330×1.516=3.532。A裸=15000×0.035×3.532=1854.3 ton/ha/yr。A草=1854.3×0.08×0.6=89.0 ton/ha/yr。減少比例=(1854.3-89.0)/1854.3=95.2%。",
d:`<h4>Step 1. L因子</h4>坡度12%≥5%，m=0.5：<div class="fm">L = (120/22.13)^0.5 = 5.424^0.5 = 2.330</div><h4>Step 2. S因子（注意公式選用）</h4>坡度12%≥9%，用大坡度公式：<div class="fm">S = 16.8×0.12 - 0.50 = 2.016 - 0.50 = 1.516</div><h4>Step 3. LS因子</h4><div class="fm">LS = 2.330 × 1.516 ≈ 3.532</div><h4>Step 4. 裸地流失量</h4><div class="fm">A裸 = 15000 × 0.035 × 3.532 × 1.0 × 1.0 ≈ 1854.3 ton/ha/yr</div><h4>Step 5. 草生地流失量</h4><div class="fm">A草 = 1854.3 × 0.08 × 0.6 ≈ 89.0 ton/ha/yr</div><h4>Step 6. 減少百分比</h4><div class="fm">減少比例 = (1854.3-89.0)/1854.3 × 100% ≈ <b>95.2%</b></div><div class="note">這題的重點在S因子公式的選擇（9%是分界點），這是USLE計算題最常見的失分點，務必記住：<9%用10.8sinβ+0.03；≥9%用16.8sinβ-0.50。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA06",pts:20,
q:"請說明土壤可蝕性（K值）受哪些土壤性質影響，並說明為何粉砂質土壤通常K值最高。",
s:"K值影響因素：粒徑組成（粉砂比例越高K越大）、有機質含量（越高K越低）、土壤結構（團粒佳K越低）、滲透等級（越快K越低）。粉砂K值最高原因：粒徑介於砂與黏土之間，缺乏砂的快速排水性，也缺乏黏土的凝聚力，最容易被雨滴打散及逕流剝離搬運。",
d:`<h4>K值（土壤可蝕性因子）影響因素</h4><table><tr><th>因素</th><th>影響方向</th><th>原因</th></tr><tr><td>粉砂含量</td><td>越高→K越大</td><td>粉砂粒徑0.002~0.05mm，既無砂粒的快速排水，也無黏粒的凝聚力</td></tr><tr><td>有機質含量</td><td>越高→K越低</td><td>有機質促進團粒形成，增加抗蝕能力</td></tr><tr><td>土壤結構</td><td>團粒結構佳→K越低</td><td>良好結構抵抗雨滴打擊與逕流剝離</td></tr><tr><td>滲透等級</td><td>越快→K越低</td><td>水分快速排除，減少逕流剪切作用時間</td></tr></table><h4>為何粉砂質土壤K值最高（重點概念）</h4><ul><li><b>砂粒（>0.05mm）：</b>顆粒大，重力作用強，不易被雨滴或逕流帶走；同時排水快，逕流少</li><li><b>黏粒（<0.002mm）：</b>顆粒細小但具高凝聚力（電化學鍵結），團粒結構穩固，抵抗剝離能力強</li><li><b>粉砂（0.002~0.05mm）：</b>顆粒不夠大（無重力優勢），也不夠細（缺乏凝聚力），是物理性質的「弱點區間」，最容易被剝離與搬運</li></ul><div class="note">這個概念在台灣的土壤分布中很實際：粉砂質壤土（Silt loam）在台灣丘陵地常見，是水土保持工程中需要特別注意防護的土壤類型。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA07",pts:20,
q:"請說明田間容水量（FC）與凋萎點（WP）的物理機制差異，並說明有效水分（PAW）在農業灌溉上的應用意義。",
s:"FC（-33kPa）：重力水排除後，土壤孔隙中仍由毛細管力保持的水分上限，此時大孔隙充氣、小孔隙仍含水。WP（-1500kPa）：植物根系滲透壓無法再克服的基質吸力臨界點，此時僅極細孔隙（薄膜水）仍含水但植物吸不到。PAW=FC-WP，是灌溉排程的核心：當土壤含水量降至接近WP前就應灌溉，避免作物受旱害。",
d:`<h4>FC與WP的物理機制（用孔隙大小理解）</h4><table><tr><th>狀態</th><th>基質吸力</th><th>孔隙狀態</th><th>物理意義</th></tr><tr><td><b>飽和</b></td><td>0 kPa</td><td>所有孔隙含水</td><td>剛降雨或灌溉後</td></tr><tr><td><b>田間容水量FC</b></td><td>-33 kPa</td><td>大孔隙（重力水）已排空，中小孔隙仍含水</td><td>重力排水完成的平衡點</td></tr><tr><td><b>凋萎點WP</b></td><td>-1500 kPa</td><td>僅極細孔隙薄膜水殘留</td><td>植物根系吸力已無法突破</td></tr></table><h4>有效水分（PAW）的農業應用</h4><div class="fm">PAW = FC - WP</div>PAW代表植物實際可利用的水分範圍。<h4>灌溉排程應用邏輯</h4><ul><li>土壤含水量從FC開始隨蒸發散逐漸下降</li><li>當含水量接近WP前（通常設定在PAW的50%處，即「灌溉臨界點」），即應啟動灌溉</li><li>不等到WP才灌溉，因為作物在接近WP前就已出現生理性缺水（水分逆境），影響產量</li></ul><div class="note">壤土PAW最大（約13%），保水保肥能力最佳，是農業上最理想的質地；砂土PAW小，需頻繁灌溉；黏土PAW雖然數值不小，但部分水分被緊密吸附難以利用，灌溉效率較差。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA08",pts:20,
q:"請說明降雨沖蝕指數（R值，台灣慣稱Rm）的計算原理，並說明為何台灣Rm值遠高於美國同類型USLE研究地區。",
s:"R值=EI30=降雨動能(E)×最大30分鐘雨強(I30)的年總和。台灣Rm遠高於美國原因：(1)颱風帶來短延時超高強度降雨（I30可達100mm/hr以上）；(2)年降雨量本身高（台灣均2000~3000mm，美國多數地區<1500mm）；(3)地形抬升效應使山區降雨強度加劇。",
d:`<h4>R值（EI30）計算原理</h4><div class="fm">R（年）= Σ各場降雨的EI₃₀</div><div class="fm">EI₃₀ = E（該場降雨總動能）× I₃₀（最大30分鐘雨強）</div>E需逐分鐘累加各時段降雨動能：<div class="fm">E = Σ[0.29×(1-0.72×e^(-0.05i))×ΔP]（Brown-Foster公式，i=瞬時雨強）</div><h4>台灣Rm遠高於美國的原因</h4><table><tr><th>原因</th><th>說明</th></tr><tr><td><b>颱風降雨（最主要）</b></td><td>颱風帶來短時間超高強度降雨，I₃₀常達100mm/hr以上，美國除佛羅里達等少數地區外罕見此強度</td></tr><tr><td>年降雨量高</td><td>台灣年雨量約2000~3000mm（東北部甚至超過4000mm），遠高於美國本土多數地區（&lt;1500mm）</td></tr><tr><td>地形抬升效應</td><td>台灣山地地形造成迎風面強降雨，進一步加大降雨強度與動能</td></tr><tr><td>梅雨季長延時降雨</td><td>梅雨季持續性降雨也累積大量EI₃₀貢獻</td></tr></table><div class="note">數值對比：美國USLE研究地區典型R值約100~700（美制單位）；台灣Rm值常達10,000~30,000 MJ-mm/ha-hr-yr，這也是為何台灣必須用本土修正的Rm值，不能直接套用美國USLE的R值範圍。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA09",pts:20,
q:"請說明何謂土壤可容許流失量（T值），並比較深厚土層與淺薄土層在T值設定上的差異，說明背後的生產力考量。",
s:"T值：維持土壤長期生產力前提下，允許的最大年侵蝕量。深厚土層（如>1m）：表土流失對整體生產力影響小，可設較高T值（如12 ton/ha/yr）。淺薄土層（如<30cm）：表土流失直接影響到底岩或母質，生產力損失快且不可逆，需設低T值（如3~5 ton/ha/yr）。背後邏輯：T值本質是「土壤資源耗竭速度的容許上限」，土層越薄，資源越稀少，越需保守設定。",
d:`<h4>T值定義回顧</h4>在維持土壤長期生產力（可永續利用）前提下，允許的最大年侵蝕量（ton/ha/yr）。台灣常見範圍：5~12 ton/ha/yr。<h4>深厚 vs 淺薄土層的T值設定邏輯</h4><table><tr><th>土層深度</th><th>建議T值</th><th>生產力考量</th></tr><tr><td>深厚（&gt;1m）</td><td>可達<b>12 ton/ha/yr</b></td><td>表土流失後，下方仍有大量類似品質的土壤可供利用，生產力衰退緩慢</td></tr><tr><td>中等（30~100cm）</td><td>約<b>5~8 ton/ha/yr</b></td><td>表土流失逐漸接近底層，需較保守管理</td></tr><tr><td>淺薄（&lt;30cm）</td><td>僅<b>3~5 ton/ha/yr</b></td><td>表土流失很快暴露母質或岩盤，農業生產力急速且不可逆衰退</td></tr></table><h4>核心邏輯（幫助記憶）</h4>T值本質上是在回答：「這塊地的土壤資源庫存還能撐多久？」<ul><li>土層厚=庫存大=可承受較高的年提取（侵蝕）速率</li><li>土層薄=庫存小=必須嚴格限制提取速率，否則很快見底</li></ul><div class="note">這個概念在實務上很重要：水保技師評估一塊地的T值時，第一步永遠是先確認土層深度（透過鑽探或土壤剖面調查），而非直接查表套用通用值。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA10",pts:25,
q:"某地進行整地，原坡度8%、坡長60m，整地後坡度變為20%、坡長變為40m。其他條件不變（K=0.04，R=20000，C=P=1.0皆裸露），請計算整地前後土壤流失量比值，並說明此計算對工程規劃的意義。",
s:"整地前：L=(60/22.13)^0.5=1.648；S（8%<9%）=10.8×0.08+0.03=0.894；LS=1.473。整地後：L=(40/22.13)^0.5=1.345；S（20%≥9%）=16.8×0.20-0.50=2.860；LS=3.847。比值=3.847/1.473=2.61倍。意義：即使坡長縮短，但坡度大幅增加使LS值不減反增逾2.6倍，說明整地（特別是切坡）若處理不當，反而可能加劇侵蝕風險，這是工程規劃必須優先考量整地後坡度的原因。",
d:`<h4>Step 1. 整地前LS</h4>坡度8%（<9%，小坡度公式）：<div class="fm">L = (60/22.13)^0.5 = 2.711^0.5 = 1.648</div><div class="fm">S = 10.8×0.08+0.03 = 0.894</div><div class="fm">LS前 = 1.648×0.894 ≈ 1.473</div><h4>Step 2. 整地後LS</h4>坡度20%（≥9%，大坡度公式）：<div class="fm">L = (40/22.13)^0.5 = 1.808^0.5 = 1.345</div><div class="fm">S = 16.8×0.20-0.50 = 2.860</div><div class="fm">LS後 = 1.345×2.860 ≈ 3.847</div><h4>Step 3. 比值計算</h4><div class="fm">LS後/LS前 = 3.847/1.473 ≈ 2.61倍</div><h4>工程規劃意義（重點）</h4><ul><li>整地後坡長雖然<b>縮短</b>（60m→40m，理論上應降低LS），但坡度<b>大幅增加</b>（8%→20%），最終LS值反而<b>增加2.61倍</b></li><li>這說明<b>坡度的影響權重遠大於坡長</b>，尤其當坡度跨越9%這個門檔（S公式由小坡度切換到大坡度公式）時，S值會急劇放大</li><li>工程意義：切坡整地時若為了減少用地面積而採用較陡的坡度，反而可能讓侵蝕風險不降反升，這是設計時的常見陷阱</li><li>正確做法：寧可保留較長但平緩的坡度（甚至做成階梯狀），也不要為了縮短坡長而大幅增加坡度</li></ul>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA11",pts:20,
q:"請說明土壤入滲過程中，Green-Ampt模式與Horton模式的基本假設差異。",
s:"Green-Ampt模式：假設入滲鋒面（wetting front）以活塞式（piston flow）向下推進，鋒面以上完全飽和，鋒面以下完全未飽和，鋒面有明確邊界。Horton模式：純經驗公式，描述入滲率隨時間呈指數遞減，f(t)=fc+(f0-fc)e^(-kt)，不涉及物理機制假設，僅描述現象。",
d:`<h4>Green-Ampt模式</h4><b>基本假設：</b><ul><li>入滲水以「活塞式」（Piston flow）整體向下推進，形成明確的濕潤鋒面（Wetting front）</li><li>鋒面以上：土壤完全飽和（θ=θs）</li><li>鋒面以下：土壤含水量維持初始值（θi），尚未受到入滲影響</li><li>鋒面處存在明確的基質吸力（Suction head）</li></ul><b>入滲率公式：</b><div class="fm">f(t) = Ks×[1 + (ψ×Δθ)/F(t)]</div>Ks=飽和水力傳導係數；ψ=濕潤鋒面吸力；Δθ=含水量變化；F(t)=累積入滲量<h4>Horton模式</h4><b>基本假設：</b>純粹經驗公式，不涉及土壤物理機制，僅描述入滲率隨時間的變化型態：<div class="fm">f(t) = fc + (f0-fc)×e^(-kt)</div>f0=初始入滲率；fc=最終（穩定）入滲率；k=遞減常數<h4>兩者比較</h4><table><tr><th>項目</th><th>Green-Ampt</th><th>Horton</th></tr><tr><td>性質</td><td>物理機制模式（半物理）</td><td>純經驗公式</td></tr><tr><td>參數意義</td><td>有明確物理意義（Ks、ψ、Δθ）</td><td>無明確物理意義，需率定</td></tr><tr><td>適用性</td><td>可推廣至不同土壤類型</td><td>僅適用於率定過的特定條件</td></tr></table>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA12",pts:20,
q:"請說明土壤沖蝕中「臨界剪切力」（Critical shear stress, τc）的概念，並說明其與起動流速的關係。",
s:"臨界剪切力τc：使土壤顆粒開始發生剝離與搬運所需的最小水流剪切力，τc與顆粒重量、凝聚力有關，τc=γRS（實際剪切力）需超過τc才會發生侵蝕。起動流速關係：τ=γRS，當R（水力半徑）與S（坡度）增加，τ增加，超過τc時顆粒開始移動；可推導出起動流速vc與τc的關係（依Shields參數）。",
d:`<h4>臨界剪切力概念</h4>水流作用在土壤（或河床）表面的剪切應力τ：<div class="fm">τ = γ × R × S</div>γ=水單位重；R=水力半徑；S=水面坡降<br><br>當τ超過土壤的<b>臨界剪切力τc</b>（顆粒開始移動所需的最小剪應力）時，發生侵蝕（顆粒剝離搬運）。<h4>τc的影響因素</h4><ul><li>顆粒粒徑：粒徑越大，重力越大，τc越高（不易移動）</li><li>顆粒密度：密度越高，τc越高</li><li>凝聚力（黏性土）：凝聚力越強，τc越高，但黏粒沖蝕機制與砂粒不同（化學鍵結而非單純重力）</li></ul><h4>與起動流速的關係（Shields參數）</h4><div class="fm">Shields數 τ* = τc/[(γs-γw)×d]</div>τ*為無因次參數，依顆粒雷諾數查Shields圖可得τc，再反推起動流速vc（需配合Manning公式或對數流速分布）。<h4>工程應用</h4>河道護岸設計、固床工設計時，須確認設計流速下的剪切力τ不超過河床材料（或護岸材料）的τc，否則會發生沖蝕破壞。這是預鑄護岸起動破壞分析的核心概念，與水土保持工程科的相關計算題密切呼應。`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA13",pts:20,
q:"請說明何謂土壤沖蝕的「臨界坡長」概念，並說明其在水土保持工程上的應用意義（例如階段式整坡設計）。",
s:"臨界坡長：在特定坡度與土壤條件下，逕流累積量增加到足以從片蝕轉變為細溝蝕、甚至溝蝕的坡長界限。應用：階段式整坡（梯田、平台）的核心理論依據是「縮短有效坡長」，將長坡分割成多個短坡段，使每段坡長都低於臨界坡長，逕流在每段重新分散，避免持續累積形成集中侵蝕。",
d:`<h4>臨界坡長概念</h4>隨著坡長增加，地表逕流沿坡面累積，流量與流速持續增加，當累積到一定程度，逕流的挾砂能力足以使侵蝕型態從片蝕（薄層均勻）轉變為細溝蝕（集中沖蝕），這個轉變發生的坡長稱為<b>臨界坡長</b>。<br><br>臨界坡長受坡度、土壤可蝕性、植生覆蓋等因子影響，坡度越陡、土壤越易蝕，臨界坡長越短。<h4>水土保持工程應用：階段式整坡設計</h4><b>核心理論：</b>梯田、平台、等高草帶等措施的共同原理都是「人為縮短有效坡長」，將原本連續的長坡分割成數個短坡段：<ul><li>每個短坡段的逕流獨立累積，在到達下一段前先被攔截、分散或導引排出</li><li>只要各段坡長都低於臨界坡長，就能避免逕流持續累積形成集中沖蝕（細溝、溝蝕）</li><li>這正是USLE中L因子（坡長因子）可透過工程手段被「人為降低」的實務體現</li></ul><h4>設計應用範例</h4><ul><li><b>水平階梯田：</b>將陡長坡分割為多個水平階面，各階高差由土埂或駁坎承擔</li><li><b>等高草帶：</b>沿等高線設置草帶分段攔截逕流，效果等同縮短坡長</li><li><b>道路邊坡的橫向截水溝：</b>每隔一定距離（即低於臨界坡長）設置截水溝，避免逕流持續累積</li></ul>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA14",pts:20,
q:"請說明乾燥地區與濕潤地區土壤沖蝕機制的主要差異，並說明為何台灣（濕潤地區）的沖蝕問題以水蝕為主而非風蝕。",
s:"乾燥地區：植生稀疏、土壤乾燥鬆散，風蝕（揚蝕、磨蝕）為主要侵蝕型態；降雨稀少但強度集中時也會發生劇烈水蝕（如荒漠flash flood）。濕潤地區（台灣）：植生覆蓋率高（風蝕被抑制），但年降雨量大、降雨強度高（颱風梅雨），水蝕（片蝕、細溝蝕、溝蝕、崩塌）為主要侵蝕型態。台灣特殊性：地形陡峭+地質年輕脆弱+颱風豪雨，三者疊加使水蝕問題格外嚴重。",
d:`<h4>乾燥地區侵蝕機制</h4><ul><li><b>主導機制：</b>風蝕（揚蝕Deflation、磨蝕Abrasion）</li><li><b>原因：</b>植生稀疏（缺水無法支持茂密植被）→地表裸露時間長→風力直接作用於乾燥鬆散土壤</li><li><b>水蝕特性：</b>降雨稀少但強度可能很集中（荒漠暴雨），引發瞬間劇烈的Flash flood沖蝕</li></ul><h4>濕潤地區（台灣）侵蝕機制</h4><ul><li><b>主導機制：</b>水蝕（片蝕、細溝蝕、溝蝕、崩塌、土石流）</li><li><b>植生抑制風蝕：</b>濕潤氣候支持茂密植被，地表幾乎全年有植生覆蓋，風蝕被有效抑制</li><li><b>水蝕原因：</b>年降雨量大（2000~3000mm）+降雨強度集中（颱風、梅雨）+地形陡峭+地質年輕脆弱（造山運動活躍，岩石風化快、強度低）</li></ul><h4>台灣特殊性（三重疊加效應）</h4><table><tr><th>因子</th><th>台灣特性</th><th>對水蝕的影響</th></tr><tr><td>地形</td><td>山高坡陡，平均坡度遠高於世界平均</td><td>S因子大，侵蝕力強</td></tr><tr><td>地質</td><td>造山運動活躍，岩石破碎風化快</td><td>K值高，土壤易蝕</td></tr><tr><td>氣候</td><td>颱風梅雨帶來短延時超高強度降雨</td><td>R值（Rm）遠高於世界平均</td></tr></table><div class="note">這正是為何台灣水土保持的核心課題幾乎都圍繞水蝕（USLE應用、崩塌、土石流），而風蝕僅在西部沿海沙地或特殊地形才會被討論。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA15",pts:25,
q:"某試驗以落水頭法測定土壤水力傳導係數：細管截面積a=2 cm²，試樣截面積A=80 cm²，試樣長度L=10cm，水頭由h1=50cm降至h2=20cm所需時間t=600秒。求水力傳導係數K。",
s:"K=(a×L)/(A×t)×ln(h1/h2)=(2×10)/(80×600)×ln(50/20)=20/48000×ln(2.5)=0.0004167×0.9163≈3.82×10⁻⁴ cm/s。",
d:`<h4>落水頭法公式回顧</h4><div class="fm">K = (a×L)/(A×t) × ln(h1/h2)</div>a=細管截面積；L=試樣長度；A=試樣截面積；t=試驗時間；h1、h2=起始與結束水頭<h4>代入數值</h4>a=2cm²；L=10cm；A=80cm²；t=600s；h1=50cm；h2=20cm<div class="fm">K = (2×10)/(80×600) × ln(50/20)</div><div class="fm">= 20/48000 × ln(2.5)</div>ln(2.5)≈0.9163<div class="fm">K = 0.0004167 × 0.9163 ≈ 3.82×10⁻⁴ cm/s</div><h4>結果判讀</h4>K≈3.82×10⁻⁴ cm/s，屬於中等偏低的滲透性，對照土壤質地分類，大約相當於<b>粉質黏土或粉質壤土</b>的水力傳導係數範圍（10⁻⁴~10⁻⁵ cm/s為低滲透性土壤的典型範圍，黏土甚至可達10⁻⁷~10⁻⁹）。<div class="note">落水頭法是針對低滲透性土壤（K<10⁻⁵~10⁻⁴ cm/s）的標準測定方法，砂質土壤（高滲透性）應改用恆水頭法（Constant head method），這個適用性區分是常考概念。</div>`},
{yr:"自出",sub:"水土保持工程",type:"self",n:"sB01",pts:20,
q:"請說明擋土牆三大破壞模式（滑動、傾倒、基礎承載破壞）的力學機制，並說明各對應的安全係數查驗方式。",
s:"滑動：水平方向土壓力超過底部摩擦阻力，牆體整體沿基礎底面滑出。傾倒：土壓力產生的力矩超過自重的抵抗力矩，牆體繞趾端旋轉傾倒。基礎承載破壞：基底接觸應力超過地基極限承載力，地基發生剪力破壞下陷。FS要求：滑動≥1.5、傾倒≥2.0、承載力≥3.0（皆為靜態）。",
d:`<h4>三大破壞模式力學機制（核心架構，必背）</h4><table><tr><th>破壞模式</th><th>力學機制</th><th>關鍵作用力</th><th>FS計算方式</th></tr><tr><td><b>滑動</b></td><td>主動土壓力水平分量Pah推動牆體，超過基底摩擦阻力與凝聚力之和</td><td>抗滑力=ΣW×tanδ+c×B；驅動力=Pah</td><td>FS=抗滑力/Pah ≥1.5</td></tr><tr><td><b>傾倒</b></td><td>土壓力對趾端產生的傾覆力矩，超過自重對趾端的抵抗力矩</td><td>抵抗力矩Mr（自重）；傾覆力矩Mo（土壓力）</td><td>FS=Mr/Mo ≥2.0</td></tr><tr><td><b>基礎承載破壞</b></td><td>基底最大接觸應力qmax超過地基極限承載力qu</td><td>qmax=N/B×(1+6e/B)（e=偏心距）</td><td>FS=qu/qmax ≥3.0</td></tr></table><h4>安全係數要求總表（必須默寫）</h4><table><tr><th>項目</th><th>靜態FS</th><th>地震FS</th></tr><tr><td>抗滑動</td><td>≥1.5</td><td>≥1.1</td></tr><tr><td>抗傾倒</td><td>≥2.0</td><td>≥1.5</td></tr><tr><td>基礎承載力</td><td>≥3.0</td><td>≥2.25</td></tr></table><div class="note">記憶技巧：1.5、2.0、3.0呈遞增關係，承載力要求最嚴格（因為一旦地基破壞是最難挽回的）；地震狀態下FS要求約為靜態的0.75倍（容許暫時性較低安全餘裕）。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB02",pts:20,
q:"請推導朗金（Rankine）主動與被動土壓力係數公式，並說明兩者的物理差異。",
s:"主動Ka=tan²(45°-φ/2)：牆向外移動，土體沿滑動面下滑，土壓力降至最小。被動Kp=tan²(45°+φ/2)：牆向土體方向擠壓，土體被壓縮抗力上升，土壓力升至最大。Kp永遠大於Ka（Kp/Ka=tan⁴(45°+φ/2)），這是工程上利用被動土壓力增加抵抗力的理論基礎（如埋入深度增加被動抗力）。",
d:`<h4>主動土壓力係數推導</h4>Mohr圓與破壞包絡線相切：sinφ=(σ1-σ3)/(σ1+σ3)<br>主動狀態：σ1=σv=γz（垂直應力為大主應力），σ3=σh=Ka×σv<div class="fm">sinφ = (1-Ka)/(1+Ka) → Ka = (1-sinφ)/(1+sinφ) = tan²(45°-φ/2)</div><h4>被動土壓力係數推導</h4>被動狀態：牆向土體擠壓，σh變為大主應力，σv變為小主應力：σ1=σh=Kp×σv，σ3=σv<div class="fm">sinφ = (Kp-1)/(Kp+1) → Kp = (1+sinφ)/(1-sinφ) = tan²(45°+φ/2)</div><h4>主動vs被動物理差異</h4><table><tr><th>狀態</th><th>牆體運動方向</th><th>土體狀態</th><th>土壓力大小</th></tr><tr><td>主動</td><td>遠離土體（向外移動）</td><td>沿滑動面下滑，達剪力破壞</td><td>最小（Ka<1）</td></tr><tr><td>被動</td><td>朝向土體（擠壓）</td><td>受壓縮，抵抗力上升至剪力破壞</td><td>最大（Kp>1）</td></tr></table><div class="fm">Kp/Ka = tan⁴(45°+φ/2)（兩者比值，差距可達10倍以上）</div><div class="note">工程應用：擋土牆前方土體（埋入深度部分）提供被動土壓力作為抗滑阻力的一部分，這也是為何增加擋土牆入土深度能有效提高滑動安全係數。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB03",pts:20,
q:"請說明攔砂壩的功能分類（不透過型、透過型），並說明各自的設計理念與適用情況。",
s:"不透過型（實壩）：完全阻擋水砂混合物，攔截全部土砂，適用緊急穩定溪床、防止溪床下切。透過型（格柵壩、縫隙壩）：平時允許清水及細砂通過，僅在土石流發生時（大顆粒）被攔截，平時維持輸砂連續性，減少對下游河床的飢餓效應，較符合生態與長期永續考量，是現代趨勢主流。",
d:`<h4>攔砂壩兩大類型對照</h4><table><tr><th>類型</th><th>設計理念</th><th>適用情況</th><th>優缺點</th></tr><tr><td><b>不透過型（實壩）</b></td><td>完全阻擋水砂混合物，形成蓄砂空間</td><td>緊急穩定溪床、防止溪床下切、新崩塌地下游緊急治理</td><td>優：攔砂效果立即顯著；缺：阻斷輸砂連續性，下游河床長期缺砂（飢餓效應），生態廊道被切斷</td></tr><tr><td><b>透過型（格柵壩/縫隙壩）</b></td><td>平時清水及細砂正常通過，僅大顆粒土石在土石流發生時被攔截（依粒徑篩選）</td><td>長期性治理、生態敏感區、土石流潛勢溪流常態防護</td><td>優：維持輸砂平衡，生態廊道保持暢通；缺：設計較複雜，需準確掌握設計粒徑</td></tr></table><h4>現代趨勢</h4>近年水土保持工程設計理念逐漸從<b>不透過型轉向透過型</b>，主因：<ul><li>下游河床長期缺砂會導致河道下切，影響橋梁基礎、護岸穩定性（清水侵蝕加劇）</li><li>透過型維持生態廊道連續性，符合生態檢核要求</li><li>透過型可降低淤滿後攔砂功能喪失的問題（不透過型滿砂後即喪失攔砂能力，需清淤；透過型平時自然排砂，延長有效使用年限）</li></ul>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB04",pts:20,
q:"請說明固床工的功能與設計原則，並說明連續多級固床工（階梯式）相較於單一高落差固床工的優點。",
s:"固床工功能：抬高並穩定溪床基準面，防止溪床下切，固定縱向坡降。設計原則：壩頂應低於原溪床高程或與其齊平（非新增障礙）、消能設施防止下游沖刷、考量魚類迴游需求。階梯式優點：單一落差分散為多級小落差，各級消能均勻、降低單級沖刷強度、提供魚類逐級迴游可能性（落差<0.5m較容易跨越）、視覺與生態衝擊較小。",
d:`<h4>固床工功能</h4><ul><li>抬高並穩定溪床基準面，提供溪床一個穩定的「底線」</li><li>防止溪床持續下切（headcut erosion向上游溯源侵蝕）</li><li>固定縱向坡降，避免坡度不穩定造成流速分布不均</li><li>保護上下游護岸基礎，避免被掏空</li></ul><h4>設計原則</h4><ul><li>壩頂高程應參考原溪床穩定高程設計，非額外創造新落差</li><li>下游設置消能設施（護坦、消力池），防止跌水沖擊造成沖刷坑</li><li>需考量生態廊道功能（魚類迴游）</li></ul><h4>連續多級（階梯式）固床工優點</h4><table><tr><th>比較項目</th><th>單一高落差固床工</th><th>連續多級（階梯式）</th></tr><tr><td>消能分布</td><td>集中於單一跌水點，沖擊力強</td><td>分散於各級，每級沖擊力小</td></tr><tr><td>下游沖刷</td><td>沖刷坑深度大，需強化消能設施</td><td>各級沖刷較淺，設施需求降低</td></tr><tr><td>魚類迴游</td><td>落差過大（>1~2m）魚類難以跨越</td><td>各級落差小（&lt;0.5m），具魚道功能，魚類可逐級跨越</td></tr><tr><td>生態與景觀</td><td>形成單一明顯人工結構，棲地阻隔明顯</td><td>多個小階形成深潭-淺瀨交替地形，棲地多樣性較高</td></tr></table>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB05",pts:25,
q:"某矩形排水溝寬2m，水深1.2m，Manning n=0.025，溝底坡度0.3%。計算流量，並說明若改為梯形斷面（底寬2m、邊坡1:1）相同水深時，流量會如何變化（不需計算，僅說明趨勢與原因）。",
s:"矩形：A=2×1.2=2.4m²；P=2+2×1.2=4.4m；R=A/P=0.545m。Q=(1/n)AR^(2/3)S^0.5=(1/0.025)×2.4×0.545^0.667×0.0548=40×2.4×0.671×0.0548≈3.52cms。梯形（邊坡1:1，相同水深）：A增加（多了兩側三角形面積=1.2²=1.44m²，總A=2.4+1.44=3.84m²），但P也增加，需比較R的變化；通常梯形在相同水深下A增加比例大於P增加比例，R增大，流量增大。",
d:`<h4>矩形斷面流量計算</h4>A=b×y=2×1.2=2.4 m²<br>P=b+2y=2+2×1.2=4.4 m<div class="fm">R = A/P = 2.4/4.4 ≈ 0.545 m</div><div class="fm">Q = (1/n)×A×R^(2/3)×S^(1/2)</div>R^(2/3)=0.545^0.667≈0.671；S^0.5=0.003^0.5=0.0548<div class="fm">Q = (1/0.025)×2.4×0.671×0.0548 = 40×2.4×0.671×0.0548 ≈ <b>3.52 cms</b></div><h4>改為梯形斷面（邊坡1:1）的趨勢分析</h4>梯形斷面（底寬b=2m，邊坡z=1，相同水深y=1.2m）：<div class="fm">A梯 = (b+zy)×y = (2+1×1.2)×1.2 = 3.2×1.2 = 3.84 m²</div><div class="fm">P梯 = b+2y√(1+z²) = 2+2×1.2×√2 = 2+3.39 = 5.39 m</div><div class="fm">R梯 = 3.84/5.39 ≈ 0.713 m（大於矩形的0.545m）</div><h4>結論與原因</h4>梯形斷面（邊坡1:1）在相同水深下，<b>流量會增加</b>。原因：<ul><li>梯形斷面因兩側傾斜邊坡增加了額外的水流面積（A大幅增加：2.4→3.84m²，增加60%）</li><li>雖然濕周也隨之增加（4.4→5.39m，增加22%），但增加幅度小於面積增加幅度</li><li>因此水力半徑R增大（0.545→0.713m），流速與流量同步提升</li><li>核心原理：梯形斷面在相同水深下通常比矩形斷面有更高的水力效率（R更大），這也是為何天然河道及多數人工溝渠常採梯形斷面設計</li></ul>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB06",pts:20,
q:"請說明截水溝與排水溝的功能差異與配置原則。",
s:"截水溝：設於坡頂或邊坡上方，目的是「攔截」尚未進入施工區或邊坡的外來地表逕流，防止外水沖入裸露面。排水溝：設於坡面或施工區內，目的是「排除」區內已產生的逕流，導引至安全出口（沉砂池或排水系統）。配置原則：截水溝在前（上游側），排水溝在後（區內收集），兩者銜接形成完整的逕流管理鏈。",
d:`<h4>功能差異核心區分</h4><table><tr><th>項目</th><th>截水溝（Intercepting ditch）</th><th>排水溝（Drainage ditch）</th></tr><tr><td><b>目的</b></td><td>攔截「外來」清水，防止流入施工區或邊坡</td><td>排除「區內」已產生的逕流</td></tr><tr><td><b>設置位置</b></td><td>坡頂、邊坡上方3~5m處（施工區邊界外側）</td><td>坡面內、施工區內部，沿排水路線</td></tr><tr><td><b>水流來源</b></td><td>上坡未開發或未施工區域的逕流</td><td>本身坡面或施工區降雨產生的逕流</td></tr><tr><td><b>典型出口</b></td><td>導向旁側自然排水系統或排水溝</td><td>導向沉砂池或最終排放點</td></tr></table><h4>配置原則（逕流管理鏈）</h4><div class="fm">截水溝（攔截外水）→ 坡面/排水溝（收集區內逕流）→ 沉砂池（攔截泥砂）→ 出口排放</div><ul><li>截水溝永遠設在<b>最上游、最外側</b>，第一線阻擋外來水量增加區內逕流負荷</li><li>排水溝沿坡面縱向佈設，配合整地進度持續延伸，確保任何施工階段都有完整排水路徑</li><li>兩者必須<b>銜接設計</b>，不可有缺口，否則逕流會繞道形成集中沖蝕</li></ul><div class="note">常見考點：若僅設排水溝而無截水溝，外來清水會直接沖過裸露坡面再進入排水溝，沿途已造成沖蝕，因此截水溝是源頭防護的關鍵第一步。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB07",pts:20,
q:"請說明邊坡穩定分析中，總應力法與有效應力法的差異，並說明何種情況下兩者分析結果會有顯著不同。",
s:"總應力法（φ=0分析）：使用未排水剪力強度（cu），適用施工期間或快速加載（孔隙水壓尚未消散）的短期穩定分析。有效應力法：使用有效強度參數（c'、φ'），σ'=σ-u，適用長期穩定分析（孔隙水壓已達穩定狀態，如降雨滲透後的長期邊坡）。顯著差異情況：飽和黏土在快速加載（如填土施工）時，總應力法與有效應力法結果差異最大，因為孔隙水壓尚未消散，有效應力遠低於總應力。",
d:`<h4>總應力法（Total Stress Analysis）</h4><ul><li>使用<b>未排水剪力強度cu</b>（透過UU三軸試驗取得）</li><li>不需單獨考慮孔隙水壓，因為cu已內含當時的孔隙水壓效應</li><li><b>適用：</b>短期、快速加載分析（如填土施工剛完成、地震瞬間），此時孔隙水壓尚未消散（不排水條件）</li></ul><h4>有效應力法（Effective Stress Analysis）</h4><ul><li>使用<b>有效強度參數c'、φ'</b>（透過CU或CD三軸試驗取得）</li><li>需單獨計算孔隙水壓u，再求有效應力：σ'=σ-u</li><li><b>適用：</b>長期穩定分析（降雨滲透後孔隙水壓已達穩定分布狀態）</li></ul><h4>兩者結果顯著不同的情況</h4><table><tr><th>情境</th><th>差異程度</th><th>原因</th></tr><tr><td>飽和黏土快速加載（如填土施工）</td><td><b>差異最大</b></td><td>填土產生的超額孔隙水壓尚未消散，有效應力遠低於總應力，但cu已反映此時的真實強度，兩種分析若混用會誤判</td></tr><tr><td>砂土（透水性高）</td><td>差異很小</td><td>砂土排水快，幾乎不存在超額孔隙水壓問題，總應力法與有效應力法（排水條件）結果接近</td></tr><tr><td>長期穩定邊坡（孔隙水壓已平衡）</td><td>應採用有效應力法</td><td>長期狀態下總應力法的cu參數已不適用（cu僅反映短期不排水強度）</td></tr></table><div class="note">水土保持工程實務上：施工期邊坡穩定（短期）多採總應力法評估；永久邊坡（長期）必須採有效應力法，並考量設計降雨情況下的孔隙水壓分布（常用穩態或暫態滲流分析配合）。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB08",pts:20,
q:"請說明明渠水流中「臨界流」、「亞臨界流」與「超臨界流」的判別方式，並說明此判別在水土保持工程設計上的應用。",
s:"以福祿數（Froude number, Fr）判別：Fr=v/√(gy)。Fr<1：亞臨界流（緩流，重力主導，水深波動可向上游傳遞）。Fr=1：臨界流（過渡狀態，最小能量狀態）。Fr>1：超臨界流（急流，慣性主導，水深波動僅能向下游傳遞）。應用：跌水/固床工下游消能設計需確認水躍（從超臨界轉亞臨界）發生位置；陡槽排水溝多為超臨界流，需特別注意消能設施配置。",
d:`<h4>福祿數判別公式</h4><div class="fm">Fr = v / √(g×y)</div>v=流速；g=重力加速度；y=水深<h4>三種流態判別</h4><table><tr><th>流態</th><th>Fr值</th><th>物理特性</th><th>波動傳遞方向</th></tr><tr><td>亞臨界流（緩流）</td><td>Fr&lt;1</td><td>重力主導，流速相對緩慢，水深較大</td><td>可向上游與下游傳遞（下游控制上游水位）</td></tr><tr><td>臨界流</td><td>Fr=1</td><td>過渡狀態，比能（Specific energy）最小的狀態</td><td>波動傳遞速度為零（恰好靜止）</td></tr><tr><td>超臨界流（急流）</td><td>Fr&gt;1</td><td>慣性主導，流速快，水深較淺</td><td>僅能向下游傳遞（上游控制下游無法影響上游）</td></tr></table><h4>水土保持工程應用</h4><ul><li><b>跌水工/固床工消能設計：</b>水流經跌水後通常進入超臨界流（Fr>1），需設計消力池或護坦讓水流經過「水躍（Hydraulic jump）」轉變為亞臨界流，消散多餘動能，避免下游沖蝕</li><li><b>陡槽排水溝：</b>坡度大的排水溝（坡度>5%通常已達超臨界流），需在出口前設置消能設施（消力池、糙度增加塊），將流速降回安全範圍再排入下游</li><li><b>水流控制邏輯：</b>超臨界流時，下游設施（如出口檔板）無法「回頭」影響上游水位，這對排水系統水位演算有重要意義——設計時須由上游往下游逐段計算，不能反向假設下游控制上游</li></ul><div class="note">考試常考型態：給定流速與水深，計算Fr值判別流態，再依流態決定消能設計策略，是計算題與概念題的常見結合方式。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB09",pts:20,
q:"請說明土石流潛勢溪流的判定標準，並說明其與一般野溪在工程設計上的差異重點。",
s:"判定標準（水保局）：滿足以下任一條件即視為土石流潛勢溪流：(1)集水區面積≤3km²；(2)溪床坡度≥10°（約18%）；(3)溪谷內有足夠土石供應（崩塌地、堆積層）。設計差異：一般野溪僅考量清水洪峰流量設計；土石流潛勢溪需額外考量土砂體積濃度Cd，設計流量Qd=Qw/(1-Cd)放大，且需設計攔砂、導流、預警等專門設施。",
d:`<h4>土石流潛勢溪流判定標準（台灣水保局）</h4>滿足以下任一或多項條件，即可能判定為土石流潛勢溪流：<table><tr><th>判定項目</th><th>門檻值</th></tr><tr><td>集水區面積</td><td>通常≤3 km²（小集水區，反應快速）</td></tr><tr><td>溪床坡度</td><td>≥10°（約18%坡度），部分標準採≥15%</td></tr><tr><td>土石供應</td><td>溪谷沿線有足夠崩塌地或堆積層可供土石流物源</td></tr><tr><td>歷史紀錄</td><td>過去曾發生土石流災害事件</td></tr></table><h4>工程設計差異重點</h4><table><tr><th>設計項目</th><th>一般野溪</th><th>土石流潛勢溪流</th></tr><tr><td>設計流量</td><td>僅考量清水洪峰流量Qw（合理化公式或頻率分析）</td><td>需放大為土石流設計流量Qd=Qw/(1-Cd)，Cd為土砂體積濃度（0.4~0.6）</td></tr><tr><td>主要工程</td><td>固床工、護岸（防沖蝕為主）</td><td>攔砂壩（含透過型）、導流堤、沉砂池（防土砂災害為主）</td></tr><tr><td>溢洪口/通水斷面</td><td>依清水流量設計即可</td><td>需考量大顆粒土石通過能力，斷面尺寸需放大且需考慮阻塞風險</td></tr><tr><td>非工程措施</td><td>較少強制要求</td><td>必須配置雨量監測、地聲感測、預警撤離系統（土石流發生速度快，工程措施往往不足以完全防護）</td></tr></table><div class="note">核心觀念：土石流潛勢溪流的設計邏輯是「工程+非工程雙軌並行」，因為土石流的破壞力與速度遠超一般洪水，純工程手段風險仍存在，預警撤離是最後一道防線。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB10",pts:25,
q:"某重力式擋土牆，牆高H=4m，主動土壓力Pa=8 t/m（水平方向，作用點在地面以上H/3處），牆體自重W=12 t/m（作用點距牆趾2.0m），底寬B=3.0m。求抗滑動安全係數（假設摩擦角δ=30°，凝聚力忽略）與抗傾倒安全係數。",
s:"抗滑動：抗滑力=W×tanδ=12×tan30°=12×0.577=6.93t/m；FS滑動=6.93/8=0.866（<1.5不符合，需檢討加大底寬或增加自重）。抗傾倒：抵抗力矩Mr=W×2.0=24t·m/m；傾覆力矩Mo=Pa×(H/3)=8×1.33=10.67t·m/m；FS傾倒=24/10.67=2.25（>2.0符合）。",
d:`<h4>抗滑動安全係數計算</h4>抗滑力（凝聚力忽略，僅考慮摩擦）：<div class="fm">抗滑力 = W×tanδ = 12×tan30° = 12×0.577 ≈ 6.93 t/m</div>驅動力（主動土壓力水平分量）= Pa = 8 t/m<div class="fm">FS滑動 = 抗滑力/驅動力 = 6.93/8 ≈ <b>0.866</b></div><div class="note">⚠️ FS滑動=0.866 &lt; 1.5（規範要求），<b>不符合安全要求</b>，需採取改善措施：加大底寬B以增加自重W、設置基礎齒槎增加摩擦阻力、或降低牆後土壓力（如改善排水降低土壓力）。</div><h4>抗傾倒安全係數計算</h4>傾覆力矩（以牆趾為轉動支點）：<div class="fm">Mo = Pa × (H/3) = 8 × (4/3) ≈ 10.67 t·m/m</div>抵抗力矩（自重對趾端的力矩）：<div class="fm">Mr = W × 2.0 = 12 × 2.0 = 24 t·m/m</div><div class="fm">FS傾倒 = Mr/Mo = 24/10.67 ≈ <b>2.25</b></div><div class="note">✓ FS傾倒=2.25 &gt; 2.0（規範要求），<b>符合安全要求</b>。</div><h4>本題綜合結論</h4>此擋土牆<b>抗傾倒符合但抗滑動不符合</b>，這是工程實務中常見的情況——傾倒與滑動的破壞機制不同，不能僅檢核一項就認定整體安全。改善建議：增加底版寬度（同時增加自重與摩擦面積，對滑動最有效）、或在基礎下方設置齒槎（Shear key）增加額外抗滑阻力。`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB11",pts:20,
q:"請說明野溪治理工程中「縱向坡度緩和」與「橫向擴寬」兩種治理思路的差異與適用情境。",
s:"縱向坡度緩和：透過固床工系列降低有效溪床坡度，減緩流速與沖蝕能力，適用坡度過陡、下切嚴重的溪段。橫向擴寬：增加河寬以降低單位寬度流量（與流速），適用河寬不足、洪水時水位暴漲的溢淹型災害溪段。兩者可視溪流問題型態單獨或併用，現代治理趨向「還地於河」（橫向擴寬+生態化縱向處理）的綜合思路。",
d:`<h4>縱向坡度緩和（固床工系列）</h4><ul><li><b>原理：</b>透過一系列固床工，將原本連續陡降的溪床坡度，轉換為多段平緩+局部跌水的型態，降低各段平均流速</li><li><b>適用情境：</b>溪床坡度過陡導致流速過快、持續沖蝕下切；上游缺乏砂源補充導致清水侵蝕嚴重</li><li><b>效果：</b>降低剪切力τ=γRS（S降低），減少沖蝕能力，穩定溪床基準面</li></ul><h4>橫向擴寬</h4><ul><li><b>原理：</b>增加河道寬度，使單位寬度承擔的流量減少，相應流速與水位上升幅度降低</li><li><b>適用情境：</b>河寬狹窄導致洪水時水位暴漲、溢淹兩岸；都市河段因人為侵占河道造成的卡水瓶頸</li><li><b>效果：</b>降低洪峰水位，減少溢淹風險；同時增加棲地多樣性空間</li></ul><h4>現代治理趨勢：兩者整合</h4>近年「還地於河」（Room for the river）理念興起，傾向同時採用：<ul><li>橫向：適度拓寬河道，恢復自然蜿蜒與灘地</li><li>縱向：以生態化固床工（階梯式、自然石材）取代陡直混凝土結構，兼顧坡度緩和與生態功能</li><li>整合效果：降低洪水風險的同時，恢復河川生態系統的自然動態</li></ul><div class="note">考試應用：題目給定溪流問題描述（下切嚴重vs溢淹頻繁），應能判斷適用何種治理思路，這是水保工程科申論題常見的情境判斷型考點。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB12",pts:20,
q:"請說明邊坡上設置水平排水孔（Horizontal drain）的設計原則，並說明其相較於垂直集水井的優勢。",
s:"設計原則：排水孔需穿越潛在滑動面，深入穩定地層；孔徑75~150mm，微向下傾斜1~5°利用重力自然排水；間距3~6m呈扇形或平行排列。優勢：水平排水孔不需動力（重力自排，垂直集水井需抽水機長期運作）、施工較簡單（不需大型機具）、長期維護成本低、可大量密集設置覆蓋整片邊坡。",
d:`<h4>水平排水孔設計原則</h4><table><tr><th>設計項目</th><th>規定/原則</th></tr><tr><td>孔徑</td><td>75~150mm（依排水量需求調整）</td></tr><tr><td>傾斜角度</td><td>微向下傾斜1~5°，利用重力使水自然流出，無須額外動力</td></tr><tr><td>深入深度</td><td>必須穿越潛在滑動面，深入穩定地層至少數公尺，確保確實降低滑動面附近孔隙水壓</td></tr><tr><td>間距與配置</td><td>3~6m間距，依坡面範圍呈扇形（從一個鑽孔點放射）或平行排列</td></tr><tr><td>管材</td><td>常用PVC或PE穿孔管，外包濾網防止細粒堵塞</td></tr></table><h4>相較垂直集水井的優勢</h4><table><tr><th>項目</th><th>水平排水孔</th><th>垂直集水井</th></tr><tr><td>動力需求</td><td>不需動力，重力自排</td><td>需長期抽水機運作（耗電、需維護）</td></tr><tr><td>施工難度</td><td>較簡單，小型鑽機即可</td><td>較複雜，需大型鑽井設備</td></tr><tr><td>長期維護成本</td><td>低（僅需偶爾清孔防堵塞）</td><td>高（抽水機定期維護、更換零件）</td></tr><tr><td>覆蓋範圍</td><td>可大量密集設置，覆蓋整片邊坡</td><td>單井覆蓋範圍有限，多井成本高</td></tr><tr><td>適用情境</td><td>邊坡淺中層排水（最常用）</td><td>需要大量降低區域性地下水位時</td></tr></table><div class="note">這也是為何水平排水孔是邊坡穩定工程中最常見、最經濟有效的地下排水手段，幾乎是任何邊坡穩定計畫的標配選項。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB13",pts:20,
q:"請說明施工中臨時邊坡與永久邊坡的安全係數要求差異，並解釋此差異背後的工程風險邏輯。",
s:"永久邊坡：FS≥1.5（靜態）、≥1.1（地震）。臨時邊坡（施工期，≤2年）：FS≥1.3（靜態）、≥1.0（地震）。差異邏輯：永久邊坡使用年限長、暴露於各種極端事件機率高（需更高安全餘裕）；臨時邊坡使用期短、可即時監測與緊急應變（人員可隨時撤離、施工可暫停），故容許較低安全係數，但仍需基本保障避免立即性破壞。",
d:`<h4>永久 vs 臨時邊坡安全係數對比</h4><table><tr><th>邊坡類型</th><th>靜態FS</th><th>地震FS</th><th>使用期限</th></tr><tr><td>永久性邊坡</td><td>≥1.5</td><td>≥1.1</td><td>&gt;2年（長期）</td></tr><tr><td>臨時性邊坡</td><td>≥1.3</td><td>≥1.0</td><td>≤2年（施工期）</td></tr></table><h4>差異背後的工程風險邏輯</h4><ul><li><b>暴露時間長短：</b>永久邊坡需承受數十年的氣候循環（多次颱風、地震），暴露於極端事件的累積機率遠高於臨時邊坡（僅施工期1~2年），因此需更高安全餘裕應對長期不確定性</li><li><b>監測與應變能力：</b>臨時邊坡（施工中）通常有現場人員、監測儀器（傾斜管、孔隙水壓計）即時掌握狀況，一旦發現異常可立即暫停施工、加強支撐或撤離人員；永久邊坡完工後監測頻率降低，應變速度較慢</li><li><b>成本效益考量：</b>臨時邊坡若採用與永久邊坡相同的高安全係數設計，會大幅增加施工期間的防護成本（如過度的臨時支撐），但其使用期短，過度設計不符合成本效益</li><li><b>地震FS的差異邏輯：</b>地震屬於低機率但高破壞力事件，永久邊坡長期暴露於地震風險，需更高FS；臨時邊坡施工期短，遭遇強震機率相對低，FS要求可適度放寬至1.0（即剛好平衡，無安全餘裕但不致立即破壞）</li></ul>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB14",pts:20,
q:"請說明野溪生態廊道設計中「深潭-淺瀨」交替結構的功能，並說明工程設計上如何人為創造此結構。",
s:"深潭-淺瀨交替是天然溪流的自然地形特徵：深潭（Pool）提供魚類休息、避敵、越冬棲地；淺瀨（Riffle）水流較急、含氧量高，提供產卵與覓食場所。兩者交替提供生物多樣性所需的棲地異質性。人為創造方式：固床工間距與高度設計（落差後形成沖刷深潭）、佈置大石塊製造局部水流變化、避免單一均勻斷面的渠化設計。",
d:`<h4>深潭-淺瀨交替結構的生態功能</h4><table><tr><th>結構</th><th>水流特性</th><th>生態功能</th></tr><tr><td><b>深潭（Pool）</b></td><td>水流緩慢，水深較大</td><td>魚類休息避敵場所；乾旱期或洪水期的避難棲地；底棲生物（蝦蟹）庇護所；水溫較穩定，適合越冬</td></tr><tr><td><b>淺瀨（Riffle）</b></td><td>水流較急，水深較淺，溶氧量高（紊流增加氣體交換）</td><td>魚類產卵場所（多數溪流魚類偏好淺瀨產卵）；底藻附著基質，提供食物來源；昆蟲幼蟲棲息地</td></tr></table>兩者交替提供完整的<b>棲地異質性（Habitat heterogeneity）</b>，是維持生物多樣性的關鍵地形特徵，遠優於單一均勻斷面的渠化河道。<h4>工程設計人為創造方式</h4><ul><li><b>固床工間距與落差設計：</b>每個固床工下游因跌水沖擊會自然形成沖刷深潭，藉由控制固床工間距（依溪床坡度與流量），可規律性創造深潭-淺瀨序列</li><li><b>大石塊佈置（Boulder placement）：</b>在溪床擺放大型石塊，造成局部水流加速（淺瀨效果）與石塊背後的渦流緩流區（類似深潭效果）</li><li><b>避免渠化設計：</b>不採用單一均勻矩形或梯形斷面的全段護岸，保留或創造斷面變化</li><li><b>蜿蜒復原：</b>適度恢復河道蜿蜒（而非取直），蜿蜒處外彎自然形成深潭，內彎形成淺瀨</li></ul>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB15",pts:20,
q:"請說明明渠流量計算中Manning公式各參數的物理意義，並說明複合粗糙係數（如河床與護岸材質不同）的計算原理。",
s:"Manning公式：Q=(1/n)AR^(2/3)S^(1/2)。n：粗糙係數，反映邊界對水流的阻力；A：流通面積；R：水力半徑=A/P，反映斷面效率；S：水面坡降，驅動力來源。複合粗糙係數（Horton法）：n_composite=[(Σni^1.5×Pi)/P]^(2/3)，將不同材質區段（各自的n與濕周P）依此公式加權合成，反映斷面整體的等效阻力。",
d:`<h4>Manning公式各參數物理意義</h4><div class="fm">Q = (1/n) × A × R^(2/3) × S^(1/2)</div><table><tr><th>參數</th><th>物理意義</th><th>影響流量方向</th></tr><tr><td>n</td><td>粗糙係數，反映渠道邊界（底床、護岸材質）對水流的摩擦阻力</td><td>n越大→阻力越大→流量越小</td></tr><tr><td>A</td><td>流通斷面積，水流實際通過的橫截面面積</td><td>A越大→流量越大（直接正比）</td></tr><tr><td>R</td><td>水力半徑=A/P，反映斷面形狀效率（同面積下，R越大表示濕周相對越小，效率越高）</td><td>R越大→流量越大</td></tr><tr><td>S</td><td>水面坡降（驅動力），重力沿坡向下的分量</td><td>S越大→流量越大</td></tr></table><h4>複合粗糙係數計算原理（Horton法）</h4>當渠道斷面由不同材質組成（如河床n1、左岸n2、右岸n3，各有對應濕周P1、P2、P3），需計算等效的複合粗糙係數：<div class="fm">n_composite = [(Σni^1.5 × Pi) / P_total]^(2/3)</div><h4>推導邏輯</h4>假設各分區流速相同（簡化假設），各分區流量Qi=（1/ni)×Ai×Ri^(2/3)×S^0.5，加總後反推等效n值，經數學處理後得到上述Horton公式形式。<div class="note">應用情境：野溪兩岸為糙度較高的護岸材質（如石籠，n較大），河床為較滑順的細砂或混凝土（n較小），需用複合粗糙係數才能準確計算整體斷面的流量與水位關係，這在水土保持工程的野溪整治計算題中相當常見。</div>`},
{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC01",pts:25,
q:"請完整說明《水土保持法》第12條規範的應擬具水土保持計畫的各類行為，並說明此條文的立法目的。",
s:"水保法§12規定：山坡地或森林區域內從事下列行為應先擬具水保計畫：(1)農林漁牧地開發利用；(2)探礦採礦採取土石；(3)修建道路（鐵路公路）；(4)開發建築用地；(5)修建其他工程設施。立法目的：在源頭管控可能造成水土流失的開發行為，要求事前規劃水土保持措施，防止災害發生而非事後補救。",
d:`<h4>《水土保持法》第12條規範的行為（必背架構）</h4><div class="fm">於山坡地或森林區域內從事下列行為，應先擬具水土保持計畫，送請主管機關核定</div><table><tr><th>項目</th><th>具體內容</th></tr><tr><td>（一）</td><td>農、林、漁、牧地之開發利用</td></tr><tr><td>（二）</td><td>探礦、採礦、採取土石</td></tr><tr><td>（三）</td><td>修建鐵路、公路、其他道路</td></tr><tr><td>（四）</td><td>開發建築用地</td></tr><tr><td>（五）</td><td>其他開挖整地、設置公私基礎設施等</td></tr></table><h4>立法目的（理解性記憶）</h4><ul><li><b>源頭管控原則：</b>水土保持法的核心精神是「事前規劃優於事後補救」，要求開發行為在動工前就必須完成水土保持規劃，將可能的水土流失風險納入設計考量</li><li><b>技師簽證制度：</b>透過要求專業技師（水保技師等）規劃設計與監造，確保計畫具備專業品質與法律責任歸屬</li><li><b>主管機關審核機制：</b>計畫需經主管機關核定，提供第三方專業審查，避免開發單位自行決定而缺乏監督</li><li><b>適用範圍限縮在山坡地與森林區域：</b>因這些區域地形坡度大、生態敏感、開發後易引發水土流失，需要較嚴格的管制</li></ul><div class="note">記憶技巧：「農林漁牧、探礦採石、修路、建築、其他工程」——五大類涵蓋了山坡地幾乎所有主要開發型態，這是規劃設計科最基礎也最常考的法規條文。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC02",pts:20,
q:"請說明簡易水土保持申報書與一般水土保持計畫的主要差異，並說明何種規模適用簡易申報書。",
s:"簡易水保申報書：適用面積較小、坡度較緩、影響輕微的開發案，依公告標準圖直接申報，免技師簽證、免主管機關核定（採申報後備查制）。一般水保計畫：需完整規劃設計（含水文計算、設施設計圖、計算書），須技師簽證，須經主管機關正式核定後方可施工，審查期較長。主要差異：規模門檻、簽證要求、審查機制（核定vs備查）。",
d:`<h4>簡易水保申報書 vs 一般水保計畫對照</h4><table><tr><th>項目</th><th>簡易水土保持申報書</th><th>一般水土保持計畫</th></tr><tr><td>適用規模</td><td>面積較小、坡度較緩（依公告標準圖規格）</td><td>規模較大或情況複雜，不符合簡易申報條件者</td></tr><tr><td>技師簽證</td><td>免技師簽證（依標準圖自行申報）</td><td>需技師（水保/大地工程/土木/水利等）規劃設計及監造簽證</td></tr><tr><td>審查機制</td><td>申報後由主管機關「備查」</td><td>需經主管機關正式「核定」</td></tr><tr><td>審查期限</td><td>較短（備查性質）</td><td>60日內完成審核（不含補正期間）</td></tr><tr><td>內容詳細度</td><td>套用標準圖即可，內容簡化</td><td>需完整水文計算、設施設計圖、計算書、施工計畫等</td></tr></table><h4>適用簡易申報書的規模判斷</h4>依《水土保持法施行細則》及主管機關公告：<ul><li>開發面積未達一定門檻（各地方主管機關依使用性質訂定不同面積標準）</li><li>坡度較緩，符合公告之標準施工規格（如標準擋土設施、標準排水設施圖）</li><li>對水土保持影響輕微，無需個案化設計</li></ul><div class="note">考試重點：簡易申報書的精神是「規模小、風險低、用標準化規格替代個案設計」，目的是簡化行政程序，但仍須符合基本水土保持要求，並非完全免責。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC03",pts:25,
q:"某開發基地面積5公頃，集流時間20分鐘，開發前後逕流係數分別為0.35與0.70，設計重現期25年雨強為90mm/hr。請計算永久滯洪設施所需削減的洪峰流量與所需滯洪量（三角形法估算）。",
s:"Q前=0.35×90×5×100/360=0.35×90×500/360=43.75cms？需確認單位：A以ha計，Q=CiA/360，A=5ha。Q前=0.35×90×5/360=0.4375cms。Q後=0.70×90×5/360=0.875cms。ΔQ=0.875-0.4375=0.4375cms。tc=20min=1200s。Vs=ΔQ×tc/2=0.4375×1200/2=262.5m³。",
d:`<h4>Step 1. 確認單位與公式</h4><div class="fm">Q = C × i × A / 360（A以公頃ha計，Q單位為cms）</div>A=5ha；i=90mm/hr<h4>Step 2. 開發前洪峰</h4><div class="fm">Q前 = 0.35×90×5/360 = 157.5/360 ≈ 0.4375 cms</div><h4>Step 3. 開發後洪峰</h4><div class="fm">Q後 = 0.70×90×5/360 = 315/360 ≈ 0.875 cms</div><h4>Step 4. 需削減量</h4><div class="fm">ΔQ = 0.875-0.4375 = 0.4375 cms</div><h4>Step 5. 滯洪量（三角形法，tp≈tc=20min=1200s）</h4><div class="fm">Vs = ΔQ×tp/2 = 0.4375×1200/2 ≈ <b>262.5 m³</b></div><div class="note">這是規劃設計科最高頻的計算題型——合理化公式+滯洪量估算，務必練到能在5分鐘內完成整套計算。記得：①A的單位要與公式匹配（ha還是m²，需看公式版本）；②三角形法是簡化估算，正式設計應用Modified Puls法演算驗證。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC04",pts:20,
q:"請說明特定水土保持區的劃定目的與類型，並說明劃定後對土地利用會產生哪些主要管制效果。",
s:"特定水土保持區劃定目的：對具特殊保護價值或高風險的山坡地區域加強管制。類型：(1)水庫集水區保護帶；(2)現有崩塌地及其周圍一定範圍；(3)地震斷層或地質敏感區；(4)其他須加強保育之地區。管制效果：限制或禁止特定開發行為（採礦、伐木、建築）、要求更嚴格的水土保持處理標準、部分區域全面禁止開發。",
d:`<h4>特定水土保持區劃定目的</h4>依《水土保持法》第16條，主管機關得視需要劃定特定水土保持區，針對具<b>特殊保護價值</b>或<b>高風險特性</b>的山坡地區域，施以更嚴格的水土保持管制措施，超出一般山坡地的常規管理強度。<h4>劃定類型</h4><table><tr><th>類型</th><th>劃定原因</th></tr><tr><td>水庫集水區保護帶</td><td>保護水源水質，防止淤積影響水庫蓄水功能</td></tr><tr><td>現有崩塌地及周邊一定範圍</td><td>崩塌地具持續活動風險，需防止周邊開發引發二次災害</td></tr><tr><td>地震斷層或地質敏感區</td><td>地質結構不穩定，開發風險高</td></tr><tr><td>其他須加強保育地區</td><td>依生態、景觀或其他特殊保護需求劃定</td></tr></table><h4>管制效果</h4><ul><li><b>禁止特定行為：</b>禁止採礦、伐木、開挖整地等高風險開發行為</li><li><b>限制土地利用方式：</b>限制新建建築物、道路工程等</li><li><b>提高水土保持處理標準：</b>即使是允許的開發行為，也需符合更嚴格的設計規範（如更高的安全係數、更完整的監測計畫）</li><li><b>部分區域全面禁止開發：</b>對風險極高的核心區域，直接公告禁止任何形式的開發</li></ul><div class="note">與廢止原則呼應：當劃定目的消滅（如水庫廢棄）或目的已達成（環境已穩定恢復），可依法定程序廢止特定水土保持區，恢復一般管制強度。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC05",pts:20,
q:"請說明水土保持計畫審查過程中，會辦其他機關（如林務局、地政機關）的目的與常見會辦事項。",
s:"會辦目的：水土保持計畫涉及跨領域、跨權責的事項時，需徵詢相關主管機關意見，確保計畫符合各該領域法規要求，避免單一機關審查的侵限性。常見會辦事項：(1)涉及國有林地→會辦林務機關（確認租用或使用許可）；(2)涉及原住民保留地→會辦原民會；(3)地籍套圖確認→會辦地政機關；(4)涉及野生動物保護區→會辦保育主管機關。",
d:`<h4>會辦制度的目的</h4>水土保持計畫常涉及多重土地權屬與多重法規管制範疇，主管機關（水保機關）本身的專業與權責有限，無法獨自確認所有面向的合法性與適當性，因此需透過<b>會辦（Inter-agency consultation）</b>機制，徵詢相關目的事業主管機關的意見：<ul><li>確保計畫不違反其他相關法規（如森林法、原住民族基本法、野生動物保育法）</li><li>確認土地權屬與使用權限的合法性</li><li>整合跨領域專業意見，提升計畫審查的完整性</li></ul><h4>常見會辦事項與對應機關</h4><table><tr><th>會辦事項</th><th>對應機關</th><th>確認重點</th></tr><tr><td>涉及國有林地</td><td>林務及自然保育署（原林務局）</td><td>是否取得租用、撥用或使用許可</td></tr><tr><td>涉及原住民保留地</td><td>原住民族委員會</td><td>是否符合原民保留地相關規定及部落諮商同意程序</td></tr><tr><td>地籍範圍確認</td><td>地政機關</td><td>確認開發基地地籍範圍與套圖正確性，避免越界開發</td></tr><tr><td>涉及野生動物保護區/重要棲地</td><td>農業部生物多樣性研究所或地方保育機關</td><td>是否影響保育類物種棲地，是否需額外生態評估</td></tr><tr><td>涉及水資源保護區</td><td>水利機關</td><td>是否符合自來水水質水量保護區管制規定</td></tr></table><div class="note">會辦回覆期限通常為14~30日，這也是水保計畫審查實際耗時遠超60日法定期限的主要原因之一（詳見計畫審核期限相關考題）。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC06",pts:25,
q:"某社區開發案集水區面積8公頃，集流時間15分鐘，依IDF公式估算25年重現期15分鐘雨強為110mm/hr。開發前C=0.30，開發後C=0.65。若採用矩形溢洪口（寬1.2m）作為滯洪池出水口設計，溢洪口設計使出流量等於開發前洪峰，求所需水頭高度H。",
s:"Q前=0.30×110×8/360=2.933cms（此即設計出流量目標）。矩形堰公式Q=(2/3)Cd√(2g)×L×H^1.5，取Cd=0.6：2.933=(2/3)×0.6×√19.62×1.2×H^1.5=0.4×4.429×1.2×H^1.5=2.126×H^1.5。H^1.5=2.933/2.126=1.380。H=1.380^(1/1.5)=1.380^0.667≈1.23m。",
d:`<h4>Step 1. 計算開發前洪峰（設計出流量目標）</h4><div class="fm">Q前 = C前×i×A/360 = 0.30×110×8/360 = 264/360 ≈ 2.933 cms</div><h4>Step 2. 矩形堰公式設定</h4><div class="fm">Q = (2/3)×Cd×√(2g)×L×H^1.5</div>Cd=0.6（一般矩形堰流量係數）；g=9.81；L=1.2m<div class="fm">(2/3)×0.6×√19.62 = 0.4×4.429 = 1.772</div><div class="fm">1.772×1.2 = 2.126</div><h4>Step 3. 解出H</h4><div class="fm">2.933 = 2.126×H^1.5</div><div class="fm">H^1.5 = 2.933/2.126 = 1.380</div><div class="fm">H = 1.380^(2/3) ≈ <b>1.23 m</b></div><div class="note">本題串接「合理化公式求設計出流量」+「矩形堰公式反求水頭」兩個常考計算步驟，是規劃設計科申論題附帶計算的典型考法。注意指數運算：H^1.5求解H時，需取1.5的倒數次方，即開2/3次方，計算機操作可用 x^(2/3) 或先平方再開三次方根。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC07",pts:20,
q:"請說明水土保持計畫變更設計與展期申請的程序差異，並說明各自的審查重點。",
s:"變更設計：因開發內容、規模或設計有實質改變，需重新送審核定，審查重點是新設計是否仍符合水土保持技術規範與安全要求。展期申請：原計畫內容不變，僅因故（資金、糾紛等）無法在期限內申報開工或完工，申請延長期限，審查重點是展期理由是否充分及現況是否仍安全無虞（如有無新增風險因子）。",
d:`<h4>變更設計 vs 展期申請對照</h4><table><tr><th>項目</th><th>變更設計</th><th>展期申請</th></tr><tr><td>觸發原因</td><td>開發規模、性質、主要設施有實質改變</td><td>原計畫內容不變，僅因故無法如期完成</td></tr><tr><td>送審內容</td><td>需提送修改後的完整設計圖說、計算書</td><td>僅需說明展期理由及現況確認，不需重新設計</td></tr><tr><td>審查重點</td><td>新設計是否符合水保技術規範、各項安全係數是否仍滿足要求</td><td>展期理由是否充分（如資金問題、地主糾紛）；現場是否仍維持安全狀態（無新增崩塌風險等）</td></tr><tr><td>核定結果</td><td>核定後取代原計畫，成為新的核定版本</td><td>核定後延長原計畫的有效期限，內容不變</td></tr><tr><td>展期次數限制</td><td>不適用（每次變更皆視為新案）</td><td>通常最多展期1年（依各地方規定）</td></tr></table><h4>共同點</h4>兩者皆需向原核定主管機關提出申請，且在申請審查期間，若有安全急迫情形（如已有崩塌徵兆），主管機關得要求立即採取緊急防護措施，不論審查結果如何。`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC08",pts:25,
q:"請說明農塘溢洪道設計的基本考量，並比較固定式溢洪道與虹吸式溢洪道的差異。",
s:"溢洪道設計考量：(1)設計洪水（通常採較高重現期，因潰決後果嚴重）；(2)洩洪能力需大於設計入流量；(3)出口消能避免沖蝕壩體基礎；(4)材質耐久性。固定式溢洪道：開放式溝渠或缺口，水位超過堰頂即自動溢流，簡單可靠但流量調節能力有限。虹吸式溢洪道：利用虹吸效應在達到啟動水位後產生急遽放大的洩流能力，洩洪效率高但構造較複雜、易因異物堵塞失效。",
d:`<h4>農塘溢洪道設計基本考量</h4><table><tr><th>考量項目</th><th>說明</th></tr><tr><td>設計洪水重現期</td><td>農塘潰決可能造成下游重大災害，溢洪道設計通常採用較高重現期（如100年或PMF機率最大洪水），安全餘裕需求高於一般排水設施</td></tr><tr><td>洩洪能力</td><td>溢洪道最大洩洪能力必須大於設計入流量，確保極端降雨時水位不超過堤頂安全高度</td></tr><tr><td>出口消能</td><td>溢洪道下游需設置消能設施（如護坦、消力池），防止高速水流沖蝕壩體基礎或下游坡面</td></tr><tr><td>材質耐久性</td><td>溢洪道長期暴露於水流沖刷，需選用耐磨耐久材質（混凝土、砌石）</td></tr></table><h4>固定式 vs 虹吸式溢洪道比較</h4><table><tr><th>項目</th><th>固定式溢洪道</th><th>虹吸式溢洪道</th></tr><tr><td>運作原理</td><td>開放式溝渠或缺口，水位超過堰頂高程即自然溢流（堰流公式）</td><td>利用虹吸管路設計，當水位達到啟動高程，虹吸效應產生，洩流量急遽放大數倍</td></tr><tr><td>構造複雜度</td><td>簡單，僅需開挖溢洪道或設置溢流堰</td><td>複雜，需精密設計虹吸管路與通氣孔</td></tr><tr><td>洩洪效率</td><td>洩流量與水頭的1.5次方成正比（堰流特性），增量平緩</td><td>啟動後洩流量急遽增加，適合應對突發性洪峰</td></tr><tr><td>可靠性</td><td>較可靠，不易故障</td><td>易因落葉、漂流物堵塞虹吸管路而失效，需定期維護</td></tr><tr><td>適用場合</td><td>一般農塘、多數常規滯洪設施</td><td>空間受限需要高效率洩洪的特殊場合</td></tr></table><div class="note">台灣多數農塘採固定式溢洪道（堰流或矩形溢洪口），因其可靠性高、維護簡單，符合農村實務管理能力；虹吸式較少見於小型農塘，多用於大型水庫的輔助溢洪設施。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC09",pts:20,
q:"請說明水土保持義務人的定義，並說明在土地所有權移轉的情況下，水土保持義務的承接原則。",
s:"水土保持義務人：依水保法規定，從事應擬具水保計畫之行為的申請人或開發單位，負有依核定計畫實施、維護及異常處理的法律義務。土地所有權移轉：原則上義務隨同土地移轉而承接，新所有權人（或使用權人）應承接原核定計畫的水土保持義務（包括未完成的保育設施、持續維護責任），除非已完成解除列管程序。",
d:`<h4>水土保持義務人定義</h4>依《水土保持法》規定，<b>水土保持義務人</b>係指從事第12條所列應擬具水土保持計畫行為的申請人、開發單位、或土地所有權人（使用權人），對其開發行為負有：<ul><li>依核定之水土保持計畫實施各項保育措施的義務</li><li>維護已完成水土保持設施功能正常的義務</li><li>發生異常（如設施損壞、邊坡滑動徵兆）時，立即處理及通報的義務</li></ul><h4>土地所有權移轉時的義務承接原則</h4><table><tr><th>情境</th><th>義務承接原則</th></tr><tr><td>土地買賣移轉</td><td>原則上水土保持義務隨同土地移轉，新所有權人應承接原核定計畫的義務（包括尚未完成的設施、持續維護責任）</td></tr><tr><td>未完成水土保持處理即移轉</td><td>新所有權人需完成原計畫尚未完成的水土保持設施，不得以「非原開發者」為由規避義務</td></tr><tr><td>已完成解除列管</td><td>若原計畫已完成竣工查驗，且經主管機關核准解除列管，則後續所有權人不再承接原計畫的特定義務（但仍受一般山坡地管理規定約束）</td></tr><tr><td>義務人變更（如更名）</td><td>僅屬程序性變更，依規定報主管機關備查即可，原核定計畫內容不變</td></tr></table><div class="note">考試重點：此原則的核心邏輯是「義務跟著土地走」，目的是防止透過土地轉手來規避水土保持責任，確保開發後的長期維護責任不會因產權移轉而出現空窗期。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC10",pts:25,
q:"某坡地農場面積4ha，坡長80m，坡度均一10%，Km=0.030，Rm=12000。開發前植生覆蓋良好C=0.05；施工整地裸露期間C=1.0；施工完工植生復原後C=0.08。各階段P=1.0。請計算三階段年土壤流失量，並說明此計算對沉砂池容量設計的應用意義。",
s:"L=(80/22.13)^0.5=1.902。坡度10%≥9%：S=16.8×0.10-0.50=1.18。LS=1.902×1.18=2.244。基準值R×K×LS=12000×0.030×2.244=807.8 ton/ha/yr。開發前：807.8×0.05=40.4ton/ha/yr。施工期：807.8×1.0=807.8ton/ha/yr。完工後：807.8×0.08=64.6ton/ha/yr。應用：沉砂池容量設計應以「施工期」（最大流失量）為依據，而非開發前或完工後的較低數值，確保施工期高峰泥砂量能被有效攔截。",
d:`<h4>Step 1. LS因子</h4><div class="fm">L = (80/22.13)^0.5 = 3.616^0.5 ≈ 1.902</div>坡度10%≥9%（大坡度公式）：<div class="fm">S = 16.8×0.10-0.50 = 1.18</div><div class="fm">LS = 1.902×1.18 ≈ 2.244</div><h4>Step 2. 基準值（R×K×LS）</h4><div class="fm">R×K×LS = 12000×0.030×2.244 ≈ 807.8 ton/ha/yr</div><h4>Step 3. 各階段流失量</h4><table><tr><th>階段</th><th>C值</th><th>年流失量（ton/ha/yr）</th></tr><tr><td>開發前（植生良好）</td><td>0.05</td><td>807.8×0.05≈40.4</td></tr><tr><td><b>施工整地期間（裸露）</b></td><td>1.0</td><td><b>807.8×1.0≈807.8</b></td></tr><tr><td>完工植生復原後</td><td>0.08</td><td>807.8×0.08≈64.6</td></tr></table><h4>對沉砂池容量設計的應用意義（重點）</h4><ul><li><b>沉砂池設計必須以「施工期」流失量為依據：</b>施工期裸露的流失量（807.8 ton/ha/yr）是開發前的<b>約20倍</b>，是完工後的<b>約12.5倍</b>，若以開發前或完工後的較低數值設計沉砂池容量，將嚴重低估施工期間的泥砂負荷，導致沉砂池在施工期溢滿失效</li><li><b>這正解釋了為何水保計畫要求設置「臨時沉砂池」：</b>施工期間是整個開發週期中泥砂風險最高的階段，需要專門的臨時性沉砂設施應對這個高峰期，而非僅依賴永久沉砂池（永久沉砂池通常以完工後較低的流失量設計，容量較小）</li><li><b>分期施工的意義：</b>透過分期分區施工（縮小同時裸露面積），可以降低「施工期」這個高峰階段的實際泥砂供應量，是控制風險成本效益較高的策略</li></ul>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC11",pts:20,
q:"請說明農地坡面整坡時，台階式（梯田）設計中「台階寬度」與「駁坎高度」的設計考量原則。",
s:"台階寬度：需考量農機操作需求（最小寬度足以容納農機迴轉）、原坡度（坡度越陡可用寬度越窄）、作物種類（果樹需較寬台階）。駁坎高度：受限於土壤抗剪強度（過高易崩塌）、施工材料（土堤、石駁坎、混凝土駁坎各有高度限制）、通常單階高度不超過1.5~2m，超過則需分階處理。兩者乘積（寬度×階數）需配合原坡長與坡度，達到坡面整體穩定。",
d:`<h4>台階寬度設計考量</h4><table><tr><th>考量因子</th><th>影響方向</th></tr><tr><td>農機操作需求</td><td>機械化耕作（曳引機等）需要足夠迴轉空間，台階寬度通常需≥3~4m</td></tr><tr><td>原坡度</td><td>坡度越陡，相同垂直高差下能分配的水平台階寬度越窄，需更多階數來消化高差</td></tr><tr><td>作物種類</td><td>果樹（需較大株距與管理空間）需較寬台階；草本作物或茶園可採較窄台階</td></tr><tr><td>排水需求</td><td>台階需保留適當坡度（通常1~3%）朝向排水溝，避免積水</td></tr></table><h4>駁坎高度設計考量</h4><table><tr><th>考量因子</th><th>影響方向</th></tr><tr><td>土壤抗剪強度</td><td>駁坎過高會使其自身承受的側向土壓力增大，超過土壤抗剪強度則發生崩塌，一般控制單階高度不超過<b>1.5~2m</b></td></tr><tr><td>施工材料</td><td>土堤駁坎高度限制較嚴（通常&lt;1m，否則需加強）；石駁坎可達1.5~2m；混凝土駁坎可更高但成本增加</td></tr><tr><td>邊坡角度</td><td>駁坎邊坡角度需小於土壤休止角，避免堆置後自然崩落</td></tr></table><h4>整體設計邏輯</h4>台階寬度×階數需配合原坡長，駁坎高度×階數需配合原垂直高差，兩者乘積關係決定整體梯田系統的尺寸配置，最終目標是在滿足農業操作需求的前提下，使每一階的駁坎高度都在安全範圍內，避免因單階過高而造成局部崩塌風險。`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC12",pts:25,
q:"請說明農塘容量設計中「有效容量」與「總容量」的差異，並列出設計總容量時需扣除或加計的各項因子。",
s:"有效容量：可實際供灌溉/滯洪使用的水量（即正常運用水位至最低運用水位間的容量）。總容量：水庫滿水位以下的全部容積，包含有效容量、淤積預留容量（容許淤積)、安全超高（堤頂超高對應的容量不計入）。設計時：總容量=有效容量+淤積預留容量（依設計年限×年均淤積速率估算）+其他無法利用的死容量（如取水口以下的容量）。",
d:`<h4>有效容量 vs 總容量定義</h4><table><tr><th>容量類型</th><th>定義</th></tr><tr><td><b>有效容量</b></td><td>正常運用水位（滿水位）至最低運用水位（如取水口高程）之間的容積，是實際可供利用（灌溉、滯洪）的水量</td></tr><tr><td><b>總容量</b></td><td>正常運用水位以下的全部容積，包含有效容量、淤積預留容量、死容量等所有部分</td></tr></table><h4>設計總容量需考量的因子</h4><table><tr><th>因子</th><th>說明</th></tr><tr><td><b>有效容量（核心需求）</b></td><td>依灌溉需水量或滯洪量需求計算得出的基本容量需求</td></tr><tr><td><b>淤積預留容量</b></td><td>依設計使用年限（如50年）× 年均淤積速率（依集水區產砂量估算）計算，預留給未來逐年淤積佔用的空間，避免有效容量隨時間遞減而失去設計功能</td></tr><tr><td><b>死容量（Dead storage）</b></td><td>取水口以下無法被正常利用的容積（通常因結構限制無法抽取），但仍佔用水庫底部空間</td></tr><tr><td><b>安全超高（非容量因子但影響設計）</b></td><td>堤頂高程須高於設計最高水位再加安全超高（通常0.3~1.0m），這部分屬堤頂高程設計考量，非容量計算的一部分，但影響整體堤高與造價</td></tr></table><h4>設計邏輯公式（概念性）</h4><div class="fm">總容量 = 有效容量 + 淤積預留容量 + 死容量</div><div class="note">水土保持規劃設計科常考的水庫淤積年限計算題（如108年坡地水文學考題的水庫囚砂效率計算），就是建立在這個容量架構基礎上：當淤積量逐年累積佔據原本的有效容量，到達設定的容量損失比例（如50%）時，即為水庫的「有效服務年限」。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC13",pts:20,
q:"請說明危險順向坡的判定原則，並說明判定為危險順向坡後，規劃設計上常見的因應策略。",
s:"危險順向坡判定：地層傾向與坡面方向大致一致（順向）、地層傾角小於坡面角度但仍具一定傾角（通常10°~70°之間視為危險範圍）、有層理或弱面（如黏土夾層、頁理）可作為潛在滑動面。因應策略：(1)避免開挖破壞坡腳（移除順向坡支撐）；(2)設置地錨或排樁穿越潛在滑動面；(3)地下排水降低滑動面孔隙水壓；(4)嚴重者禁止開發，劃定為限制建築區。",
d:`<h4>危險順向坡判定原則</h4><table><tr><th>判定要素</th><th>說明</th></tr><tr><td>地層傾向</td><td>地層傾向與坡面坡向大致一致（同向），形成順向坡構造</td></tr><tr><td>地層傾角</td><td>傾角小於坡面角度，但仍具一定傾角（一般認定10°~70°範圍內具滑動風險，過於平緩或過於陡直反而風險較低）</td></tr><tr><td>弱面/層理</td><td>地層中存在黏土夾層、頁理、節理等低強度弱面，可作為潛在滑動面</td></tr><tr><td>坡趾條件</td><td>若坡趾（順向坡下端）已被開挖或河流侵蝕移除支撐，風險顯著提高</td></tr></table><h4>判定為危險順向坡後的因應策略</h4><table><tr><th>策略</th><th>具體措施</th></tr><tr><td><b>避免破壞坡趾支撐（最重要）</b></td><td>嚴格禁止在順向坡坡趾進行開挖，這是維持順向坡穩定的關鍵</td></tr><tr><td>地錨/排樁穩定</td><td>設置預力地錨或排樁，穿越潛在滑動面（弱面），提供額外抗滑阻力</td></tr><tr><td>地下排水</td><td>設置水平排水孔降低滑動面附近孔隙水壓，提高有效應力與安全係數</td></tr><tr><td>長期監測</td><td>安裝傾斜管、地表位移監測樁，持續追蹤是否有滑動徵兆</td></tr><tr><td>限制開發（嚴重者）</td><td>若風險評估顯示安全係數無法達到要求標準，應劃定為限制建築區或加強保育地，禁止或嚴格限制開發行為</td></tr></table><div class="note">立體投影圖判斷技巧：在地質圖上比對坡面傾向（地形等高線）與地層傾向（走向傾角符號），若兩者方向接近（夾角小於30°）且地層傾角小於坡角，即初步判定為順向坡構造，需進一步現場調查確認弱面位置。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC14",pts:20,
q:"請說明沉砂設施與滯洪設施垂直共構時應注意的事項，並說明此設計方式的優缺點。",
s:"垂直共構：將沉砂池設於滯洪池下層（或上游端），合併為單一複合結構。注意事項：(1)沉砂層需設計可定期清淤的獨立通道，不影響滯洪功能；(2)兩者水位高程需妥善銜接，確保沉砂後的水才進入滯洪空間；(3)結構設計需同時滿足沉砂（流速需慢）與滯洪（容量需大）的相互衝突需求。優點：節省用地面積。缺點：維護管理較複雜，清淤作業可能干擾滯洪功能運作。",
d:`<h4>垂直共構設計概念</h4>在用地有限的情況下，將沉砂設施（攔截泥砂）與滯洪設施（削減洪峰）整合為同一結構體的不同層次或分區，而非分別設置兩個獨立設施，以節省用地面積。<h4>垂直共構應注意事項</h4><table><tr><th>注意事項</th><th>說明</th></tr><tr><td>獨立清淤通道</td><td>沉砂層需設計可單獨進出清淤的通道或開口，避免清淤作業時必須排空整個滯洪空間，影響滯洪功能的持續運作</td></tr><tr><td>水位高程銜接</td><td>水流需先經過沉砂區（低流速沉降泥砂）才進入滯洪空間，兩者高程與流路設計需確保此順序，不可逆流或短路</td></tr><tr><td>功能需求衝突的權衡</td><td>沉砂需要<b>低流速、長滯留時間</b>；滯洪需要<b>大容量、能快速蓄洪</b>，兩者在空間配置上可能互相排擠，需仔細權衡分區比例</td></tr><tr><td>結構安全</td><td>合併結構的整體穩定性、防水性需一併考量，避免因功能複雜化而降低結構安全餘裕</td></tr></table><h4>優缺點分析</h4><table><tr><th>優點</th><th>缺點</th></tr><tr><td>節省用地面積（山坡地土地資源有限時特別重要）</td><td>維護管理較複雜，需同時考量兩種功能的運作需求</td></tr><tr><td>降低整體工程造價（共用部分結構）</td><td>清淤作業可能暫時影響滯洪容量，需妥善規劃清淤時程（避開颱風季）</td></tr><tr><td>水流路徑單一化，減少額外管線銜接需求</td><td>設計複雜度提高，需要更精細的水力計算驗證</td></tr></table>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC15",pts:25,
q:"某野溪河床質調查得D50=45mm、D84=85mm。請說明此調查結果如何應用於：(一)固床工材料選用；(二)護岸設計流速檢核；(三)生態棲地評估。",
s:"(一)固床工材料：選用粒徑應大於河床自然D84（85mm），確保不被沖蝕帶走，建議採用粒徑100mm以上的塊石或預鑄結構。(二)護岸設計流速：依河床質D84反算容許流速（依Shields參數或經驗公式），確保設計流速不超過此臨界值，避免河床起動沖蝕。(三)生態棲地評估：D50=45mm屬中等粒徑礫石底質，適合多數溪流魚類覓食與底棲生物附著，若D50>60mm則更適合產卵棲地，本案D50略低於理想產卵粒徑，可能需局部補充較大礫石改善棲地品質。",
d:`<h4>河床質基本資料</h4>D50=45mm（中值粒徑）；D84=85mm（84%通過粒徑，水力計算常用代表值）<h4>（一）固床工材料選用</h4>固床工材料粒徑需<b>大於河床自然最大代表粒徑（D84）</b>，否則材料本身會在設計流速下被沖蝕帶走：<ul><li>建議固床工塊石粒徑選用<b>100mm以上</b>（明顯大於D84=85mm，留有安全餘裕）</li><li>若採用預鑄混凝土結構，則需確認結構單元重量足以抵抗設計流速下的拖曳力與升力，不受河床自然粒徑限制</li></ul><h4>（二）護岸設計流速檢核</h4>以D84反算河床容許流速（起動流速）：<ul><li>依Shields參數或經驗公式（如美國Corps of Engineers經驗式），D84=85mm（約8.5cm）對應的容許流速約在<b>2.0~2.5 m/s</b>範圍</li><li>護岸設計流速必須<b>低於</b>此臨界值，否則河床（即使有護岸保護兩側）仍會發生沖蝕下切，間接危及護岸基礎穩定性</li><li>若設計流速超過容許值，需考慮設置固床工抬升並穩定溪床，或選用更大粒徑的河床保護材料</li></ul><h4>（三）生態棲地評估</h4><ul><li>D50=45mm屬於<b>中等粒徑礫石底質</b>，介於粗砂與大礫石之間，適合多數溪流魚類（如石斑、苦花幼魚）的覓食與底棲無脊椎動物附著</li><li>對於<b>產卵棲地</b>而言，一般認為D50>60mm的礫石底質生態價值較高（提供卵粒安全的孔隙空間躲避水流直接衝擊），本案D50=45mm<b>略低於理想產卵粒徑</b></li><li>建議：若此溪段為重要魚類產卵棲地，可考慮局部補充較大粒徑礫石（人工強化），改善產卵棲地品質，同時兼顧護岸與固床工設計的水力穩定性需求</li></ul><div class="note">本題整合了河床質調查資料在工程設計（材料選用、流速檢核）與生態評估兩個面向的應用，是規劃設計科申論題常見的「一份資料、多重應用」考法。</div>`},
{yr:"自出",sub:"坡地水文學",type:"self",n:"sD01",pts:20,
q:"請說明水文循環的主要環節，並用一張概念圖（文字描述）說明各環節之間的轉換關係。",
s:"水文循環環節：降水→截留→入滲（地表水）/地表逕流→蒸發散（返回大氣）→滲漏→地下水補注→基流（排洩至河川）→蒸發（海洋/河川水面）→大氣水汽→降水（循環）。核心轉換鏈：大氣（水汽）⇌地表（降水/蒸發）⇌土壤（入滲/蒸散）⇌地下水（補注/排洩）⇌河川（逕流/基流）⇌海洋（最終彙集）。",
d:`<h4>水文循環完整環節（喚醒整體架構）</h4><div class="fm">大氣水汽 → 降水 → [截留→蒸發] → 地表 → [入滲 or 地表逕流]</div><div class="fm">入滲水 → 滲漏（不飽和帶）→ 地下水補注 → [基流排洩 or 抽水利用]</div><div class="fm">地表逕流 + 基流 → 河川 → 海洋 → [蒸發] → 大氣水汽（循環起點）</div><h4>各環節定義回顧</h4><table><tr><th>環節</th><th>定義</th></tr><tr><td>截留（Interception）</td><td>植物葉面莖幹攔截降雨，部分直接蒸發返回大氣</td></tr><tr><td>入滲（Infiltration）</td><td>水由地表進入土壤表層的過程</td></tr><tr><td>滲漏（Percolation）</td><td>水在不飽和帶中繼續向下移動至地下水面</td></tr><tr><td>滲流（Seepage）</td><td>地下水（飽和帶）中的側向流動</td></tr><tr><td>蒸發散（Evapotranspiration）</td><td>土面蒸發+植物蒸散的總稱</td></tr><tr><td>基流（Baseflow）</td><td>地下水緩慢排洩至河川，維持枯水期流量</td></tr></table><div class="note">考試應用：理解這個完整循環鏈，可以快速回答「植生如何影響水文環境」「都市化如何改變水文循環」等申論題，只要依序檢視循環鏈中每個環節受到的影響即可完整作答，不會漏掉任何重要面向。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD02",pts:20,
q:"請說明單位歷線（Unit Hydrograph）的基本假設與應用原理，並說明線性疊加原理如何應用於複合降雨事件的逕流計算。",
s:"基本假設：(1)時間不變性（同一集水區，相同延時的單位降雨，產生的UH形狀不變）；(2)線性疊加性（降雨量加倍，逕流量加倍；多場降雨的逕流可疊加計算）。應用原理：將連續複雜降雨拆解為多個獨立的單位降雨時段，各自產生對應的UH，再依時序疊加（考慮延遲）得到總逕流歷線。",
d:`<h4>單位歷線基本假設（必背）</h4><table><tr><th>假設</th><th>內容</th></tr><tr><td><b>時間不變性</b></td><td>同一集水區，固定延時（如1小時）的單位有效降雨（1cm），不論發生在何時，產生的逕流歷線形狀相同</td></tr><tr><td><b>線性疊加性（比例性+疊加性）</b></td><td>有效降雨量加倍，逕流流量在每個對應時刻都加倍（比例性）；多場時間不同的降雨，其逕流可依時序疊加（疊加性）</td></tr></table><h4>線性疊加應用於複合降雨</h4>假設集水區有1小時延時、1cm有效降雨的UH已知。若實際發生連續多時段降雨：<ul><li><b>Step 1：</b>將降雨依時段拆解，扣除入滲損失（φ指數法），得到各時段「有效降雨」</li><li><b>Step 2：</b>各時段有效降雨×對應比例的UH（若該時段有效降雨為Pi cm，則該時段貢獻的逕流為Pi×UH）</li><li><b>Step 3：</b>各時段貢獻依時間延遲疊加（後面時段的UH要往後平移對應時段數）</li><li><b>Step 4：</b>加總所有貢獻得到總直接逕流歷線（DRO）</li><li><b>Step 5：</b>加上基流，得到總河川流量歷線Q(t)</li></ul><div class="fm">Q(t) = Σ[Pi × U(t-i+1)] + Qbase</div><div class="note">這個疊加邏輯正是114年坡地水文學考題（雙場降雨求流量歷線）的核心解法，務必練熟「拆解→各自卷積→依時序疊加→加基流」這套標準流程。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD03",pts:25,
q:"某集水區面積60km²，設計暴雨延時2hr總降雨60mm，入滲損失φ=0.5cm/hr。已知1hr延時1cm有效降雨的單位歷線：t=0,1,2,3,4hr對應流量0,40,80,40,0(cms)。求此降雨事件產生的逕流歷線（總流量，假設基流5cms）。",
s:"降雨拆為兩個1hr時段，各30mm=3cm。扣損失：每時段有效降雨=3-0.5=2.5cm。第一時段(t=0起)貢獻=2.5×UH；第二時段(t=1起)貢獻=2.5×UH（往後移1hr）。疊加：t=0:2.5×0=0；t=1:2.5×40+2.5×0=100；t=2:2.5×80+2.5×40=300；t=3:2.5×40+2.5×80=300；t=4:2.5×0+2.5×40=100；t=5:2.5×0=0。加基流5：Q=5,105,305,305,105,5。",
d:`<h4>Step 1. 降雨拆解與有效降雨計算</h4>總降雨60mm=6cm，延時2hr，拆為兩個1hr時段，各時段降雨=3cm（假設均勻分布）<br>各時段有效降雨=3-φ×1hr=3-0.5=<b>2.5cm</b>（兩時段相同）<h4>Step 2. 各時段貢獻（線性疊加）</h4>第一時段（t=0起算）貢獻DRO1 = 2.5×UH（不平移）<br>第二時段（t=1起算）貢獻DRO2 = 2.5×UH（往後平移1hr）<table><tr><th>t(hr)</th><th>UH(cms)</th><th>DRO1=2.5×UH(t)</th><th>DRO2=2.5×UH(t-1)</th><th>DRO合計</th><th>Q=DRO+5</th></tr><tr><td>0</td><td>0</td><td>0</td><td>-</td><td>0</td><td>5</td></tr><tr><td>1</td><td>40</td><td>100</td><td>2.5×0=0</td><td>100</td><td>105</td></tr><tr><td>2</td><td>80</td><td>200</td><td>2.5×40=100</td><td>300</td><td>305</td></tr><tr><td>3</td><td>40</td><td>100</td><td>2.5×80=200</td><td>300</td><td>305</td></tr><tr><td>4</td><td>0</td><td>0</td><td>2.5×40=100</td><td>100</td><td>105</td></tr><tr><td>5</td><td>-</td><td>-</td><td>2.5×0=0</td><td>0</td><td>5</td></tr></table><div class="note">尖峰流量出現在t=2與t=3兩個時刻，均為305 cms（雙峰平頂現象，因兩時段降雨疊加恰好造成尖峰持平）。這正是單位歷線疊加法的標準解題模板，務必反覆練習至能快速建表計算。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD04",pts:20,
q:"請說明合理化公式（Q=CiA/360）的基本假設與適用限制，並說明為何此公式不適用於大型集水區。",
s:"基本假設：(1)降雨在集水區內均勻分布；(2)降雨強度恆定且延時等於集流時間tc（此時洪峰最大）；(3)逕流係數C為定值（不隨降雨變化）。適用限制：僅適用小型集水區（通常<5km²或更小），因大型集水區降雨空間分布不均勻假設不成立，且tc過長使降雨強度恆定假設不合理（長延時降雨強度通常較低，且集水區內各處匯流時間差異大）。",
d:`<h4>合理化公式基本假設</h4><div class="fm">Q = C × i × A / 360</div><table><tr><th>假設</th><th>內容</th><th>合理性檢視</th></tr><tr><td>降雨空間均勻</td><td>整個集水區同時遭受相同強度的降雨</td><td>小集水區尚可接受，大集水區降雨空間變異大，假設失真</td></tr><tr><td>降雨延時=tc</td><td>當降雨延時恰好等於集流時間時，洪峰流量最大（全集水區同時貢獻逕流）</td><td>此為理論最不利情況，實際設計常採用此假設求最大可能洪峰</td></tr><tr><td>C值為定值</td><td>逕流係數不隨降雨強度、前期含水量等變化</td><td>實際上C值會隨土壤飽和程度變化，但合理化公式簡化為定值</td></tr></table><h4>為何不適用大型集水區</h4><ul><li><b>降雨空間分布不均勻：</b>大型集水區面積廣，不同位置可能遭受不同強度的降雨（尤其颱風或局部對流雨），均勻降雨假設嚴重失真</li><li><b>集流時間過長：</b>大集水區tc可能長達數小時甚至數日，要求「整個延時內降雨強度恆定」的假設不合理（真實長延時降雨強度通常遠低於短延時降雨強度，依IDF曲線特性）</li><li><b>逕流機制複雜化：</b>大集水區涉及河道蓄水、河道演算（Channel routing）等複雜水文過程，不是單純的C值線性轉換可以描述</li><li><b>業界慣例：</b>合理化公式通常限定適用於集水區面積<b>小於數平方公里（常見上限為5km²，部分規範放寬至更大）</b>，大型集水區應改用單位歷線法或水文模式（如HEC-HMS）模擬</li></ul>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD05",pts:20,
q:"請說明基流分割（Baseflow separation）的常用方法，並說明各方法的適用情況與優缺點。",
s:"常用方法：(1)水平直線法：從漲水起點水平延伸至退水曲線，最簡單但精度低；(2)斜直線法：漲水起點以遞減斜率連接至退水段反曲點，較合理；(3)退水曲線延伸法：以退水段地下水排放規律延伸推估，物理基礎較強；(4)經驗公式法（如N值法，N=A^0.2，A為集水區面積，估算退水段反曲點時間）。",
d:`<h4>基流分割方法比較</h4><table><tr><th>方法</th><th>操作方式</th><th>優點</th><th>缺點</th></tr><tr><td><b>水平直線法</b></td><td>從漲水起點水平延伸一條直線至退水曲線與其交點</td><td>最簡單，計算快速</td><td>精度最低，忽略基流在洪水期間實際也會增加的現象</td></tr><tr><td><b>斜直線法</b></td><td>從漲水起點以遞減斜率連接至退水段反曲點（Inflection point）</td><td>較合理反映基流隨水位上升而略增的現象</td><td>反曲點判定具主觀性</td></tr><tr><td><b>退水曲線延伸法</b></td><td>取洪水前的退水曲線型態，延伸並反映至洪峰後段</td><td>物理基礎較強，反映地下水排放的自然衰減規律</td><td>需要洪水前有足夠長的退水資料可供延伸</td></tr><tr><td><b>N值法（經驗公式）</b></td><td>退水段反曲點時間N（天）= A^0.2（A為集水區面積，平方英里），用以判定基流分割點位置</td><td>提供客觀經驗公式，減少主觀判定</td><td>經驗公式可能不適用所有氣候區與集水區特性</td></tr></table><div class="note">考試應用：當題目給定流量歷線資料要求計算逕流量或入滲率時（如111年考題），第一步永遠是先進行基流分割，才能得到直接逕流量（DRO=總流量-基流），這是水文計算題的必經前置步驟，務必養成「先看基流、再算DRO」的解題習慣。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD06",pts:20,
q:"請說明對數皮爾遜第三型分布（Log-Pearson Type III）在水文頻率分析中的應用，並說明偏態係數（Cs）對分布形狀的影響。",
s:"應用：將實測流量取對數後，假設符合皮爾遜第三型分布，可處理不對稱（偏態）的水文資料，較常態分布更貼合實際洪水流量分布特性。偏態係數Cs影響：Cs=0時退化為對數常態分布；Cs>0右偏（長尾在大值端，極端洪水機率較高）；Cs<0左偏。台灣多數河川流量資料Cs>0，反映極端洪峰事件的長尾特性。",
d:`<h4>Log-Pearson III分布的應用邏輯</h4><div class="fm">設 X = log(Q)，X服從Pearson III分布</div>為何要先取對數？因為原始流量資料（尤其洪峰流量）通常呈現高度右偏（少數極端大洪水拉長尾部），直接套用常態分布或皮爾遜分布效果不佳，取對數後分布形狀更接近常態，再用皮爾遜III型描述剩餘的偏態，是一種「雙重修正」手法。<h4>頻率因子計算（Wilson-Hilferty近似）</h4><div class="fm">log Q_T = μ + K_T × σ</div>K_T為頻率因子，依重現期T（標準常態z值）與偏態係數Cs共同決定：<div class="fm">K_T ≈ z + (z²-1)Cs/6 + ...（高階修正項）</div><h4>偏態係數Cs對分布形狀的影響</h4><table><tr><th>Cs值</th><th>分布形狀</th><th>物理意義</th></tr><tr><td>Cs=0</td><td>對稱分布，退化為對數常態分布</td><td>資料對稱分布，無特別偏態</td></tr><tr><td>Cs&gt;0（右偏）</td><td>長尾在大值端</td><td>少數極端大洪水事件出現機率較高，符合多數河川流量特性</td></tr><tr><td>Cs&lt;0（左偏）</td><td>長尾在小值端</td><td>較少見於洪峰流量分析</td></tr></table><div class="note">台灣多數河川流量資料的Cs值通常為正值（右偏），這反映了颱風帶來的極端洪峰事件確實比常態分布預期的更頻繁發生，這也是為何水文設計必須採用考慮偏態的分布（如Log-Pearson III），而非簡單套用常態分布。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD07",pts:20,
q:"請說明降雨量資料的「年最大值法」（Annual Maximum Series）與「年超越值法」（Annual Exceedance Series）的差異，並說明各自適用的重現期範圍。",
s:"年最大值法（AMS）：每年僅取一個最大值樣本（無論大小），組成n年資料的樣本系列。年超越值法（AES）：取超過某設定門檻值的所有事件（不限一年一個，可能一年多個或零個），樣本數可能大於年數。差異：AES在短重現期（<10年）較準確（因樣本更多更敏感），AMS在長重現期較常用（標準化方法，國際通用）。",
d:`<h4>兩種抽樣方法比較</h4><table><tr><th>方法</th><th>抽樣方式</th><th>樣本數</th></tr><tr><td><b>年最大值法（AMS）</b></td><td>每年僅選出該年最大的一個事件（即使該年第二大事件比其他年的最大值還大，仍不納入）</td><td>固定等於年數n</td></tr><tr><td><b>年超越值法（AES）</b></td><td>設定一個門檻值，取所有超過此門檻的事件，不限制每年數量（可能一年多次，也可能某年一次都沒有）</td><td>不固定，可能多於或少於年數n</td></tr></table><h4>適用重現期範圍</h4><ul><li><b>AES適用短重現期（&lt;10年）：</b>因為AES保留了「次大值」資訊（如某年的第二大事件可能比其他年最大值更顯著），對短重現期（高頻率事件）的估計更敏感準確</li><li><b>AMS適用長重現期、國際通用標準：</b>AMS方法簡單、標準化程度高，是國際間進行長重現期（如50年、100年）洪水頻率分析的主流方法，台灣水文設計規範也以AMS為主</li></ul><h4>兩者轉換關係（經驗）</h4>當重現期T較大時（T>10年），AES與AMS結果趨於接近；當T較小時，AES通常給出較大的降雨量估計值（因為更敏感地捕捉到高頻率事件）。<div class="note">這個概念呼應109年坡地水文學考古題的解釋名詞「降雨量年超越值數列」，是水文統計分析的基礎概念題，務必清楚兩者抽樣邏輯的本質差異。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD08",pts:20,
q:"請說明地下水流的達西定律（Darcy's law）基本假設，並說明在哪些情況下達西定律會失效（不適用）。",
s:"達西定律：q=-K×dh/dl，假設層流（Re<1~10）、介質均質等向、飽和流。失效情況：(1)高流速紊流（如石灰岩地下河、大孔隙岩體，雷諾數過大）；(2)非飽和流（需改用Richards方程式）；(3)極低透水性介質（黏土，存在門檻水力梯度才開始流動）；(4)介質高度不均質或異向性未適當處理。",
d:`<h4>達西定律基本假設</h4><div class="fm">q = -K × (dh/dl)</div>q：單位面積流量（Darcy流速）；K：水力傳導係數；dh/dl：水力梯度<br><br>核心假設：<ul><li><b>層流條件：</b>雷諾數Re&lt;1~10（多孔介質流動雷諾數定義略不同於管流），流速與水力梯度呈線性關係</li><li><b>飽和流：</b>介質孔隙完全被水充滿</li><li><b>均質等向介質：</b>K值在各方向、各位置相同（理想化假設）</li></ul><h4>達西定律失效（不適用）的情況</h4><table><tr><th>情況</th><th>原因說明</th></tr><tr><td><b>高流速紊流</b></td><td>石灰岩地下河、大孔隙礫石層、裂隙發育的岩體，流速過快導致雷諾數超過層流範圍，水力梯度與流速不再呈線性關係（變為與流速平方相關）</td></tr><tr><td><b>非飽和流</b></td><td>孔隙未完全充水時，需改用Richards方程式（非飽和達西定律的擴展型），K值隨含水量θ變化而非常數</td></tr><tr><td>極低透水性介質（緻密黏土）</td><td>存在「門檻水力梯度」，水力梯度過小時水分子被黏土顆粒表面強力吸附而不流動，需超過門檻值才開始符合達西定律的線性關係</td></tr><tr><td>介質高度不均質/異向性未處理</td><td>若直接套用單一K值描述高度變異的地層（如夾雜礫石層與黏土層的複合地層），會產生顯著誤差，需採用等效K值或分層分析</td></tr></table><div class="note">水土保持工程實務上，邊坡地下排水設計多數情況下達西定律適用（土壤孔隙流動屬層流範圍），但若邊坡涉及大型裂隙岩體或鄰近喀斯特地形，需特別注意達西定律可能失效的風險。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD09",pts:25,
q:"某含水層進行抽水試驗，抽水流量Q=2000 m³/day，穩定狀態下距井r1=50m處水位降深s1=2.0m，r2=150m處水位降深s2=0.8m。求流通係數T（採Thiem公式，穩態徑向流分析）。",
s:"Thiem公式：T=Q×ln(r2/r1)/(2π×(s1-s2))。T=2000×ln(150/50)/(2π×(2.0-0.8))=2000×ln3/(2π×1.2)=2000×1.0986/7.540=2197.2/7.540≈291.4 m²/day。",
d:`<h4>Thiem公式（穩態徑向流分析）</h4><div class="fm">T = Q × ln(r2/r1) / [2π × (s1-s2)]</div>適用於抽水試驗已達穩定狀態（水位不再隨時間變化）時的流通係數T計算。<h4>代入數值</h4>Q=2000 m³/day；r1=50m，s1=2.0m；r2=150m，s2=0.8m<div class="fm">ln(r2/r1) = ln(150/50) = ln(3) ≈ 1.0986</div><div class="fm">s1-s2 = 2.0-0.8 = 1.2 m</div><div class="fm">2π×1.2 ≈ 7.540</div><div class="fm">T = 2000×1.0986/7.540 ≈ <b>291.4 m²/day</b></div><h4>與Jacob法的差異提醒</h4>本題用<b>Thiem公式</b>（穩態，需兩個觀測井的穩定水位降深），與常考的<b>Jacob直線法</b>（暫態，需單井不同時間的降深資料）是不同的解法路徑：<table><tr><th>方法</th><th>適用條件</th><th>所需資料</th></tr><tr><td>Thiem公式</td><td>抽水已達穩定狀態</td><td>至少兩個觀測點的穩定降深（r1,s1）、（r2,s2）</td></tr><tr><td>Jacob直線法</td><td>暫態（抽水尚未達穩定）</td><td>單一觀測點不同時間的降深資料（t1,s1）、（t2,s2）</td></tr></table><div class="note">考試重點：看到題目給「兩個不同距離的觀測井，且強調穩定狀態」→用Thiem公式；看到「同一觀測井，不同時間的降深」→用Jacob直線法。兩者都是抽水試驗分析的標準解法，務必能辨別題型選對方法。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD10",pts:20,
q:"請說明設計暴雨（Design storm）的設計雨型（Design hyetograph）建立方法，並說明常用的SCS雨型與三角形雨型的差異。",
s:"設計雨型建立方法：(1)由IDF曲線取得設計總降雨量；(2)依時間分布模式（雨型）將總降雨量分配至各時段。SCS雨型：依美國土壤保育局統計大量實測暴雨資料得出的標準化時間分布曲線（如SCS Type II，峰值集中在降雨延時中段附近）。三角形雨型：簡化假設，降雨強度從0線性上升至峰值再線性下降，峰值位置依經驗設定（如總延時的30~50%處）。SCS雨型較貼合實際統計特性，三角形雨型計算最簡便。",
d:`<h4>設計雨型建立方法（兩步驟）</h4><b>Step 1：</b>由IDF曲線（降雨強度-延時-頻率曲線）取得設計重現期、設計延時對應的總降雨量<br><b>Step 2：</b>依選定的雨型（時間分布模式），將總降雨量分配至各個時段，得到完整的設計降雨歷線（橫軸時間，縱軸降雨強度）<h4>SCS雨型</h4><ul><li><b>來源：</b>美國土壤保育局（SCS，現NRCS）依大量實測暴雨事件統計分析得出的標準化時間分布曲線</li><li><b>特性：</b>分為Type I、IA、II、III等型態，依各地區氣候特性選用；典型Type II雨型呈現降雨強度集中在延時中段（約40~60%處）達到峰值的型態</li><li><b>優點：</b>較貼合實際暴雨統計特性，廣泛應用於美國及許多國家的設計暴雨建立</li></ul><h4>三角形雨型</h4><ul><li><b>形式：</b>降雨強度從0開始線性上升至峰值，再線性下降回0，整體呈三角形</li><li><b>峰值位置：</b>依經驗設定，常見假設峰值位於總延時的30~50%處</li><li><b>優點：</b>計算簡便，適合手算或簡化分析；<b>缺點：</b>過度簡化，未必符合實際暴雨的統計分布特性</li></ul><h4>兩者比較</h4><table><tr><th>項目</th><th>SCS雨型</th><th>三角形雨型</th></tr><tr><td>真實性</td><td>較高（基於大量實測統計）</td><td>較低（簡化假設）</td></tr><tr><td>計算複雜度</td><td>較高（需查表或函數）</td><td>低（簡單幾何關係）</td></tr><tr><td>應用場合</td><td>較精確的設計分析、大型工程</td><td>初步估算、小型工程、教學示範</td></tr></table>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD11",pts:20,
q:"請說明集水區地貌特徵（如形狀係數、河流密度）如何影響洪水反應特性，並比較圓形集水區與狹長形集水區的洪水歷線差異。",
s:"形狀係數（Form factor）=面積/坡長²，反映集水區形狀胖瘦。圓形（胖）集水區：各處到出口距離相近，水流幾乎同時到達，洪峰高且尖瘦（集中型）。狹長形集水區：各處到出口距離差異大，水流到達時間分散，洪峰較低但延時較長（分散型，洪水歷線較平緩）。河流密度越高：排水效率越高，集流時間越短，洪峰反應越快越尖銳。",
d:`<h4>集水區形狀對洪水反應的影響</h4><div class="fm">形狀係數 Kf = A/L²（A=面積，L=主流長度，或坡長）</div><table><tr><th>集水區形狀</th><th>水流到達出口的時間分布</th><th>洪水歷線特徵</th></tr><tr><td><b>圓形（胖）集水區</b></td><td>各處距出口的距離相近，逕流幾乎同時到達出口</td><td>洪峰<b>高且尖瘦</b>，洪峰出現時間早，退水也快（集中型反應）</td></tr><tr><td><b>狹長形集水區</b></td><td>距出口最近與最遠處的距離差異很大，逕流到達時間分散</td><td>洪峰<b>較低但延時較長</b>，洪水歷線較平緩（分散型反應），洪峰出現時間較晚</td></tr></table><h4>河流密度的影響</h4><div class="fm">河流密度 Dd = 河道總長度 / 集水區面積</div><ul><li>河流密度越高（排水網絡發達）→ 地表逕流匯入河道的距離越短 → 集流時間tc越短 → 洪峰反應越快、越尖銳</li><li>河流密度越低（排水網絡稀疏）→ 地表逕流需經過更長的坡面漫流才能到達河道 → tc越長 → 洪峰反應較緩和</li></ul><h4>工程應用意義</h4>在進行集水區洪水特性初步評估時，可先透過地形圖估算形狀係數與河流密度，快速判斷該集水區屬於「快速集中反應型」或「緩慢分散反應型」，作為後續水文模式選用（如合理化公式僅適用形狀規則的小集水區）與防洪設計策略（尖銳洪峰需更大滯洪容量瞬時削峰；平緩洪峰則需考量長延時排水能力）的初步參考依據。`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD12",pts:25,
q:"某集水區面積25km²，年平均降雨量2200mm，年逕流係數0.55，年蒸發散損失估算為何（以水平衡方程式計算，假設地下水儲存變化為零）？並說明此推估方法的限制。",
s:"水平衡：P=ET+Q+ΔS（ΔS=0時，P=ET+Q）。年逕流量Q=P×逕流係數=2200×0.55=1210mm。年蒸發散ET=P-Q=2200-1210=990mm。限制：此法假設地下水儲存變化為零（長期平均才成立，單一年度可能有顯著儲存變化）；逕流係數為簡化代表值，實際逐年降雨特性不同會使真實逕流量有所差異；未考慮深層滲漏損失（若有跨集水區地下水流動）。",
d:`<h4>水平衡方程式應用</h4><div class="fm">P = ET + Q + ΔS</div>假設ΔS（地下水儲存變化）=0（長期平均條件下成立）：<div class="fm">P = ET + Q → ET = P - Q</div><h4>計算年逕流量</h4><div class="fm">Q = P × 逕流係數 = 2200mm × 0.55 = 1210 mm</div><h4>反推年蒸發散損失</h4><div class="fm">ET = P - Q = 2200 - 1210 = <b>990 mm</b></div><h4>此推估方法的限制</h4><ul><li><b>ΔS=0僅在長期平均下成立：</b>單一年度的地下水儲存量可能因該年降雨豐枯而有顯著正負變化（豐水年儲存增加，枯水年儲存減少），若用單年資料套用此方法會有誤差，需用多年平均資料才較準確</li><li><b>逕流係數的代表性：</b>逕流係數0.55是簡化的年平均代表值，實際上逕流係數會隨降雨強度、前期土壤含水量、季節等變化，不同年份的真實逕流量可能與此估算值有差異</li><li><b>未考慮跨集水區地下水流動：</b>若集水區地質條件允許地下水跨越地表水分水嶺流動（深層滲漏至鄰近集水區或反之），則水平衡方程式中應額外加入此項，否則會低估或高估ET</li><li><b>蒸發散包含多重機制：</b>計算結果ET是土面蒸發、植物蒸散、截留蒸發的總和，無法進一步區分各部分的相對貢獻</li></ul>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD13",pts:20,
q:"請說明降雨延時與設計重現期的選用原則如何因應不同水土保持工程設施的設計目標而有所不同。",
s:"設計重現期選用原則：依工程設施的重要性與潛在危害程度決定。臨時性設施（施工期）：較低重現期（如5~10年）。一般排水設施：中等重現期（10~25年）。永久性重要設施（永久滯洪池、重要橋梁）：較高重現期（25~50年）。極端風險設施（大型水庫、可能造成生命財產重大損失者）：最高重現期（100年以上或考慮PMF）。設計延時則依集流時間tc選定，原則上採用延時等於tc時雨強最大，洪峰流量最大，此為設計上最不利情況。",
d:`<h4>設計重現期選用原則（依設施重要性遞增）</h4><table><tr><th>設施類型</th><th>建議重現期</th><th>選用邏輯</th></tr><tr><td>臨時性設施（施工期）</td><td>5~10年</td><td>使用期短（1~2年），可承受較高風險，且可隨時監測應變</td></tr><tr><td>一般排水溝、截水溝</td><td>10~25年</td><td>常規設施，需基本防護但非極端考量</td></tr><tr><td>永久滯洪池、重要道路</td><td>25~50年</td><td>長期使用，潛在影響範圍較大，需更高安全餘裕</td></tr><tr><td>大型水庫、重大基礎設施</td><td>100年以上或PMF（可能最大洪水）</td><td>潰決或失效後果極為嚴重（生命財產重大損失），須以最保守標準設計</td></tr></table><h4>設計延時的選用原則</h4>設計延時通常選定<b>等於集流時間tc</b>，因為：<ul><li>當降雨延時=tc時，集水區內所有位置的逕流恰好同時到達出口，此時洪峰流量達到理論最大值</li><li>若延時&lt;tc：部分遠端逕流尚未到達出口，降雨已結束，無法形成最大洪峰</li><li>若延時&gt;tc：雖然全部逕流都已到達，但延時越長雨強通常越低（依IDF曲線特性），平均雨強下降，洪峰反而較小</li></ul><div class="note">這個「設計延時=tc」的選擇邏輯是合理化公式與多數水文設計方法的共同基礎，務必理解其物理意義（而非死記公式），這樣面對各種變化題型都能推導出正確答案。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD14",pts:20,
q:"請說明壤中流（Subsurface flow/Interflow）的形成機制，並說明其在山坡地洪水反應中的角色與一般地表逕流的差異。",
s:"壤中流形成機制：降雨入滲後，水分在土壤中沿坡向側向移動（受不透水層或滲透性差異層阻擋），最終排出至溪流或坡腳。與地表逕流差異：(1)路徑：地表逕流沿地表流動，壤中流在土壤中流動；(2)速度：地表逕流快（分鐘~小時尺度），壤中流較慢（小時~天尺度）；(3)對洪峰貢獻：地表逕流主導洪峰尖峰，壤中流貢獻洪峰後段與退水段的延續流量，使洪水退水較緩。",
d:`<h4>壤中流形成機制</h4><ul><li>降雨入滲進入土壤後，若土壤剖面中存在<b>滲透性差異層</b>（如表土滲透性高、下方緻密層或岩盤滲透性低），水分會在此介面上方<b>側向流動</b>（沿坡向順坡流動），而非繼續垂直滲漏至深層地下水</li><li>這個側向流動的水流稱為<b>壤中流（Interflow或Subsurface flow）</b>，最終可能在坡腳或溪岸滲出（形成滲流帶），補充溪流流量</li></ul><h4>壤中流 vs 地表逕流比較</h4><table><tr><th>項目</th><th>地表逕流</th><th>壤中流</th></tr><tr><td>流動路徑</td><td>地表面（坡面、溝道）</td><td>土壤剖面內部（沿滲透性差異層側向移動）</td></tr><tr><td>流動速度</td><td>快（分鐘~小時尺度）</td><td>較慢（小時~數天尺度），但快於深層地下水流動</td></tr><tr><td>洪峰貢獻時機</td><td>主導洪峰<b>尖峰</b>（快速反應）</td><td>貢獻洪峰<b>後段及退水段</b>，延續河川流量</td></tr><tr><td>對水質影響</td><td>易帶入表土泥砂與污染物</td><td>經土壤過濾，水質通常較地表逕流清澈</td></tr></table><h4>對洪水歷線型態的影響</h4>壤中流的存在使洪水退水曲線（Falling limb）較為平緩、延續時間較長，而非單純的快速消退（若只有地表逕流貢獻則退水會更快）。山坡地植生良好、土層較厚的集水區，壤中流貢獻比例通常較高，這也是植生覆蓋良好的集水區洪水反應較「溫和」（洪峰較低、退水較緩）的部分原因之一，與植生對水文循環影響的整體概念呼應。`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD15",pts:20,
q:"請說明都市化對集水區水文反應造成的主要改變，並說明低衝擊開發（LID）理念如何透過分散式措施緩解這些改變。",
s:"都市化改變：不透水面積增加→C值上升；地表粗糙度降低（鋪面取代植被）→tc縮短；地下水補注減少→枯水基流降低；綜合效果：洪峰增大且提前到達，總逕流量增加。LID理念：在源頭（建築周邊、道路、停車場）分散設置透水鋪面、雨水花園、生物滯留池、綠屋頂等小型設施，模擬開發前的入滲與蒸散功能，使開發後的水文反應盡量接近開發前狀態，而非僅依賴末端的大型滯洪池集中處理。",
d:`<h4>都市化對水文反應的主要改變</h4><table><tr><th>改變項目</th><th>機制</th><th>結果</th></tr><tr><td>逕流係數C上升</td><td>不透水鋪面（道路、建築、停車場）取代原有植被與土壤</td><td>相同降雨下逕流量大幅增加</td></tr><tr><td>集流時間tc縮短</td><td>地表粗糙度降低（光滑鋪面vs植被覆蓋），加上排水管網的高效集流</td><td>洪峰提前到達，反應時間變短</td></tr><tr><td>地下水補注減少</td><td>入滲面積大幅減少</td><td>枯水期河川基流降低，水資源穩定性下降</td></tr><tr><td>水質劣化</td><td>都市逕流攜帶油污、重金屬、垃圾等污染物</td><td>下游水體水質受影響</td></tr></table><h4>綜合效果</h4>都市化後洪峰<b>增大且提前</b>，總逕流量<b>增加</b>，但枯水基流<b>減少</b>——這正是「洪旱兩極化」現象的水文機制根源。<h4>低衝擊開發（LID）理念與分散式措施</h4>LID核心理念：<b>在源頭模擬開發前的自然水文功能</b>，而非僅依賴末端大型滯洪池集中削峰。<table><tr><th>LID措施</th><th>模擬的自然功能</th></tr><tr><td>透水性鋪面</td><td>模擬自然地表的入滲功能</td></tr><tr><td>雨水花園/生物滯留池</td><td>模擬植被覆蓋地的截留與滲透功能，並提供初期逕流污染物過濾</td></tr><tr><td>綠屋頂</td><td>模擬原有植被的截留蒸散功能，降低屋頂逕流</td></tr><tr><td>滲透溝/滲透井</td><td>模擬地下水補注路徑，恢復枯水期基流</td></tr></table><div class="note">LID與傳統「集中式」滯洪池設計理念的根本差異：傳統設計是「先讓逕流大量產生，再用大型設施集中削峰」；LID是「從源頭減少逕流產生量」，兩者可互補應用，現代水土保持規劃趨勢是將LID措施分散布置於開發基地內各處，搭配末端滯洪設施作為最後防線。</div>`},
{yr:"自出",sub:"植生工程",type:"self",n:"sE01",pts:20,
q:"請說明植生工程材料選擇的基本原則，並說明「適地適種」原則在水土保持植生工程中的具體應用。",
s:"基本原則：適地適種、發芽/活存率高、生長速度匹配目標、根系特性匹配需求、耐逆境、生態安全（非入侵種）、取得容易。適地適種具體應用：依施工地的氣候帶（海拔、年雨量）、土壤性質（pH、質地）選擇原生分布範圍涵蓋該條件的物種，而非統一套用單一「萬用」植物，這是成活率的根本保障。",
