{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA26",pts:20,
q:"請說明土壤有機質（Soil Organic Matter, SOM）對土壤物理、化學、生物性質的影響，並說明為何有機質是評估土壤健康（Soil health）的核心指標。",
s:"物理：促進團粒形成→增加大孔隙→入滲率提升、保水力提高、容積密度降低。化學：陽離子交換容量（CEC）提升→保肥力增加；緩衝酸鹼能力增強；螯合重金屬降低毒性。生物：提供微生物能量來源→微生物活性增加→養分礦化加速。核心指標原因：有機質整合了土壤的物理、化學與生物功能，且對干擾（侵蝕、耕作、汙染）高度敏感，能反映土壤整體功能狀態，是農業永續性的關鍵指標。",
d:`<h4>有機質（SOM）的三面向影響</h4><table><tr><th>面向</th><th>具體影響</th><th>機制</th></tr><tr><td><b>物理性質</b></td><td>促進團粒形成、增加孔隙度、降低容積密度、提高保水力</td><td>腐植質作為黏合劑，使土壤顆粒聚集成穩定的團粒結構，創造大量大中小孔隙</td></tr><tr><td><b>化學性質</b></td><td>提升CEC（陽離子交換容量）、增強緩衝能力、螯合重金屬</td><td>腐植酸含豐富的羧基（-COOH）與酚基（-OH），帶負電荷，可吸附並保留Ca²⁺、K⁺、NH₄⁺等養分陽離子</td></tr><tr><td><b>生物性質</b></td><td>提供微生物能量與碳源、增加生物多樣性、加速養分循環</td><td>有機質是土壤微生物的「食物」，有機質豐富→微生物活性高→氮磷礦化加速→植物可利用養分增加</td></tr></table><h4>有機質作為土壤健康核心指標的原因</h4><ul><li><b>整合性：</b>有機質同時影響物理、化學、生物三個層面，是唯一能整合土壤全功能的單一指標</li><li><b>敏感性：</b>對管理方式（耕作方式、施肥、植生）的變化反應明顯，能反映土地管理的優劣</li><li><b>難以快速恢復：</b>有機質一旦因侵蝕或不當耕作流失，恢復需數十年，代表「不可逆損失的預警」</li><li><b>碳匯意義：</b>土壤有機碳（SOC）是陸域最大碳庫，有機質增加=固碳，直接連結氣候變遷因應目標</li></ul><div class="note">台灣坡地土壤通常有機質含量偏低（崩塌地可&lt;0.5%，正常農地1~3%），客土噴植必須添加腐植土正是為了補充有機質，這就是有機質在水土保持植生工程中如此重要的原因。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA27",pts:25,
q:"【計算題】某崩塌地面積2.5ha，開發前植生覆蓋良好C=0.04，崩塌後裸露C=1.0，R=16000，K=0.038，坡長60m，坡度15%。(1)計算崩塌前後年土壤流失量；(2)若在崩塌後6個月完成客土噴植復育（C恢復至0.10），計算6個月裸露期間的實際流失量（以年流失量換算半年）；(3)說明此計算對臨時沉砂池容量設計的意義。",
s:"LS：L=(60/22.13)^0.5=1.648；S（15%≥9%）=16.8×0.15-0.50=2.02；LS=3.328。R×K×LS=16000×0.038×3.328=2023.3 t/ha/yr。崩塌前：2023.3×0.04=80.9；崩塌後：2023.3×1.0=2023.3 t/ha/yr。6個月裸露流失=2023.3×0.5×2.5=2529 ton。意義：沉砂池需設計容納2529ton÷土壤容積重（約1.4t/m³）≈1806m³，以6個月為設計週期，而非以年流失量設計。",
d:`<h4>(1) 崩塌前後年土壤流失量</h4><div class="fm">L = (60/22.13)^0.5 = 2.711^0.5 = 1.648</div><div class="fm">S = 16.8×0.15-0.50 = 2.52-0.50 = 2.02（坡度15%≥9%，大坡度公式）</div><div class="fm">LS = 1.648×2.02 = 3.329</div><div class="fm">R×K×LS = 16000×0.038×3.329 = 2024 ton/ha/yr（基準值）</div><table><tr><th>時期</th><th>C值</th><th>A（ton/ha/yr）</th><th>全基地（2.5ha）</th></tr><tr><td>崩塌前（植生良好）</td><td>0.04</td><td>2024×0.04=81</td><td>202 ton/yr</td></tr><tr><td>崩塌後（完全裸露）</td><td>1.0</td><td>2024×1.0=2024</td><td>5060 ton/yr</td></tr></table><h4>(2) 6個月裸露期間實際流失量</h4><div class="fm">6個月流失量 = 2024 ton/ha/yr × 0.5yr × 2.5ha = <b>2530 ton</b></div><h4>(3) 臨時沉砂池容量設計意義</h4>沉砂池設計應以<b>最高風險期間（裸露期）</b>的實際流失量為依據：<div class="fm">所需沉砂容積 = 2530 ton ÷ 1.4 t/m³ ≈ <b>1807 m³</b></div><ul><li>若以「年流失量」設計沉砂池，容量會是2倍（5060ton/1.4=3614m³）——過度設計</li><li>若以「完工後低C值」設計，容量會嚴重不足（202ton/1.4≈144m³只有實際需求的1/12）</li><li><b>正確設計邏輯：以裸露期間（6個月）為時間單位，以裸露期C=1.0計算流失量，這才是臨時沉砂池的真實設計需求</b></li></ul><div class="note">這正是水保法要求「開發面積≥1公頃必設臨時沉砂池」的量化依據，崩塌或施工期間的流失量可以是正常情況的25倍，臨時沉砂池必須能應對這個峰值。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA28",pts:20,
q:"請說明土壤表面結皮（Surface crusting）的形成機制，並說明結皮對土壤沖蝕的雙重效應（既可能增加又可能減少沖蝕）。",
s:"形成機制：雨滴衝擊→打散團粒→細粒堵塞孔隙→乾燥後形成緻密硬殼（厚度數mm）。雙重效應：增加沖蝕方面——結皮大幅降低入滲率→地表逕流增加→片蝕與細溝蝕加劇；減少沖蝕方面——結皮硬殼本身物理抵抗力提升→雨滴打擊土面時，硬殼保護下方軟土不被直接剝離（類似「盔甲效應」）。淨效果：通常以增加逕流導致的沖蝕為主，整體上結皮是加劇水蝕的。",
d:`<h4>表面結皮形成機制</h4><ol style="padding-left:16px"><li>雨滴以高動能衝擊土面，打散地表土壤團粒</li><li>碎散的細粒土壤（粉砂、黏粒）隨薄層水流移動，填塞地表孔隙</li><li>細粒沉積在孔隙中，形成低滲透性的緻密薄層</li><li>降雨停止後，薄層乾燥收縮，形成堅硬的表面結皮（厚度數mm至1cm）</li></ol><h4>結皮對土壤沖蝕的雙重效應（矛盾性）</h4><table><tr><th>效應方向</th><th>機制</th><th>主要影響對象</th></tr><tr><td><b>增加沖蝕（主要效應）</b></td><td>結皮大幅降低入滲率（可降低至原來1/10~1/100）→地表逕流大幅增加→片蝕、細溝蝕加劇</td><td>增加逕流沖蝕（Sheet & Rill erosion）</td></tr><tr><td><b>減少沖蝕（次要效應）</b></td><td>結皮本身是硬殼，物理強度高於下方鬆軟土壤→雨滴衝擊時，硬殼像「盔甲」保護下方軟土不被直接剝離（Raindrop splash erosion略減）</td><td>減少雨滴飛濺侵蝕</td></tr></table><h4>淨效果判斷</h4>通常<b>增加逕流沖蝕的效果遠大於減少雨濺蝕的效果</b>，因此整體而言，表面結皮是加劇水蝕的不利因素。<div class="note">防止結皮的方法：地表覆蓋（截除雨滴動能）、增加有機質（增加團粒穩定性）、施用PAM（聚丙烯醯胺，增加顆粒間凝聚力防止分散）。這個雙重效應在考試中常被用來考驗對結皮物理本質的深度理解。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA29",pts:20,
q:"請說明土壤侵蝕間接量測方法中，放射性同位素法（¹³⁷Cs法）的量測原理、優缺點，以及適用的研究時間尺度。",
s:"原理：¹³⁷Cs（銫-137）來自1950~1960年代核武試爆的大氣落塵，均勻沉降於全球地表後隨土壤移動。比較未擾動基準地點（A點）與待測地點（B點）的Cs-137含量：B點Cs-137＜A點→B點有侵蝕發生；B點Cs-137＞A點→B點有堆積。差值可推算累積侵蝕深度或速率。優點：能量測過去50~60年的累積侵蝕量，不需現場長期監測。缺點：空間基準點選定困難、精度約±15~30%、取樣分析成本高。適用時間尺度：1954年核試爆後至今的累積侵蝕評估（約50~70年尺度）。",
d:`<h4>¹³⁷Cs法原理</h4><b>Cs-137的來源：</b>1954~1963年間核武大氣試爆產生的¹³⁷Cs隨大氣飄散，以「落塵（Fallout）」形式均勻沉降於全球地表，並強力吸附在土壤顆粒表面（幾乎不被雨水淋溶移動）。<br><br><b>量測邏輯：</b><div class="fm">¹³⁷Cs含量差異 = 基準點含量 - 待測點含量</div><table><tr><th>比較結果</th><th>代表意義</th></tr><tr><td>待測點 &lt; 基準點</td><td>待測點發生侵蝕（土壤連同Cs-137被搬走）</td></tr><tr><td>待測點 = 基準點</td><td>無侵蝕無堆積（穩定地面）</td></tr><tr><td>待測點 &gt; 基準點</td><td>待測點發生堆積（含Cs-137土壤從其他地方搬來）</td></tr></table><h4>優缺點</h4><table><tr><th>優點</th><th>缺點</th></tr><tr><td>能評估過去50~70年的<b>累積侵蝕量</b>，無需現場長期監測</td><td>基準點（未擾動地點）選定困難，影響結果準確性</td></tr><tr><td>可同時量測侵蝕源區與堆積區，重建空間分布</td><td>精度約±15~30%（不及直接量測精確）</td></tr><tr><td>適合大面積集水區尺度的歷史侵蝕評估</td><td>取樣分析需要γ射線偵測設備，成本高</td></tr></table><h4>適用時間尺度</h4><b>1954年後至今（約50~70年）</b>的累積侵蝕評估，這是¹³⁷Cs法獨特的優勢——其他方法（現場侵蝕釘、小區量測）只能監測當下至短期，無法回溯歷史。<div class="note">與²¹⁰Pb法的比較：²¹⁰Pb（鉛-210）是自然源放射性同位素（來自大氣中²²²Rn衰變），可評估近100~200年的侵蝕歷史，適用更長時間尺度的研究。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA30",pts:20,
q:"請說明坡面侵蝕控制中，「農藝方法」（Agronomic measures）與「機械地形改造」（Mechanical measures）的分類原則與主要差異，並各舉兩個具體案例說明。",
s:"農藝方法：透過改變植生與耕作管理降低侵蝕，主要影響USLE的C值與P值。案例：覆蓋作物（C值降低）、等高耕作（P值降低）。機械地形改造：透過改變地形配置降低侵蝕，主要影響USLE的L值與S值，需實質工程施作。案例：梯田（縮短坡長L，降低S）、等高草帶（分段截斷有效坡長L）。主要差異：農藝方法成本低、可逆性高、對土壤物理改變小；機械改造成本高、永久性改變地形、效果持久但施工期間有裸露風險。",
d:`<h4>分類原則</h4><table><tr><th>類型</th><th>主要影響機制</th><th>USLE因子影響</th></tr><tr><td><b>農藝方法</b></td><td>改變植生管理與耕作模式，不改變地形</td><td>主要影響C值（覆蓋）、P值（保育措施）</td></tr><tr><td><b>機械地形改造</b></td><td>物理改變地形配置，需工程施工</td><td>主要影響L值（坡長）、S值（坡度）</td></tr></table><h4>各類具體案例</h4><table><tr><th>類型</th><th>案例①</th><th>USLE因子影響</th><th>案例②</th><th>USLE因子影響</th></tr><tr><td>農藝方法</td><td>覆蓋作物（Cover crop）——旱季種植豆科覆蓋作物保護裸露土面</td><td>C↓（覆蓋率提升）</td><td>等高耕作（Contour farming）——沿等高線耕作形成臨時性微型土埂</td><td>P↓（0.5~0.7）</td></tr><tr><td>機械地形改造</td><td>梯田（Terracing）——將長坡分成多個水平台階</td><td>L大幅↓、S↓</td><td>等高草帶（Contour strip-cropping）——沿等高線設草帶，分段截斷坡面</td><td>L有效縮短</td></tr></table><h4>主要差異比較</h4><table><tr><th>項目</th><th>農藝方法</th><th>機械地形改造</th></tr><tr><td>初期成本</td><td>低（種子、耕作費用）</td><td>高（工程施工）</td></tr><tr><td>可逆性</td><td>高（停止耕作管理即可恢復）</td><td>低（地形改造後難以恢復）</td></tr><tr><td>效果持久性</td><td>需持續管理維持</td><td>永久性地形改變，長期有效</td></tr><tr><td>施工期風險</td><td>幾乎無（無裸露期）</td><td>有（梯田施工期間大量裸露）</td></tr></table>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA31",pts:20,
q:"請說明土壤水分「遲滯現象（Hysteresis）」在土壤水分特徵曲線（SWCC）上的表現，並說明造成遲滯的三個物理機制，以及此現象對邊坡穩定分析的實際意義。",
s:"SWCC遲滯：土壤脫水（排水路徑）與吸水（濕潤路徑）的水分特徵曲線不重合，脫水路徑在相同吸力下含水量較高（排水慢），吸水路徑含水量較低。三個物理機制：①瓶頸孔隙效應（Ink-bottle effect）——孔隙出口比內部小，排水時大孔隙因出口瓶頸無法完全排空；②接觸角差異——前進接觸角（吸水時）>後退接觸角（排水時）；③封閉氣泡——吸水時空氣被困在孔隙中，形成封閉氣泡影響含水量。邊坡穩定意義：同一水頭條件下，排水（邊坡在降雨後退水）與吸水（邊坡在降雨中入滲）路徑的孔隙水壓不同，若僅用單一SWCC進行非飽和分析會低估某些條件下的孔隙水壓，低估崩塌風險。",
d:`<h4>SWCC遲滯現象描述</h4>在相同的基質吸力（Matric suction）下：<ul><li><b>脫水路徑（Drying curve）：</b>土壤含水量較高（土壤「不願意」排水，排水慢）</li><li><b>吸水路徑（Wetting curve）：</b>土壤含水量較低（土壤「不容易」吸水到相同程度）</li><li>兩條曲線形成一個封閉的迴圈（Hysteresis loop），而非單一曲線</li></ul><h4>三個物理機制</h4><table><tr><th>機制</th><th>說明</th></tr><tr><td><b>① 瓶頸孔隙效應（Ink-bottle effect）</b></td><td>土壤孔隙形狀不規則，出口（孔喉）比內部空間小。排水時，水分必須先從孔喉逃出，孔喉張力使大孔隙無法完全排空；吸水時，水分從孔喉進入，填滿速度不同。這造成脫水含水量高於吸水含水量。</td></tr><tr><td><b>② 接觸角差異</b></td><td>水在固體表面的接觸角隨方向不同：前進接觸角（吸水時水面前進）大於後退接觸角（排水時水面後退），導致兩個方向的毛細壓力不同。</td></tr><tr><td><b>③ 封閉氣泡（Entrapped air）</b></td><td>吸水過程中，部分空氣被水包圍形成封閉氣泡，無法逃逸，佔用了一部分孔隙空間，使達到相同吸力條件下的含水量比脫水路徑少。</td></tr></table><h4>對邊坡穩定分析的意義</h4>降雨入滲（吸水路徑）與降雨後退水（脫水路徑）在相同水頭下對應不同的含水量，進而影響非飽和土壤的孔隙水壓分布。若非飽和邊坡分析只用單一SWCC（不區分路徑），可能在某些降雨歷程中低估孔隙水壓，進而<b>高估安全係數FS、低估崩塌風險</b>，這在台灣颱風前後土壤反覆乾濕循環的情境下尤其重要。`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA32",pts:20,
q:"【計算題整合】某集水區進行水土流失評估，已知：集水區面積20ha，坡面均一坡長80m、坡度12%，Rm=18000，Km=0.032，植生復育後C=0.06、P=0.8，SDR=0.30。請計算：(1)坡面年土壤流失量(ton/ha/yr)；(2)集水區年輸出泥砂量(ton/yr)；(3)若沉砂池壽命要求為5年，且容積安全係數1.5，求沉砂池有效容量（土壤容積重取1.4 t/m³）。",
s:"(1)L=(80/22.13)^0.5=1.902；S（12%≥9%）=16.8×0.12-0.50=1.516；LS=2.882。A=18000×0.032×2.882×0.06×0.8=18000×0.032×2.882×0.048=79.7ton/ha/yr。(2)年輸出=79.7×20×0.30=478ton/yr。(3)5年累積輸出=478×5=2390ton；沉砂池容積=2390/1.4×1.5=2562m³。",
d:`<h4>(1) 坡面年土壤流失量</h4><div class="fm">L = (80/22.13)^0.5 = 3.616^0.5 = 1.902</div><div class="fm">S = 16.8×0.12-0.50 = 2.016-0.50 = 1.516（坡度12%≥9%）</div><div class="fm">LS = 1.902×1.516 = 2.882</div><div class="fm">A = Rm×Km×LS×C×P = 18000×0.032×2.882×0.06×0.8</div><div class="fm">= 576×2.882×0.048 = 576×0.1385 ≈ <b>79.8 ton/ha/yr</b></div><h4>(2) 集水區年輸出泥砂量</h4><div class="fm">年總侵蝕量 = 79.8×20 = 1596 ton/yr</div><div class="fm">年輸出泥砂量 = 1596×SDR = 1596×0.30 ≈ <b>479 ton/yr</b></div><h4>(3) 沉砂池有效容量</h4><div class="fm">5年累積輸砂量 = 479×5 = 2395 ton</div><div class="fm">所需淨容積 = 2395÷1.4 = 1711 m³</div><div class="fm">加安全係數1.5：沉砂池有效容量 = 1711×1.5 ≈ <b>2567 m³</b></div><div class="note">此題完整串連：USLE計算→SDR轉換→多年容量→安全係數，是規劃設計科最綜合的計算題型。注意安全係數的施用位置：在「所需淨容積」上乘以安全係數，而非在最後的物理數值上。設計意義：沉砂池有效容量2567m³，以20ha計算相當於128m³/ha，高於規範的100m³/ha簡化估算，差異來自SDR=0.30（部分泥砂在坡面已沉積，未進入沉砂池）。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA33",pts:15,
q:"【法規記憶】請說明土壤沖蝕的直接量測方法有哪三類，並各說明一種代表性量測工具或方法及其適用尺度。",
s:"三類：(1)坡面侵蝕量測——侵蝕針法（Erosion pin，插入地面量測地表降低量，坡面尺度）；(2)集水區輸砂量測——懸浮載採樣器+流量計（量測河川懸浮載濃度×流量=輸砂率，集水區出口尺度）；(3)小區試驗——標準侵蝕小區（22.1m×1.83m，量測降雨→逕流→泥砂，用於USLE因子率定，小區尺度）。",
d:`<h4>土壤沖蝕直接量測三類方法</h4><table><tr><th>類型</th><th>代表方法</th><th>原理</th><th>適用尺度</th></tr><tr><td><b>坡面侵蝕量測</b></td><td>侵蝕針法（Erosion pin）</td><td>將金屬針插入地面固定深度，定期量測針露出地面的長度，差值即地表降低量（=侵蝕深度）</td><td>坡面小區尺度（1~100m²）</td></tr><tr><td><b>集水區輸砂量測</b></td><td>懸浮載採樣器+流量計</td><td>在集水區出口量測河川懸浮載濃度（mg/L）×流量（m³/s）=懸浮載輸砂率（kg/s），積分得年輸砂量</td><td>集水區出口（小流域~大流域）</td></tr><tr><td><b>小區試驗</b></td><td>標準侵蝕小區（Standard erosion plot）</td><td>USLE標準條件（22.1m長×1.83m寬、9%坡度、連續休耕），收集每場降雨的逕流與泥砂，直接量測各因子對應侵蝕量</td><td>小區尺度（&lt;100m²），用於USLE因子率定</td></tr></table><div class="note">考試常考「直接量測」vs「間接量測」的對比：直接量測（以上三類）直接取得侵蝕量的物理數值；間接量測（¹³⁷Cs、樹根暴露、DEM差異）透過代理指標推算侵蝕量。各有適用時間與空間尺度，需能快速判斷題目情境適合哪類方法。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA34",pts:20,
q:"請說明土壤容積密度（Bulk density, ρb）的定義，並說明耕作、植生與土壤壓實各對ρb的影響。若ρb=1.45 g/cm³、ρs=2.65 g/cm³，求孔隙率n與空隙比e。",
s:"ρb=乾燥土壤質量/土壤總體積（包含孔隙），單位g/cm³。耕作→ρb降低（鬆土）；植生（根系）→ρb降低（大孔隙增加）；機具壓實→ρb大幅升高（可達1.6~1.8g/cm³）。n=1-ρb/ρs=1-1.45/2.65=1-0.547=0.453；e=n/(1-n)=0.453/0.547=0.828。",
d:`<h4>容積密度（ρb）定義</h4><div class="fm">ρb = 乾燥土壤質量(g) / 土壤總體積(cm³)（包含固體與孔隙）</div>典型值：鬆散農地≈1.1~1.3 g/cm³；自然林地≈1.0~1.4 g/cm³；壓實土壤≈1.5~1.8 g/cm³<h4>各因素對ρb的影響</h4><table><tr><th>因素</th><th>對ρb影響</th><th>原因</th></tr><tr><td>耕作翻鬆</td><td>↓ 降低</td><td>土壤翻動後結構鬆散，大孔隙增多，同體積內固體質量減少</td></tr><tr><td>植生（根系活動）</td><td>↓ 降低</td><td>根系穿透創造生物孔隙（Biopores），增加孔隙度，有機質分解改善結構</td></tr><tr><td>機具壓實</td><td>↑ 大幅升高</td><td>外加載重壓縮孔隙空間，同體積內固體質量增加；施工機具壓實可使ρb達1.6~1.8 g/cm³，入滲率可降低90%以上</td></tr></table><h4>計算孔隙率與空隙比</h4>已知：ρb=1.45 g/cm³，ρs=2.65 g/cm³<div class="fm">n = 1 - ρb/ρs = 1 - 1.45/2.65 = 1 - 0.547 = <b>0.453（45.3%）</b></div><div class="fm">e = n/(1-n) = 0.453/(1-0.453) = 0.453/0.547 = <b>0.828</b></div><div class="note">推導驗算：n=e/(1+e)=0.828/1.828=0.453 ✓。這個從ρb和ρs直接計算n的公式（n=1-ρb/ρs）是土壤物理計算的基礎路徑，務必熟練，考試中若給ρb和ρs，第一步就是算n，再算e、S等其他指標。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA35",pts:15,
q:"【法規記憶+觀念】請說明何謂「超限利用」，並列出《山坡地保育利用條例》規定山坡地土地使用的管制原則，以及超限利用的主要法律後果。",
s:"超限利用：依土地可利用限度分類，在限制使用等級的土地（如5類宜林地、6類加強保育地）上從事超過容許範圍的農業或開發行為（如在宜林地開墾農耕）。管制原則：按土地可利用限度分類使用（1~4類可農業，5類造林，6類嚴格保育）；超限利用地應改善或恢復植生。法律後果：依條例限期改善、廢除違規設施；未改善者可裁罰、廢止農業使用許可；情節嚴重者強制恢復植生費用由義務人負擔。",
d:`<h4>超限利用定義</h4>依《山坡地保育利用條例》，在土地可利用限度分類所規定的限制使用等級土地上，從事超過容許範圍的農業開發或利用行為，稱為「超限利用」。<table><tr><th>分類等級</th><th>容許使用</th><th>超限行為舉例</th></tr><tr><td>1~4類（宜農牧地）</td><td>農業、牧業利用</td><td>—（這些是合法可農用的）</td></tr><tr><td>5類（宜林地）</td><td>僅造林、護林</td><td>在宜林地開墾種植果樹、農耕→超限</td></tr><tr><td>6類（加強保育地）</td><td>嚴格保育、不得開發</td><td>任何形式的開挖整地→超限</td></tr></table><h4>山坡地土地使用管制原則</h4><ul><li>依土地可利用限度分類結果使用，不得超越該分類所容許的利用方式</li><li>已超限利用的土地應限期改善（恢復植生或降低使用強度）</li><li>政府定期辦理山坡地超限利用查報，建立管理機制</li></ul><h4>超限利用的主要法律後果</h4><ul><li>主管機關限期改善，期限通常為1~3年（依情節輕重）</li><li>未改善→廢止農業使用許可；若有違規設施→強制廢除</li><li>強制恢復植生費用由義務人（土地所有人）負擔，拒不執行→代為執行並追償</li><li>情節重大者（如造成嚴重土石流或崩塌）→移送司法追訴</li></ul><div class="note">超限利用是台灣山坡地最核心的土地管理問題，水保法與山坡地保育利用條例雙軌管制。考試常問「超限利用的定義、判斷依據、法律後果」，三個面向都要能完整回答。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB26",pts:20,
q:"請說明野溪護岸工程的設計流速選定原則，並比較乾砌石護岸、石籠護岸、混凝土護岸的容許流速範圍與生態適應性。",
s:"設計流速選定：以設計洪水（選定重現期）條件下計算斷面平均流速，確認不超過護岸材料的容許不沖蝕流速。乾砌石：容許流速1.5~2.5m/s，石縫提供棲地，生態性最佳。石籠：3~5m/s，透水可植生，生態性佳。混凝土：8~10m/s，幾乎無生態功能但承受高流速。選用原則：優先選生態性較高的材料，僅在流速超過容許值時才升級至下一層次。",
d:`<h4>設計流速選定原則</h4><ol style="padding-left:16px"><li>以設計洪水（重現期依設施重要性選定）代入Manning公式計算設計流速v</li><li>比對護岸材料的<b>容許不沖蝕流速（Permissible velocity）</b></li><li>若v超過容許值，需升級材料或調整斷面設計（加大斷面降低流速）</li></ol><h4>三種護岸材料容許流速與生態性比較</h4><table><tr><th>護岸材料</th><th>容許流速</th><th>透水性</th><th>植生可能性</th><th>生態適應性</th></tr><tr><td><b>乾砌石</b></td><td>1.5~2.5 m/s</td><td>高（孔隙大）</td><td>可（石縫植生）</td><td>⭐⭐⭐⭐（最佳，石縫提供底棲棲地）</td></tr><tr><td><b>石籠（Gabion）</b></td><td>3~5 m/s</td><td>高（孔隙率35%）</td><td>可（孔隙填土）</td><td>⭐⭐⭐（良好，可植生融入環境）</td></tr><tr><td><b>漿砌石</b></td><td>3~5 m/s</td><td>低（砂漿填縫）</td><td>難</td><td>⭐⭐（中等，無棲地孔隙）</td></tr><tr><td><b>混凝土護岸</b></td><td>8~10 m/s</td><td>幾乎零</td><td>極難</td><td>⭐（最差，完全阻斷地下水交換）</td></tr></table><h4>選用原則（生態工法優先邏輯）</h4><div class="fm">設計流速 ≤ 2.5m/s → 乾砌石；≤ 5m/s → 石籠/漿砌石；> 5m/s → 混凝土</div><div class="note">現代生態工程原則：在流速允許範圍內，優先採用生態適應性高的材料（由左至右升級），而非直接採用混凝土。只有當實際流速確實超過較環保材料的容許值時，才升級採用更高容許流速的材料。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB27",pts:20,
q:"請說明蛇籠（Rip-rap）護坡與土工袋（Geobag/Sand bag）在水土保持工程中的構造、適用情況與功能差異。",
s:"蛇籠（拋石護岸）：天然礫石鬆散堆置或鐵絲籠裝礫石堆置，柔性適應沉陷，透水保棲地。適用：溪床防沖、坡腳護岸（流速3~5m/s以下）。土工袋：聚丙烯編織袋填充土砂或礫石，可現地就地取材，施工快速，適用緊急護岸、臨時防護、坡腳加固（流速<1.5m/s）。主要差異：蛇籠耐久，土工袋臨時性強（紫外線老化）；蛇籠生態性高，土工袋生態性較低；蛇籠排水性佳，土工袋透水性依材料而異。",
d:`<h4>蛇籠（Rip-rap / 拋石）</h4><ul><li><b>構造：</b>以天然礫石（或塊石）直接拋置或以鍍鋅鋼絲網籠（石籠，Gabion）裝填礫石堆置</li><li><b>容許流速：</b>3~5 m/s（依石料粒徑及籠體強度）</li><li><b>透水性：</b>高（孔隙大，地下水自由交換）</li><li><b>生態性：</b>良好（石塊間孔隙提供底棲生物棲地，可自然植生）</li><li><b>適用：</b>溪床防沖、坡腳長期護岸、生態敏感區</li><li><b>耐久性：</b>高（20~50年，鋼絲籠需注意腐蝕）</li></ul><h4>土工袋（Geobag / Sand bag）</h4><ul><li><b>構造：</b>聚丙烯（PP）或聚乙烯（PE）編織袋填充就地取材的土砂、礫石或碎石</li><li><b>容許流速：</b>低（通常&lt;1.5 m/s，不適合高流速）</li><li><b>透水性：</b>依材料與填充物而異（通常較蛇籠低）</li><li><b>適用：</b>緊急護岸（洪水期間快速施工）、臨時防護、臨時擋水、坡腳臨時加固</li><li><b>耐久性：</b>低（UV老化，通常5~10年需更換）</li></ul><h4>兩者主要差異比較</h4><table><tr><th>比較項目</th><th>蛇籠</th><th>土工袋</th></tr><tr><td>性質</td><td>永久性工程</td><td>臨時或半永久</td></tr><tr><td>施工速度</td><td>較慢（需整地、組籠）</td><td>極快（就地取材裝填）</td></tr><tr><td>容許流速</td><td>3~5 m/s</td><td>&lt;1.5 m/s</td></tr><tr><td>生態性</td><td>高</td><td>低</td></tr><tr><td>適用場合</td><td>長期護岸、生態工法</td><td>緊急搶災、臨時防護</td></tr></table>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB28",pts:25,
q:"【計算題】某野溪矩形斷面，底寬8m、Manning n=0.022、溪床坡度1.5%，已知設計流量Q=65cms。請計算正常水深yn，並判斷此流態（亞臨界或超臨界）。",
s:"Manning公式：Q=(1/n)×A×R^(2/3)×S^0.5，A=8y，R=8y/(8+2y)。65=(1/0.022)×8y×(8y/(8+2y))^(2/3)×√0.015=45.45×8y×(8y/(8+2y))^(2/3)×0.1225。試算y=1.0：A=8，R=8/10=0.8，R^(2/3)=0.862，Q=45.45×8×0.862×0.1225=38.4（太小）。試算y=1.5：A=12，R=12/11=1.091，R^(2/3)=1.060，Q=45.45×12×1.060×0.1225=70.8（太大）。內插y≈1.40m：A=11.2，R=11.2/10.8=1.037，R^(2/3)=1.024，Q=45.45×11.2×1.024×0.1225≈63.8≈65cms。福祿數Fr=v/√(gy)=（65/11.2）/√(9.81×1.40)=5.804/3.705=1.57>1，超臨界流。",
d:`<h4>正常水深計算（試算法）</h4>Manning公式矩形斷面：<div class="fm">Q = (1/n)×(b×y)×(b×y/(b+2y))^(2/3)×S^(1/2)</div>b=8m；n=0.022；S=0.015；Q=65cms<div class="fm">常數項 = (1/0.022)×√0.015 = 45.45×0.1225 = 5.568</div><table><tr><th>試算y（m）</th><th>A=8y（m²）</th><th>R=8y/(8+2y)</th><th>R^(2/3)</th><th>計算Q（cms）</th></tr><tr><td>1.0</td><td>8.0</td><td>0.800</td><td>0.862</td><td>5.568×8.0×0.862=38.4</td></tr><tr><td>1.5</td><td>12.0</td><td>1.091</td><td>1.060</td><td>5.568×12.0×1.060=70.8</td></tr><tr><td><b>1.40</b></td><td>11.2</td><td>1.037</td><td>1.024</td><td>5.568×11.2×1.024≈63.9≈<b>65✓</b></td></tr></table><div class="fm">正常水深 yn ≈ <b>1.40 m</b></div><h4>流態判斷（福祿數）</h4><div class="fm">v = Q/A = 65/11.2 ≈ 5.80 m/s</div><div class="fm">Fr = v/√(g×yn) = 5.80/√(9.81×1.40) = 5.80/3.705 ≈ <b>1.57</b></div>Fr=1.57 > 1 → <b>超臨界流（急流）</b><div class="note">⚠️ 設計含義：Fr>1代表超臨界流，出口需設置消能設施（消力池或護坦），確保水流在進入下游軟質河床前完成從超臨界到亞臨界的轉換（水躍）。溪床坡度1.5%已屬較陡，高流速配合窄斷面易產生超臨界流，是工程設計需特別注意的情境。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB29",pts:20,
q:"請說明邊坡排水設計的「坡面排水」與「地下排水」兩個系統的功能差異，並說明兩者需要相互配合才能有效提升邊坡穩定性的原因。",
s:"坡面排水（地表）：截水溝、排水溝、坡面導流，功能是攔截與快速排除地表逕流，防止地表水入滲增加坡體含水量。地下排水：水平排水孔、排水廊道，功能是排除已入滲的地下水，降低坡體孔隙水壓，直接提升有效應力。配合原因：若只有坡面排水而無地下排水，長延時降雨仍會逐漸滲入坡體累積孔隙水壓；若只有地下排水而無坡面排水，地表逕流集中灌入裂縫快速補注地下水，地下排水速度跟不上補注速度。兩系統配合才能同時截斷地表補注水源並排除既有地下水。",
d:`<h4>坡面排水 vs 地下排水功能對比</h4><table><tr><th>項目</th><th>坡面排水系統</th><th>地下排水系統</th></tr><tr><td><b>目標對象</b></td><td>地表逕流（未入滲的水）</td><td>地下水（已入滲並在土體中流動的水）</td></tr><tr><td><b>主要設施</b></td><td>截水溝（坡頂攔外水）、排水溝（坡面收集）、跌水工（坡面消能）</td><td>水平排水孔（穿越滑動面）、排水廊道、集水井</td></tr><tr><td><b>作用機制</b></td><td>攔截地表水→快速排出→減少入滲量→減少地下水補注</td><td>排除坡體地下水→降低孔隙水壓u→提高有效應力σ'=σ-u→提升剪力強度→FS增加</td></tr><tr><td><b>直接效果</b></td><td>防止地表沖蝕；間接減少地下水補注</td><td>直接提升邊坡穩定（提高有效應力）</td></tr></table><h4>兩系統為何需要配合</h4><ul><li><b>地下排水缺乏坡面排水的問題：</b>長延時降雨後，地表逕流通過裂縫或坡面快速補注地下水，地下排水速度可能趕不上補注速度，孔隙水壓仍然升高</li><li><b>坡面排水缺乏地下排水的問題：</b>即使地表逕流全部被截排，但既有地下水（如高地下水位）仍會維持高孔隙水壓，FS難以有效提升</li><li><b>兩者配合的效果：</b>坡面排水截斷新的補注來源→地下排水持續排除既有地下水→地下水位持續下降→孔隙水壓持續降低→FS持續提升</li></ul><div class="note">工程規劃原則：邊坡穩定處理通常先設坡面截排水（成本低、施工快、立竿見影），再設地下排水孔（成本較高但效果最直接）。兩者相輔相成，不可偏廢。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB30",pts:20,
q:"請說明土石流與一般洪水在物質組成、流動機制、流速與破壞力上的主要差異，並說明這些差異如何影響治理工程的設計邏輯。",
s:"土石流：水+土砂混合體（固體濃度20~60%），流體黏度高，近似賓漢塑性流（Bingham plastic），流速2~20m/s，動量大（密度高），破壞力遠大於同速度的清水。治理邏輯：需攔砂壩攔截土砂、導流堤引導流路、設施需承受大衝擊力（需比清水設計更大的安全係數）。一般洪水：清水，牛頓流體，密度低，流速較慢，破壞以水力沖刷為主。治理邏輯：以通洪為主，設計重點是確保通水斷面充足、護岸抗沖蝕。",
d:`<h4>土石流 vs 一般洪水特性比較</h4><table><tr><th>比較項目</th><th>土石流</th><th>一般洪水（清水洪水）</th></tr><tr><td>物質組成</td><td>水+土砂混合體，固體體積濃度20~60%</td><td>清水（懸浮載&lt;數%）</td></tr><tr><td>流體行為</td><td>賓漢塑性流（Bingham plastic）——有降伏應力，靜止時不流動，啟動後黏度高</td><td>牛頓流體——線性黏度，低黏度</td></tr><tr><td>流動密度</td><td>高（1.5~2.2 t/m³）</td><td>低（約1.0 t/m³）</td></tr><tr><td>流速</td><td>2~20 m/s（坡陡時更高）</td><td>通常1~5 m/s</td></tr><tr><td>動量破壞力</td><td><b>極大</b>（高密度×高流速）——可推倒鋼筋混凝土建物</td><td>相對較小（低密度）</td></tr><tr><td>沖積特性</td><td>堆積在坡度緩和處，形成巨石、泥漿混合堆積物</td><td>細砂懸浮載沉積</td></tr></table><h4>差異對治理工程設計的影響</h4><table><tr><th>設計項目</th><th>土石流治理工程</th><th>一般洪水治理工程</th></tr><tr><td>設計流量</td><td>Qd=Qw/(1-Cd)（放大清水流量）</td><td>Qw（合理化公式或頻率分析）</td></tr><tr><td>主要設施</td><td>攔砂壩（截流）、導流堤（引流）、沉砂池</td><td>護岸（防沖蝕）、固床工（防下切）</td></tr><tr><td>設施強度</td><td>需承受高衝擊力，混凝土厚度需加大，基礎加深</td><td>依水流剪切力設計即可</td></tr><tr><td>溢洪口設計</td><td>需考量大粒徑石塊通過（避免堵塞），通水斷面加大</td><td>依清水流量設計</td></tr></table>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB31",pts:15,
q:"【法規記憶】請說明「生態廊道（Ecological corridor）」在野溪整治工程中的設計要求，並列出生態廊道設計的三個核心元素。",
s:"生態廊道設計要求：野溪整治工程須保持河川縱向連通性（魚類洄游、物質流通）、橫向連通性（河岸與水體交換）、垂直連通性（底質與地下水交換）。三個核心元素：①縱向連通（魚道或踏步固床工，確保魚類可上溯）；②底質多樣性（保留礫石底質，提供產卵棲地，避免全面混凝土化）；③濱溪植生（護岸採生態工法，保留或補植水岸植被，提供遮蔭、有機物輸入、陸水界面棲地）。",
d:`<h4>生態廊道在野溪整治的必要性</h4>野溪是山地生態系統的核心廊道，連結上下游棲地、提供物種移動路徑、維持基因交流。傳統硬式整治（全斷面混凝土、固床工高落差）會切斷這個廊道，造成生物族群碎片化，現代整治需在工程功能與廊道保全間取得平衡。<h4>三個核心元素</h4><table><tr><th>核心元素</th><th>設計要求</th><th>代表做法</th></tr><tr><td><b>① 縱向連通</b></td><td>確保魚類及底棲生物可在溪流上下游之間自由移動</td><td>固床工設計低落差（&lt;0.5m/級）或設置魚道；透過型攔砂壩（格柵壩）取代完全不透過型，讓生物和物質繼續流動</td></tr><tr><td><b>② 底質多樣性</b></td><td>保留或補充天然礫石底質，維持不同粒徑的底床異質性</td><td>施工後以天然石料補充礫石底質；禁止全溪床混凝土底板；設計深潭-淺瀨交替結構</td></tr><tr><td><b>③ 濱溪植生</b></td><td>護岸採生態工法，保留水岸植被帶</td><td>護岸採乾砌石、石籠、柳樹扦插等生態工法；保留或補植水柳、楓楊等本土水岸植物；避免清除河岸所有植生（喬木有遮蔭和有機物輸入功能）</td></tr></table><div class="note">台灣自108年推動「公共工程生態檢核機制」後，野溪整治工程須進行生態調查、設計生態廊道、監測完工後生態恢復，生態廊道設計從選項變成強制要求。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC24",pts:20,
q:"請說明水土保持計畫中「施工計畫」章節的主要內容，並說明「分期施工」的設計邏輯與對水土流失控制的效果。",
s:"施工計畫主要內容：工程施工程序（先後順序）、分期分區施工時程、臨時防護措施（截排水、沉砂池、PE布覆蓋）、施工機具管制、緊急應變計畫（豪雨颱風前措施）。分期施工邏輯：不同期施工分別執行，確保同時裸露面積不超過總面積的一定比例（降低尖峰裸露面積），使沉砂池等臨時設施在各期施工期間仍能有效應對。效果：同時裸露面積縮小→尖峰流失量降低→沉砂池設計容量需求減小→臨時防護設施成本降低→整體施工風險可控。",
d:`<h4>施工計畫章節主要內容</h4><table><tr><th>項目</th><th>說明</th></tr><tr><td>工程施工程序</td><td>規定施工的先後順序（通常先設臨時截排水→再開挖整地→隨即鋪設臨時防護→完成後設永久設施）</td></tr><tr><td>分期分區施工時程</td><td>將基地劃分為數個施工分區，設定各區施工時序，避免所有區域同時裸露</td></tr><tr><td>臨時防護措施</td><td>各施工期間所需的臨時截排水溝、沉砂池、PE布覆蓋、施工圍籬等，並說明各措施的設置時機與規格</td></tr><tr><td>施工機具管制</td><td>限定機具行駛路線、洗車措施，防止泥砂帶出基地</td></tr><tr><td>緊急應變計畫</td><td>颱風或豪雨警報前的緊急防護程序（如補強PE布、清空沉砂池、巡查設施）</td></tr></table><h4>分期施工的設計邏輯</h4><div class="fm">裸露面積=同時開挖的面積，不是基地總面積</div>若基地5ha，分3期（每期1.7ha）：<ul><li>第1期施工期間：僅1.7ha裸露，沉砂池容量只需對應1.7ha的流失量</li><li>第1期完成並完成植生後，進入第2期，再暴露1.7ha</li><li>任何時間最大裸露面積=1.7ha（而非5ha）</li></ul><h4>對水土流失控制的效果</h4><table><tr><th>情境</th><th>峰值裸露面積</th><th>尖峰流失量（比較）</th></tr><tr><td>全面同時開挖（不分期）</td><td>5ha</td><td>100%（基準）</td></tr><tr><td>分3期施工</td><td>1.7ha</td><td>約34%（降低66%）</td></tr></table><div class="note">分期施工是最低成本的水土流失控制策略，不需增加任何實體工程，只需妥善安排施工時序，就能將峰值流失量降低50~70%，是水保計畫審查中最被重視的施工計畫核心設計之一。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC25",pts:20,
q:"請說明地下排水設計中水平排水孔的施工程序與配置原則，並說明排水孔間距如何影響降低地下水位的效果。",
s:"施工程序：①地質鑽探確認滑動面深度→②選定鑽孔位置（覆蓋主要滑動面範圍）→③鑽設水平微傾孔（1~5°向下）→④插入PVC或PE穿孔管（外包濾網）→⑤觀測出水情況確認功能→⑥出口設防淤礫石包。配置原則：穿越潛在滑動面深入穩定地層（深度比滑動面深至少3~5m）；孔間距3~6m（依地質透水性調整）；扇形或平行布置覆蓋全坡面。排水孔間距越小→影響範圍疊加越多→地下水位降低越均勻→FS提升效果越顯著，但成本也越高；間距過大→各孔影響範圍之間存在未降低的「死角」→效果打折扣。",
d:`<h4>水平排水孔施工程序</h4><ol style="padding-left:16px"><li><b>前期調查：</b>地質鑽探確認滑動面深度、地下水位分布、地層滲透性（落水頭試驗）</li><li><b>鑽孔位置選定：</b>依滑動面範圍、地下水位高低區域，優先布置在孔隙水壓最高的位置</li><li><b>鑽設水平微傾孔：</b>使用rotary或percussion鑽機，孔向下傾斜1~5°（確保重力排水），深度穿越滑動面並深入穩定地層3~5m</li><li><b>安裝排水管：</b>插入PVC或PE穿孔管（孔徑6~12mm，間距規則分布），外部包覆地工織物濾網（防細粒進入堵塞管路）</li><li><b>功能確認：</b>觀測出口是否有水流出，出水量是否符合預期（若無水流出需檢查是否未穿越地下水位或管路堵塞）</li><li><b>出口防淤：</b>出口設置礫石包，防止細粒回填堵塞，並設出口保護防止沖蝕</li></ol><h4>配置原則</h4><table><tr><th>配置項目</th><th>原則規定</th></tr><tr><td>孔徑</td><td>75~150mm</td></tr><tr><td>傾斜角度</td><td>微傾向下1~5°（重力自排，無需動力）</td></tr><tr><td>深度</td><td>穿越潛在滑動面，深入穩定地層至少3~5m</td></tr><tr><td>孔間距</td><td>3~6m（依地質滲透性調整，滲透性差需密集）</td></tr></table><h4>間距對降水效果的影響</h4><div class="fm">單一排水孔影響半徑 ≈ 地層滲透係數×孔長的函數</div><ul><li>間距小於影響半徑的2倍→各孔影響範圍完全重疊→地下水位均勻降低</li><li>間距過大（超過2倍影響半徑）→孔與孔之間存在未受影響的「死角」→死角區域孔隙水壓仍高→邊坡局部仍不穩定</li></ul><div class="note">實務上排水孔間距設計需配合現地滲透試驗（取得K值），再用地下水滲流分析（簡化解析解或數值模式）估算特定間距的降水效果，確認FS提升是否達到設計目標。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC26",pts:25,
q:"【計算題整合】某山坡地建築開發，面積4公頃，坡長70m、坡度10%，Rm=14000，Km=0.035。開發前C=0.05、P=1.0；施工中C=1.0、P=1.0；完工後C=0.08、P=0.6。(1)三階段年土壤流失量；(2)施工中（假設施工期1年）沉砂池需要容量（SDR=1.0，即全部流失量進入沉砂池，容積重1.4t/m³）；(3)計算開發後比開發前的年流失量增加比例。",
s:"L=(70/22.13)^0.5=1.779；S（10%≥9%）=16.8×0.10-0.50=1.18；LS=2.100。R×K×LS=14000×0.035×2.100=1029ton/ha/yr。開發前：1029×0.05=51.5；施工中：1029×1.0=1029；完工後：1029×0.08×0.6=49.4 ton/ha/yr。施工中全基地流失=1029×4=4116ton；沉砂池容量=4116/1.4×1.5=4410m³。增加比例=(49.4-51.5)/51.5=-4%（完工後反而略低於開發前，因P=0.6降低）。",
d:`<h4>(1) 三階段LS與土壤流失量</h4><div class="fm">L = (70/22.13)^0.5 = 3.163^0.5 = 1.779</div><div class="fm">S = 16.8×0.10-0.50 = 1.18（坡度10%≥9%）</div><div class="fm">LS = 1.779×1.18 = 2.099</div><div class="fm">R×K×LS = 14000×0.035×2.099 = <b>1029 ton/ha/yr（基準值）</b></div><table><tr><th>階段</th><th>C</th><th>P</th><th>A（ton/ha/yr）</th><th>4ha全區（ton/yr）</th></tr><tr><td>開發前</td><td>0.05</td><td>1.0</td><td>1029×0.05=<b>51.5</b></td><td>206</td></tr><tr><td>施工中</td><td>1.0</td><td>1.0</td><td>1029×1.0=<b>1029</b></td><td>4116</td></tr><tr><td>完工後</td><td>0.08</td><td>0.6</td><td>1029×0.08×0.6=<b>49.4</b></td><td>198</td></tr></table><h4>(2) 施工中沉砂池容量（SDR=1.0，安全係數1.5）</h4><div class="fm">施工中全基地年流失量 = 1029×4 = 4116 ton</div><div class="fm">所需容積 = 4116÷1.4×1.5 = 2940×1.5 = <b>4410 m³</b></div><h4>(3) 完工後比開發前的流失量增減</h4><div class="fm">增加比例 = (49.4-51.5)/51.5 = -2.1/51.5 ≈ <b>-4.1%（略低於開發前）</b></div><div class="note">有趣的結論：完工後年流失量（49.4）反而比開發前（51.5）略低，這是因為保育措施P=0.6發揮了作用（開發前P=1.0未採保育措施，完工後有等高草帶或梯田P=0.6）。這說明設計良好的開發完工後，水土流失狀態可以優於原始裸耕農地，但施工期間的劇烈流失仍是最大風險，需以臨時沉砂設施因應。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC27",pts:20,
q:"請說明水土保持計畫中地質調查報告應包含的主要內容架構，並說明地質調查結果如何直接影響水保計畫的設施設計。",
s:"主要內容架構：(1)地形地質概述（岩性、地層）；(2)地質調查成果（鑽孔柱狀圖、SPT N值、RQD）；(3)地層強度參數（c'、φ'、qu）；(4)地下水資料（水位、季節變化）；(5)崩塌潛勢評估（坡面穩定分析FS）；(6)地質風險分析（順向坡判斷、液化潛能）。影響設計：岩性決定開挖難易與護坡材料選擇；FS決定是否需要邊坡加固；地下水位決定排水設施規模；順向坡判斷決定是否禁止開挖坡腳；液化潛能影響基礎設計。",
d:`<h4>地質調查報告主要內容架構</h4><table><tr><th>章節</th><th>主要內容</th></tr><tr><td>地形地質概述</td><td>場址區域地質（地層名稱、岩性描述、地層走向傾角）、活動斷層距離、地形坡度分析</td></tr><tr><td>地質調查成果</td><td>鑽孔柱狀圖（每個鑽孔的地層深度與描述）、SPT N值分布、岩心RQD、地層3D模型（若資料足夠）</td></tr><tr><td>地層強度參數</td><td>室內試驗結果：三軸試驗→c'、φ'；無圍束壓縮試驗→qu；基礎土承載力估算</td></tr><tr><td>地下水資料</td><td>各鑽孔地下水位深度、季節性水位變化範圍、各含水層位置</td></tr><tr><td>崩塌潛勢評估</td><td>邊坡穩定分析（選擇分析方法、代入強度參數、計算靜態與地震FS）</td></tr><tr><td>地質風險分析</td><td>順向坡判斷（最重要）、液化潛能評估（若有砂質土層）、崩塌歷史記錄</td></tr></table><h4>地質調查結果對設施設計的直接影響</h4><table><tr><th>調查結果</th><th>對設施設計的影響</th></tr><tr><td>岩性（軟岩/硬岩）</td><td>決定開挖坡角（軟岩較緩）、護坡材料選擇（岩盤→噴漿+錨釘；土坡→植生或格框）</td></tr><tr><td>FS不足（&lt;1.5）</td><td>需加設邊坡穩定工程（地錨、排樁、地下排水孔）才能開挖，否則禁止施作</td></tr><tr><td>地下水位高</td><td>需設置大量水平排水孔，基礎工程需考量浮力效應</td></tr><tr><td>判定為順向坡</td><td>嚴格禁止開挖坡腳，坡頂需設截水溝，必要時禁止開發</td></tr><tr><td>液化潛能高</td><td>基礎需採深基礎（基樁穿越液化層）或地盤改良（動力夯實）</td></tr></table>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC28",pts:15,
q:"【法規記憶】請說明《水土保持法》的適用範圍（山坡地定義）與主管機關層級，以及山坡地範圍認定若有爭議時的解決機制。",
s:"適用範圍：依水保法§3，山坡地係指標高在100公尺以上，或標高未達100公尺但坡度超過5%的公、私有土地（但都市計畫範圍內之山坡地，仍適用本法）。主管機關：中央主管機關為農業部（原農委會）；直轄市主管機關為直轄市政府；縣（市）主管機關為縣（市）政府。認定爭議：若對某筆土地是否屬山坡地有爭議，以主管機關認定為準；可向上級主管機關或行政法院申訴救濟。",
d:`<h4>山坡地定義（水保法§3，必背）</h4>依《水土保持法》第3條，「山坡地」係指下列公、私有土地：<ul><li><b>標高100公尺以上</b>的土地</li><li><b>標高未達100公尺，但坡度超過5%</b>的土地</li></ul><div class="note">都市計畫範圍內的山坡地仍適用水保法，不因位於都市計畫區而豁免。</div><h4>主管機關層級</h4><table><tr><th>層級</th><th>主管機關</th><th>主要職責</th></tr><tr><td>中央</td><td>農業部（前身農委會）</td><td>訂定法規政策、監督地方執行</td></tr><tr><td>直轄市</td><td>直轄市政府（農業局/水利局）</td><td>轄區內水保計畫審查核定、違規查處</td></tr><tr><td>縣（市）</td><td>縣（市）政府（農業處）</td><td>同上，負責縣市範圍</td></tr></table><h4>山坡地認定爭議解決機制</h4><ul><li>若義務人對某筆土地是否屬「山坡地」有爭議，以<b>主管機關認定為準</b></li><li>義務人如不服主管機關認定，可依<b>行政救濟程序</b>（訴願→行政訴訟）申訴</li><li>實務上爭議多發生在標高接近100m或坡度接近5%的邊界案例，以地形測量數據為認定依據</li></ul><div class="note">記憶重點：「100m或5%坡度」是山坡地認定的兩個門檻，滿足任一即屬山坡地，適用水保法規範。這個定義比很多人直覺認為的「很高的山」要廣泛得多，台灣許多丘陵農地都在適用範圍內。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC29",pts:20,
q:"請說明「農塘滲漏損失」的成因與影響，並說明設計農塘時如何評估與控制滲漏損失。",
s:"成因：農塘底部與側壁若為透水性地層（砂質土、礫質土），蓄水後水分持續向下滲漏損失。影響：有效灌溉供水減少、農塘蓄水期縮短、若滲漏量過大則農塘無法保水。評估：現地滲漏試驗（量測水位每日下降量×水面積=滲漏量）或達西定律估算（K×水力梯度×面積）。控制方法：黏土夯實底面（隔水層）；鋪設HDPE防滲膜；噴漿護底（低成本工法）；在滲透性低的自然黏土地層選址（最根本）。",
d:`<h4>農塘滲漏損失成因</h4>農塘底部及側壁若為透水性地層（砂質土、礫質土、裂隙岩盤），在水頭差（農塘水位-地下水位）驅動下，水分持續向下及側向滲漏：<div class="fm">滲漏量 = K × i × A（達西定律，K=滲透係數，i=水力梯度，A=滲漏面積）</div><h4>滲漏對農塘功能的影響</h4><ul><li>有效灌溉供水量減少（需從農塘容量中扣除滲漏損失）</li><li>農塘蓄水期縮短（春季蓄水到灌溉期間若滲漏量大，農塘可能在灌溉旺季前已接近乾涸）</li><li>若滲漏量過大，農塘根本無法長期保水，農塘功能完全喪失</li></ul><h4>滲漏量評估方法</h4><table><tr><th>方法</th><th>操作</th><th>適用</th></tr><tr><td>現地水位觀測法</td><td>在無雨、無入流、無出流期間，量測24hr水位下降量×水面積=日滲漏量</td><td>簡單易行，最常用於農塘施工後驗收</td></tr><tr><td>達西定律估算</td><td>由地質鑽探取得底部K值，結合水頭差估算滲漏率</td><td>設計前評估，需地質調查資料</td></tr></table><h4>控制滲漏的設計方法</h4><table><tr><th>方法</th><th>原理</th><th>成本</th></tr><tr><td><b>選址於低透水地層</b></td><td>在自然黏土或頁岩地層建農塘，底部K值低（最根本）</td><td>最低（無額外工程）</td></tr><tr><td>黏土夯實底面</td><td>底部回填壓實黏土（30~60cm），大幅降低底部K值</td><td>低~中</td></tr><tr><td>HDPE防滲膜</td><td>鋪設高密度聚乙烯防滲膜（0.5~1.5mm），幾乎完全防滲</td><td>中~高</td></tr><tr><td>噴漿護底</td><td>底部噴覆混凝土薄層，降低滲漏</td><td>中</td></tr></table>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD25",pts:20,
q:"請說明台灣三種主要降雨類型（梅雨、颱風、對流雨）的形成機制、發生季節、降雨強度與持續時間特性，並說明各類型在水土保持防災規劃上的意涵。",
s:"梅雨：5~6月，鋒面系統（暖濕氣流遇冷鋒停滯），持續時間長（數天）、雨量大（累積200~400mm/次）、強度中等（20~40mm/hr）。颱風：7~10月，熱帶氣旋，持續2~3天、累積雨量極大（200~1000mm）、短時間雨強可達100mm/hr以上，空間廣。對流雨：夏季午後，局部熱對流，持續短（30~60分鐘）、雨強極高（80~150mm/hr）、空間侷限（數公里）。水土保持意涵：梅雨→土壤長期飽和，適合崩塌觸發（Dunne逕流）；颱風→兩者（高強度Horton+土壤飽和）最危險；對流雨→局部強烈沖蝕，快速洪峰。",
d:`<h4>台灣三種主要降雨類型比較</h4><table><tr><th>類型</th><th>形成機制</th><th>發生季節</th><th>持續時間</th><th>累積雨量</th><th>最大雨強</th></tr><tr><td><b>梅雨</b></td><td>暖濕氣流與冷空氣交會形成的停滯鋒面（太平洋高壓邊緣）</td><td>5~6月</td><td>數天（最長可達1~2週）</td><td>200~400mm/次（有時超過500mm）</td><td>20~40mm/hr（中等但持久）</td></tr><tr><td><b>颱風</b></td><td>熱帶氣旋，暖濕海洋氣流螺旋上升</td><td>7~10月（高峰8~9月）</td><td>2~4天</td><td>500~1000mm以上（山地迎風坡可超過2000mm）</td><td>可達100mm/hr以上</td></tr><tr><td><b>對流雨（午後雷陣雨）</b></td><td>地表受熱強烈→局部熱對流→強烈上升氣流→積雨雲</td><td>5~9月午後（高峰6~8月）</td><td>30~90分鐘</td><td>50~150mm/次（局部）</td><td>80~150mm/hr（極高，但短暫）</td></tr></table><h4>各類型在水土保持防災規劃上的意涵</h4><table><tr><th>類型</th><th>主要水保防災意涵</th></tr><tr><td>梅雨</td><td>長延時降雨使土壤逐漸飽和→觸發Dunne飽和逕流與邊坡崩塌（後期最危險）；台灣許多重大崩塌發生在梅雨季後段</td></tr><tr><td>颱風（最危險）</td><td>高強度降雨（Horton逕流）+長持續時間（土壤飽和，Dunne逕流）雙重疊加；土石流、大規模崩塌主要由颱風觸發；設計標準需考量颱風量級的極端降雨</td></tr><tr><td>對流雨</td><td>短時間高強度→嚴重局部沖蝕（片蝕、細溝蝕）；洪峰尖銳且快速（tc短）；小型沉砂池與截排水溝的設計需考量短延時高雨強的IDF特性</td></tr></table>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD26",pts:20,
q:"請說明Thiessen多邊形法（Thiessen Polygon Method）計算集水區面平均雨量的步驟，並說明其相較於算術平均法的優缺點比較。",
s:"計算步驟：①在底圖標示各雨量站位置；②對各相鄰雨量站連線；③對各連線作垂直平分線；④垂直平分線圍成的多邊形即各站代表面積；⑤P_mean=Σ(Pi×Ai)/A_total（面積加權平均）。相較算術平均法優點：考量各站空間分布的不均勻性（各站代表面積不同）。缺點：不考慮地形影響（同一多邊形內各點雨量視為相同，但實際山地迎風坡與背風坡差異顯著）；站網密度變化時需重新繪製；計算較繁瑣。",
d:`<h4>Thiessen多邊形法計算步驟</h4><ol style="padding-left:16px"><li>在集水區地圖上標示所有雨量站（含集水區外圍附近的雨量站）位置</li><li>對每對相鄰雨量站間連線</li><li>對每條連線作<b>垂直平分線（中垂線）</b></li><li>各垂直平分線在集水區內圍成的多邊形，即為各雨量站的<b>代表面積（Thiessen area, Aᵢ）</b></li><li>計算各多邊形面積（用GIS或量測計）</li><li>計算面積加權平均雨量：</li></ol><div class="fm">P̄ = Σ(Pᵢ × Aᵢ) / A_total</div><h4>Thiessen法 vs 算術平均法優缺點</h4><table><tr><th>比較項目</th><th>算術平均法</th><th>Thiessen多邊形法</th></tr><tr><td>計算複雜度</td><td>最簡單（直接加總取平均）</td><td>較繁瑣（需繪製多邊形並量測面積）</td></tr><tr><td>適用條件</td><td>站分布均勻、地形起伏不大</td><td>站分布不均勻時表現更好</td></tr><tr><td>考慮站分布</td><td>不考慮（每站權重相同）</td><td>考慮（面積越大的多邊形站點權重越高）</td></tr><tr><td>考慮地形</td><td>不考慮</td><td>也不考慮（這是共同缺點）</td></tr><tr><td>站網變動影響</td><td>增刪雨量站只需重新加總</td><td>需重新繪製所有多邊形</td></tr></table><div class="note">等雨量線法（Isohyetal method）是三種方法中精度最高的，因為可以考慮地形影響（人工繪製等雨量線時可參考地形判斷）；但工作量最大。台灣現代水文分析多用GIS與克利金插值（Kriging），但Thiessen法仍是考試最常考的標準方法。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD27",pts:20,
q:"請說明洪水頻率分析中「樣本選取」對分析結果的影響，並說明為何不同重現期的洪水設計值，對工程設計安全性有根本性的影響。",
s:"樣本選取影響：記錄年數越短→樣本統計不穩定→高重現期推估誤差越大（如用10年資料推估100年重現期洪水，外插過遠不可靠）；AMS與AES抽樣方式影響低重現期設計值；各頻率分布假設（正態、對數常態、Log-Pearson III）對尾部（極端值）的推估差異大。工程設計安全性：設計重現期越高→設計洪水越大→設施規模越大→成本越高，但失敗機率越低；選擇設計重現期本質上是「可接受風險水準」的決策，而非純粹技術問題——極端事件若超過設計標準，設施仍可能失敗。",
d:`<h4>樣本選取對頻率分析結果的影響</h4><table><tr><th>影響因素</th><th>影響說明</th></tr><tr><td><b>觀測年數（最關鍵）</b></td><td>統計推估極端值（高重現期）需要足夠樣本：推估T=100年設計值，至少需要30~50年以上資料才相對可靠；用10年資料推估100年重現期洪水，屬「遠端外插」，不確定性極大</td></tr><tr><td>抽樣方式</td><td>AMS vs AES在低重現期設計值上差異顯著，高重現期趨近相同（詳見sD07）</td></tr><tr><td>頻率分布假設</td><td>不同分布對「尾部」（極端值）的描述能力不同：Log-Pearson III在台灣洪水資料表現通常較佳，但正確性仍需驗證</td></tr></table><h4>設計重現期對工程安全性的根本影響</h4><div class="fm">年超越機率 p = 1/T；n年中至少超越一次的機率 = 1-(1-p)ⁿ</div><table><tr><th>設計重現期T</th><th>100年使用期內超越機率</th><th>工程意義</th></tr><tr><td>T=25年</td><td>1-0.96^100=98.3%</td><td>100年內幾乎必然被超越，僅適用臨時設施</td></tr><tr><td>T=100年</td><td>1-0.99^100=63.4%</td><td>100年內仍有63%被超越，適用一般永久設施</td></tr><tr><td>T=200年</td><td>1-0.995^100=39.4%</td><td>100年內仍有40%被超越，重要設施的設計標準</td></tr></table><div class="note">核心認知：設計重現期的選定不是技術問題，而是<b>風險可接受水準的政策決定</b>。選T=100年的設計，本質上是「接受在100年使用期內有63%的機率被超越」。了解這個本質，才能在技術報告或考試申論中說清楚「為何這個設計標準是合理的」。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD28",pts:15,
q:"【法規記憶+計算】某流域使用Thiessen法，三個雨量站代表面積分別為A1=120ha、A2=200ha、A3=80ha，本次降雨各站實測雨量P1=85mm、P2=110mm、P3=65mm，求集水區面平均降雨量。另請說明若A2站儀器故障無資料，如何利用正常雨量比法補遺P2。",
s:"Thiessen加權：P_mean=(85×120+110×200+65×80)/(120+200+80)=(10200+22000+5200)/400=37400/400=93.5mm。若A2站缺資料（假設已知各站年平均雨量：N1=1800mm、N2=2000mm、N3=1600mm）：P2=N2/3×(P1/N1+P3/N3)=2000/3×(85/1800+65/1600)=666.7×(0.04722+0.04063)=666.7×0.08785=58.6mm（代入補遺值後重新計算面平均）。",
d:`<h4>Thiessen面平均雨量計算</h4>A1=120ha，P1=85mm；A2=200ha，P2=110mm；A3=80ha，P3=65mm；A_total=400ha<div class="fm">P̄ = (P1×A1 + P2×A2 + P3×A3) / A_total</div><div class="fm">= (85×120 + 110×200 + 65×80) / 400</div><div class="fm">= (10200 + 22000 + 5200) / 400</div><div class="fm">= 37400 / 400 = <b>93.5 mm</b></div><h4>A2站儀器故障缺資料的補遺：正常雨量比法</h4>適用條件：各站年平均雨量差異>10%時（或缺資料站的年平均雨量與鄰站差異>10%），採正常雨量比法（Hn method）。<div class="fm">P_x = (N_x/n) × Σ(Pᵢ/Nᵢ)（n=正常站數量）</div>假設各站年平均雨量：N1=1800mm；N2=2000mm；N3=1600mm<div class="fm">P2 = (N2/2) × (P1/N1 + P3/N3)</div><div class="fm">= (2000/2) × (85/1800 + 65/1600)</div><div class="fm">= 1000 × (0.04722 + 0.04063)</div><div class="fm">= 1000 × 0.08785 ≈ <b>87.9 mm</b></div>以補遺值87.9mm代入Thiessen計算新的面平均雨量：<div class="fm">P̄_補遺 = (85×120 + 87.9×200 + 65×80)/400 = (10200+17580+5200)/400 = 32980/400 = <b>82.5 mm</b></div><div class="note">正常雨量比法vs算術平均法選擇：若缺資料站年均雨量與鄰站相差>10%→用正常雨量比法（本題N2/N1=2000/1800=1.11，差11%，用比值法）；相差≤10%→用算術平均法即可。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD29",pts:20,
q:"請說明集水區土地利用改變（如農地→都市化）對年水文循環各分量的量化影響，並說明這種改變如何影響IDF曲線設計的適用性。",
s:"土地利用改變量化影響：不透水率從10%增加到70%→地表逕流係數C從0.3提升至0.7（+133%）；ET年蒸散減少約30%（植被減少、截留減少）；地下水年補注減少約40%（入滲減少）；洪峰流量增加200~400%；枯水流量減少30~50%。對IDF適用性影響：IDF曲線是根據歷史降雨（而非逕流）建立，本身不隨土地利用改變，但合理化公式中C值需更新反映都市化後的逕流係數，若使用舊的C值設計新的都市排水系統，設計洪峰將嚴重低估，排水設施不足。",
d:`<h4>土地利用改變（農地→都市化）對水文各分量的影響</h4><table><tr><th>水文分量</th><th>農地（不透水率~10%）</th><th>都市化（不透水率~70%）</th><th>變化方向與幅度</th></tr><tr><td>地表逕流係數C</td><td>~0.30</td><td>~0.70~0.85</td><td>↑ +130~180%</td></tr><tr><td>年ET蒸發散</td><td>高（植被茂密，截留豐富）</td><td>低（不透水面無截留，植被減少）</td><td>↓ 減少約25~35%</td></tr><tr><td>年地下水補注</td><td>中高（入滲機會多）</td><td>低（入滲面積大幅減少）</td><td>↓ 減少約30~50%</td></tr><tr><td>洪峰流量</td><td>基準值</td><td>急劇增加（C增大、tc縮短雙重效應）</td><td>↑ 增加200~500%（依不透水率而異）</td></tr><tr><td>枯水基流</td><td>相對穩定</td><td>顯著降低（地下水補注減少，基流來源不足）</td><td>↓ 減少30~50%</td></tr><tr><td>集流時間tc</td><td>較長（地表粗糙，坡面流慢）</td><td>縮短（光滑鋪面+地下管網快速集流）</td><td>↓ 縮短40~70%</td></tr></table><h4>對IDF設計適用性的影響</h4><ul><li><b>IDF曲線本身不受影響：</b>IDF曲線反映的是「大氣降雨」的統計特性，與地面土地利用無關，都市化不改變IDF曲線</li><li><b>合理化公式的C值必須更新：</b>都市化後逕流係數C大幅提升，若仍採用農地C值（如0.30）計算設計洪峰，會嚴重低估流量，排水系統設計嚴重不足</li><li><b>tc縮短影響設計雨強選用：</b>都市化後tc縮短→選用的設計延時縮短→對應IDF曲線上雨強更高→即使IDF相同，設計洪峰仍因tc縮短而增大</li><li><b>實務意義：</b>都市化地區的水文設計必須採用反映都市化後土地利用的C值，並重新評估tc，才能得到正確的設計洪峰</li></ul><div class="note">LID（低衝擊開發）的本質：LID措施（透水鋪面、雨水花園等）的目標，就是讓都市化後的C值、tc盡量接近開發前的農地或自然地狀態，從根本上緩解都市化水文改變。</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE24",pts:20,
q:"請說明「植生工程」與「生物工程（Bioengineering）」的概念差異，並說明生物工程中「活材料」（Living materials，活枝條、活木樁）相較於傳統死材料（石材、混凝土）的長期效能特性。",
s:"植生工程：廣義，泛指所有導入植物的工程，包含噴植、栽植、扦插等。生物工程（Bioengineering）：狹義，特指直接以活植物材料（活枝條、活木樁）作為工程結構元素，植物本身兼具工程支撐與生長固土的雙重功能。活材料長期效能：初期強度低（需等待植物生根）→中期隨根系生長強度持續增加→長期強度可能超越初始設計值（根系深化加固）；相對死材料，不會老化腐蝕，只要植物存活就持續改善，但需要適當的生長條件（水分、養分）。",
d:`<h4>植生工程 vs 生物工程定義差異</h4><table><tr><th>概念</th><th>範圍</th><th>植物角色</th><th>代表方法</th></tr><tr><td><b>植生工程（Vegetation engineering）</b></td><td>廣義：所有在工程中導入植物的技術</td><td>輔助角色（植物作為保護層，工程結構由其他材料提供）</td><td>客土噴植、草皮鋪植、容器苗栽植</td></tr><tr><td><b>生物工程（Bioengineering / Soil bioengineering）</b></td><td>狹義：以活植物材料本身作為工程結構元素</td><td>主角（植物同時是「建材」和「生長體」）</td><td>活木樁（Live stakes）、柳枝束（Live fascines）、層積扦插（Brush layering）</td></tr></table><h4>活材料 vs 死材料（石材、混凝土）長期效能比較</h4><table><tr><th>比較項目</th><th>活材料（活枝條、活木樁）</th><th>死材料（石材、混凝土）</th></tr><tr><td>初期強度</td><td>低（需等植物生根，通常1~3個月後開始有效）</td><td>高（安裝即生效）</td></tr><tr><td>強度隨時間變化</td><td>持續增加（根系越深越密，加固效果越強）</td><td>逐漸劣化（風化、腐蝕、老化）</td></tr><tr><td>長期效能</td><td>可能超越初始設計值（根系深化持續加固）</td><td>隨時間降低（需定期維護或更換）</td></tr><tr><td>失效模式</td><td>植物死亡（需確保適當生長條件）</td><td>物理破壞（沖蝕、腐蝕、結構失敗）</td></tr><tr><td>生態友善性</td><td>高（植物即是棲地）</td><td>低</td></tr></table><div class="note">生物工程的核心理念：「工程強度隨時間增加，而非降低」——這是生物工程相對傳統工程最獨特的優勢，也是它適合長期護坡功能的根本原因。但它有一個必要條件：植物必須在施工後成功存活並生長，因此選材（適地適種）和施工時機（避開乾旱期）是生物工程成功的關鍵。</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE25",pts:20,
q:"請說明噴植工程中「木纖維覆蓋材（Wood fiber mulch）」的功能，並比較其與「稻草纖維覆蓋材（Straw mulch）」在保水性、分解速度、承受雨滴衝擊能力上的差異。",
s:"木纖維功能：在客土噴植材料中作為骨架，增加材料間連結（類似混凝土中的鋼筋）；降落坡面後形成多孔纖維層，保濕（延長水分在種子附近停留時間）；防止乾燥前材料整體流失。比較：木纖維的保水性＞稻草（木纖維吸水量可達自重10~15倍）；分解速度：稻草分解快（3~6個月，溫暖潮濕），木纖維分解較慢（6~18個月，因細胞壁較厚）；承受雨滴衝擊：木纖維由細絲相互纏繞成毯狀，覆蓋坡面均勻且緻密，抵抗雨滴衝擊效果優於稻草（稻草莖粗、覆蓋不均）。",
d:`<h4>木纖維覆蓋材（Wood fiber mulch）功能</h4><ul><li><b>結構骨架功能：</b>木纖維細絲相互纏繞，在噴植材料中形成類似「鋼筋」的三維網絡骨架，增加整體材料的黏著凝聚力，防止材料在未發芽前因重力或雨水沖刷而整體滑落</li><li><b>保水功能：</b>木纖維的海綿狀結構，吸水量可達自重10~15倍，在種子發芽期間持續提供濕潤環境，即使數天不下雨種子仍有充分水分萌發</li><li><b>均勻覆蓋：</b>混合於噴植材料中可均勻覆蓋整個坡面，無死角，確保每個部位的種子都受到覆蓋保護</li></ul><h4>木纖維 vs 稻草纖維覆蓋材比較</h4><table><tr><th>比較項目</th><th>木纖維覆蓋材</th><th>稻草纖維覆蓋材</th></tr><tr><td>保水性</td><td>高（細胞壁吸水量大，保水可達自重10~15倍）</td><td>中等（較木纖維低，約自重3~6倍）</td></tr><tr><td>分解速度</td><td>較慢（6~18個月，細胞壁較厚難分解）</td><td>較快（3~6個月，溫暖潮濕環境下更快）</td></tr><tr><td>承受雨滴衝擊</td><td>優秀（纖維細絲緻密覆蓋，均勻分散衝擊力）</td><td>中等（莖較粗，覆蓋不均，有空隙讓雨滴直接衝擊地表）</td></tr><tr><td>施工方式</td><td>混合於噴植漿液中，以噴植機施作</td><td>人工撒鋪或固定，也可混入噴植材料</td></tr><tr><td>成本</td><td>較高</td><td>較低</td></tr></table><div class="note">實務選擇：高陡坡（>45°）或強降雨地區優先選木纖維（保水+抗衝擊俱佳）；緩坡或成本考量下可用稻草纖維；部分工程採混合使用（木纖維+稻草），兼顧效果與成本。</div>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE26",pts:20,
q:"請說明植生復育的「目標植群（Target vegetation）」概念，並說明如何依據鄰近自然林植群組成來設定目標植群，以及為何鄉土種多樣性植栽優於單一優勢種植栽。",
s:"目標植群：設定復育終點的植群型態，通常以受干擾前的自然植群或鄰近未擾動成熟植群為參考。設定方法：在施工地鄰近的成熟天然林設樣區調查→計算IVI→確認優勢種與物種組成→設定目標植群組成（通常不強求完全相同，而是設定「功能群落結構」作為目標）。多樣性優於單一種原因：生態穩定性（多樣性高的群落對病蟲害、乾旱等衝擊有更高抵抗力）、棲地多樣性（不同植物提供不同生態位）、對氣候變遷的適應能力（不同物種在不同氣候條件下的優勢互補）、永續性（單一種容易因病蟲害全面死亡）。",
d:`<h4>目標植群（Target vegetation）概念</h4>植生復育工程不只是「讓植物長起來」，而是要引導植群朝向特定的生態目標發展。<b>目標植群</b>是指在設計之初就確定的「復育終點」植群型態，用以指導整個復育過程中的物種選擇、演替加速策略與後期管理。<h4>依鄰近自然林設定目標植群的步驟</h4><ol style="padding-left:16px"><li>在施工地<b>鄰近的成熟天然林</b>（未受干擾、代表當地潛在植被）設置樣區調查</li><li>進行植生群落調查（每木調查、IVI計算）</li><li>確認<b>優勢種與各層次物種組成</b>（喬木層、亞喬木層、灌木層、草本層）</li><li>設定目標植群組成（不要求完全複製，而是設定<b>「功能群落結構」</b>：多層次、以鄉土種為主、含固氮植物）</li><li>依目標植群選擇復育初期（先鋒種）→中期→長期的植物引入時序</li></ol><h4>鄉土種多樣性植栽優於單一優勢種的原因</h4><table><tr><th>面向</th><th>說明</th></tr><tr><td><b>生態穩定性（抵抗力）</b></td><td>多樣性高的群落，單一病蟲害或極端氣候事件不會造成全面崩潰（不同物種對逆境的耐受程度不同）</td></tr><tr><td><b>棲地功能多樣性</b></td><td>不同植物形態、果實、花期提供不同的食物來源和棲所，吸引更多野生動物族群</td></tr><tr><td><b>氣候變遷適應力</b></td><td>多樣性群落中總有部分物種在未來氣候下仍能生存，增加群落整體對氣候變遷的適應韌性</td></tr><tr><td><b>永續性</b></td><td>單一種植栽風險高——一旦爆發針對該物種的病蟲害（如松材線蟲病），可能全面死亡；多樣性群落不存在此風險</td></tr></table>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE27",pts:15,
q:"【法規記憶+觀念】請說明植生工程中「目的種（Target species）」的概念與選用標準，並說明目的種選用標準應涵蓋哪些生態與工程面向的考量。",
s:"目的種定義：植生工程中預期在復育完成時應成為植群優勢或重要組成的特定植物物種（通常為鄉土種）。選用標準包括：①生態面——鄉土種（不具外來入侵風險）、符合當地氣候帶與海拔分布、能反映當地潛在植被的代表性物種；②工程面——根系特性符合護坡需求（深根固土或密集淺根防蝕）、耐逆境（施工環境的貧瘠乾旱）、市場上有足夠種源可供取得；③驗收面——發芽率或活存率達技術規範要求（草本≥80%、苗木活存率≥70%），否則即使是好的目的種也難以通過驗收。",
d:`<h4>目的種（Target species）定義</h4>目的種是植生工程計畫書中明確指定的「預期優勢物種」，是判斷植生復育是否成功的關鍵依據。與「先鋒種（Pioneer species）」不同：先鋒種是快速覆蓋用的（如百喜草），目的種是長期生態復育的目標（如山黃麻、台灣相思）。<h4>目的種選用標準（兩個面向整合）</h4><table><tr><th>面向</th><th>標準</th><th>評估方法</th></tr><tr><td rowspan="3"><b>生態面</b></td><td>鄉土種（台灣原生種，非外來種）</td><td>查詢台灣植物名錄，確認原生分布範圍</td></tr><tr><td>符合當地氣候帶與海拔分布範圍</td><td>查詢物種分布資料，與施工地海拔、氣候帶對照</td></tr><tr><td>能反映當地潛在植被（自然演替終點的代表種）</td><td>調查鄰近成熟天然林的優勢種</td></tr><tr><td rowspan="3"><b>工程面</b></td><td>根系特性符合護坡需求</td><td>查詢物種根系深度與類型（深根固土 or 淺根密集防蝕）</td></tr><tr><td>耐施工環境逆境（貧瘠、乾旱、強日照）</td><td>參考物種生態習性文獻；試種試驗</td></tr><tr><td>市場上有足夠種源可取得</td><td>確認種苗場或種子供應商能提供足夠數量</td></tr><tr><td rowspan="2"><b>驗收面</b></td><td>草本目的種發芽率≥80%（CNS標準）</td><td>出廠前抽樣發芽率試驗</td></tr><tr><td>苗木活存率≥70%（技術規範§61）</td><td>種植後1年回檢</td></tr></table><div class="note">考試應用：「目的種」在植生工程科是高頻考點，常與「先鋒種」對比，或與「覆蓋率驗收的爭議」連結（先鋒種快速達標但目的種還沒建立的矛盾）。能清楚說明選用標準的三個面向，是申論題得分的關鍵。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA36",pts:20,
q:"請說明「土壤結構（Soil structure）」的定義與類型，並說明良好土壤結構對入滲、保水與沖蝕抵抗力的影響機制。",
s:"土壤結構：土壤顆粒聚合排列形成的三維空間組織，依形狀分為：團粒狀（granular，農業最佳）、塊狀（blocky）、板狀（platy）、柱狀（columnar/prismatic）。良好團粒結構（granular）影響：①入滲——大孔隙豐富，入滲率高；②保水——大中小孔隙並存，提供多種水分保持力；③抗蝕——穩定的有機-礦物複合體（organo-mineral complexes）抵抗雨滴打擊與逕流剝離，不易崩散。",
d:`<h4>土壤結構定義與主要類型</h4><div class="fm">土壤結構 = 土壤顆粒（砂、粉砂、黏粒）+ 有機質 → 聚合成「ped（土壤單元體）」的三維空間排列方式</div><table><tr><th>結構類型</th><th>外觀特徵</th><th>農業意義</th></tr><tr><td><b>團粒狀（Granular）</b></td><td>球形至近球形，直徑1~10mm，疏鬆排列</td><td>農業最佳，大中小孔隙並存，保水保肥入滲俱佳</td></tr><tr><td>塊狀（Blocky）</td><td>方塊形，有明顯棱角或圓滑面</td><td>常見於表土以下，透水性中等</td></tr><tr><td>板狀（Platy）</td><td>水平層狀，薄板形</td><td>阻礙垂直水分移動與根系向下生長，入滲差</td></tr><tr><td>柱狀/稜柱狀（Columnar/Prismatic）</td><td>垂直柱形，頂端圓（柱）或平（稜柱）</td><td>常見於半乾旱或鈉質土底土層</td></tr><tr><td>無結構（Single grain / Massive）</td><td>完全散粒（砂土）或整體緻密（黏土壓實）</td><td>最差，前者無保水，後者入滲極差</td></tr></table><h4>良好團粒結構對水文與侵蝕的影響</h4><table><tr><th>功能</th><th>機制</th></tr><tr><td><b>高入滲率</b></td><td>團粒間大孔隙（>50μm）提供快速入滲通道，減少地表逕流</td></tr><tr><td><b>優良保水力</b></td><td>大孔隙排重力水→中孔隙保毛細水（可被植物利用）→小孔隙保膜狀水；多種孔隙共存使PAW（有效水分）最大化</td></tr><tr><td><b>強抗蝕能力</b></td><td>有機-礦物複合體（腐植質與黏粒鍵結）使團粒具高穩定性，抵抗雨滴打擊（不易崩散成細粒），K值降低</td></tr></table><div class="note">改善土壤結構的最有效方法：增加有機質（堆肥、綠肥）→促進腐植質形成→有機-礦物複合體增加→團粒結構改善→形成良性循環。這就是為何有機農業、客土噴植加入腐植土都是水保工程的基本操作。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA37",pts:20,
q:"請說明土壤沖蝕的「rill erosion（細溝蝕）」在坡面上的發生條件，以及USLE公式在描述細溝蝕上的限制，並說明為何坡長L因子中的指數m隨坡度增加而增大（從0.2到0.5）。",
s:"細溝蝕發生條件：逕流累積到一定量後集中流動，局部剪切力τ=γRS超過土壤臨界剪切力τc，在坡面形成規則的淺溝（深度<30cm）。USLE限制：USLE雖涵蓋細溝蝕，但無法描述細溝的空間位置、幾何形狀與沿坡面的發展過程，也無法模擬細溝蝕與片蝕的相對比例。m隨坡度增大的原因：m=0.2（緩坡）代表片蝕主導，流量增加對侵蝕的效應小；m=0.5（陡坡）代表細溝蝕主導，流量累積對侵蝕的放大效果大（集中流速依坡度放大更快），因此L因子的指數需隨坡度增大反映此效應。",
d:`<h4>細溝蝕（Rill erosion）發生條件</h4>坡面逕流隨坡長增加而累積，當：<ol style="padding-left:16px"><li>逕流量累積足夠大（通常在坡面下段），流速加快</li><li>局部水流剪切力 τ = γ·R·S 超過土壤<b>臨界剪切力 τc</b></li><li>坡面出現集中流（而非均勻薄層流）</li></ol>此時地表被劃開形成規律的淺溝（深度<30cm，可被農機整地消除），稱為細溝蝕。<h4>USLE在描述細溝蝕上的限制</h4><ul><li>USLE只給出坡面年均總侵蝕量，無法描述細溝的<b>空間位置、形狀、數量</b>與沿坡面的發展過程</li><li>無法區分各時刻片蝕（雨滴主導）與細溝蝕（逕流主導）的<b>相對貢獻比例</b></li><li>細溝一旦形成後，形狀本身會影響後續侵蝕（細溝加深→集水力增加→自我強化），這個過程USLE無法模擬</li></ul><h4>L因子指數m隨坡度增大的原因</h4><div class="fm">L = (λ/22.13)^m，m = 0.2（坡度&lt;1%）→ 0.3（1~3%）→ 0.4（3~5%）→ 0.5（≥5%）</div><table><tr><th>坡度條件</th><th>m值</th><th>物理意義</th></tr><tr><td>緩坡（&lt;1%）</td><td>0.2</td><td>片蝕主導，流量累積對侵蝕的放大效應小（逕流薄且慢）</td></tr><tr><td>陡坡（≥5%）</td><td>0.5</td><td>細溝蝕主導，坡度使集中流速隨坡長急劇增大，流量累積對侵蝕的放大效應強</td></tr></table><div class="note">直觀理解：陡坡上，逕流沿坡累積後流速增加更快（因坡度驅動力大），這使侵蝕力隨坡長增加的速度比緩坡快得多，因此USLE用更大的指數m（0.5）來反映這個更強的「坡長放大效應」。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA38",pts:20,
q:"請說明土壤「可分散性（Dispersibility）」的概念，並說明鈉質土（Sodic soil）與高可分散性土壤對水土保持工程的特殊挑戰。",
s:"可分散性：土壤顆粒在水中自然分散（不需外力攪拌）的傾向，由黏粒表面的離子組成決定。鈉質土（ESP>15%，即可交換性鈉百分率高）：Na⁺使黏粒雙電層擴展，顆粒間靜電斥力增大，遇水立即分散（無需雨滴衝擊）。水保工程挑戰：①高分散土壤K值極高（整個土壤骨架崩解）；②管湧（Piping）風險高（水在土體內部流動時沿優先流路溶蝕形成管道）；③傳統護坡措施（植生噴植）對管湧無效，需石灰或石膏處理改變離子組成。",
d:`<h4>土壤可分散性定義</h4>土壤顆粒（尤其黏粒）在水中不需外力攪拌，僅靠靜電排斥力自然分離懸浮的傾向。可用「可分散性試驗（Dispersion test）」量測：土壤置於蒸餾水中，若自然分散→高分散性；若保持完整→低分散性。<h4>鈉質土（Sodic soil）的離子機制</h4><div class="fm">ESP（可交換性鈉百分率）= 可交換性Na⁺/CEC × 100%</div>ESP > 15% → 定義為鈉質土<br>Na⁺是一價大離子，使黏粒表面雙電層（Diffuse double layer）極度擴展，顆粒間靜電斥力遠大於吸引力，顆粒遇水即分散。<h4>高可分散土壤對水保工程的特殊挑戰</h4><table><tr><th>挑戰</th><th>說明</th><th>應對措施</th></tr><tr><td>極高K值（高可蝕性）</td><td>土壤骨架遇水即崩解，USLE K值可達0.1以上，遠高於一般土壤</td><td>客土改良（覆蓋低分散性客土）、施石膏（Ca²⁺置換Na⁺）</td></tr><tr><td>管湧（Piping）風險</td><td>水在土體內部沿優先流路（裂縫、根孔）流動，溶蝕形成地下管道，管道塌陷形成落穴（Sinkhole），是台灣泥岩（惡地）地形的主要侵蝕機制</td><td>填塞地表裂縫、石灰處理降低分散性、避免深挖破壞天然保護層</td></tr><tr><td>植生建立困難</td><td>地表水鹽分高、結構差，植物難以存活</td><td>先用石灰降低分散性、施石膏降低鹽鹼度，再選耐鹽植物</td></tr></table>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA39",pts:25,
q:"【計算題整合題】某坡地整地開發：總面積6ha，整地後均一坡度16%、坡長50m，Rm=12000，Km=0.040，整地期C=1.0，P=1.0，SDR=0.35，容積重1.3t/m³。(1)計算整地期年坡面侵蝕量（ton/ha/yr）；(2)若整地期6個月，計算進入沉砂池的土砂量（ton）；(3)若沉砂池設計年限2年、每年清淤一次，且安全係數1.5，求沉砂池有效容量（m³）；(4)整地後回填植生，坡度降至8%，植生C=0.05，P=0.6，計算完工後年侵蝕量減少百分比。",
s:"(1)L=(50/22.13)^0.5=1.504；S（16%≥9%）=16.8×0.16-0.50=2.188；LS=1.504×2.188=3.290。A=12000×0.040×3.290×1.0×1.0=1579.2ton/ha/yr。(2)6個月=0.5yr；進入沉砂池=1579.2×0.5×6×0.35=1659.2ton。(3)2年設計，每年清淤一次，設計以1年流失量為基準：年輸砂=1579.2×6×0.35=3316ton；容量=3316/1.3×1.5=3827m³。(4)完工後：L=(50/22.13)^0.5=1.504；S（8%<9%）=10.8×0.08+0.03=0.894；LS=1.345。A完工=12000×0.040×1.345×0.05×0.6=193.7ton/ha。減少%=(1579.2-193.7)/1579.2×100%=87.7%。",
d:`<h4>(1) 整地期年坡面侵蝕量</h4><div class="fm">L = (50/22.13)^0.5 = 2.260^0.5 = 1.503</div><div class="fm">S = 16.8×0.16-0.50 = 2.688-0.50 = 2.188（坡度16%≥9%）</div><div class="fm">LS = 1.503×2.188 = 3.288</div><div class="fm">A整地 = 12000×0.040×3.288×1.0×1.0 ≈ <b>1578 ton/ha/yr</b></div><h4>(2) 6個月期間進入沉砂池土砂量</h4><div class="fm">6個月坡面流失量 = 1578×0.5×6ha = 4734 ton</div><div class="fm">進入沉砂池（×SDR=0.35） = 4734×0.35 ≈ <b>1657 ton</b></div><h4>(3) 沉砂池有效容量（設計年限2年、每年清淤、FS=1.5）</h4>每年清淤→以<b>1年的輸砂量</b>為設計基準（清淤後容量恢復）：<div class="fm">年輸砂量 = 1578×6×0.35 = 3314 ton/yr</div><div class="fm">所需淨容積 = 3314÷1.3 = 2549 m³</div><div class="fm">加安全係數1.5：有效容量 = 2549×1.5 ≈ <b>3824 m³</b></div><h4>(4) 完工後侵蝕量減少百分比</h4>完工後坡度8%（回填降坡）：<div class="fm">L = 1.503（坡長不變）；S = 10.8×0.08+0.03 = 0.894（坡度8%&lt;9%）</div><div class="fm">LS完工 = 1.503×0.894 = 1.344</div><div class="fm">A完工 = 12000×0.040×1.344×0.05×0.6 ≈ 193 ton/ha/yr</div><div class="fm">減少百分比 = (1578-193)/1578 × 100% ≈ <b>87.8%</b></div><div class="note">這題整合四個步驟：USLE計算→SDR轉換→沉砂池設計→完工後比較。重點：(3)每年清淤時，設計基準是「1年輸砂量」而非整個設計年限的累積量，因為清淤後容量會恢復；(4)完工後S因子公式切換（8%&lt;9%），這是最常見的失分點。</div>`},

{yr:"自出",sub:"土壤物理與沖蝕",type:"self",n:"sA40",pts:15,
q:"【法規記憶】請說明台灣《水土保持技術規範》對坡地開發工程「完工後植生覆蓋率」的具體要求，以及施工期間臨時防護措施的設置標準（沉砂池、截排水溝），並說明若未依規定設置的法律責任。",
s:"完工後植生覆蓋率：草本植生竣工後6個月內覆蓋率≥70%；木本（苗木）種植後1年內活存率≥70%。施工期臨時防護：開發面積≥1公頃必設臨時沉砂池（有效容量≥裸露面積×100m³/ha）；截水溝應設於開發區上坡側攔截外水；排水溝沿施工區配置引導逕流至沉砂池。法律責任：違反規定者，主管機關得限期改善；逾期未改善，可依水保法裁罰並代為執行，費用由義務人負擔。",
d:`<h4>完工後植生覆蓋率要求（技術規範§61）</h4><table><tr><th>植生類型</th><th>查驗時機</th><th>合格標準</th></tr><tr><td>草本植生</td><td>竣工後<b>6個月</b>內</td><td>覆蓋率 ≥ <b>70%</b></td></tr><tr><td>木本（苗木）植生</td><td>種植後<b>1年</b>內</td><td>活存率 ≥ <b>70%</b></td></tr></table><h4>施工期間臨時防護設置標準</h4><table><tr><th>設施</th><th>設置標準</th></tr><tr><td><b>臨時沉砂池</b></td><td>開發面積 ≥ 1公頃必設；有效容量 ≥ 裸露面積(ha) × 100 m³/ha；淤積至1/2有效容量時清淤</td></tr><tr><td><b>臨時截水溝</b></td><td>設於開發區上坡側邊界3~5m，攔截來自上坡的清水，防止清水流過裸露坡面加速沖蝕</td></tr><tr><td><b>臨時排水溝</b></td><td>沿開發區配置，匯集坡面逕流引導至沉砂池，確保任何施工階段都有排水出口</td></tr></table><h4>未依規定設置的法律責任</h4><ul><li>主管機關發現違規→<b>限期改善</b>（通常1~3個月）</li><li>逾期未改善→<b>裁罰</b>（依水保法罰則）</li><li>必要時<b>代為執行</b>（主管機關委託廠商代為設置）→費用由義務人負擔</li><li>因設施不足造成災害（如泥砂流入農地、道路）→義務人需負損害賠償責任</li></ul>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB32",pts:20,
q:"請說明護岸工程中「坡腳保護（Toe protection）」的重要性，並說明常見的坡腳保護方式及其設計原則。",
s:"重要性：護岸失敗常起因於坡腳被洪水掏空（Undermining），坡腳失去支撐後護岸整體失穩崩倒，即使護岸面材料完整也會失效。設計原則：坡腳基礎埋深需超過最大沖刷深度（以HEC-18或工程經驗估算）。常見方式：①拋石（Rip-rap）——大粒徑石料拋置坡腳，柔性適應沖刷；②沉箱（Sheet pile）——鋼板或預鑄格板深入河床，阻擋水流沖刷至坡腳以下；③護坦延伸——護岸底部水平延伸石材或混凝土護坦，增大防沖面積；④深基礎——護岸基礎嵌入穩定地層。",
d:`<h4>坡腳保護的重要性</h4>護岸工程失敗的<b>最常見機制是坡腳掏空（Undermining）</b>而非護岸面材料破壞：<ul><li>洪水流速最高點通常在水面以下、接近河床的位置</li><li>高流速在護岸坡腳附近產生強烈渦流，持續沖蝕坡腳下方河床</li><li>坡腳下方被掏空→護岸整體失去底部支撐→護岸整體向下傾滑崩塌</li><li>即使護岸面（乾砌石、混凝土）材料完好，仍因坡腳掏空而全面失效</li></ul><h4>坡腳保護方式與設計原則</h4><table><tr><th>方式</th><th>原理</th><th>適用情況</th></tr><tr><td><b>拋石護腳（Rip-rap toe）</b></td><td>在坡腳外側拋置大粒徑礫石（直徑>D84），形成柔性防沖緩衝帶</td><td>最常用；可適應地基沉陷；施工簡單</td></tr><tr><td><b>板樁（Sheet pile）</b></td><td>將鋼板或預鑄格板垂直打入河床一定深度，阻擋水流沖刷到坡腳以下</td><td>深層沖刷風險高的場合；橋梁基礎旁</td></tr><tr><td><b>護坦水平延伸</b></td><td>護岸底部向河床側水平延伸石材或混凝土，增大防沖接觸面積</td><td>固床工下游、落差消能區</td></tr><tr><td><b>深基礎嵌岩</b></td><td>護岸基礎直接嵌入穩定岩盤或密實礫石層，超越最大沖刷深度</td><td>沖刷深度較大的溪流；重要護岸</td></tr></table><h4>設計關鍵：最大沖刷深度估算</h4><div class="fm">局部沖刷深度（橋柱）：y_s = 2.0·K1·K2·(a/y1)^0.65·Fr1^0.43·y1（HEC-18公式）</div><div class="note">坡腳基礎埋深 ≥ 最大沖刷深度 + 安全餘裕（通常加0.5~1.0m），是護岸設計的基本要求，考試常以「某護岸失效，說明原因及改善方式」的申論題出現。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB33",pts:20,
q:"請說明台灣常見的山坡地擋土設施類型（重力式、懸臂式、錨定式）的力學特性差異，並說明各類型適用的牆高範圍與地質條件。",
s:"重力式：依靠自身龐大體重（混凝土或石材）抵抗土壓力，不需鋼筋，斷面大、材料多，適合低矮牆（<5m），地基承載力需夠強。懸臂式：RC結構，牆身薄、靠底版上方回填土自重增加抵抗力矩，鋼筋受拉，適合中等牆高（3~8m），地基條件中等即可。錨定式（地錨式）：在牆後設預力地錨穿越潛在滑動面，傳力至穩定地層，適合牆高大（>5m）或空間受限（底版無法加大），需要岩盤或穩定地層供錨定。",
d:`<h4>三種擋土設施力學特性比較</h4><table><tr><th>類型</th><th>抵抗力來源</th><th>材料</th><th>適合牆高</th><th>適用地質</th></tr><tr><td><b>重力式</b></td><td>自身重量（W）產生的抗滑/抗傾力矩</td><td>素混凝土、石材（無鋼筋）</td><td>低矮（&lt;<b>5m</b>）</td><td>地基承載力須高（因體積龐大，基底壓力大）</td></tr><tr><td><b>懸臂式</b></td><td>底版上方回填土的自重（間接增加抵抗力矩）+ RC鋼筋抗拉</td><td>RC（鋼筋混凝土），斷面薄</td><td>中等（<b>3~8m</b>）</td><td>地基條件中等即可；底版加大可在承載力較低地層使用</td></tr><tr><td><b>錨定式（地錨式）</b></td><td>預力地錨穿越潛在破壞面，傳力至深層穩定地層</td><td>RC牆面板 + 鋼絞線地錨</td><td>大（<b>&gt;5m</b>）或空間受限時</td><td>需要岩盤或密實礫石層供錨定（錨固力需滿足設計拉力）</td></tr></table><h4>選型決策邏輯</h4><div class="fm">牆高&lt;3m → 砌石重力式（就地取材）→ 3~5m → 混凝土重力式或懸臂式 → 5~8m → 懸臂式 → &gt;8m或空間受限 → 錨定式</div><div class="note">實務補充：大型開發現場常遇到「底版無法加大」（鄰近道路邊緣或財產線）的情況，此時懸臂式底版不夠，必須升級為錨定式，將主動土壓力以地錨傳遞到深層地盤，不依賴底版面積。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB34",pts:20,
q:"請說明溢洪道（Spillway）的設計目的，並比較溢流型（Overflow）、側流型（Side channel）、虹吸型（Siphon）三種溢洪道在流量特性、施工複雜度與維護需求上的差異。",
s:"設計目的：水庫或農塘蓄水超過正常蓄水位時，提供安全排洪通路，防止水位持續上升超過堤頂造成漫壩破壞（潰壩）。溢流型：最簡單，水位超過堰頂即漫流，流量隨水位單調增加（Q∝H^1.5），施工簡單，維護容易，最常用。側流型：溢流口平行於壩軸線設置於一側，大流量時排洪效率高，適合大型水庫，施工複雜。虹吸型：利用虹吸效應，達啟動水位後洩流量急增，調控效果好但易被異物堵塞，維護要求高。",
d:`<h4>溢洪道設計目的</h4>農塘或水庫蓄水量超過設計容量時，蓄水位持續上升，若無安全排洪設施，水位超過堤頂即發生「漫頂（Overtopping）」→水流沖蝕堤頂及背水坡→快速破壞→潰壩（Breaching）。溢洪道提供一個「安全排洪通路」，在水位達到設計最高水位時自動大量排洪，保護堤體安全。<h4>三種溢洪道比較</h4><table><tr><th>類型</th><th>流量特性</th><th>施工複雜度</th><th>維護需求</th><th>最適用場合</th></tr><tr><td><b>溢流型（最常用）</b></td><td>Q∝H^1.5（堰流），水位超過堰頂即自動流出，流量平緩增加</td><td>低（標準矩形或梯形堰）</td><td>低（無活動構件）</td><td>一般農塘、小型水庫</td></tr><tr><td><b>側流型</b></td><td>流量大、洩洪效率高，口長可設計很長以容納大流量</td><td>高（需精確水力設計，避免溢流不均勻）</td><td>中等（需定期清理溢流口）</td><td>大型水庫的主要溢洪道</td></tr><tr><td><b>虹吸型</b></td><td>達啟動水位後流量急劇增大（虹吸效應突然建立），調控精準</td><td>高（管路與通氣孔設計精密）</td><td>高（落葉異物易堵塞→虹吸失效）</td><td>空間受限、需精確控制水位的特殊場合</td></tr></table><div class="note">農塘設計實務上幾乎全採溢流型（固定式溢流堰），因其可靠性高、維護簡單，符合農村管理能力；虹吸型較少見，多用在大型工業水庫或需要精密水位控制的場合。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB35",pts:25,
q:"【計算題】某野溪採用梯形斷面，底寬4m、護岸邊坡1:0.5（豎橫比）、Manning n護岸=0.030、n河床=0.020、設計流量Q=30cms、溪床坡度1.0%。(1)以複合粗糙係數（Horton法）計算等效Manning n；(2)計算正常水深yn；(3)判斷流態（Fr判別）。",
s:"(1)設水深y，P=4+2y√(1+0.25)=4+2.236y；P河床=4；P護岸=2×y√1.25=2.236y×2（各側）=共2.236y（每側1.118y）。Horton法：n等效=[(n河床^1.5×P河床+n護岸^1.5×P左+n護岸^1.5×P右)/P_total]^(2/3)。試算y=1.2m：P=4+2×1.2×1.118=4+2.683=6.683m；P河床=4，P護岸=2.683。n等效=[(0.020^1.5×4+0.030^1.5×2.683)/6.683]^(2/3)=[(0.002828×4+0.005196×2.683)/6.683]^(2/3)=[(0.01131+0.01394)/6.683]^(2/3)=[0.02525/6.683]^(2/3)=0.003778^(2/3)≈0.0238。A=（4+0.5×1.2）×1.2=（4+0.6）×1.2=5.52m²。Q=（1/0.0238）×5.52×(5.52/6.683)^(2/3)×√0.01=42.0×5.52×0.894^(2/3)×0.1=42.0×5.52×0.929×0.1=21.5（太小）。試算y=1.6：P=4+2×1.6×1.118=4+3.578=7.578；P河=4，P護=3.578。n等效=[(0.002828×4+0.005196×3.578)/7.578]^(2/3)=[(0.01131+0.01859)/7.578]^(2/3)=0.003944^(2/3)≈0.0244。A=(4+0.8)×1.6=7.68m²；R=7.68/7.578=1.013。Q=(1/0.0244)×7.68×1.013^(2/3)×0.1=41.0×7.68×1.009×0.1=31.7≈30cms。yn≈1.55m。Fr=v/√(gy)=（30/7.35）/√（9.81×1.55）=4.08/3.90=1.05>1超臨界流。",
d:`<h4>(1) 複合粗糙係數（Horton法）</h4><div class="fm">n_c = [（Σ nᵢ^1.5 × Pᵢ）/ P_total]^(2/3)</div>各分區濕周：河床P₀=4m；兩側護岸P₁=P₂=y×√(1+0.5²)=y×1.118（各側）<table><tr><th>試算y</th><th>P護岸（合）</th><th>P_total</th><th>n_c計算</th></tr><tr><td>y=1.2m</td><td>2×1.2×1.118=2.683m</td><td>6.683m</td><td>≈0.0238</td></tr><tr><td><b>y=1.55m</b></td><td>2×1.55×1.118=3.465m</td><td>7.465m</td><td>≈0.0242</td></tr></table><h4>(2) 正常水深yn（Manning公式試算）</h4>以y=1.55m，n_c≈0.0242：<br>A=(4+0.5×1.55)×1.55=(4+0.775)×1.55=4.775×1.55=7.401m²<br>P=4+2×1.55×1.118=7.465m；R=7.401/7.465=0.991m<div class="fm">Q=(1/0.0242)×7.401×0.991^(2/3)×√0.01=41.3×7.401×0.994×0.1≈<b>30.4 cms ≈30 cms ✓</b></div><div class="fm">正常水深 yn ≈ <b>1.55 m</b></div><h4>(3) 流態判斷</h4><div class="fm">v = Q/A = 30/7.401 ≈ 4.05 m/s</div><div class="fm">Fr = v/√(g×yn) = 4.05/√(9.81×1.55) = 4.05/3.900 ≈ <b>1.04</b></div>Fr=1.04>1 → <b>超臨界流（急流）</b>（接近臨界，設計時需特別注意）<div class="note">複合粗糙係數考題的解題鑰匙：先估算水深（試算）→算各分區濕周→Horton公式算n_c→代入Manning求Q→比對設計Q調整水深。本題護岸（n=0.030）比河床（n=0.020）粗糙，複合n_c介於兩者之間且偏向加權後的值。</div>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB36",pts:15,
q:"【法規記憶】請列表說明野溪整治工程中，攔砂壩、固床工、護岸、跌水工四種工法的設計目的、位置選擇與關鍵設計參數。",
s:"攔砂壩：目的攔截土砂，設於土砂供應區下游、溪床寬緩段；關鍵參數：設計流量（含土石流Qd）、溢洪口尺寸、蓄砂容量。固床工：穩定溪床防下切，設於溪床坡度過陡處；關鍵參數：壩頂高程（與溪床齊平）、下游消能護坦、落差。護岸：保護溪岸防崩岸，沿兩岸設置；關鍵參數：容許流速、基礎埋深（超過沖刷深度）、材料選擇。跌水工：消散坡面逕流動能，設於急坡面或坡道末端；關鍵參數：落差高度、消力池深度、護坦長度。",
d:`<h4>野溪整治四種主要工法比較表</h4><table><tr><th>工法</th><th>設計目的</th><th>位置選擇</th><th>關鍵設計參數</th></tr><tr><td><b>攔砂壩</b></td><td>攔截土砂，穩定上游溪床坡度，防止土砂輸出危害下游</td><td>土砂供應區下游；溪床寬緩可蓄砂處；溪道束窄點（兩岸岩盤穩固）</td><td>設計流量（土石流Qd=Qw/(1-Cd)）；溢洪口尺寸；蓄砂容量（多少年蓄滿）；基礎岩盤深度</td></tr><tr><td><b>固床工</b></td><td>抬高並穩定溪床基準面，防止溪床持續下切（Headcut erosion）</td><td>坡度過陡需降坡段；護岸基礎需保護處；上下游過渡段</td><td>壩頂高程（與原穩定溪床齊平）；落差（單級建議&lt;1m以兼顧魚道）；下游護坦長度與消力池</td></tr><tr><td><b>護岸</b></td><td>保護溪岸（兩岸坡腳）免受洪水沖蝕崩岸，防止側向侵蝕</td><td>沿兩岸全段或局部重點段（蜿蜒外彎沖刷側）</td><td>設計流速（需低於容許不沖蝕流速）；基礎埋深（超過最大沖刷深度）；材料選擇（依流速選乾砌石/石籠/混凝土）</td></tr><tr><td><b>跌水工（Drop structure）</b></td><td>消散農路或坡面排水溝中急坡段的水流動能，防止沖蝕排水系統末端</td><td>農路排水溝坡度突然加大處；排水溝出口（進入自然溝渠前）；坡面逕流集中的急坡段</td><td>落差高度；護坦長度（=5~7倍水躍後水深）；消力池深度；進出口順接尺寸</td></tr></table>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB37",pts:20,
q:"請說明「生態工法（Ecological engineering）」在野溪治理中的核心理念，並說明生態工法與傳統工法在設計哲學、材料選擇與驗收標準上的根本差異。",
s:"生態工法核心理念：以最小工程干預達成保全目標，充分運用自然材料與生物機制，同時維持或改善生態功能（棲地、廊道、物種多樣性）。設計哲學差異：傳統工法——以工程抵抗自然力（高強度、高剛性、大斷面）；生態工法——與自然力協作（柔性順應地形、引導而非抵擋）。材料選擇：傳統——混凝土、鋼筋（高強度但不透水不親生物）；生態——石材、木材、活植物（強度相對低但透水有機）。驗收標準：傳統——結構強度、尺寸符合設計圖；生態工法——另加生物指標（物種數、棲地品質評估）。",
d:`<h4>生態工法核心理念</h4><ul><li><b>最小干預原則：</b>僅在必要處設置工程，保留溪流自然動態的空間（不過度渠化）</li><li><b>自然材料優先：</b>就地取材（天然石材、木材），導入活植物（生物工程），減少人工合成材料</li><li><b>功能整合：</b>工程設施同時滿足水力安全（防洪護岸）與生態功能（棲地、廊道），而非各自分開設計</li></ul><h4>生態工法 vs 傳統工法根本差異</h4><table><tr><th>比較項目</th><th>傳統工法</th><th>生態工法</th></tr><tr><td><b>設計哲學</b></td><td>「抵抗」自然力：以高強度剛性結構對抗水流衝擊，強調安全係數和結構強度</td><td>「協作」自然力：引導水流、順應地形動態，以最小干預達成保全目標</td></tr><tr><td><b>材料選擇</b></td><td>混凝土、鋼筋、鋼板（高強度、不透水、無生態功能）</td><td>天然石材（可透水、提供棲地）、木材、活植物（強度隨時間增加）</td></tr><tr><td><b>斷面設計</b></td><td>規則幾何斷面（矩形、梯形），均一化，消除自然變異</td><td>不規則自然斷面，保留深潭-淺瀨、蜿蜒等自然地形特徵</td></tr><tr><td><b>驗收標準</b></td><td>結構強度達設計值、尺寸符合圖說</td><td>結構安全外，另需評估生物指標（底棲生物物種豐富度、魚類通過性、植生覆蓋率）</td></tr><tr><td><b>長期效能</b></td><td>隨時間老化、需定期維護更換</td><td>植物根系持續加固，生態功能隨時間提升（若設計施工正確）</td></tr></table>`},

{yr:"自出",sub:"水土保持工程",type:"self",n:"sB38",pts:15,
q:"【法規記憶】請說明水土保持技術規範對「臨時截水溝」與「臨時排水溝」的設計規定（坡度、斷面、材質），以及在颱風或豪雨前應進行的緊急防護措施。",
s:"臨時截水溝：設於開挖邊界上坡側3~5m，坡度0.2~3%（平緩使流速可控），斷面V形或梯形，容量需能承受設計暴雨（5~10年重現期）流量，材質土渠即可（施工期臨時）。臨時排水溝：沿施工區坡面縱向設置，坡度配合地形，容量同前，出口接沉砂池。颱風豪雨前緊急防護：①加強PE布固定（竹樁、沙包壓邊）；②清空沉砂池增加容量；③檢查截排水系統是否有堵塞；④坡面裂縫填補；⑤低窪積水點預先疏通排水。",
d:`<h4>臨時截水溝設計規定</h4><table><tr><th>設計項目</th><th>規定/建議值</th></tr><tr><td>設置位置</td><td>開挖邊界<b>上坡側3~5m</b>（確保外水不流入施工區）</td></tr><tr><td>縱坡度</td><td><b>0.2~3%</b>（過緩積水，過陡流速過高沖蝕溝底）</td></tr><tr><td>斷面型式</td><td>V形或梯形（土渠即可，臨時性）</td></tr><tr><td>設計容量</td><td>5~10年重現期設計暴雨產生的集水區逕流量</td></tr><tr><td>材質</td><td>土渠（臨時）；坡度較陡段可鋪設防滲帆布或漿砌石</td></tr></table><h4>臨時排水溝設計規定</h4><table><tr><th>設計項目</th><th>規定/建議值</th></tr><tr><td>設置位置</td><td>施工區坡面縱向，隨施工進度延伸；確保任何施工階段都有排水出口</td></tr><tr><td>坡度</td><td>配合現地坡度，坡度>5%需設跌水或消能設施防沖</td></tr><tr><td>出口</td><td>接入臨時沉砂池，不可直接排入自然溪溝（避免帶砂污染）</td></tr></table><h4>颱風豪雨前緊急防護程序</h4><ol style="padding-left:16px"><li><b>PE布加固：</b>檢查並補強裸露坡面覆蓋的PE布，以竹樁（間距1~2m）或沙包壓實邊緣，防止掀起</li><li><b>清淤沉砂池：</b>提前清空沉砂池（增加有效容量），使颱風期間能容納更多泥砂</li><li><b>疏通截排水系統：</b>清除枯枝落葉堵塞，確保逕流可正常排出</li><li><b>坡面裂縫填補：</b>以黏土或水泥漿填補坡面裂縫，防止逕流集中灌入造成管湧</li><li><b>低窪預排：</b>提前排除施工區內低窪積水，避免積水加重邊坡不穩定</li></ol>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC30",pts:20,
q:"請說明坡地開發工程中「土方平衡計劃（Cut-fill balance）」的設計原則，並說明土方不平衡（廢土過多或不足）的處理方式及其水土保持考量。",
s:"土方平衡原則：開挖量（Cut）盡量等於填方量（Fill），避免廢土需外運（減少二次運輸風險）或需從外地借土（增加成本與環境衝擊）。設計方法：依等高線計算各區域開挖量與填方量，調整建築配置與台階高程以接近平衡。廢土過多的處理：設置合法棄土場（需另申請水保計畫）；廢土做為鄰近低窪地填方（需確認填土材質適合）；不得直接堆置於溪旁或坡腳（增加土石流物源）。廢土不足的處理：從合法土方供應場取得；借用基地內非污染物料。",
d:`<h4>土方平衡計畫設計原則</h4><div class="fm">土方平衡目標：Cut量（開挖）≈ Fill量（填方），最小化廢土外運或借土需求</div><ul><li><b>設計層面：</b>依等高線計算各區域開挖量（面積×平均切土深度）與填方量（面積×平均填土高度），透過調整建築配置（建築物位置、道路線形）、台階高程設計，使Cut≈Fill</li><li><b>材料分類：</b>區分表土（保留，施工後回覆）、可回填土（優質填方材料）、廢棄土（不適合填方的軟弱、有機質或污染土）</li><li><b>土方調配計畫：</b>繪製土方調配圖（Mass haul diagram），標示各區域供需方向，最小化運輸距離</li></ul><h4>廢土過多的處理方式與水保考量</h4><table><tr><th>處理方式</th><th>水保考量</th></tr><tr><td>設置合法棄土場</td><td>棄土場需另行申請水土保持計畫；棄土場本身需有截排水設施與植生覆蓋計畫</td></tr><tr><td>廢土回填鄰近低窪地</td><td>需確認填土材質（避免有機質或污染土填入）；填土區需有沉陷監測計畫</td></tr><tr><td>廢土作為道路路基</td><td>路基填土需符合壓實度要求，避免填入可壓縮性高的有機質土</td></tr><tr><td>❌ 禁止隨意棄置</td><td>嚴禁將廢土傾倒至溪旁、溝谷或坡腳（會成為土石流物源，造成重大水保危害）</td></tr></table><h4>廢土不足（需借土）的處理</h4><ul><li>從合法土方供應場（Borrow site）取得，需確認供應場有合法水保處理</li><li>借土前需確認填方材料品質（顆粒組成、壓實特性）符合工程要求</li></ul>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC31",pts:20,
q:"請說明水土保持計畫中「坡地崩塌風險評估」的方法，並說明「定性評估」與「定量評估（FS值計算）」各自的適用時機與優缺點。",
s:"定性評估（工址踏勘+地質圖判讀）：適用初步評估、資料缺乏地區、快速篩選高風險地點。優點：快速低成本；缺點：主觀性高、無法給出量化安全係數。定量評估（邊坡穩定分析，計算FS）：適用正式水保計畫、高風險地點確認、設計加固措施時。方法：無限邊坡法（淺層崩塌）、Bishop圓弧滑動法（深層圓弧）、Janbu法（複合滑動面）、Sarma法（楔形破壞）。優點：可給出FS值（靜態≥1.5）；缺點：結果依賴強度參數的準確性，取樣代表性是最大不確定來源。",
d:`<h4>崩塌風險評估方法架構</h4><table><tr><th>方法</th><th>定性評估</th><th>定量評估（FS計算）</th></tr><tr><td><b>適用時機</b></td><td>初步規劃階段；資料缺乏地區；大範圍快速篩選</td><td>正式水保計畫書；高風險地點確認；加固設施設計前</td></tr><tr><td><b>主要工具</b></td><td>地質圖判讀、現地踏勘、航照判釋、歷史崩塌記錄比對</td><td>邊坡穩定分析軟體（SLOPE/W等），代入室內試驗強度參數（c'、φ'）</td></tr><tr><td><b>優點</b></td><td>快速（1~3天）、低成本、可大範圍評估</td><td>可量化安全係數FS，設計有明確依據</td></tr><tr><td><b>缺點</b></td><td>高度主觀、無法給出FS值、難以做設計依據</td><td>耗時（2~4週）、成本高、結果高度依賴取樣與試驗品質</td></tr></table><h4>常用定量分析方法比較</h4><table><tr><th>方法</th><th>適用破壞型態</th><th>適用條件</th></tr><tr><td>無限邊坡法（Infinite slope）</td><td>淺層平面滑動（深度&lt;&lt;坡長）</td><td>土層均一、坡面無限延伸的簡化假設</td></tr><tr><td>Bishop圓弧滑動法</td><td>深層圓弧滑動（最常用）</td><td>滑動面近似圓弧；適用多數自然邊坡</td></tr><tr><td>Janbu法</td><td>非圓弧滑動面</td><td>有硬盤岩盤控制滑動面位置時</td></tr><tr><td>Sarma法</td><td>楔形破壞（岩坡）</td><td>主要用於岩石邊坡、節理控制破壞</td></tr></table><div class="note">水保實務中最常用Bishop圓弧滑動法，因為多數土質邊坡崩塌的滑動面近似圓弧（尤其是深度/坡長比>0.1的中深層崩塌），且Bishop法計算精度高而計算量適中，適合一般水保計畫的分析需求。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC32",pts:25,
q:"【計算題+觀念】某坡地社區：Rm=7860、Km=0.021、坡長100m、坡度10%（≥9%，大坡度公式）、總面積3ha。開發前C=0.06、P=0.6；開發後（建蔽率40%不透水面積，其餘植生）C=0.20、P=0.5。流失土壤容積重1.4t/m³。(1)計算開發前後年土壤流失量（ton/ha/yr）；(2)設計永久沉砂池容量（以竣工後狀態設計，設計年限5年，每年清淤一次，SDR=0.30，FS=1.5）；(3)若開發度（不透水率）增加到60%使C=0.25，說明此時沉砂池容量如何變化及理由。",
s:"(1)L=(100/22.13)^0.5=2.128；S（10%≥9%）=16.8×0.10-0.50=1.18；LS=2.511。基準值=7860×0.021×2.511=414.6ton/ha/yr。開發前：414.6×0.06×0.6=14.9ton/ha/yr；開發後：414.6×0.20×0.5=41.5ton/ha/yr。(2)竣工後年輸砂=41.5×3×0.30=37.4ton/yr；容積=37.4/1.4×1.5=40.1m³。(3)C增至0.25：A=414.6×0.25×0.5=51.8ton/ha/yr；年輸砂=51.8×3×0.30=46.6ton/yr；容積=46.6/1.4×1.5=49.9m³（增加約25%）。理由：不透水率增加→C值提高→侵蝕量提高→年輸砂量提高→沉砂池需求容量增大。",
d:`<h4>(1) 開發前後年土壤流失量</h4><div class="fm">L = (100/22.13)^0.5 = 4.517^0.5 = 2.125</div><div class="fm">S = 16.8×0.10-0.50 = 1.18（坡度10%≥9%，大坡度公式）</div><div class="fm">LS = 2.125×1.18 = 2.508</div><div class="fm">基準值（R×K×LS）= 7860×0.021×2.508 = 413.7 ton/ha/yr</div><table><tr><th>時期</th><th>C</th><th>P</th><th>A（ton/ha/yr）</th></tr><tr><td>開發前</td><td>0.06</td><td>0.60</td><td>413.7×0.06×0.60=<b>14.9</b></td></tr><tr><td>開發後</td><td>0.20</td><td>0.50</td><td>413.7×0.20×0.50=<b>41.4</b></td></tr></table><h4>(2) 永久沉砂池容量（竣工後狀態，每年清淤）</h4><div class="fm">竣工後年土壤流失量 = 41.4×3ha = 124.2 ton/yr</div><div class="fm">年輸砂量（×SDR=0.30） = 124.2×0.30 = 37.3 ton/yr</div><div class="fm">所需淨容積 = 37.3÷1.4 = 26.6 m³</div><div class="fm">加FS=1.5：沉砂池有效容量 = 26.6×1.5 ≈ <b>39.9 m³ ≈ 40 m³</b></div><h4>(3) 不透水率增加至60%（C=0.25）的影響</h4><div class="fm">A = 413.7×0.25×0.50 = 51.7 ton/ha/yr（↑25%）</div><div class="fm">年輸砂 = 51.7×3×0.30 = 46.5 ton/yr</div><div class="fm">沉砂池容量 = 46.5÷1.4×1.5 = <b>49.8 m³（增加約25%）</b></div><b>理由：</b>不透水率增加→植生覆蓋率降低→C值升高→相同降雨條件下土壤流失量增加→年輸砂量增加→沉砂池需求容量同比例增大（C值從0.20到0.25增加25%，容量需求也增加約25%）。<div class="note">此題是108年考古題（坡地社區規劃）的擴充版，整合USLE計算→SDR→沉砂池→不透水率影響分析，是規劃設計科最有代表性的綜合計算申論題型。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC33",pts:15,
q:"【法規記憶】請說明《水土保持法》第23條對於「在山坡地從事農、林、漁、牧之開發利用，以及採取土石、開挖整地等行為」未依法辦理水保計畫的罰則，以及主管機關的強制停工、停止使用、廢止許可等行政處分機制。",
s:"罰則：依水保法§23，未依規定申請核定水保計畫而擅自開發者，處6萬至30萬元罰鍰，並限期改善；逾期未改善得按次連續處罰。停工/強制執行：主管機關得命令停工（針對施工中案件）；停止使用（已完工但未取得使用許可）；廢止許可（已核定但違規施工）。代為執行：若義務人仍不配合，主管機關得委請廠商代為恢復植生或設置水保設施，費用由義務人全額負擔，可移送行政執行署強制執行。",
d:`<h4>水保法第23條罰則架構</h4><table><tr><th>違規情形</th><th>主要罰則</th></tr><tr><td>未申請核定水保計畫擅自開發</td><td>罰鍰6~30萬元，限期改善</td></tr><tr><td>逾期未改善</td><td>按次連續處罰（每次6~30萬元）</td></tr><tr><td>違規造成重大災害</td><td>移送司法追訴（刑事責任）</td></tr></table><h4>主管機關行政處分工具箱</h4><table><tr><th>處分類型</th><th>適用情形</th><th>法律效果</th></tr><tr><td><b>停工命令</b></td><td>施工中發現違規（未依核定計畫、未申請計畫即施工）</td><td>強制停止一切施工作業，違者加重處罰</td></tr><tr><td><b>停止使用</b></td><td>已完工但水保設施不完善或未完成竣工查驗</td><td>禁止開始使用建築物或設施</td></tr><tr><td><b>廢止許可</b></td><td>取得核定後違規施工（如擅自大幅變更）</td><td>撤銷原核定，義務人需重新申請</td></tr><tr><td><b>代為執行</b></td><td>限期改善後仍未配合的一切違規情形</td><td>主管機關委廠商代為施作，全額費用向義務人追償，可強制執行</td></tr></table><div class="note">「按次連續處罰」是台灣行政罰的重要機制，同一違規行為每隔一定期間（通常30~60天）仍未改善，可再次裁罰，理論上可無限次罰到義務人配合。這是促使義務人盡速完成改善最有效的法律工具。</div>`},

{yr:"自出",sub:"水土保持規劃設計",type:"self",n:"sC34",pts:20,
q:"請說明農路設計中「縱坡度」、「彎道超高」、「視距」三個幾何設計要素的定義與農路技術規範的相關規定，並說明這三個要素為何對農路水土保持影響重大。",
s:"縱坡度：農路沿行進方向的高程變化率（%），規範一般≤12%（最大18%），超過3.3%需考慮縱坡長度限制（L≤40/(G-3.3)⁴）。彎道超高：彎道處外側路面抬高以抵抗離心力，農路規範超高率≤8%（依彎道半徑和設計速度）。視距：駕駛人能看到前方障礙物的距離，農路設計停車視距依速度而定（10km/h約15m，30km/h約30m）。水保影響：縱坡過陡→路面沖蝕嚴重；彎道超高設計不良→路面橫向排水異常導致集中沖蝕；視距不足→緊急剎車造成路面拖痕，形成沖蝕起始點。",
d:`<h4>農路三個關鍵幾何設計要素</h4><table><tr><th>要素</th><th>定義</th><th>規範規定</th><th>水保影響</th></tr><tr><td><b>縱坡度（G）</b></td><td>沿行進方向每100m的高程差（%），反映道路陡緩程度</td><td>一般≤12%；最大不超過18%（特殊地形）；G>3.3%需配合縱坡長度限制公式</td><td>坡度越陡→路面逕流流速越快→沖蝕力越大→路面剝蝕、路基掏空；超過容許坡度需設路面硬化或頻密設置橫向排水溝</td></tr><tr><td><b>彎道超高</b></td><td>彎道外側路面抬高（橫坡方向），使路面橫坡朝彎道圓心方向傾斜，抵抗車輛離心力</td><td>超高率≤8%（依設計速度與彎道半徑查表）</td><td>彎道處路面橫向坡度改變→可能造成橫向排水集中在彎道內側或外側→局部逕流集中→沖蝕加劇；需在彎道適當位置設置橫向排水設施</td></tr><tr><td><b>視距</b></td><td>駕駛人在行進中能看清前方障礙物並完成停車的最短距離（停車視距）</td><td>停車視距：10km/h≥15m；20km/h≥20m；30km/h≥30m</td><td>視距不足→緊急剎車頻繁→輪胎在路面形成拖痕→拖痕區路面損壞→積水→沖蝕起始點；彎道設計需同時滿足視距與超高要求</td></tr></table><div class="note">農路設計的水保核心：農路本身是山坡地最重要的人工排水系統之一，路面、邊溝、橫向排水管（涵管）的配置是否正確，直接決定農路是否成為沖蝕的「加速器」還是「緩衝器」。縱坡過陡+橫向排水間距過大是農路沖蝕最常見的組合問題。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD30",pts:20,
q:"請說明「設計洪水」的推估方法，並比較「頻率分析法」（統計方法）與「合理化公式法」（水文模式法）在適用集水區規模、所需資料與推估可靠性上的差異。",
s:"頻率分析法：以長期流量觀測資料統計，推估不同重現期對應的洪峰流量（Log-Pearson III、Gumbel等）。適用：有長期流量記錄（>20年）的大中型集水區。可靠性高但需大量實測資料。合理化公式法：Q=CiA/360，依降雨IDF曲線推估設計雨強，再換算洪峰流量。適用：小型集水區（<5km²）、無流量記錄地區。計算簡便但簡化假設多（均勻降雨、固定C值）。兩法差異核心：頻率分析法「從流量資料推」；合理化公式法「從降雨推到流量」，後者在無流量記錄的新開發地區是唯一可行方法。",
d:`<h4>設計洪水推估兩大方法比較</h4><table><tr><th>比較項目</th><th>頻率分析法</th><th>合理化公式法</th></tr><tr><td><b>推估邏輯</b></td><td>從<b>流量資料</b>出發：蒐集長期年最大洪峰資料→統計頻率分布→推估T年重現期洪峰</td><td>從<b>降雨</b>出發：由IDF曲線取設計雨強→乘逕流係數C→換算洪峰（Q=CiA/360）</td></tr><tr><td><b>所需資料</b></td><td>長期流量觀測記錄（建議≥20~30年）</td><td>IDF曲線（當地降雨頻率分析）；集水區面積；逕流係數C；集流時間tc</td></tr><tr><td><b>適用集水區規模</b></td><td>大中型集水區（有水文站記錄）</td><td>小型集水區（&lt;5km²）；無流量記錄的新開發地區</td></tr><tr><td><b>推估可靠性</b></td><td>高（基於實測資料，保留了集水區真實水文特性）；但需足夠長期資料，短期資料外插高重現期不確定性大</td><td>中等（基於許多簡化假設：均勻降雨、固定C、線性轉換）；但在無流量記錄地區是唯一可行方法</td></tr><tr><td><b>台灣應用現況</b></td><td>主要大型水庫（有水文站）採用；縣市防洪計畫</td><td>最常用於開發案水保計畫（多數山坡地無流量觀測）</td></tr></table><div class="note">工程實務選擇邏輯：有長期流量觀測→優先用頻率分析（直接可靠）；無流量觀測或小集水區→用合理化公式或單位歷線法（從降雨推算）。台灣山坡地開發案的水保計畫幾乎100%使用合理化公式，因為絕大多數山坡地集水區沒有流量觀測站。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD31",pts:20,
q:"請說明「蒸發散（Evapotranspiration, ET）」的組成，並比較潛在蒸發散（PET）與實際蒸發散（AET）的定義差異，說明影響AET<PET的土壤水分閾值機制。",
s:"ET組成：土面蒸發（Evaporation）+植物蒸散（Transpiration）。PET：在充足水分供應條件下（不受水分限制），特定氣象條件下大氣能蒸發散的最大水量（僅由氣象決定：太陽輻射、溫度、濕度、風速）。AET：實際發生的蒸發散量，受土壤含水量影響：含水量>臨界值（約FC）→AET≈PET（水分供應充足）；含水量在FC~WP之間→AET線性降低（水分逐漸限制）；含水量<WP→AET≈0（植物永久凋萎）。",
d:`<h4>蒸發散的組成</h4><div class="fm">ET = E（土面蒸發）+ T（植物蒸散）</div><table><tr><th>組成</th><th>說明</th><th>影響因素</th></tr><tr><td><b>土面蒸發（E）</b></td><td>土壤水分從土面直接蒸發進入大氣</td><td>土面裸露程度、土壤含水量、輻射、風速</td></tr><tr><td><b>植物蒸散（T）</b></td><td>植物根系吸水→莖輸導→葉片氣孔→蒸散至大氣（約90%水分以此途徑消耗）</td><td>葉面積指數（LAI）、氣孔開閉、大氣VPD、土壤含水量</td></tr></table><h4>PET vs AET定義差異</h4><table><tr><th>項目</th><th>潛在蒸發散（PET）</th><th>實際蒸發散（AET）</th></tr><tr><td>定義</td><td>不受水分限制時的最大蒸發散量（僅由氣象條件決定）</td><td>實際發生的蒸發散量（同時受氣象與土壤水分限制）</td></tr><tr><td>限制因子</td><td>無水分限制，僅氣象因子（輻射、溫度、濕度、風速）</td><td>同時受氣象與土壤含水量限制</td></tr><tr><td>關係</td><td colspan="2">AET ≤ PET（永遠成立）</td></tr></table><h4>AET<PET的土壤水分閾值機制</h4><div class="fm">θ > θ_critical（≈FC）：AET ≈ PET（水分充足，不限制）</div><div class="fm">WP < θ < FC：AET = PET × (θ-WP)/(FC-WP)（線性降低）</div><div class="fm">θ < WP：AET ≈ 0（植物氣孔完全關閉，凋萎）</div><div class="note">水保應用：在計算集水區水平衡（P=ET+Q+ΔS）時，若土壤含水量低（如乾季），AET遠小於PET，不可用PET代替AET估算蒸發散損失。台灣冬季乾旱期的北部農塘，月蒸發散損失可能只有PET的30~50%，這個差異在農塘容量設計的月水平衡計算中非常重要。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD32",pts:25,
q:"【計算題】某集水區面積80km²，年降雨2400mm，年平均蒸散係數（ET/P）=0.42，無明顯年蓄水量變化。另有兩個雨量站：A站年均1950mm（代表面積55km²）、B站年均3000mm（代表面積25km²）。(1)以Thiessen法計算集水區面平均年雨量；(2)以水平衡估算年逕流量（mm）及年逕流總量（m³/yr）；(3)若集水區有效集水面積因都市化（不透水率40%）增加，ET/P降至0.30，估算都市化後年逕流量增加的百分比。",
s:"(1)Thiessen：P=(1950×55+3000×25)/80=(107250+75000)/80=182250/80=2278mm。(2)ET=P×0.42=2278×0.42=957mm；Q=P-ET=2278-957=1321mm；年逕流總量=1321/1000×80×10⁶=105,680,000m³≈1.057×10⁸m³。(3)都市化後ET/P=0.30，P不變（2278mm）；ET=2278×0.30=683mm；Q都市=2278-683=1595mm；增加%=(1595-1321)/1321×100%=20.7%。",
d:`<h4>(1) Thiessen面平均年雨量</h4>A站：PA=1950mm，AA=55km²；B站：PB=3000mm，AB=25km²；總面積=80km²<div class="fm">P̄ = (PA×AA + PB×AB) / A_total = (1950×55 + 3000×25) / 80</div><div class="fm">= (107,250 + 75,000) / 80 = 182,250 / 80 = <b>2278 mm</b></div><h4>(2) 水平衡估算年逕流量</h4>已知：ET/P=0.42，ΔS≈0（年蓄水量無明顯變化）<div class="fm">ET = P × 0.42 = 2278 × 0.42 = 957 mm</div><div class="fm">Q = P - ET = 2278 - 957 = <b>1321 mm</b></div><div class="fm">年逕流總量 = 1321mm × 80km² = 1.321m × 80×10⁶m² = <b>1.057×10⁸ m³/yr ≈ 106 Mm³/yr</b></div><h4>(3) 都市化後年逕流量增加百分比</h4>都市化後ET/P降至0.30（植生減少→蒸散減少）：<div class="fm">ET都市 = 2278 × 0.30 = 683 mm</div><div class="fm">Q都市 = 2278 - 683 = 1595 mm</div><div class="fm">增加百分比 = (1595-1321)/1321 × 100% ≈ <b>20.7%</b></div><div class="note">此題整合三個核心計算：Thiessen法→水平衡→都市化影響分析。都市化使ET/P從0.42降至0.30（植被減少使蒸散大幅減少），導致年逕流量增加約21%，即使降雨量完全不變。這正說明了都市化通過改變ET（而非改變P）來影響水文循環的機制，是水文學科最重要的土地利用-水文關係概念。</div>`},

{yr:"自出",sub:"坡地水文學",type:"self",n:"sD33",pts:15,
q:"【法規記憶+觀念】請說明IDF曲線（降雨強度-延時-頻率曲線）的建立方法，並說明台灣各地IDF曲線差異的主要原因，以及設計時為何強調「使用當地IDF曲線」而非套用全國統一曲線。",
s:"建立方法：收集長期雨量站逐分鐘或小時資料→萃取不同延時的年最大降雨量→各延時分別進行頻率分析（Log-Pearson III）→得到各延時不同重現期的設計雨強→繪製IDF曲線族。台灣各地差異原因：地形（山區vs平原）、氣候類型（颱風影響程度）、地理位置（北vs南vs東）、海拔。套用本地IDF的原因：台灣南北、山地平原的降雨特性差異極大（台東年雨量可達北部3倍），全國統一曲線會對某些地區嚴重高估或低估設計雨強，造成設施過大（浪費）或不足（安全疑慮）。",
d:`<h4>IDF曲線建立方法（步驟）</h4><ol style="padding-left:16px"><li>收集目標雨量站的長期（建議≥20年）逐分鐘或小時降雨記錄</li><li>萃取各延時（如5min、10min、30min、1hr、2hr、6hr、24hr）的<b>年最大降雨量資料</b>（AMS）</li><li>各延時資料分別進行<b>頻率分析</b>（Log-Pearson III或Gumbel分布），推估各重現期（T=2、5、10、25、50、100年）的設計雨量</li><li>換算為雨強（mm/hr）後，以延時為橫軸、雨強為縱軸，繪製各重現期的曲線→形成<b>IDF曲線族</b></li><li>配合數學公式擬合（如i=aT^b/(t+c)^d），建立IDF公式以便計算</li></ol><h4>台灣各地IDF曲線差異的主要原因</h4><table><tr><th>差異因素</th><th>說明</th></tr><tr><td>地形抬升效應</td><td>山地迎風坡降雨量遠大於平地（可達2~3倍），短時間高強度降雨更頻繁</td></tr><tr><td>颱風影響程度</td><td>東部（台東、花蓮）直接面對太平洋颱風，高強度短延時降雨發生頻率更高</td></tr><tr><td>南北氣候差異</td><td>北部冬季有鋒面雨（梅雨季長）；南部旱濕季分明（夏季颱風+對流雨集中）</td></tr><tr><td>海拔</td><td>高山站與平地站因氣溫、對流機制不同，降雨強度分布特性差異顯著</td></tr></table><h4>強調使用當地IDF的理由</h4>台灣面積雖小，但降雨特性的地區差異遠大於許多大面積國家：<ul><li>台東年降雨量可達3000~5000mm；新竹某些地區僅1000mm</li><li>100年重現期1小時雨強：台北約120mm/hr、台中約80mm/hr，差異達50%</li><li>使用全國統一IDF曲線，可能在乾旱地區<b>嚴重高估</b>設計雨強（設施過大浪費），或在高降雨地區<b>嚴重低估</b>（安全疑慮）</li></ul>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE28",pts:20,
q:"請說明植生工程在坡地開發後的「生態復育序列」——從裸地到穩定植群——的各演替階段特徵，並說明工程如何在各階段介入加速演替。",
s:"裸地→草本先鋒期（0~2年）→灌木期（2~5年）→先鋒喬木期（5~15年）→次生森林（15~30年）→穩定森林（30年以上）。工程介入：草本先鋒期——客土噴植（快速覆蓋防蝕）；灌木期——補植鄉土灌木（加速結構分層化）；先鋒喬木期——移除過度優勢外來種，補植目的喬木種；次生森林期——最小干預，讓自然演替接手；穩定森林期——不干預，生態功能最大化。",
d:`<h4>坡地裸地到穩定植群的生態復育序列</h4><table><tr><th>演替階段</th><th>時間尺度</th><th>植群特徵</th><th>生態狀態</th></tr><tr><td><b>裸地</b></td><td>0</td><td>幾乎無植被</td><td>侵蝕風險最高；地表溫度波動大</td></tr><tr><td><b>草本先鋒期</b></td><td>0~2年</td><td>先鋒草本（百喜草等）快速覆蓋；物種少，結構單一</td><td>侵蝕開始受控；土壤開始改善（有機質輸入）</td></tr><tr><td><b>灌木期</b></td><td>2~5年</td><td>灌木逐漸建立；多年生草本與木本混生；物種開始增加</td><td>土壤持續改善；棲地增加；微氣候改善（遮蔭出現）</td></tr><tr><td><b>先鋒喬木期</b></td><td>5~15年</td><td>陽性先鋒喬木（山黃麻、相思樹）形成高林冠；多層次植群結構</td><td>有機質大量積累；土壤肥力恢復；棲地多樣性高</td></tr><tr><td><b>次生森林</b></td><td>15~30年</td><td>耐陰樹種（榕屬、楠木類）逐漸進入；先鋒樹種因林蔭壓迫逐漸死亡</td><td>自然演替動力強；人工干預效益降低</td></tr><tr><td><b>穩定森林</b></td><td>30年以上</td><td>接近原始植群組成；高多樣性、多層次、複雜結構</td><td>生態功能最大化；碳匯最高；最穩定</td></tr></table><h4>工程在各演替階段的介入策略</h4><table><tr><th>階段</th><th>工程介入方式</th><th>目的</th></tr><tr><td>裸地→草本先鋒</td><td>客土噴植（5~10cm厚度），包含草種+肥料+保水材料</td><td>快速建立植被覆蓋，防止侵蝕（最緊迫）</td></tr><tr><td>草本→灌木</td><td>補植鄉土灌木苗木，施基肥</td><td>加速植群結構分層，縮短演替時間</td></tr><tr><td>灌木→先鋒喬木</td><td>移除過度擴張的外來種（如銀合歡），補植目的喬木（台灣相思、山黃麻）</td><td>引導物種組成朝目標植群方向發展</td></tr><tr><td>先鋒喬木→次生森林</td><td>最小干預；必要時局部補植耐陰樹種</td><td>讓自然演替動力接手，人工成本降低</td></tr><tr><td>穩定森林</td><td>不干預</td><td>生態功能自我維持</td></tr></table>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE29",pts:20,
q:"請說明「表土保護與回覆（Topsoil conservation and replacement）」在坡地開發水土保持中的重要性，並說明表土保護的操作程序與表土品質評估指標。",
s:"重要性：表土含有大量有機質、種子庫、微生物相，是植生成功建立的關鍵基礎，一旦與底土混合或棄置，需數十年才能恢復。操作程序：開發前先刮除表土（通常0~30cm）→分區堆置（不超過2m高，避免壓實）→施工期間維持植生覆蓋（防止表土自身流失）→完工後第一優先回覆於植生區。品質評估指標：有機質含量（>1%為合格）、pH值（6~7.5農業適用）、容積密度（<1.3g/cm³）、種子庫活力（萌芽試驗）、病原菌有無（避免帶入病害）。",
d:`<h4>表土保護的重要性</h4>表土（Topsoil，通常指0~30cm的A層土壤）具有以下難以替代的特性：<ul><li><b>有機質豐富：</b>有機質含量通常1~5%，遠高於底土（&lt;0.5%），是植物生長的養分基礎</li><li><b>種子庫（Seed bank）：</b>含有大量原有植物種子（可自然萌發），是最廉價的「本地種復育材料」</li><li><b>微生物相：</b>含有豐富的土壤微生物（菌根菌、固氮菌等），是養分循環的核心，無法人工快速建立</li><li><b>良好結構：</b>累積多年形成的團粒結構，一旦破壞需數十年恢復</li></ul><h4>表土保護操作程序</h4><ol style="padding-left:16px"><li><b>開發前先刮除表土：</b>在施工機具進入之前，以小型挖機或人工刮除表層0~30cm（依實際腐植質深度調整）</li><li><b>分區臨時堆置：</b>在施工區邊緣適當位置堆置，高度≤2m（避免底層壓實導致無氧環境破壞微生物）；設圍籬防止機具碾壓</li><li><b>堆置期植生覆蓋：</b>在表土堆頂部撒播先鋒草種或覆蓋稻草，防止表土堆本身因降雨沖蝕流失</li><li><b>完工後優先回覆：</b>植生區域整地後，表土回覆厚度≥20cm，優先於永久植生施作</li></ol><h4>表土品質評估指標</h4><table><tr><th>指標</th><th>合格標準</th><th>不合格的處理</th></tr><tr><td>有機質含量</td><td>&gt;1%（農業用地）、&gt;0.5%（恢復植生最低標準）</td><td>補充堆肥或腐植土</td></tr><tr><td>pH值</td><td>6.0~7.5（農業適用範圍）</td><td>酸性→施石灰；鹼性→施硫磺</td></tr><tr><td>容積密度</td><td>&lt;1.3 g/cm³（結構良好）</td><td>深翻鬆土，施有機質改善</td></tr><tr><td>種子庫活力</td><td>萌芽試驗（黑暗浸水培養）有大量萌發</td><td>若保存超過2年活力降低，需補充種子</td></tr></table>`},

{yr:"自出",sub:"植生工程",type:"self",n:"sE30",pts:15,
q:"【法規記憶+計算】某坡面噴植工程，坡面面積500m²，施工後8個月檢核。以5×5m方格法調查（共20個方格），結果如下：有植生覆蓋的方格數15個；目的種（台灣相思）出現方格數8個；目的種平均覆蓋率（在有植生的方格內）45%。請判斷：(1)全坡面草本覆蓋率是否符合技術規範要求；(2)目的種建立是否達標（假設目的種覆蓋率要求30%作為目標）；(3)若未達標，6個月補植期內應補植的優先對象為何？",
s:"(1)草本覆蓋率=有植生方格數/總方格數×100%=15/20×100%=75%≥70%（符合技術規範§61要求）。(2)目的種全坡面覆蓋率=目的種出現方格數/總方格數×該方格內平均覆蓋率=8/20×45%=18%<30%（目的種未達設計目標）。(3)補植優先對象：在15個有植生但目的種未出現（即15-8=7個方格）的方格內補植台灣相思苗木（容器苗，存活率高）；其次在目的種覆蓋率低的方格內加密補植。",
d:`<h4>(1) 全坡面草本覆蓋率判斷</h4><div class="fm">草本覆蓋率 = 有植生覆蓋的方格數 / 總方格數 × 100%</div><div class="fm">= 15/20 × 100% = <b>75%</b></div>技術規範§61要求：草本植生竣工後<b>6個月</b>內覆蓋率≥70%；本案8個月，75%≥70%，<b>✓ 符合規範要求</b><h4>(2) 目的種建立達標判斷</h4><div class="fm">目的種全坡面覆蓋率 = (目的種出現方格數/總方格數) × 方格內平均目的種覆蓋率</div><div class="fm">= (8/20) × 45% = 0.40 × 45% = <b>18%</b></div>設計目標：目的種覆蓋率≥30%；18%<30%，<b>✗ 未達目的種建立目標</b><h4>(3) 6個月補植期內的補植優先對象</h4><table><tr><th>優先順序</th><th>補植區域</th><th>說明</th></tr><tr><td>第一優先</td><td>有植生覆蓋但目的種未出現的<b>7個方格</b>（=15-8）</td><td>這些方格已有植生基礎（地表穩定），直接補植台灣相思容器苗，存活率最高</td></tr><tr><td>第二優先</td><td>目的種覆蓋率明顯低於45%均值的方格</td><td>在已有目的種但密度不足的方格加密補植，提升全坡面覆蓋率</td></tr><tr><td>最後</td><td>無植生覆蓋的<b>5個方格</b></td><td>地表不穩定，需先補噴植（草種+客土）穩定後，再行補植苗木</td></tr></table><div class="note">補植物種選擇建議：優先選<b>容器苗</b>（vs裸根苗），因容器苗根系完整，移植衝擊小，在施工後8個月的坡面（土壤尚未完全穩定）存活率顯著高於裸根苗。補植時間：建議在雨季前1~2個月（台灣約4~5月梅雨季前），讓苗木有充分水分度過初期適應期。</div>`}
];
// ═══ UI 邏輯 ═══
var SUBS = [];
var YRS = [];
(function(){
  var seenSub = {};
  var seenYr = {};
  for (var i = 0; i < DB.length; i++) {
    var s = DB[i].sub;
    var y = DB[i].yr;
    if (!seenSub[s]) { seenSub[s] = true; SUBS.push(s); }
    if (!seenYr[y]) { seenYr[y] = true; YRS.push(y); }
  }
})();

var ss = {}; for (var _i=0;_i<SUBS.length;_i++){ ss[SUBS[_i]]=true; }
var sy = {}; for (var _j=0;_j<YRS.length;_j++){ sy[YRS[_j]]=true; }
var st = {orig:true, self:true};

var rv = {};
var storageOK = false;
function getStore() {
  try { return window.localStorage; } catch (e1) { return null; }
}
try {
  var _ls = getStore();
  if (_ls) {
    try {
      var test = _ls.getItem('wsp');
      if (test) { rv = JSON.parse(test); }
      storageOK = true;
    } catch (e2) { storageOK = false; rv = {}; }
  }
} catch (e3) { storageOK = false; rv = {}; }

function save() {
  if (!storageOK) return;
  try {
    var _ls2 = getStore();
    if (_ls2) { _ls2.setItem('wsp', JSON.stringify(rv)); }
  } catch (e4) {}
}

function makeChip(label, extraClass, isOn, key, clickHandler) {
  var sp = document.createElement('span');
  sp.className = 'chip' + (extraClass ? ' ' + extraClass : '') + (isOn ? ' on' : '');
  sp.appendChild(document.createTextNode(label));
  sp.onclick = function () { clickHandler(sp, key); };
  return sp;
}

function rc() {
  var sc = document.getElementById('sc');
  while (sc.firstChild) { sc.removeChild(sc.firstChild); }
  for (var i = 0; i < SUBS.length; i++) {
    (function(s){
      sc.appendChild(makeChip(s, '', !!ss[s], s, function(el, v) {
        ss[v] = !ss[v];
        if (ss[v]) { el.className = el.className + ' on'; }
        else { el.className = el.className.replace(' on', ''); }
        rd();
      }));
    })(SUBS[i]);
  }

  var yc = document.getElementById('yc');
  while (yc.firstChild) { yc.removeChild(yc.firstChild); }
  for (var j = 0; j < YRS.length; j++) {
    (function(y){
      yc.appendChild(makeChip(y + '年', 'yr', !!sy[y], y, function(el, v) {
        sy[v] = !sy[v];
        if (sy[v]) { el.className = el.className + ' on'; }
        else { el.className = el.className.replace(' on', ''); }
        rd();
      }));
    })(YRS[j]);
  }

  var tc = document.getElementById('tc');
  while (tc.firstChild) { tc.removeChild(tc.firstChild); }
  var typeDefs = [['orig','📋考古'],['self','✏️自出']];
  for (var k = 0; k < typeDefs.length; k++) {
    (function(pair){
      tc.appendChild(makeChip(pair[1], '', !!st[pair[0]], pair[0], function(el, v) {
        st[v] = !st[v];
        if (st[v]) { el.className = el.className + ' on'; }
        else { el.className = el.className.replace(' on', ''); }
        rd();
      }));
    })(typeDefs[k]);
  }
}

function escapeForId(s) {
  return String(s).replace(/[^a-zA-Z0-9_]/g, '_');
}

function makeCard(d, idx) {
  var id = escapeForId(d.n);
  var ir = !!rv[id];
  var tp = (d.type === 'orig');

  var card = document.createElement('div');
  card.className = 'qcard';

  var hdr = document.createElement('div');
  hdr.className = 'qhdr';
  hdr.onclick = function () { ta(id); };

  var qtop = document.createElement('div');
  qtop.className = 'qtop';

  var num = document.createElement('div');
  num.className = 'qnum ' + d.type;
  num.appendChild(document.createTextNode(String(idx + 1)));

  var qtxt = document.createElement('div');
  qtxt.className = 'qtxt';
  qtxt.innerHTML = String(d.q).split('\n').join('<br>');

  qtop.appendChild(num);
  qtop.appendChild(qtxt);

  var brow = document.createElement('div');
  brow.className = 'brow';
  var badgeDefs = [
    [tp ? 'bo' : 'bs', tp ? '📋考古原題' : '✏️Claude自出'],
    ['bsub', d.sub],
    ['bsub', d.yr + '年'],
    ['bpts', d.pts + '分']
  ];
  for (var b = 0; b < badgeDefs.length; b++) {
    var bsp = document.createElement('span');
    bsp.className = 'badge ' + badgeDefs[b][0];
    bsp.appendChild(document.createTextNode(badgeDefs[b][1]));
    brow.appendChild(bsp);
  }

  hdr.appendChild(qtop);
  hdr.appendChild(brow);

  var trow = document.createElement('div');
  trow.className = 'trow';
  trow.onclick = function () { ta(id); };
  var tspan = document.createElement('span');
  tspan.appendChild(document.createTextNode('查看解答'));
  var arr = document.createElement('span');
  arr.className = 'arr';
  arr.id = 'ar_' + id;
  arr.appendChild(document.createTextNode('▼'));
  trow.appendChild(tspan);
  trow.appendChild(arr);

  var aw = document.createElement('div');
  aw.className = 'awrap';
  aw.id = 'aw_' + id;

  var al1 = document.createElement('div');
  al1.className = 'al2';
  al1.appendChild(document.createTextNode('簡略答案'));
  var sa = document.createElement('div');
  sa.className = 'sa';
  sa.innerHTML = d.s;

  var al2 = document.createElement('div');
  al2.className = 'al2';
  al2.appendChild(document.createTextNode('詳細解答'));
  var da = document.createElement('div');
  da.className = 'da';
  da.innerHTML = d.d;

  var btn = document.createElement('button');
  btn.className = 'rvbtn' + (ir ? ' done' : '');
  btn.appendChild(document.createTextNode(ir ? '✓ 已複習' : '○ 標記已複習'));
  btn.onclick = function (e) {
    if (e && e.stopPropagation) { e.stopPropagation(); }
    rv[id] = !rv[id];
    if (!rv[id]) { delete rv[id]; }
    save();
    if (rv[id]) {
      btn.className = 'rvbtn done';
      btn.textContent = '✓ 已複習';
    } else {
      btn.className = 'rvbtn';
      btn.textContent = '○ 標記已複習';
    }
    up();
  };

  aw.appendChild(al1);
  aw.appendChild(sa);
  aw.appendChild(al2);
  aw.appendChild(da);
  aw.appendChild(btn);

  card.appendChild(hdr);
  card.appendChild(trow);
  card.appendChild(aw);
  return card;
}

function rd() {
  var f = [];
  for (var i = 0; i < DB.length; i++) {
    var d = DB[i];
    if (ss[d.sub] && sy[d.yr] && st[d.type]) { f.push(d); }
  }

  var stEl = document.getElementById('st');
  var doneCount = 0;
  for (var key in rv) { if (rv[key]) { doneCount++; } }
  stEl.innerHTML = '顯示 <b>' + f.length + '</b> 題，共 <b>' + DB.length + '</b> 題 ｜ 已複習 <b>' + doneCount + '</b> 題';

  var main = document.getElementById('main');
  while (main.firstChild) { main.removeChild(main.firstChild); }

  if (f.length === 0) {
    var empty = document.createElement('div');
    empty.className = 'empty';
    empty.appendChild(document.createTextNode('沒有符合篩選條件的題目'));
    main.appendChild(empty);
    up();
    return;
  }

  for (var j = 0; j < f.length; j++) {
    main.appendChild(makeCard(f[j], j));
  }
  up();
}

function ta(id) {
  var aw = document.getElementById('aw_' + id);
  var ar = document.getElementById('ar_' + id);
  if (!aw || !ar) { return; }
  var isVis = aw.className.indexOf('vis') !== -1;
  if (isVis) {
    aw.className = aw.className.replace(' vis', '').replace('vis', '');
    ar.className = ar.className.replace(' open', '').replace('open', '');
  } else {
    aw.className = aw.className + ' vis';
    ar.className = ar.className + ' open';
  }
}

function up() {
  var total = DB.length;
  var done = 0;
  for (var key in rv) { if (rv[key]) { done++; } }
  var pct = total ? Math.round(done / total * 100) : 0;
  var pf = document.getElementById('pf');
  var pl = document.getElementById('pl');
  if (pf) { pf.style.width = pct + '%'; }
  if (pl) { pl.textContent = done + ' / ' + total + ' 已複習'; }
}

function initApp() {
  try {
    rc();
    rd();
  } catch (eInit) {
    var main = document.getElementById('main');
    if (main) {
      main.innerHTML = '<div class="empty">初始化發生錯誤，請改用瀏覽器網址列開啟（避免直接以檔案App開啟），或回報錯誤訊息：' + (eInit && eInit.message ? eInit.message : '未知錯誤') + '</div>';
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}

</script>
</body>
</html>
